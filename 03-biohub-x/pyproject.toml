[project]
name = "biohubx"
version = "0.0.1"
description = "Object-centric, graph-owning 3D+t cell tracking for the Biohub cell-tracking-during-development task."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    # Kept minimal on purpose. A dependency is added when a module that needs it
    # has a named consumer, not in anticipation of one.
    "numpy>=2.0",
    "pydantic>=2.7",
    "polars==1.43.2",
    "pyyaml>=6.0",
    "scipy==1.18.0",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@7bfeaf845ceb951226f19b72fe5b80e01601018a",
    "typer>=0.12",
    # Both the competition volumes and the GEFF ground truth are Zarr stores.
    # It arrived transitively with tracksdata; `biohubx.data.competition` imports
    # it directly, so it is declared directly rather than relied on by accident.
    "zarr>=3.0",
]

[project.scripts]
biohubx = "biohubx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Deliberately NOT a core dependency. Torch is needed only to instantiate the
# reference architecture and load its quarantined weights; every other Biohub-X
# operation, including the whole metric and retention path, runs without it.
# Keeping it in a group means `uv run biohubx artifacts verify` does not pay for
# a 200 MB import it never uses.
#
# CPU-only and pinned. The CUDA build is a separate, later decision that belongs
# to training our own folds, not to reading someone else's checkpoint.
model-cpu = [
    "torch==2.10.0+cpu",
]
# The pre-push gate validates and converts the generated notebook with the same
# libraries Kaggle runs, because a notebook that fails conversion costs a whole
# authorised GPU session and produces no output at all (D-0026). A separate group
# so that nothing in the training path depends on Jupyter.
package-gate = [
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biohubx"]

[tool.hatch.metadata]
# tracksdata is pinned to an exact commit because it is the official metric's
# own matching and graph library; a version range would let the authoritative
# behaviour drift underneath a recorded score.
allow-direct-references = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Phase-1's reproducible development lock targets the interpreter pinned by
# .python-version. The project metadata retains its wider eventual-runtime range.
environments = ["python_version == '3.12'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"
# The vendored official source is byte-identical upstream code whose digests are
# recorded in registry/official_source.yaml. Formatting or linting it would be a
# silent fork of the authority, so it is excluded from both.
# `artifacts/` holds build output, including a staged copy of this package.
# Linting a copy of the source is noise, and reformatting it would silently
# invalidate the package manifest that recorded its digests.
extend-exclude = ["src/biohubx/_vendor", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
# A silently ignored missing import is how an optional dependency becomes a
# hidden runtime failure. Every ignore must be declared here explicitly.
ignore_missing_imports = false
exclude = ["src/biohubx/_vendor/", "artifacts/"]

# numcodecs ships no py.typed marker. It is used in exactly one place, to build
# the blosc decode fixture the environment audit carries, and the alternative to
# this declaration is an inline ignore that nobody would find later.
[[tool.mypy.overrides]]
module = ["numcodecs.*"]
ignore_missing_imports = true

# scipy ships no stubs for ndimage. Declared here rather than silenced at the
# import, so the set of untyped dependencies stays readable in one place.
[[tool.mypy.overrides]]
module = ["scipy.ndimage.*"]
ignore_missing_imports = true

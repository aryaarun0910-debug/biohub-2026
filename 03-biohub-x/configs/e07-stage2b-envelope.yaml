  authorises: >-
    wave 1 only: the two A3 packages named by digest below, seeds 0 and 1 in
    both directions, two isolated workers on two Tesla T4s serialised if one
    compatible device is available, sixty minutes per kernel, at most four
    wave-1 attempts (one push and one repair retry per package), AMP
    validation, batch-throughput autotuning, the enforced 13 GiB ceiling, the
    mandatory residual-propensity evaluation and every declared output, and
    the sparse 43-cell held-out direction with its uncertainty retained.
    Repairs may touch packaging, dependency, mount, transport or hardware
    integration only. Not covered: wave 2 and E08, mini-folds, full folds,
    public-test access, internet, contaminated weights, submission, promotion.
    Stop and report after wave 1.
  wave1_attempts_maximum: 4
  wave1_attempts:
    1: {package: A3-fold_44b6, digest: canonical_text_sha256:sha256/v1:64dbb55009bc1987aab68b5870e96268d4f86d90781b2450df3c11e6b0196d91, outcome: ERROR at worker start, workers could not import the package (R-0028)}
    2: {package: A3-fold_6bba, digest: canonical_text_sha256:sha256/v1:c94ce04a8bd6a595da8aa9eca4009fa47eed35d79ad70a0ef98012537ac29522, outcome: ERROR at worker start, same cause (R-0029)}
    3: {package: A3-fold_44b6, digest: canonical_text_sha256:sha256/v1:9f36660e073b37cbda49cda9a575a214437aedeec05341f366e822e549198e33, repair: worker PYTHONPATH (commit 2c182a4), outcome: ERROR while building inputs, the two workers raced on one shared cache file (R-0030)}
    4: {package: A3-fold_6bba, digest: canonical_text_sha256:sha256/v1:31db0a43ab5f7df01ec8157e4cff8366360061469f85a3803c664fcaae5db7c4, repair: worker PYTHONPATH (commit 2c182a4), outcome: ERROR as a kernel, seed 1 lost to the same cache race while seed 0 completed on cuda:0 and wrote its own manifest (R-0031)}
  wave1_status: exhausted, four of four attempts spent; one worker measurement obtained

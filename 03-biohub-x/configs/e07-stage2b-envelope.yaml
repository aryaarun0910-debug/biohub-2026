      held-out windows, the two workers in parallel; about 45 with one card
      serialising the workers, which is why the ceiling is sixty
    expected_wall_clock_minutes_total: about 100 for four kernels; the ceiling is 240
    gpu_minutes_ceiling: 240
    stop_conditions:

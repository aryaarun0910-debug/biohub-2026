      rebuilt at commit c16096f after R-0030 (per-worker cache, pid-stamped
      partial names), gated locally and validated for transport; pushing them
      would be a fifth and sixth wave-1 attempt, which this authorisation does
      not cover
    A3-fold_44b6: canonical_text_sha256:sha256/v1:3e409fdc35c8d00a0988338ff4c5bcd6fa94afaca260e1123a652a6f05c51cb3
    A3-fold_6bba: canonical_text_sha256:sha256/v1:509961b44ea493c02361a3ace20336915652726bb5cd10ed3c002c8c31a0e0e3
  requested_by: Arya Arun, 2026-09-04, after R-0027 and D-0046
  objective: >-
    Four comparable representative smokes, automatic killing, then compute on
    the survivor. Wave 1 is E07 arm A3 at two independent seeds in both fold
    directions. Wave 2, conditional, is E08 arm B3 at two seeds in both
    directions. A4 and B4 are held.
  commit: 159ca24eea87360b7ee92fc328772362331b7432
  local_gate: ruff, ruff format, mypy strict, pytest, artifacts verify, and the pre-push exercise of every package on CPU
  accelerator: >-
    NvidiaTeslaT4 requested; the guard accepts one or two visible T4s, refuses
    any other device or count, and each worker trains on exactly one visible
    device (D-0044 as amended by D-0046). Two visible cards run the two seeds
    as two isolated processes, one per device, with separate optimizers,
    checkpoints, manifests and worker ids; one visible card serialises them.
  image: the Kaggle GPU image measured in R-0026 (torch 2.10.0+cu128, CUDA 12.8)
  wheelhouse: aryaarun07/biohubx-wheelhouse-metric-cp312-linux, published payload tree_sha256:sha256/v1:cc8a180133fb8cdf0eaf10ca192bd9965b3b8bade1178746e4c364d790258f7d (R-0016, R-0017; installs on the GPU image per R-0026)
  inputs: the registered competition training artifacts named in each package's input_digests, and the wheelhouse; nothing else
  internet: disabled

  compute_policy:
    decision: D-0045 and D-0046
    memory_ceiling_bytes_per_device: 13958643712
    amp: requested; enabled per worker only after one fixed batch agrees with full precision (logit 5e-2 abs, loss 1e-2 rel), recorded either way
    batch: ladder 512..16384 on the first training movie's patches, knee at 90 percent of best throughput below the ceiling, recorded with peak bytes and expected positives per batch
    recorded_per_worker: examples per second, positives per batch, clamp frequency, data-wait fraction, median GPU utilisation, peak allocated and reserved bytes
    checkpoints: atomic, per epoch, per worker

  selection:
    training: stratified across annotation-count quartiles of the training embryo, median bands first, deterministic; shipped as a list
    evaluation: the first four movies of the held-out embryo in name order, never chosen by their labels; refused only if their windows held no cell
    frames: 10
    epochs: 2
    count_ratio: 1.0
    min_positives_floor: 200 annotated cells across the training windows, checked before any push

  advancement_condition_per_direction:
    - a finite, decreasing epoch-mean loss
    - positives above zero in every epoch
    - no guard failure and peak allocation under the ceiling
    - "residual-propensity test passed: the probe rerun with the trained scorer's logit as the control gains no more from circumstances than max(the permutation null, the DoG response's own gain)"
    - fixed-count held-out ceiling at or above A0 on the same windows, reported per seed and per direction, never pooled
  after_wave_1: >-
    only an arm improving the fixed-count ceiling in both directions at both
    seeds reaches a mini-fold, under a further envelope; a direction that
    degrades below A0 counts toward D-0046's kill; wave 2 runs only if the
    controller's next_action after wave 1 does not read stop and redesign
  kill: an arm failing the condition in a direction is held in that direction; failing both is killed; A4 and B4 stay held throughout


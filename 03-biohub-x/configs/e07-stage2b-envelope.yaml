# GPU-CAMPAIGN-E07-02. Wave 1 authorised by Arya Arun on 2026-09-04 in their own words; wave 2 remains proposed.
#
# Written from the four staged packages by the session's generator; every digest,
# movie list and count below is read from the package that would be pushed.
# Nothing here trains full folds, reads the public test split, or submits.


    kernels_maximum: 8 (one packaging, dependency, mount, transport or hardware-guard repair retry per planned kernel)
    runtime_ceiling_seconds_per_kernel: 3600
    expected_wall_clock_minutes_per_kernel: >-
      about 25 with two cards: input building for twelve windows, two epochs,

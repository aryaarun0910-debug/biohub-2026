  - id: R-0009
    status: reference_only
    title: Three competition discussion threads, supplied by Arya, on the metric and on sparse-label overfitting
    provenance:
      supplied_by: Arya Arun
      collected_by: not Biohub-X. These were handed over; nothing was scraped.
      files:
        - DiscussionThread1.txt
        - DiscussionThread2.txt
        - DiscussionThread3.txt
        - two attached screenshots showing annotated nodes over a volume
      note: >-
        Public competitor discussion, not a prior campaign. It is reference_only
        under [[D-0017]]: it may motivate an experiment and may never support a
        claim, and no constant in it may be adopted as a prior. It is emphatically
        NOT the AGENTS.md section 1 quarantine, which is absolute and applies to
        the prior campaign alone. Keeping the two apart matters, because a
        reference entry is citable as "someone asserts X" and a quarantined one is
        not citable at all.

    observed:
      thread_1_node_count_adjustment:
        who: a 12th-place competitor, with responses from 6th place and others
        states: >-
          The adjusted edge Jaccard has a floor at zero and no ceiling, so
          predicting fewer nodes than estimated_number_of_nodes yields a
          multiplier above one. Reports 0.98 edge Jaccard and a node ratio near
          -0.29 giving 1.0102 on one training clip. A responder reports three
          further synthetic observations: a signed node adjustment, different graph
          normalisation between edge and division scoring, and a directory
          evaluator that aggregates only datasets present in both prediction and
          ground truth so an omitted dataset receives no explicit zero.
        biohubx_position: >-
          Independently measured here before this thread was supplied. [[F-0004]]
          records the uncapped multiplier, [[F-0005]] the frame-skipping edge that
          is dropped rather than charged, [[F-0015]] and [[F-0018]] the size of the
          lever on the real corpus. Nothing here is new to Biohub-X and nothing
          here needs to be believed. The convergence is worth noting only as
          evidence that the reading is not eccentric.
        unadopted: >-
          The missing-dataset behaviour is NOT measured here and is not adopted.
          Emitting fewer datasets to exploit it would be gaming a scorer silence,
          which [[D-0010]] refuses on principle.

      thread_2_proxy_versus_leaderboard:
        who: a 51st-place competitor, answering a question about detectors above 0.94
        states: >-
          That the local proxy is scored against sparse ground truth while the
          leaderboard is scored against dense labels, so the proxy barely
          penalises over-detection and a proxy gain need not be a leaderboard
          gain. A 172nd-place responder challenges this directly, saying they can
          find no statement anywhere that the leaderboard uses dense labels.
        biohubx_position: >-
          UNRESOLVED AND CONTESTED IN THE THREAD ITSELF. Biohub-X has not measured
          it and cannot, since the hidden set is not readable. It changes nothing
          operationally: [[D-0020]] already disqualified the public leaderboard as
          a target for an unrelated and independently established reason, so
          Biohub-X targets a held-out split of the 199 annotated train movies
          either way. Recorded because if the dense-label claim were true it would
          make the node-count lever in [[F-0018]] behave differently on the hidden
          set than on our folds, which is a real risk to name even while unproven.

      thread_3_detector_overfitting:
        who: a 75th-place competitor, with two responses from 172nd place
        states: >-
          Training a 3D UNet detector on fixed sparse-GT frames with a masked focal
          loss, the real metric peaks around epoch 5 to 10 and then collapses by
          more than half, adj_ej 0.40 to 0.07 by epoch 120, while the loss keeps
          falling 0.25 to 0.003 and node recall stays flat near 0.98. Peaks per
          frame climb from 1800 to over 2100 and the node-count term eventually
          goes negative from over-detection. A responder attributes it to sparse
          annotation: the unlabelled nodes "change from noisy targets to negative
          targets after 10 epochs", and posts screenshots showing faint-intensity
          annotated nodes.
        why_this_one_matters_most: >-
          It is the only one of the three describing a mechanism Biohub-X has
          reasoned about but never observed, and it is a mechanism this repository
          predicted from a different direction. [[D-0023]] and [[D-0024]] rejected
          supervising unlabelled cells as background, and [[F-0021]] falsified
          every intensity band across all 133,318 annotated nodes. This thread
          reports what happens to someone who does supervise them as background:
          the objective converges onto the training frames and the real score
          collapses while the loss looks healthy. The screenshots showing faint
          annotated nodes are the same population [[F-0021]] measured at percentile
          0.063.
        still_not_evidence: >-
          A third party's uncontrolled observation with no ablation, no seed, no
          fold definition and a different objective from the one Biohub-X uses. It
          may motivate an experiment. It may not support a claim, and it does not
          confirm [[D-0024]]; only a Biohub-X measurement can do that.

    hypotheses_extracted:
      - id: H-01
        from: thread_3
        statement: >-
          Under a positive-unlabelled objective with no background class, the gap
          between falling loss and falling official score that thread 3 describes
          does not open, or opens far later, than under an objective that
          supervises unlabelled voxels as background.
        falsifier: >-
          Killed if a Biohub-X nnPU detector shows the same signature, meaning
          official score peaking early and then declining by more than half while
          the training loss keeps falling, on either embryo fold.
        cost: an epoch ladder on one fold; no new data, no new dependency
        note: >-
          This is the strongest item the three threads yield, because it is cheap,
          it is falsifiable on our own folds, and its outcome changes what E03
          reports either way.
      - id: H-02
        from: thread_3
        statement: >-
          Selecting a checkpoint on the official metric rather than on the training
          loss changes which epoch is chosen, and the difference is large.
        falsifier: >-
          Killed if the metric-selected and loss-selected epochs coincide, or if
          their held-out scores differ by less than the fold-to-fold spread.
        note: >-
          Already implied by Biohub-X's own promotion rule, which is the official
          metric per fold. The thread supplies a reason to measure the size of the
          difference rather than assume it is small.
      - id: H-03
        from: thread_3
        statement: >-
          Resampling which frames are trained on each epoch reduces the collapse
          relative to a fixed frame subset.
        falsifier: killed if resampling does not change the epoch at which the held-out score peaks
        note: >-
          Lowest priority of the three. It is a remedy for a failure Biohub-X has
          not yet observed in its own objective, so it is queued behind H-01, which
          establishes whether the failure exists here at all.

    not_adopted:
      - Any threshold, epoch count, peak count or learning rate stated in these threads.
      - The claim that the leaderboard uses dense labels. Contested in the thread and unmeasured here.
      - The missing-dataset aggregation behaviour, which is a scorer silence and is refused by [[D-0010]].
      - The suggested ultrack-plus-post-processing route in thread 2. It is a
        different system, it is advice rather than a measurement, and adopting a
        pipeline on a forum suggestion is how a campaign acquires beliefs it
        cannot falsify.

    unresolved:
      - Whether the hidden set is scored against dense labels. Contested by the
        participants themselves and not checkable from outside.
      - Whether the collapse in thread 3 is specific to that objective, which is
        H-01 and is the reason H-01 exists.
      - Whether the poster's node recall near 0.98 is measured the same way as
        Biohub-X's, which is not stated and materially changes what the number means.

  - id: R-0010
    status: reference_only
    title: Three public notebooks and their stated leaderboard scores, named but not retrieved
    provenance:
      supplied_by: Arya Arun
      retrieved: true, on 2026-09-03, source and metadata only
      why_not: >-
        The message that named them authorised local preparation only, so they
        were not retrieved in that turn. D-0035 now gives standing authorization
        for public research intake, including public Kaggle notebook source, but
        this policy change itself performed no pull: Arya Arun stated that the
        material has already been gathered and should not be independently
        searched or scraped here.
    observed:
      notebooks:
        - ref: alioman/biohub-v19c-public0939-sis14-only
          stated_public_score: 0.939
        - ref: flexonafft/biohub-agreement-gated-dual-seed-fusion
          stated_public_score: 0.935
        - ref: alioman/biohub-v19d-dual-wide-div400
          stated_public_score: 0.938
      pull_commands_supplied: kaggle kernels pull <ref>
    reading: >-
      The scores are public-leaderboard numbers and are therefore observations,
      never targets ([[D-0020]]).

    retrieved_2026-09-03:
      how: kaggle kernels pull, source and metadata only, under [[D-0035]]
      bytes: 636323 across six files; no weights, no binary artifact, no stop condition met
      kept_outside_git: true

    observed:
      all_three_load_the_same_quarantined_weights:
        dataset_sources_common_to_all_three:
          - pilkwang/biohub-deepcenter-unet3d-center-prior-v1
          - pilkwang/biohub-temporal-unet3d-seed314159-v1
          - pilkwang/biohub-tracking-support-pack-50ep-v1
        additional_in_the_fusion_notebook:
          - xiaoleilian/biohub-unet3d-weights
          - anhadmahajan06/images-for-competition-notebook
        consequence: >-
          This resolves the open question. Two of those three packs are the ones
          [[R-0002]] showed were fitted or selected on movies byte-identical to the
          public-test volumes, and [[models.yaml]] records both as blocked. All
          three public scores, 0.939, 0.938 and 0.935, therefore rest on the same
          contamination as the reference's 0.936 and mean what that meant: nothing
          about generalisation. None of them is a baseline Biohub-X could honestly
          aim to beat, and their ordering carries no information about method
          quality.

      the_two_alioman_variants_differ_by_two_constants:
        v19c_reported_lb: 0.939
        v19d_reported_lb: 0.938
        differing_lines: 6, of which 4 are a label and a comment
        substantive_difference:
          BIOHUB_SAFE_DIV_MAX_UM: 7.0 in v19c, 9.0 in v19d
          BIOHUB_SAFE_DIV_DIVERGE_UM: 2.25 in v19c, 4.0 in v19d
        reading: >-
          The two are one pipeline with a division-geometry sweep, not two methods,
          and 0.001 of leaderboard separates them. v19d's own comment describes its
          value as interpolating between the public stack and reported scores,
          which is tuning against leaderboard feedback and disqualifies both
          constants from being adopted as priors ([[D-0017]], [[D-0020]]).

      accelerator_field:
        all_three_set: 'machine_shape: NvidiaTeslaT4'
        none_sets: an accelerator key
        biohubx_currently_sets: 'accelerator: NvidiaTeslaT4'
        why_it_matters: >-
          E03-SMOKE-02 requested a T4 and Kaggle allocated a P100 ([[D-0028]]).
          Three public GPU notebooks that pin a T4 all do it through machine_shape,
          and Kaggle's own returned metadata for the Biohub-X preflight also
          carried a machine_shape key. This is a mechanism, not a constant, so it
          may motivate a change; it is not evidence that machine_shape is the
          effective field, and the guarantee remains the runtime guard that refuses
          a device which is not a Tesla T4 ([[D-0034]]).

      shared_mechanisms:
        - ILP-based global linking rather than a greedy decode
        - a DeepCenter centre-prior model used as an add-only veto on gap closes and divisions
        - minimum-track-length filtering with isolated-node pruning
        - gap closing across one frame, with a distance cap and a cap on added links
        - motion-based relinking with a velocity term
        - division acceptance gated on parent-daughter distance, sister separation, symmetry and forward divergence
        - agreement gating between two detector seeds, in the flexonafft notebook only

    hypotheses_extracted:
      - id: H-04
        statement: >-
          A minimum-track-length filter with isolated-node pruning is the
          node-count lever [[F-0018]] measured, applied in practice. If so it must
          retain at least 0.94 of correct edges at the annotated node count to pay,
          on both embryo folds.
        falsifier: >-
          Killed if, on ground-truth graphs, removing tracks shorter than the
          observed threshold destroys more than 8 percent of correct edges on
          either fold, since [[F-0018]] puts break-even at 0.92 retention and the
          target step at 0.94.
        cost: reuses `evaluate retention`; ground-truth graphs only, no volume read
        note: >-
          The strongest item this intake produced. It converts a policy three
          public notebooks share into a question our own oracle can already answer,
          and the answer does not depend on their contaminated scores.
        status: >-
          TESTED AND NOT KILLED. [[F-0023]] measured it on all 199 annotated
          datasets: at the span of 6 those notebooks use, edge retention is 0.9963
          on 44b6 and 0.9945 on 6bba, far above the 0.94 target. The falsifier
          required more than 8 percent of correct edges to be destroyed and the
          filter destroys under 0.6 percent.
        what_survives_is_narrower_than_it_looks: >-
          The same measurement shows the filter removes only 0.5 to 0.7 percent of
          annotated nodes, because annotated tracks are long by construction and
          ground truth contains almost no short-track structure to prune. So the
          policy is established as harmless, not as effective. Whether it removes
          enough spurious short tracks to reach the annotated node count is a
          question about a detector's output, and no Biohub-X detector exists yet.
          H-04 is therefore promoted from hypothesis to a candidate the first
          trained fold must re-measure, not to a component.
      - id: H-05
        statement: >-
          Division acceptance by geometry alone, gated on parent-daughter distance,
          sister separation and forward divergence, is worth more than a learned
          division model on this corpus.
        falsifier: >-
          Killed if a geometric rule tuned on one embryo fails to beat chance on the
          held-out embryo's annotated divisions.
        note: >-
          [[F-0014]] records 26 annotated divisions in the smaller fold, which is
          too few to fit a learned triple scorer with confidence, so a geometric
          prior was already the likely route. Three independent public pipelines
          using one is consistent with that and does not establish it.

    not_adopted:
      - Every numeric threshold in all three notebooks. They were tuned against a
        leaderboard Biohub-X does not use, on models trained on the public test set.
      - The DeepCenter veto as a component. Its weights are quarantined, and
        [[F-0016]] shows spurious divisions on unmatched nodes are nearly free, so
        its contribution to a score is small and its provenance cost is not.
      - Any claim that 0.939 is better than 0.935. The ordering is contaminated.

    unresolved:
      - Whether the ILP decode outperforms a greedy one on clean folds. Observed as
        a mechanism, not measured here, and not yet a queued hypothesis.
      - What agreement gating between two seeds buys, since Biohub-X has one detector.


          raw: raw_artifact_sha256:sha256:d809c35d42f504161074ddeaaa7aee5b407e5bca7f9b4e1d5f9b2ff345666cac
          canonical_text: canonical_text_sha256:sha256/v1:d809c35d42f504161074ddeaaa7aee5b407e5bca7f9b4e1d5f9b2ff345666cac
        - path: simple_node_transformer.py
          bytes: 7229
          raw: raw_artifact_sha256:sha256:b97209edeb03840e80d903e3e2a8c81c520641c8ef343f6ca2904d0f80db064e
          canonical_text: canonical_text_sha256:sha256/v1:b97209edeb03840e80d903e3e2a8c81c520641c8ef343f6ca2904d0f80db064e

    biohubx_owned:
      module: src/biohubx/reference/architecture.py
      consumer: biohubx infer reference
      supplies: >-
        The composition the checkpoints imply and the vendored files do not
        contain: a TemporalUNet3D, a 1x1x1 detect_head convolution, and a
        SimpleNodeTransformer, plus a strict loader that freezes the weights and
        puts them in eval mode.
      derived_not_assumed: >-
        pos_feat_dim appears in no published config. It is read from the
        checkpoint as the projection width minus the UNet channel count, so a
        checkpoint built with a different positional embedding is refused here
        rather than at a shape error deep inside inference. Both published
        weights derive 32, which matches the upstream constant of four times
        eight.

    strict_loading:
      both_checkpoints:
        strict: true
        parameters: 2076706
        buffers: 1290
        total_tensors: 2077996
        exact_key_coverage: true
        exact_shape_match: true
        eval_mode: true
        gradients_disabled: true
      cross_check: >-
        The torch-free structural index in R-0003 counted 2,077,996 tensor
        entries. The loaded model reports 2,076,706 parameters plus 1,290
        buffers, which is the same number reached two independent ways.
      derived_spec:
        unet_out_channels: 32
        unet_layers: [32, 64, 128]
        pos_feat_dim: 32
        window_size: 2
        downsample: [1, 4, 4]

    synthetic_forward_pass:
      input_shape: [1, 2, 8, 16, 16]
      feature_shape: [1, 2, 32, 8, 16, 16]
      logit_shape: [1, 2, 1, 8, 16, 16]
      finite: true
      seconds: 0.041

    real_proposal_smoke:
      status: integration_only
      window: E01, 6bba_2540cd90 frames 0 to 11, crop z 0:32 y 128:256 x 128:256
      checkpoint: reference.pilkwang.support_pack_50ep.edge_predictor_best
      volume_shape: [12, 32, 128, 128]
      strided_shape: [12, 32, 32, 32]
      striding_note: >-
        The reference downsamples by striding, not pooling, so the smoke strides
        identically. Its quantile normalisation at 0.1 and 99.9 percent is the
        same normalisation Biohub-X already applies when reading a window, so no
        second convention was introduced.
      feature_shape: [1, 2, 32, 32, 32, 32]
      logit_shape: [1, 2, 1, 32, 32, 32]
      finite: true
      detection_threshold: 0.965
      voxels_per_frame: 32768
      voxels_above_threshold_total: 3992
      voxels_above_threshold_per_frame: [298, 328, 322, 344, 337, 353, 368, 366, 345, 345, 296, 290]
      fraction_of_voxels_above_threshold: 0.010152
      seconds: 3.018
      peak_rss_bytes: 371568640
      what_this_is_not: >-
        A voxel above threshold is not a node. The reference still runs peak
        finding and suppression over this heatmap before it has proposals, so
        3,992 is an upper bound on what the detector offers this window and not
        a node count. Against 26 annotated nodes and a prorated window estimate
        of 56.7 cells, the gap between the heatmap and a node set is where the
        reference's proposal logic lives, and Biohub-X has not reproduced it.
      why_it_cannot_support_a_finding: >-
        The checkpoint is quarantined and this window comes from the training
        corpus the reference's sibling weight trained on. integration_only means
        the chain runs, nothing more.

    unresolved:
      - Whether Biohub-X can reproduce the reference's peak finding and
        suppression, which is what turns this heatmap into the node counts
        recorded in R-0001. Until then the proposal interface is loadable but
        not reproduced.
      - The primary weight's training split, carried forward from R-0002.
  - id: R-0005
    status: reference_only
    title: Audit of the CC0 trainer's detection objective, before copying any of it
    source:
      kind: cc0_source_read
      file: repo/scripts/train_unet_transformer.py
      sha256: c4f6317736bb3bb1ec8f3f6e9a6d935a463e3f0f1f685481b2d13218d35dc9ea
      function: compute_detection_loss
      note: Read locally from the copy acquired in G-01. Nothing was downloaded for this audit.

    observed:
      target_construction: >-
        `target = torch.zeros_like(logits)`, then the annotated node voxels are
        set to 1.0. Every other voxel is a negative, weighted by neg_weight. The
        docstring states it plainly: "GT node voxels are positive, all others
        lightly penalised."
      ignore_class: none
      weighting: >-
        Positives normalised by their count to total weight 1.0, negatives by
        theirs to total weight neg_weight, published as 0.01 in the temporal
        seed's training_config.json.
      it_does_warn_about: >-
        Nodes that collapse to the same voxel after downsampling, which it calls
        undetectable. It warns about losing a labelled cell and says nothing
        about supervising an unlabelled one as background.

    measured_consequence:
      method: >-
        Each dataset's annotated node count against its own official
        estimated_number_of_nodes, for four movies spanning both embryos.
      unannotated_cells_supervised_as_background_per_annotated_cell:
        44b6_0c582fdc: 393
        44b6_0db75fae: 97
        6bba_2540cd90: 6
        6bba_5f89039d: 4
      fraction_of_negatives_that_are_really_cells:
        44b6_0c582fdc: 0.0010638
        6bba_2540cd90: 0.0001241
      reading: >-
        Per voxel the contamination is small, which is why the objective trains
        at all. Per cell it is not: on 44b6_0c582fdc the objective asserts that
        71 cells are cells and 27,887 visually identical cells are not. The
        ratio spans two orders of magnitude across the embryos, tracking the
        twelvefold density difference in F-0013, so the two folds would not be
        optimising the same thing.

    verdict: >-
      REJECTED for Biohub-X. AGENTS.md section 5 requires unlabelled and ignore
      regions to be respected rather than treated as background, and this
      objective does the opposite by construction. D-0023 records the
      replacement. The audit is kept because knowing exactly how the reference
      was trained explains its dense output, and because a later comparison
      between the two objectives is a real experiment.

    unresolved:
      - Whether the reference's dense node counts are partly an artefact of this
        objective rather than a deliberate strategy. Its configuration contains
        no node-count target (R-0001), and an objective that penalises every
        unlabelled cell would push toward exactly the behaviour R-0003 found.
  - id: R-0006
    status: measured_environment
    title: The Kaggle CPU runtime, measured rather than inferred
    source:
      kind: biohubx_diagnostic_kernel
      audit_id: E03-ENV-AUDIT-01
      kernel: aryaarun07/biohub-x-environment-audit
      pinned_commit: 58ad4a3a9dc5d159650c4bb17b0c478b2fe3e6e9
      authorised_by: Arya Arun
      scope: CPU only, no accelerator, internet disabled, no dataset, model or competition sources
      elapsed_seconds: 9.184
      note: >-
        Measured by Biohub-X's own instrument on the target machine, so it is a
        fact rather than a claim. It is still not scientific evidence: it says
        what the runtime contains, nothing about cell tracking, and it may not
        support a promotion or appear in a findings entry.

    retrieved:
      kernel_log: artifacts/env-audit/kernel.log
      kernel_log_digest: raw_artifact_sha256:sha256:893ecbdef09c1f58226771bdfbfa1ab15fc3fbcb71ea76c9109f614f0f48ed85
      environment_manifest: artifacts/env-audit/environment-audit.json
      environment_manifest_digest: raw_artifact_sha256:sha256:bd0e46599a58d62c46d6aafc6fac9d09ad4ac950c66cf81a93cf7a4ec55278e1
      self_identification: >-
        The manifest carries the audit id and pinned commit it was built with,
        and both match the staged package, so the measurement is bound to the
        artifact that produced it.

    abi_target:
      python: 3.12.13
      implementation: CPython
      platform: Linux-6.12.90+-x86_64-with-glibc2.35
      machine: x86_64
      libc: glibc 2.35
      platform_tag: linux-x86_64
      soabi: cpython-312-x86_64-linux-gnu
      wheel_tag_implied: cp312-cp312-manylinux_2_35_x86_64
      note: >-
        These five fields are what a wheel has to match and what no traceback
        could have told us. glibc 2.35 means a manylinux_2_17 or manylinux_2_28
        wheel is also compatible; the tag above is the tightest one.

    installed_distributions: 874

    missing_from_the_runtime_closure: ["bidict", "crc32c", "donfig", "geff", "imagecodecs", "numcodecs", "rustworkx", "tracksdata", "zarr"]

    present_and_usable:
      numpy: "2.0.2"
      scipy: "1.16.3"
      polars: "1.35.2"
      pydantic: "2.12.3"
      PyYAML: "6.0.3"
      typer: "0.24.2"
      torch: "2.10.0+cpu"
      blosc2: "4.1.2"
      zstandard: "0.25.0"
      note: >-
        Biohub-X pins polars==1.43.2 and scipy==1.18.0 locally; the image carries
        1.35.2 and 1.16.3. A package that ships neither takes what is there, and
        whether that difference matters is unmeasured.

    codec:
      numcodecs_blosc_decode: "failed: numcodecs is absent"
      zarr: absent
      blosc2_version: "4.1.2"
      zstandard_version: "0.25.0"
      probe_gap: >-
        The fixture is Blosc1, which is what zarr v3's blosc codec writes and what
        numcodecs decodes. blosc2 is present at 4.1.2 but was only reported, not
        asked to decode the fixture, and blosc2 is a different container format
        from Blosc1. So the image's ability to read competition chunks without
        numcodecs is not established either way. A later audit should decode the
        fixture through blosc2 before anyone counts on it.

    what_the_smoke_actually_needs: >-
      The E03 smoke path imports data.competition, reference.architecture and
      training.targets. Of those only data.competition reaches outside the
      standard library and torch, and it imports zarr alone. It never touches the
      official metric, so tracksdata, geff, rustworkx, bidict and imagecodecs are
      not needed to make the smoke run. zarr pulls numcodecs, donfig and crc32c.
      Four wheels, not the reference's 322 MB bundle. A full fold that scores
      through the official metric needs the rest.

    unresolved:
      - Whether blosc2 alone can decode a Blosc1 chunk, which decides whether numcodecs is required at all.
      - The GPU image's torch build. This audit was CPU-only by authorisation and
        measured torch 2.10.0+cpu; a GPU kernel will carry a CUDA build that has
        not been measured.
      - Whether the image's polars 1.35.2 and scipy 1.16.3 behave identically to
        the versions this repository pins.

  - id: R-0007
    status: measured_environment
    title: An attached Kaggle dataset is not mounted at /kaggle/input/<slug> on this image
    source:
      kind: biohubx_preflight_kernel
      preflight_id: E03-WHEELHOUSE-PREFLIGHT-01

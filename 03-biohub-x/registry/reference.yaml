      the_same_path_worked_for: E03-SMOKE-03, which read two movies from it
      cause: >-
        The entry point resolved the competition root from a hardcoded default
        while resolving the wheelhouse by identity. That is the defect
        [[D-0033]] named for the wheelhouse, still present on the other mount:

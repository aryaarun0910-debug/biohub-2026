      - refuses to open a public-test path, on either path separator
      - refuses if a quarantined checkpoint is reachable
      - refuses if the GPU count is not what was approved
      - emits a BIOHUBX_STAGE heartbeat at every stage
      - writes an atomic checkpoint and result manifest, and reloads strict before finishing

    local_cpu_smoke:
      performed: true
      device: cpu
      fold: fold_44b6
      movies: 2
      epochs: 2
      guards: passed, 142 artifacts shape-checked and 4 re-digested in full
      loss: 0.61999217 to 0.60511005
      checkpoint: written atomically, reloaded strict
      note: >-
        The same entry point the notebook calls, exercised here first. Two bugs
        surfaced that would have cost GPU time: a guard that passed on an empty
        digest set, and a fixed crop inherited from E01 that is empty on sparse
        44b6 movies and would have trained on nothing.

    run_request:
      id: E03-SMOKE
      accelerator: one T4
      gpus: 1
      fold: fold_44b6 only
      movies: 2 from 44b6
      epochs: 2
      seed: 4460
      expected_runtime_minutes: 20
      runtime_ceiling_seconds: 2400
      storage: one checkpoint under 40 MB plus one result manifest
      failure_conditions:
        - the risk does not decrease across the two epochs
        - any epoch reports zero positives
        - the negative-risk clamp fires in every epoch
        - the checkpoint does not reload strict
        - torch.cuda.device_count() is not 1
        - wall clock exceeds 40 minutes
      stop_condition: >-
        Report and stop. The two full folds are a separate request with separate
        approval, and this gate does not grant them.

    what_this_does_not_authorise:
      - the two full folds
      - any submission
      - any second kernel push
      - a CUDA dependency in this repository
      - any Colab run on competition data

  gate_5_environment_audit:
    state: PERFORMED
    outcome: >-
      Pushed once, ran CPU-only, completed in 9.184 seconds and produced its
      manifest. The measurement is R-0006. Nine of the twenty-eight runtime
      closure imports are absent, and the ABI a wheelhouse must target is now
      known rather than guessed.
    audit_id: E03-ENV-AUDIT-01
    purpose: >-
      Measure the Kaggle runtime instead of inferring it. E03-SMOKE-02 proved
      zarr is absent and proved nothing about the Python version, platform tag or
      ABI a wheel would have to match. A wheelhouse built on one traceback is a
      third wasted session waiting to happen.
    package:
      path: artifacts/kaggle-audit
      manifest_digest: canonical_text_sha256:sha256/v1:78e171dd46d4b47c61c9d1a405883f751f63ddf3b88798022d08f0c84ad41fb2
      pinned_commit: 58ad4a3a9dc5d159650c4bb17b0c478b2fe3e6e9
      kernel: aryaarun07/biohub-x-environment-audit
      file_count: 3
      total_bytes: 9075
      push_command: kaggle kernels push -p artifacts\kaggle-audit
      pushed: false
    scope:
      accelerator: none; enable_gpu false
      internet: disabled
      dataset_sources: []
      model_sources: []
      competition_sources: []
      runtime_ceiling_seconds: 300
      reads_competition_data: false
      trains: false
      imports_biohubx: false
    what_it_measures:
      - interpreter version, implementation, platform, machine, architecture, libc, platform tag and SOABI
      - every installed distribution with its exact version
      - importability and version for each of the 28 names in the runtime closure
      - a blosc/zstd/bitshuffle decode of a buffer encoded with the competition's own codec
      - zarr version and whether its v3 BloscCodec exists
      - torch version and CUDA build metadata, only if torch is present
    failure_handling: >-
      Every probe is wrapped in BaseException, because a missing compiled
      extension raises things that are not ImportError. An absent package is

      nbconvert_converted: true
      converted_bytes: 308605
      ran_isolated_from_the_repository: true
      heartbeat_lines: 41
      stages_seen: ["audit-start", "probe-interpreter", "probe-distributions", "probe-imports", "probe-import", "probe-codec", "probe-torch", "manifest", "done"]
      expected_stage_sequence_seen: true
    what_this_does_not_authorise:
      - any GPU run
      - any wheelhouse download or construction
      - another training push

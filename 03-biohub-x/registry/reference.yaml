      extractor: 84 proposals at threshold quantile 0.999, node ratio -0.9442, match fraction 0.0, oracle None
    readings: >-
      Three things worth carrying into the family design. The transformer block
      (580353 of 2076706 parameters) receives no gradient on the
      detection path, so any arm that trains this architecture for proposals
      carries it as dead weight. The output is invariant to frame order to
      floating-point precision while depending on neighbouring frames, so the
      temporal attention is symmetric in time: it cannot tell a cell arriving
      from one leaving. And the empirical receptive field exceeds a
      45 x 40 x 40 grid, so a crop that small trains every output voxel on
      truncated context.

  - id: R-0022
    status: measured_environment
    title: The complete miss atlas of the A2 proposal source on 6bba, every unreached annotation classified
    why: >-
      F-0035 left the 6bba ceiling at 0.9283 with the best proposal source
      measured. Before a learned architecture is chosen, every cell that source
      fails to reach is described in features an arm can act on and classified
      under one ordered rule, so arms are motivated or killed by counts rather
      than by impression. The atlas motivates; it is not a finding until a
      preregistered probe reproduces what it suggests.
    instrument: biohubx evaluate miss-atlas, windows identical to E06-ORACLE and E05
    source: {"frames_per_movie": 10, "local_maxima_only": true, "per_scale_union": true, "radii_um": [2.0, 3.0], "refine_centroids": false, "response_quantile": 0.95, "source": "biohubx.proposals.dog", "suppression_radius_um": 4.0, "truncation": "none"}
    thresholds: {"boundary_um": 8.0, "dim_percentile": 0.8, "localization_um": 14.0, "low_response_um": 7.0, "merge_neighbour_um": 8.0}
    class_order: ["boundary", "merged", "dim", "localization", "temporal_dropout", "low_response", "annotation_ambiguity", "unexplained"]
    report: artifacts/miss-atlas-6bba.json
    runtime_seconds: 287.579

    counts:
      annotated_nodes_in_windows: 9870
      misses: 706
      miss_fraction: 0.0715
      primary_classes: {"annotation_ambiguity": 0, "boundary": 189, "dim": 331, "localization": 181, "low_response": 1, "merged": 2, "temporal_dropout": 1, "unexplained": 1}
      flags: {"annotation_ambiguity": 0, "boundary": 189, "dim": 452, "localization": 555, "low_response": 587, "merged": 3, "temporal_dropout": 121}
      with_a_strict_peak_within_7um: 665
      of_which_the_quantile_discarded: 587
      peak_within_7um_kept_yet_unmatched: 78
      no_peak_within_7um: 41
      a_proposal_within_14um: 562
      median_intensity_percentile: 0.7386
      median_nearest_proposal_um: 9.893
      median_nearest_vector_um: '|dz| 4.88, in-plane 7.89'
      most_common_flag_combinations: [[["dim", "localization", "low_response"], 192], [["localization", "low_response"], 105], [["dim", "low_response"], 88], [["boundary", "dim", "localization", "low_response"], 55], [["boundary", "dim", "low_response"], 45], [["localization"], 29]]
    per_class_medians:
      boundary: n=189, intensity_pct=0.755, nearest_um=10.124, boundary_um=3.656, response_pct=0.876
      merged: n=2, intensity_pct=0.79, nearest_um=7.906, boundary_um=11.782, response_pct=0.686
      dim: n=331, intensity_pct=0.647, nearest_um=10.733, boundary_um=17.875, response_pct=0.878
      localization: n=181, intensity_pct=0.875, nearest_um=8.618, boundary_um=18.281, response_pct=0.911
      temporal_dropout: n=1, intensity_pct=0.91, nearest_um=5.025, boundary_um=24.375, response_pct=0.843
      low_response: n=1, intensity_pct=0.812, nearest_um=14.259, boundary_um=8.125, response_pct=0.54
      unexplained: n=1, intensity_pct=0.85, nearest_um=6.918, boundary_um=20.719, response_pct=0.861
    per_movie_extremes: >-
      6bba_6feb10f0 79/189, 6bba_ebff6e76 67/228, 6bba_ab78413d 62/139, 6bba_b329af44 54/183, 6bba_32db13fc 51/227

    reading: >-
      Four things. First, the misses are almost never absences: 665 of
      706 lie within 7 micrometres of a strict per-scale maximum, and 587
      of those maxima were discarded by the frame-level response quantile,
      not by suppression. The detector saw these cells and ranked them below
      the 95th percentile of response. Second, merging is not the mechanism:
      2 misses are merged under the rule and 3 carry the flag at all,
      so a deblending or centre-offset head has almost nothing to recover on
      this embryo. Third, only 41 misses have no peak within the radius; that
      is the ceiling of a residual detector that finds cells the DoG cannot,
      under half a percent of annotated cells. Fourth, dim and boundary
      together carry most of the primary classes, and both are threshold
      effects in disguise: the dim misses have peaks at the 88th response
      percentile, the boundary misses at the 88th, and a fixed quantile cannot
      keep them without admitting the spurious peaks E05 measured the cost of.
      The lever is ranking. A learned scorer over the complete per-scale peak
      set, with local image, per-scale response and temporal context, that
      keeps true cells and drops the spurious third that inflates 6bba's node
      ratio, is the family the atlas supports; the two deblending arms and the
      residual detector are killed before implementation on these counts.

  - id: R-0023
    status: measured_environment

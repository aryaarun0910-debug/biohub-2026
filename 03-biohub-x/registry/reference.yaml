      stages_seen: ["preflight-start", "wheelhouse"]
      stages_not_reached: ["verify", "install", "import", "roundtrip", "competition-read"]

    what_the_package_did_right: >-
      It refused instead of proceeding, in 8.752 seconds, and wrote its manifest
      atomically before exiting, so the refusal is readable rather than inferred
      from an absent output. No pip ran, no import was attempted and no
      competition byte was read. The guard behaved exactly as designed; what it
      guarded against was not the thing that went wrong.

    diagnostic_gap: >-
      The refusal names the path it wanted and not the paths it had. Nothing in
      the run lists /kaggle/input, so this log cannot distinguish a dataset that
      was never attached from one mounted under another name, and that
      distinction is what a second run would otherwise be spent on. The check was

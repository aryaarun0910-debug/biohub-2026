  - id: R-0012
    status: measured_environment
    title: The official-metric dependency closure, and a fold runtime forecast from measured throughput
    source:
      kind: biohubx_local_measurement
      instruments: uv.lock resolution, a live import of the metric adapter, and F-0024's step timing
      note: >-
        Engineering facts about this repository's own dependency graph and about
        how long a fold would take. Not scientific evidence and may not support a
        promotion.

    closure:
      measured_how: >-
        Two ways, because the declared tree and the imported set are different
        questions. Walking uv.lock from biohubx's roots gives 64 distributions.
        Importing biohubx.evaluation.official_metric and biohubx.data.competition
        and reading sys.modules gives 51 distributions actually touched. The
        overlap is large: the official metric really does pull most of tracksdata's
        stack, including numba, llvmlite, pyarrow, scikit-image and the ilpy
        solver wrapper.
      distributions: 64
      wheels_resolvable_for_cp312_manylinux_x86_64: 63
      total_wheel_bytes: 325711643
      total_wheel_mib: 310.6
      largest:
        llvmlite: 57.12 MiB
        polars-runtime-32: 54.65 MiB
        pyarrow: 47.78 MiB
        scipy: 33.65 MiB
        imagecodecs: 26.78 MiB
        pyscipopt: 16.75 MiB
        numpy: 15.95 MiB
      comparison: >-
        The smoke wheelhouse is four wheels and 8.9 MiB. The metric closure is
        roughly thirty-five times larger and is comparable to the reference
        notebook's 322 MB bundle, which [[D-0030]] noted Biohub-X had avoided. It
        was avoided because the smoke path genuinely needed four wheels; scoring
        through the official metric genuinely needs this. The difference is a
        measurement either way, not a preference.
      abi_note: >-
        rustworkx, blosc2 and polars-runtime-32 ship abi3 wheels tagged cp310 or
        cp311, which are compatible with cp312. A first pass rejected them by
        matching the python tag literally and reported them as unresolvable; the
        error was in the reader, not the lock. blosc2 4.12.0 requires
        manylinux_2_27, satisfied by the target's glibc 2.35 ([[R-0006]]).

    blocker_tracksdata_is_not_a_wheel:
      version: 0.1.0rc9.dev4+g7bfeaf845
      source: git, https://github.com/royerlab/tracksdata pinned at 7bfeaf845ceb951226f19b72fe5b80e01601018a
      wheels_in_lock: 0
      sdist_in_lock: false
      consequence: >-
        An ABI-locked wheelhouse assembled from uv.lock URLs cannot contain
        tracksdata, because the lock records a git revision rather than an
        artifact. It is the one distribution in the closure with no downloadable
        wheel, and it is not optional: it is the official metric's graph
        representation and distance matching, pinned in
        registry/official_source.yaml as a runtime dependency.
      options_not_yet_chosen:
        - Build a wheel from the pinned commit and ship it with a Biohub-X digest.
          Its identity would then be ours rather than a uv.lock hash, which is a
          different provenance claim and needs its own record.
        - Vendor it as source the way the metric itself is vendored, which keeps
          one provenance model but enlarges what this repository carries.
        - Establish whether the Kaggle image already provides it. [[R-0006]] probed
          28 names and found tracksdata absent, so this is measured and the answer
          is no.
      recorded_rather_than_solved: >-
        Choosing between these changes what Biohub-X ships and how its identity is
        asserted, so it is a decision rather than an implementation detail.

    fold_runtime_forecast:
      anchored_on: >-
        F-0024's steady-state step time on a real T4: epoch 2 ran two optimizer
        steps in 1.25 seconds, so 0.625 seconds per step at a two-frame window of
        524,288 grid voxels. Epoch 1 took 3.95 seconds and is excluded as warmup.
      step_definition: one optimizer step per movie per epoch
      fold_window: >-
        entry.py uses 8 frames when not a smoke, so a fold step covers 2,097,152
        grid voxels, four times the smoke's.
      fixed_cost_per_run_seconds: about 100
      fixed_cost_note: >-
        Import, offline install, artifact verification and model construction. The
        verification alone took 62.3 seconds to shape-check 142 registered 44b6
        artifacts and re-digest 4 in full, and it does not scale with epochs. A
        forecast that extrapolates the smoke's whole 84.7 seconds per movie
        overstates a fold substantially, because most of that number is paid once.
      projections_at_20_epochs:
        fold_44b6_71_movies_1420_steps:
          linear_in_voxels_2.50s_per_step: 0.99 hours
          if_io_doubles_it_5.00s: 1.97 hours
          if_io_quadruples_it_10.00s: 3.94 hours
        fold_6bba_128_movies_2560_steps:
          linear_in_voxels_2.50s_per_step: 1.78 hours
          if_io_doubles_it_5.00s: 3.56 hours
          if_io_quadruples_it_10.00s: 7.11 hours
      the_assumption_that_needs_measuring: >-
        That step time scales with window voxels. It is stated rather than
        established. The smoke read two frames from a mounted zarr; a fold reads
        eight, and whether the cost is dominated by compute or by chunk decode is
        unmeasured. The bracket above spans a factor of four for exactly that
        reason, and a single bounded timing probe at the real window size would
        collapse it.
      what_this_replaces: >-
        The configured 21,600 second per-fold ceiling was a guess made before any
        step had been timed. Even the pessimistic arm of this bracket fits inside
        it, and the optimistic arm fits inside the 80 minute campaign budget for
        one fold, so the ceiling is not the binding constraint; the step budget is.
      gpu_count_caveat: >-
        Every figure assumes one device, which is what the implementation uses.
        Kaggle allocated two on E03-SMOKE-03 and the count is uncontrolled
        ([[D-0038]]), so no budget may assume two.

    unresolved:
      - How many of the 51 imported distributions the Kaggle image already carries
        at a usable version. [[R-0006]] probed 28 names on a CPU image and predates
        this closure, so the wheelhouse cannot yet be trimmed to what is actually
        absent. A single CPU diagnostic over all 64 names would size it honestly
        and is cheap.
      - Whether the image's polars 1.35.2 and scipy 1.16.3 produce identical
        scorer output to the pinned 1.43.2 and 1.18.0. This is why the pinned
        versions are shipped rather than accepted, and it is the check the metric
        preflight has to make rather than assume.
      - Step time at the real eight-frame window, which decides the fold budget.

  - id: R-0013
    status: reference_only
    title: RX-01 first pass, mechanisms only, each traced to the research ledger
    campaign: RX-01
    provenance:
      ledger: registry/research-ledger.yaml, RL-0001 to RL-0022
      acquired_under: "[[D-0039]]"
      note: >-
        Every claim below names the ledger id it was read from, and the ledger
        record carries the URL, time, size and raw digest of what arrived.
        Nothing here is evidence. A mechanism may seed a probe arm; a constant
        appears only with its source and never as a default.

    stream_2_association:
      trackastra_RL-0001_RL-0016:
        attends_over: >-
          Detections in a sliding temporal window of s=6 frames, tokens built
          from Fourier positional encodings of centre coordinates plus mean
          intensity, area and inertia tensor, with rotary time embeddings.
        edge_scoring: >-
          Pairwise logits from an encoder-decoder cross-attention outer product,
          normalised by a "parental softmax" over each detection's candidate
          parents in the previous frame with a constant 1 in the denominator.
          That constant is the no-parent option: a detection can decline every
          parent, and the normalisation enforces at most one parent per vertex.
        biohubx_relation: >-
          This is the same shape as TargetPrediction's explicit no-parent row
          ([[SYSTEM.md]] 4.4), arrived at independently. What differs is that
          Trackastra learns the no-parent mass jointly with the parent scores,
          where Biohub-X's is still a hand-set constant.
        training: >-
          Binary cross-entropy on the parental softmax plus lambda=0.01 times a
          sigmoid BCE term; per-element weights 1+lambda_div with lambda_div=10 on
          dividing cells and 1+lambda_cont with lambda_cont=1 on continuing ones;
          links beyond delta_t=2 frames ignored.
        decoding: >-
          Three decoders from the same scores: greedy with threshold 0.5, a
          two-stage linear assignment, or an ILP with degree constraints. The
          paper reports all three, which is the bake-off E06 proposes.
        constants_not_adopted: s=6, alpha=0.05, theta=0.5, d=256, L=6, lambda_div=10
      ultrack_RL-0002_RL-0017:
        hypotheses: >-
          Hierarchical watershed on a contour map yields nested segment
          candidates per frame, filtered by minimum and maximum size and contour
          strength.
        ilp: >-
          Binary variables for segment selection, frame-to-frame assignment,
          appearance, disappearance and division. Constraints: a selected segment
          has exactly one incoming link or is an appearance; outgoing flow is one
          continuation, or a division with at most two children, or a
          disappearance; a division only from a selected segment; nested
          candidates are mutually exclusive.
        costs: >-
          IoU between candidate segments in adjacent frames, raised to a power to
          discourage over-segmentation, sparsified by a KD-tree query of the 2k
          nearest neighbours then keeping the k with highest IoU. Appearance,
          disappearance and division carry non-positive penalties.
        biohubx_relation: >-
          The constraint set is the LineageGraph legality contract expressed as
          an ILP. The interesting part for E06 is the cost sparsification and the
          global solve, not the segmentation front end, which Biohub-X does not
          use.
        scaling: windows of 50 frames with 5-frame overlap, solved in an interleaved two-pass scheme
      bytetrack_RL-0003:
        mechanism: >-
          Associate high-confidence detections first, then run a second
          association pass in which low-confidence detections may claim the
          tracks left unmatched, rather than discarding them at a threshold.
        biohubx_relation: >-
          Directly relevant to the node-count trade in [[F-0018]]: a second pass
          over low-response DoG peaks could recover annotated endpoints without
          admitting every low peak as a node.
      uncertainty_for_assignment_RL-0005_RL-0015_RL-0018:
        per_link_probability: >-
          A column softmax over negated costs gives each daughter a distribution
          over candidate mothers plus a dummy no-match class.
        bayesian_marginals: >-
          Uniform prior over biologically feasible assignments, likelihood from
          the cost, marginals approximated three ways: top-K assignment sampling
          weighted by posterior, feature perturbation with K separate solves, or
          feature perturbation with averaged costs and one solve.
        abstention: >-
          Drop links below a probability threshold, or flag high daughter-wise
          entropy for review. Entropy is reported as less dependent on
          temperature scaling.
        calibration: expected calibration error, with post-hoc temperature scaling fit on one held-out sequence
        biohubx_relation: >-
          Gives E06's learned-abstention arm a concrete, cheap form: the
          entropy of the per-target parent distribution is computable from any
          cost matrix Biohub-X already builds, with no new model.
        constants_not_adopted: K=10, gamma=0.1, dropout 0.5/0.25/0.125
      mitosis_aware_mht_RL-0004_RL-0020:
        costs: >-
          Association cost is a Gaussian match between a motion-predicted position
          and a detection, each carrying its own covariance. Motion is regressed
          from two frames, and its uncertainty is obtained by test-time
          augmentation that shifts the previous frame by multiples of the mean
          cell radius, forty transforms in all, then merging the per-pixel spread
          into a per-cell Gaussian.
        mitosis: >-
          The assignment matrix is extended with a mirrored copy of each mother's
          column so two daughters can be assigned to one mother. The cost of
          dividing is the negative log of an Erlang cumulative distribution over
          the cell's current age, so a cell that divided very recently is charged
          for dividing again.
        conflicts: >-
          Multi-hypothesis tracking keeps the A_max best assignments per
          hypothesis via Murty's algorithm, up to H_max hypotheses, and re-scores
          them a posteriori so a false early mitosis is overturned when its
          supposed daughter divides implausibly soon.
        biohubx_relation: >-
          Two ideas transfer without the framework. A track-age prior on division
          needs only lineage bookkeeping Biohub-X already does, and [[F-0014]]
          says the supervised division count is too small to learn such a prior,
          which is an argument for a parametric one. And per-cell motion
          uncertainty from augmentation is a cheap way to make the matcher's
          distance cost heteroscedastic.
        constants_not_adopted: A_max=7, H_max=150, forty augmentations, Erlang alpha=K beta=1/K
      higher_order_transformer_RL-0007_RL-0021:
        candidate_graph: >-
          Edges between detections in different frames within a distance cutoff,
          including gaps of more than one frame.
        node_features: >-
          Nineteen scalars per detection: time and 3D position, equivalent
          diameter, four intensity statistics, the nine-entry inertia tensor, and
          distance to the field-of-view border. No image encoder.
        edge_attention: >-
          Edge tokens are gathered from their two contextualised nodes and then
          attend to other edges, with an attention bias proportional to the
          minimum distance between the two edges as 3D line segments, learnable
          per head and alternating in sign so some heads attract nearby edges
          and others provide global context.
        no_link_and_division: >-
          The same parental softmax with a constant 1 in the denominator as
          Trackastra; divisions weighted 3.5x in a focal loss; at most two children
          enforced in a two-pass ILP that first links adjacent frames into
          tracklets and then aggregates them and re-solves with longer gaps.
        datasets: >-
          Sixteen Cell Tracking Challenge sets. None is a 3D embryo nucleus set,
          which bounds how far its reported numbers travel.
        biohubx_relation: >-
          Distance-to-border as an input feature and line-to-line edge geometry
          are both computable from Biohub-X's existing contracts. The
          observation that edges sharing a node have near-random label agreement
          under pairwise scoring is a testable claim about our own candidate
          graphs and belongs in E06.
        constants_not_adopted: tau=300 px, focal gamma=3.5, w_n=-10, w_a=0.5, w_b=0.25, w_delta=0.25, lambda=0.5
      primal_dual_and_argus_RL-0006_RL-0008:
        note: >-
          Recorded as routes, not read in depth. The first is a solver for
          large tracking-by-assignment problems; the second keeps optical flow
          and linear assignment while replacing thresholding with learned
          segmentation.

    stream_1_proposals:
      celegans_nuclei_RL-0009_RL-0014_RL-0019:
        comparison: >-
          Table 1 reports precision, recall and F1 of 0.81, 0.80, 0.80 for
          IFT-watershed, 0.95, 0.90, 0.92 for LoG-GSF, and 0.95, 0.92, 0.93 for
          a 3D U-Net. The learned detector's gain came from dim nuclei and from
          separating adjacent nuclei that classical methods clumped.
        biohubx_relation: >-
          The two failure modes named there, dimness and merging under crowding,
          are exactly the two features the E04b miss audit measures per node. If
          the audit shows the same signature, a learned residual detector is
          plausibly complementary to DoG; if the misses are instead outside the
          scale bank, widening the bank is cheaper than a model.
      hessian_constrained_blobs_RL-0010:
        mechanism: >-
          DoG-smooth, then mark voxels whose Hessian is negative definite as a
          blob superset; gate that superset with a U-Net probability map to remove
          noise-induced convexities, so no post-pruning is needed. Scale chosen by
          the maximum of the scale-normalised DoG.
        biohubx_relation: >-
          A convexity test is a cheap second criterion Biohub-X's DoG does not yet
          apply. It could reduce proposals at a fixed recall, which is the
          node-count side of the trade.
        constants_not_adopted: gamma=2, sigma 0.5 to 3 step 0.5
      giani_RL-0011:
        note: LoG versus Hessian blob detection compared in one 3D pipeline; recorded as a route, not read in depth.

    stream_3_alternative_supervision:
      selma3d_RL-0012_RL-0022:
        inventory: >-
          Thirty-five large light-sheet volumes: mouse vessels, mouse c-Fos cells,
          mouse amyloid plaques, and four human-brain nucleus volumes at 0.54 x
          0.54 x 5 micrometres. 315 annotated patches for validation. Winning
          entries used BYOL on a 3D U-Net and DINO/iBOT on a 3D ViT.
        licence: CC BY-NC-ND 4.0
        provenance_blocker: >-
          NonCommercial and NoDerivatives. A model whose weights were trained on
          it is arguably a derivative, and a competition entry is arguably
          commercial use. Under AGENTS.md section 6 this cannot be cleared by
          reading a licence field; it stays out of any Biohub-X input until Arya
          reviews the terms against the competition rules. Recorded so the
          question is not rediscovered later.
      cellseg3d_RL-0013:
        mechanism: >-
          WNet3D: a dual U-Net trained without labels on a weighted sum of a soft
          normalised-cut clustering loss on the encoder logits and a
          reconstruction loss on the decoder, then thresholded and split into
          instances by Voronoi-Otsu. The authors state it has no notion of a cell
          and cannot separate cells from artefacts on its own.
        data: >-
          mesoSPIM cleared mouse brain at 5.26 x 5.26 x 5 micrometre voxels, an
          order of magnitude coarser than this competition's 0.40625 micrometre
          plane. It releases 2,632 annotated nuclei across six volumes on Zenodo
          under MIT.
        biohubx_relation: >-
          The released annotations are a candidate external set for a
          with-and-without pretraining comparison, but the voxel scale gap is
          large enough that transfer is a hypothesis in its own right, not a
          given. Its reported F1 of 0.71 unfiltered against 0.83 for a supervised
          transformer at 80 percent data is recorded and not adopted.
        constants_not_adopted: intensity sigma 1, spatial sigma 4, radius 2 voxels, threshold 0.6

    hypothesis_queue_additions:
      - id: H-06
        stream: association
        statement: >-
          A parental-softmax normalisation over candidate parents with an
          explicit no-parent constant, learned jointly, beats the hand-set
          no-parent constant in Biohub-X's untrained matcher on edge reach after
          decoding, on both folds.
        falsifier: killed if edge TP does not rise on either held-out fold at equal proposals
        source: RL-0001, RL-0016
      - id: H-07
        stream: association
        statement: >-
          Daughter-wise entropy of the parent distribution identifies the links
          most likely to be wrong, so abstaining on the highest-entropy fraction
          raises edge precision more than it lowers recall.
        falsifier: killed if edge Jaccard falls on either fold at every abstention fraction swept
        source: RL-0005, RL-0018
      - id: H-08
        stream: proposals
        statement: >-
          A second association pass admitting low-response DoG peaks only where a
          track has no successor recovers annotated endpoints without paying the
          node-count cost of admitting all of them.
        falsifier: killed if reachability does not rise at a fixed node budget on either fold
        source: RL-0003, and F-0018 for the bar
      - id: H-09
        stream: proposals
        statement: >-
          Gating DoG peaks on a negative-definite Hessian reduces proposals at
          fixed reachability.
        falsifier: killed if the proposal count at matched reachability does not fall on either fold
        source: RL-0010

      - id: H-11
        stream: proposals
        statement: >-
          The near-miss residual, where a proposal lies 7 to 14 micrometres from
          an annotated cell, is a localisation failure that sub-voxel centroid
          refinement of each DoG peak, or a smaller suppression radius, converts
          into hits without raising the proposal count.
        falsifier: >-
          killed if reachability at a fixed proposal count does not rise on
          either fold after refinement, or if the displacement turns out to be
          mostly along z where refinement cannot recover a strided grid.
        source: F-0028; the mechanism is standard blob-centroid refinement and needs no external source
        first_probe: re-audit with the displacement vector, to learn whether the miss is along z or in the plane
        status: >-
          REFINEMENT ARM KILLED BY ITS FIRST PROBE, before the expensive run.
          [[F-0029]] measured the near-miss displacement at four to six grid
          steps in the plane with no z bias, which refinement cannot close and
          which identifies the nearest proposal as a neighbour's peak rather
          than this cell's displaced one. The refinement instrument stays in the
          repository behind a flag, because it is cheap and correct, but it is
          not the fix for this residual.
        reframed_as: H-11b
      - id: H-11b
        stream: proposals
        statement: >-
          The near-miss residual is response merging at the largest scale of
          the bank. Removing the 4.5 micrometre scale, or taking maxima per scale
          rather than of the max-over-scales response, separates neighbouring
          nuclei and raises reachability at a fixed proposal count on both folds.
        falsifier: >-
          killed if reachability at a fixed proposal count does not rise on
          either fold when the largest scale is removed, or if it rises on one
          fold and falls on the other.
        source: F-0029, and the DoG scale-space argument that the outer sigma at 4.5 um is about 4.2 um
        cost: one evaluate proposals run per bank; no new model
        status: >-
          CHALLENGER. [[F-0031]]: removing the 4.5 micrometre scale raises reach
          on 44b6 at every budget and matched count, and on 6bba only above twice
          the estimate, with a loss at the neutral budget. The falsifier's
          both-folds clause is met above ratio 4 and not below, so the bank is a
          budget-dependent choice rather than a fix. The 2.5 micrometre scale is
          redundant to four decimals. Measured under the packed regime; the bank's
          interaction with true peaks (F-0030) is the next measurement.
        under_peaks: >-
          [[F-0032]]: with a strict-maximum rule the two-scale bank wins on both
          embryos wherever the budget is at least twice the estimate, and the
          three-scale bank keeps a 0.015 lead only at the neutral budget on 6bba.
          Carried forward as the operating configuration under [[D-0041]].
      - id: H-11c
        stream: proposals
        statement: >-
          A per-scale peak union, taking strict maxima at each scale separately
          and deduplicating by physical suppression, recovers the neutral-budget
          6bba cells the 4.5 micrometre scale ranks well without re-merging the
          44b6 neighbours it fuses.
        falsifier: >-
          killed if reachability at a fixed proposal count falls on either fold
          relative to the two-scale peaks detector.
        source: F-0032
        cost: one evaluate proposals run; a small change to how the response bank is reduced
        result: >-
          [[F-0034]]. With three scales the union beats the fused peaks and loses
          to the two-scale peaks; the 4.5 micrometre scale is the cost, not the
          fusion. Re-run on the two-scale bank as H-11d it is a retention
          challenger, 0.9467 and 0.9291 saturated reach against 0.9239 and
          0.8984 with both held-out directions improving, bought with a fifth
          more proposals. Enters E05 as a candidate source; D-0041 unchanged.
      - id: H-10
        stream: division
        statement: >-
          A parametric track-age prior on division, charging a cell for dividing
          again soon after it divided, removes more false divisions than it
          suppresses true ones on both folds.
        falsifier: killed if division TP falls faster than division FP on either held-out fold
        source: RL-0020, and F-0014 for why a learned prior is not available
        queued_after: E06, since it needs track ages from a working linker

    stopping_note: >-
      First-pass reading of the association stream has reached diminishing
      returns: the last three full texts converged on the same parental-softmax
      no-link mechanism, ILP decoding with degree constraints, and geometric
      attention biases. Further association reads wait for E06 to show which
      mechanism the folds actually reward.

    not_adopted:
      - Every constant listed under constants_not_adopted. They seed labelled probe grids only.
      - Any reported score. None was measured on this corpus or under this metric.
      - SELMA3D as an input, pending a licence review against the competition rules.

  - id: R-0014
    status: measured_environment
    title: A reproducible tracksdata wheel built in the disposable sandbox from the officially pinned commit
    why: >-
      [[R-0012]] found that tracksdata is a git source in uv.lock with no wheel
      and no sdist, and that it is not optional: registry/official_source.yaml
      pins it as the official metric's graph representation and distance
      matching. An ABI-locked wheelhouse cannot carry what has no artifact, so
      the artifact is built here, from the pinned commit, in the sandbox
      [[D-0039]] requires for third-party code, and its identity is recorded
      separately from the upstream provenance it was built from.

    upstream_provenance:

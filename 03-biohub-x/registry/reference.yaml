  - id: R-0004
    status: reference_only
    title: G-03 vendored CC0 architecture, strict loading, and the CPU smoke
    source:
      kind: kaggle_selective_source_download_and_local_cpu_run
      authorised_by: Arya Arun
      authorisation: >-
        CPU-only PyTorch 2.10 wheel in a pinned model-cpu dependency group, not a
        core dependency. No CUDA libraries and no system Python. Build the
        minimum Biohub-X-owned compatibility definition for the CC0 reference
        architecture, preserving attribution and binding the vendored source
        identity, with one named consumer. Load both quarantined weights with
        strict=True. One synthetic CPU forward pass and one no-gradient proposal
        smoke on the preregistered E01 crop, classified integration_only. No
        corpus-wide inference, no training, no GPU, no kernel push, no submission.
      performed_utc: '2026-09-02T00:00:00Z'

    dependency:
      package: torch
      version: 2.10.0+cpu
      index: https://download.pytorch.org/whl/cpu
      group: model-cpu
      verified:
        cuda_compiled_in: null
        cuda_available: false
        nvidia_packages_installed: 0
      rationale: >-
        A group rather than a core dependency, so that `artifacts verify`, the
        official metric, the retention oracle and every other non-model command
        keep running without importing 200 MB they never use. The CUDA build
        stays a separate decision belonging to training our own folds.

    vendored_source:

      upstream_directory: repo/src/biohub_tracking/models/
      license: CC0-1.0
      vendored_into: src/biohubx/_vendor/reference_baseline/
      note: >-
        Copied byte-exact. Both files were already LF with no BOM, so raw and
        canonical identity coincide and `.gitattributes` needed no change, which
        matters because changing it is itself a gated action. An architecture
        retyped from a description is a different architecture, and strict
        loading against it would either fail or silently succeed on wrong shapes.
      files:

  gate_6_wheelhouse:
    state: awaiting_authorisation
    scope_performed: >-
      Four wheels downloaded from the URLs uv.lock records and verified against
      the SHA-256 uv.lock records. The private dataset was created from them. The
      published dataset was then downloaded once, on Arya's instruction, and
      compared against the published payload by path, size and content. No kernel
      has been pushed and nothing else has been downloaded.

    dataset:
      slug: aryaarun07/biohubx-wheelhouse-zarr-cp312-linux
      state: CREATED, PRIVATE, VERIFIED
      created_utc: '2026-09-03T06:09:52Z'
      instrument: biohubx package wheelhouse
      report: artifacts/wheelhouse-identity.json

      why_two_identities: >-
        A wheelhouse is uploaded as a directory and published as a dataset, and
        those are not the same tree. Recording one digest named a tree that
        exists on neither side, which is what surfaced as an inventory difference
        and stopped the push ([[D-0031]]). Both are now recorded, so the two can
        be named apart rather than reconciled in prose.

      upload_bundle:
        what: what this machine sends, staged at artifacts/wheelhouse
        tree_digest: tree_sha256:sha256/v1:32688f0520b25e314f677f46a8c843fe684890f951bffc643dbb2ea9180b6040
        file_count: 8
        total_bytes: 9304348
        kaggle_configuration_included:
          relative_path: dataset-metadata.json
          size_bytes: 275
          raw_sha256: 4398b85ba837a276c393e811d7f04b16c4e8c603db282f26e99318fe588eba6c

      published_payload:
        what: what a Kaggle kernel mounts, and therefore the identity an authorisation names
        tree_digest: tree_sha256:sha256/v1:4c7474376ba70a4772babee4c8fca8d13d829066686f8672cd1b9f23a10ee3ed
        file_count: 7
        total_bytes: 9304073
        excludes: >-
          dataset-metadata.json and nothing else. Kaggle reads it to create the
          dataset and does not keep it among the data, so the published tree
          holds exactly one file fewer than the bundle that produced it.
        derivation: >-
          Computed by staging the payload as a tree of its own and walking it
          with the same contract-tested walk every other tree identity uses, not
          by deleting a line from the bundle's canonical listing. Subtraction is
          wrong in general, because removing the last file from a directory turns
          it into an empty directory that canonicalization v1 records in its own
          right, so an edited listing can describe a tree that could not exist.

      published_dataset_verified:
        downloaded_and_compared: true
        method: >-
          The published dataset was downloaded from Kaggle and compared with the
          published payload by relative path, size and content digest, then by
          tree digest over the whole tree.
        differences: none
        tree_digest_matches_published_payload: true
        remote_file_count: 7
        remote_total_bytes: 9304073
        wheels_verified_against: >-
          uv.lock and requirements-offline.txt, all four, by filename rather than
          by package name, since one package resolves to many platform wheels and
          only the file on disk is the staged one.
        note: >-
          Content, not shape. A same-size substitution changes neither the file
          count nor the total bytes, so the inventory listing Kaggle reports could
          not have established this on its own.

      inventory_discrepancy_resolved: >-
        The authorisation named 8 files and 9,304,348 bytes, which is the upload
        bundle. The dataset holds 7 files and 9,304,073 bytes, which is the
        published payload. The difference is exactly dataset-metadata.json at 275
        bytes, and both trees now carry their own recorded identity. The stop
        condition was real and the cause was benign, and recording only one of two
        identities is what made a benign platform behaviour indistinguishable from
        a substituted file.

      upload_note: >-
        Uploaded with --dir-mode zip because the CLI's default skips
        subdirectories entirely, which would have dropped every wheel. Kaggle
        extracted the archive and the wheels/ prefix survived.
      first_attempt_failed: >-
        A first create with a relative -p path failed inside the CLI on a
        mixed-separator temp path and created nothing; the retry used an
        absolute path. No partial dataset was left behind.
      contents:
        published:
          - wheels/zarr-3.3.0-py3-none-any.whl
          - wheels/numcodecs-0.15.1-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          - wheels/donfig-0.8.1.post1-py3-none-any.whl
          - wheels/google_crc32c-1.8.0-cp312-cp312-manylinux1_x86_64.manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_5_x86_64.whl
          - requirements-offline.txt
          - WHEELHOUSE.json
          - README.md
        configuration_only:
          - dataset-metadata.json
      licences:
        zarr: MIT
        numcodecs: MIT
        donfig: MIT
        google-crc32c: Apache-2.0
      licence_evidence: >-
        Read from each wheel rather than assumed. zarr, numcodecs and donfig
        declare MIT in their METADATA and carry a licence file in dist-info.
        google-crc32c declares no License field, so its licence was read from
        the LICENSE file inside the wheel, which is the Apache License 2.0.
      installation_command: >-
        pip install --no-index --no-deps --require-hashes -r
        /kaggle/input/biohubx-wheelhouse-zarr-cp312-linux/requirements-offline.txt
        --find-links /kaggle/input/biohubx-wheelhouse-zarr-cp312-linux/wheels/
      refusals: >-
        --no-index forbids reaching an index, --no-deps forbids resolution, and
        --require-hashes refuses any artifact whose hash is not in the
        requirements file. No sdist is present, so none can be built, and the
        builder refuses to stage a wheelhouse containing one.
      deliberately_absent:
        - polars, scipy and every other version the image already supplies
        - tracksdata, geff, rustworkx, bidict, imagecodecs and the metric stack
        - the reference's 322 MB bundle

    preflight:
      preflight_id: E03-WHEELHOUSE-PREFLIGHT-01
      state: PERFORMED. Pushed once as kernel version 2 and completed; see [[R-0008]]
      outcome: >-
        Resolved the wheelhouse by its embedded identity at
        /kaggle/input/datasets/aryaarun07/biohubx-wheelhouse-zarr-cp312-linux,
        verified it before pip with zero differences, installed offline at
        returncode 0, imported all four packages, round-tripped the competition's
        own codec, and decoded one real chunk from train/44b6_0113de3b.zarr. 6.907
        seconds against a 600 second ceiling.
      attempt: 2
      prior_attempt: >-
        Attempt 1 pushed package 9344153065 at commit 27fdd3d and refused at the
        mount gate after 8.752 seconds. Its outcome is [[R-0007]] and is immutable;
        this rebuild does not replace or inherit it.
      outcome: >-
        Authorised by Arya Arun and pushed once as kernel version 1. Every
        authorised parameter was re-derived from the staged bytes before the push
        and all matched. The run refused after 8.752 seconds because the
        wheelhouse was not mounted at the path the package assumed, wrote its
        manifest atomically, and reached neither verify, install, import,
        roundtrip nor competition-read. No repair run was made, per the
        authorisation. The wheelhouse identity check this package was rebuilt to
        carry was never exercised on the target.
      package_digest: canonical_text_sha256:sha256/v1:ba93657b1781c083243d83d9c9f933b5bb6849ee3e952ec2fdf2c1ca607dee9b
      supersedes_packages:
        - >-
          canonical_text_sha256:sha256/v1:6dcdf87f1c74a146fdf58404f6a2d7e168aff0ea80602aaae1aad1d2ba770ce5
          at 8227221, never pushed. It installed from whatever it mounted.
        - >-
          canonical_text_sha256:sha256/v1:9344153065a0674f63299978eb7cc930209372740e93909023428ffb7f3c824a
          at 27fdd3d, pushed once and refused at the mount gate ([[R-0007]]). It
          verified the tree it mounted and assumed where that tree would be.
      file_count: 4
      total_bytes: 22341
      nbconvert_bytes: 347883

      mount_resolution:
        why: >-
          Attempt 1 assumed /kaggle/input/<slug> and refused, having measured only
          that its guess was wrong. The package already carries the tree's
          identity, and an identity answers a stronger question than a path: a
          name says where to look, a digest says when you have found it
          ([[D-0033]]).
        method: >-
          Enumerate what is mounted under /kaggle/input and select the tree whose
          canonical digest equals the embedded identity. Locating and verifying
          then rest on one fact rather than two.
        bounded: four levels, single-level globs, never a recursive glob
        cost_control: >-
          Shape is compared before anything is hashed and abandoned the moment the
          file count or byte total is exceeded, so the competition corpus is never
          read to find a directory of four wheels.
        refusal: >-
          A miss prints a listing of what is actually mounted, which is exactly
          what attempt 1's refusal lacked.
        exercised_locally: >-
          Against a simulated mount holding a 480-file corpus-shaped decoy and the
          real downloaded dataset nested three levels deep under a layout the
          package was never told about: resolved correctly in 0.369 seconds,
          hashed three trees, none of them the decoy.
        still_unmeasured: >-
          Where Kaggle actually mounts a private dataset on this image. The design
          removes the need to know; if the next run resolves, the path it reports
          becomes a Biohub-X measurement.
      repository_clean_at_build: true

      mount_verification:
        why: >-
          requirements-offline.txt cannot authenticate itself. A substituted
          dataset shipping its own matching requirements file satisfies
          pip --require-hashes exactly, so the hash check bound nothing it had not
          also been handed. Verifying the published dataset remotely established
          what was published at one moment and said nothing about the bytes a
          kernel reads at another ([[D-0032]]).
        anchor: carried by the package, never read from the mount
        embedded_identity: tree_sha256:sha256/v1:4c7474376ba70a4772babee4c8fca8d13d829066686f8672cd1b9f23a10ee3ed
        embedded_records: 7
        pinned_to_authorisation: true
        runs_before_pip: true
        refuses_on: [extra, missing, renamed, modified]
        rename_note: >-
          A rename appears as one missing path and one extra path, which is what a
          rename is.
        logs: >-
          Both identities are printed as BIOHUBX_STAGE verify lines, expected then
          observed, followed by one line per difference, so a mismatch is readable
          in the run rather than reconstructed from it.
        second_implementation: >-
          The package may not import Biohub-X, because it has to run on an image
          where Biohub-X cannot ([[D-0029]]), so canonicalization v1 exists a
          second time inside the notebook. A test executes the notebook's own
          verifier and requires it to return exactly what
          biohubx.hashing.tree_digest returns for the same tree, including the
          empty-directory record and the zero-byte-file size. Without that test it
          would be a reimplementation that agrees until it does not.
        upload_bundle_not_checked: >-
          tree_sha256:sha256/v1:32688f0520b25e314f677f46a8c843fe684890f951bffc643dbb2ea9180b6040
          is recorded in the package manifest for provenance and is deliberately
          not the identity checked. Kaggle consumes dataset-metadata.json, so no
          kernel mounts that tree and embedding it would refuse every correct
          mount ([[D-0031]]).
        exercised_locally:
          real_published_dataset: >-
            The shipped notebook's own verifier, executed against the downloaded
            published dataset, recomputed
            tree_sha256:sha256/v1:4c7474376ba70a4772babee4c8fca8d13d829066686f8672cd1b9f23a10ee3ed
            with zero differences.
          same_size_substitution: >-
            One byte of the zarr wheel flipped in place, leaving the file count,
            every file size and the total bytes identical, was caught as a content
            difference naming that wheel.
          tampering: >-
            A rewritten requirements file, an added file and a renamed file were
            each named individually.
          authorisation_pin: >-
            Building against a wrong expected identity refuses and stages nothing.
        what_it_does_not_do: >-
          It does not authenticate the dataset's origin and is not a defence
          against the account holder. Anyone able to replace the dataset can still
          replace it; what they can no longer do is have the run proceed.
      pinned_commit: 5e5778133391c443470842c34d6c91ef916b4f8d
      kernel: aryaarun07/biohub-x-wheelhouse-preflight
      enable_gpu: false
      enable_internet: false
      dataset_sources: [aryaarun07/biohubx-wheelhouse-zarr-cp312-linux]
      competition_sources: [biohub-cell-tracking-during-development]
      runtime_ceiling_seconds: 600
      what_it_asks: >-
        Whether the wheelhouse installs offline on the measured image, and
        whether the result decodes a real competition chunk. The competition is
        attached for exactly one read, because a wheelhouse that installs but
        cannot decode blosc has answered neither question.
      not_executed_at_build: >-
        The notebook is validated and converted locally but not run: it installs
        packages and reads the corpus, and neither belongs in a build step.

    correction_to_R-0006: >-
      The audit reported crc32c missing. That was the wrong import name.
      google-crc32c imports as google_crc32c and is present on the target at
      exactly the locked 1.8.0, so only three of the four wheels are strictly
      required. The fourth is shipped anyway so the wheelhouse does not depend on
      that staying true, and the closure now probes the right name.

    what_this_does_not_authorise:
      - creating or uploading the Kaggle dataset
      - pushing the preflight kernel
      - E03-SMOKE-03, any GPU work, or a submission

  what_G-01_changed_about_the_plan:

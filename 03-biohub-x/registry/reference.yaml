        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TRACKSDATA: 0.1.0rc9.dev4+g7bfeaf845
        PYTHONDONTWRITEBYTECODE: "1"
        PIP_NO_CACHE_DIR: "1"
      pretend_version_note: >-
        hatch-vcs derives the version from git metadata, which the sandbox does

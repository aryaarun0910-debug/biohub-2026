    resolutions:
      public_test_contamination:
        verdict: >-
          CONTAMINATED. All four public-test movie ids were used in fitting or
          model selection for at least two of the three models the notebook
          blends, so the 0.936 public leaderboard score cannot be read as
          evidence of generalisation.
        evidence:
          temporal_seed_model: >-
            split_manifest.json records method
            unet_transformer_alltrain_seed314159_v1 with train listing all 199
            annotated movies, which includes 44b6_0113de3b, 44b6_0b24845f,
            6bba_05b6850b and 6bba_05db0fb1. Its 40-movie validation list
            contains 44b6_0113de3b and 44b6_0b24845f as well.
          deepcenter_model: >-
            split_manifest.json records train of 71 stems containing
            44b6_0113de3b and 44b6_0b24845f, and val of 128 stems containing
            6bba_05b6850b and 6bba_05db0fb1. The 71/128 division is the
            44b6/6bba embryo split, so no public-test movie was held out of both.
          primary_support_pack_weights: >-
            Unrecorded. The pack carries no split manifest and its
            ARTIFACT_MANIFEST describes itself only as a public learned baseline
            artifact repackaged locally. Its training split remains unknown, but
            the two models above settle the ensemble.
          why_it_matters: >-
            F-0010 established that each public-test volume is byte-identical to
            a train volume of the same id, and those train volumes carry ground
            truth. Training on them is training on the public test set.
        kaggle_test_splits_50ep.json: >-
          Not a training record and not in any dataset. The notebook writes it at
          inference time as [{"split": 0, "train": [], "test": test_stems}] with
          an empty train list, where test_stems is a directory listing of the
          competition test folder. It is an inference manifest. The question was
          answered by the two weight packs' own split manifests instead.

      name_mismatch:
        verdict: >-
          RESOLVED, and not a defect in the weights. build_biohub_support_pack.py
          sets artifact_name from the local output directory name, so
          biohub-tracking-support-pack-400ep-snapshot-v1 is the author's staging
          folder on their own machine and carries no claim about training length.
          The Kaggle slug is a separate argument to the same script. The
          authoritative binding is the weight sha256, which is identical across
          the manifest, the run log and the file listing.

      licences:
        verdict: >-
          RESOLVED. All four datasets are CC0-1.0 and public, each tagged
          pre-trained model. Competition rule 2.6 permits external data and
          models that are public, equally accessible and of minimal cost, which
          these are. Code licence, weight licence and training-data provenance
          are still three questions: the licence is settled, and the
          training-data provenance is settled as contaminated above.

      configuration_versus_receipt:
        verdict: >-
          RESOLVED, and the receipt is the unreliable one. Cell 0 sets the run's
          values as environment variables, and those are what executed:
          BIOHUB_DET_THRESHOLD 0.965, BIOHUB_ILP_DISAPPEARANCE_WEIGHT 2 and
          BIOHUB_SECONDARY_DETECTION_WEIGHT 0.80. The runtime integrity receipt
          reports 0.96875, 1.5 and 0.475. The 0.475 is the parent fork's value,
          which cell 0's own comment names as the single constant this notebook
          changed. The receipt describes the ancestor, not the run.
        instruction_for_reproduction: >-
          Trust the cell-0 environment block. Do not configure a reproduction
          from the runtime integrity receipt.

      notebook_lineage:
        verdict: >-
          RESOLVED, and four deep. Cell 0 declares this notebook a fork of the
          public notebook pls-upvote-share-higher-scoring-ideas by
          stephennedumpally at LB 0.931, with one constant changed and a claimed
          gain of +0.003 on that lineage. The run log separately credits its
          harmonic association rule to the CC0 notebook
          yusuketogashi/no-hack-biohub-cell-another-approch-3rd v18, and names a
          fixed-90 dual-seed baseline at LB 0.913 beneath that. The weights come
          from pilkwang. No single author owns the result.

      division_jaccard_of_the_run:
        verdict: >-
          UNRESOLVABLE from any artifact. The notebook computes no division
          Jaccard on the test split because no test ground truth exists, and the
          leaderboard reports only the combined score. It stays open, and the
          four public movies hold three annotated divisions between them, so the
          term is decided by three events whichever way the split falls.

    corrections_to_R-0001:
      - >-
        R-0001 recorded the DeepCenter checkpoint as epoch 2 with best_score
        -0.045, taken from the run log, and this repository described it as a

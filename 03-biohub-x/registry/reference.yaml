      contaminated.
    - >-
      The 0.950 target must be defined against a clean held-out split of the 199
      train movies under D-0016, never against the public leaderboard.
    - >-
      The reference's own training scripts are in hand as CC0 code. They describe
      a proposal source, which F-0017 identifies as exactly what Biohub-X lacks.

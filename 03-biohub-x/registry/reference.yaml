        the directory still did not exist under the assumed name.
      competition_path_by_contrast: >-
        /kaggle/input/competitions/biohub-cell-tracking-during-development is a
        real directory on this image, established by E03-SMOKE-02: that run
        reached the import at entry.py line 106 of commit 6cb640e, which is
        downstream of a _discover call that raises when train/*.geff is empty.
        So competitions are mounted under a competitions/ prefix rather than at
        /kaggle/input/<slug>, and the plain layout the wheelhouse assumed is not

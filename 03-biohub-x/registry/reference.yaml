  - id: R-0020
    status: measured_environment
    title: The biohub-compute sandbox, a Jupyter server that can read the competition root and reach nothing else
    why: >-
      [[D-0043]]'s third profile. Multi-call exploration needs a kernel that
      survives between calls; the authorisation requires no credentials, a
      read-only competition root, one scratch output and no hosted service.
      Those are properties a launcher can assert or a probe can measure; this
      is the measurement.
    design:
      host_side: jupyter-mcp-server 2.1.4 in biohub-compute/py, stdio to Claude Code, HTTP to 127.0.0.1 only
      image: biohubx-compute:15b696d6f181 from base python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea, built by tools/workstation/sandbox/Dockerfile
      lock: tools/workstation/requirements/biohub-compute-sandbox.lock.txt, sha256 15b696d6f181efec025c93acd2906ee550365de16b993abb36de29fe161a668a, compiled for linux/cp312 against the repository's uv.lock as constraints
      network: docker internal network; the Jupyter container has no route out
      ingress: one forwarder container publishing 127.0.0.1:18888 into the internal network
      mounts: /data read-only competition root; /repo/src read-only repository source; /scratch the one read-write directory
      root_filesystem: read-only, with tmpfs for the temporary directory and the sandbox user's home
      user: 1000:1000, all capabilities dropped, no-new-privileges
      limits: memory 8g, cpus 4, pids 512
      secrets: one random token per launch, in process environments only
      tracksdata: the Biohub-X build of R-0014, installed into the image with its hash

    validation:
      session: artifacts/tool-sessions/WS-COMPUTE-01.json
      server: Jupyter MCP Server 2.1.4, 18 tools, executor execute_code
      read_data_root: True
      write_into_data_root_refused: True
      outbound_network_blocked: True
      scratch_writable: True
      biohubx_imports_and_reads_a_movie: True
      overall_ok: True
      note: >-
        Two defects found on the way and fixed before the record: the tmpfs home
        was root-owned so Jupyter could not create its runtime directory, and a
        proxy container leaked from that failed start kept the port, so the
        next launch failed for an unrelated-looking reason. The launcher now
        tears down on a failed start and surfaces docker's stderr.

    not_evidence: >-
      A notebook in this sandbox is an instrument. Any result must be rerun
      through a preregistered biohubx command before it can enter findings.


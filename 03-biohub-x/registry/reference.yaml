        number the log printed. BIOHUB_DEEPCENTER_EXPECTED_EPOCH=2 in the
        notebook is an assertion about a different field of the checkpoint.
      - >-
        R-0001 listed the figures dataset's role as unresolved. It is a generic
        figure store for the author's unrelated notebooks and is not an input to
        anything. It is dropped from the download packet.
      - >-
        R-0001 treated the runtime integrity receipt as a description of the run.
        It is not; see configuration_versus_receipt above.


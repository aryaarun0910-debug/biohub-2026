      diagnostic_gap: >-
        The refusal named the path it wanted and not the paths it had, so the
        log cannot distinguish a competition source that failed to attach from
        one mounted elsewhere. Repaired with the resolution itself.
      repair: >-
        The root is now located by the registered artifact names the package
        already carries: the documented path and the bare slug are tried first,

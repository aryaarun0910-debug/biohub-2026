          verdict: MATCH
          attested_by: the pack's own ARTIFACT_MANIFEST and the reference run log, both predating the download
        temporal_edge_predictor_best.pth:
          bytes: 8363159
          expected: 9bac2fa0dadc4a6fc1899e0caf187f4b553e0a7cd90ba1261a68b35ffe9e305f
          recomputed: 9bac2fa0dadc4a6fc1899e0caf187f4b553e0a7cd90ba1261a68b35ffe9e305f
          verdict: MATCH
          attested_by: the pack's own SNAPSHOT_MANIFEST and the reference run log, both predating the download
        same_size_different_content: >-
          Both files are exactly 8363159 bytes and their digests differ, so they
          are genuinely two models rather than one file published twice.
        registry_check: >-
          Both are recorded in registry/artifacts.yaml with status reference_only
          and re-derived through `artifacts verify --deep`: 2 checked, 0 failed.

      format_check:
        method: >-
          Read as Zip archives with a restricted unpickler that refuses to
          execute any torch class and captures the rebuild calls instead. No
          torch, no CPU inference, no tensor materialised. This establishes what
          the files contain and nothing about what they do.
        both_checkpoints:
          zip_entries: 142
          state_dict_entries: 136
          parameters: 2077996
          identical_key_sets: true
          identical_shapes: true
        architecture_recovered:
          encoder: unet.encoder_blocks 0 to 2, first conv (32, 1, 3, 3, 3), so a single-channel 3D input
          temporal: unet.temporal_blocks 1 and 2, each a MultiheadAttention with layer norm
          decoder: unet.decoder_blocks 0 and 1
          unet_head: (32, 32, 1, 1, 1) producing a 32-channel feature volume
          detect_head: (1, 32, 1, 1, 1) plus one bias, a 1x1x1 convolution to a single logit per voxel
          edge_predictor: >-
            transformer.proj (128, 64), four cross-attention blocks, and
            pair_mlp ending (1, 64) to a single edge logit.
        what_this_settles: >-
          The reference's proposal source is a dense per-voxel detection
          heatmap, one logit for every voxel of the UNet feature volume, and the
          notebook turns it into nodes with a threshold. That is architectural
          confirmation of what the emitted node counts in R-0001 already implied:
          the system detects every cell it can and never targets the annotated
          ones. It also means its node budget is set by a scalar threshold,
          which is the knob a retention policy would act on.
        model_size_note: >-
          2.08 million parameters across both, which is small. The reference's
          strength is not model capacity.


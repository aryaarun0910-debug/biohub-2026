    layers: volume (gray, additive), ground truth (lime points), proposals (magenta points), the miss (red ring); scale (1, 4.0, 1.0, 1.0) um on (t, z, y, x)
    classes_bookmarked: ['boundary', 'dim', 'localization', 'low_response', 'merged', 'temporal_dropout', 'unexplained']
    what_was_seen: >-
      The dim representatives are faint blobs under the ring with proposals

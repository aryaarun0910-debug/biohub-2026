          canonical_text: canonical_text_sha256:sha256/v1:b97209edeb03840e80d903e3e2a8c81c520641c8ef343f6ca2904d0f80db064e

    biohubx_owned:
      module: src/biohubx/reference/architecture.py
      consumer: biohubx infer reference
      supplies: >-
        The composition the checkpoints imply and the vendored files do not
        contain: a TemporalUNet3D, a 1x1x1 detect_head convolution, and a
        SimpleNodeTransformer, plus a strict loader that freezes the weights and
        puts them in eval mode.
      derived_not_assumed: >-
        pos_feat_dim appears in no published config. It is read from the
        checkpoint as the projection width minus the UNet channel count, so a
        checkpoint built with a different positional embedding is refused here
        rather than at a shape error deep inside inference. Both published
        weights derive 32, which matches the upstream constant of four times
        eight.

    strict_loading:
      both_checkpoints:
        strict: true
        parameters: 2076706
        buffers: 1290
        total_tensors: 2077996
        exact_key_coverage: true
        exact_shape_match: true
        eval_mode: true
        gradients_disabled: true
      cross_check: >-
        The torch-free structural index in R-0003 counted 2,077,996 tensor
        entries. The loaded model reports 2,076,706 parameters plus 1,290
        buffers, which is the same number reached two independent ways.
      derived_spec:
        unet_out_channels: 32
        unet_layers: [32, 64, 128]
        pos_feat_dim: 32
        window_size: 2
        downsample: [1, 4, 4]

    synthetic_forward_pass:
      input_shape: [1, 2, 8, 16, 16]
      feature_shape: [1, 2, 32, 8, 16, 16]
      logit_shape: [1, 2, 1, 8, 16, 16]
      finite: true
      seconds: 0.041

    real_proposal_smoke:
      status: integration_only
      window: E01, 6bba_2540cd90 frames 0 to 11, crop z 0:32 y 128:256 x 128:256
      checkpoint: reference.pilkwang.support_pack_50ep.edge_predictor_best
      volume_shape: [12, 32, 128, 128]
      strided_shape: [12, 32, 32, 32]
      striding_note: >-
        The reference downsamples by striding, not pooling, so the smoke strides
        identically. Its quantile normalisation at 0.1 and 99.9 percent is the
        same normalisation Biohub-X already applies when reading a window, so no
        second convention was introduced.
      feature_shape: [1, 2, 32, 32, 32, 32]
      logit_shape: [1, 2, 1, 32, 32, 32]
      finite: true
      detection_threshold: 0.965
      voxels_per_frame: 32768
      voxels_above_threshold_total: 3992
      voxels_above_threshold_per_frame: [298, 328, 322, 344, 337, 353, 368, 366, 345, 345, 296, 290]
      fraction_of_voxels_above_threshold: 0.010152
      seconds: 3.018
      peak_rss_bytes: 371568640
      what_this_is_not: >-
        A voxel above threshold is not a node. The reference still runs peak
        finding and suppression over this heatmap before it has proposals, so
        3,992 is an upper bound on what the detector offers this window and not
        a node count. Against 26 annotated nodes and a prorated window estimate
        of 56.7 cells, the gap between the heatmap and a node set is where the
        reference's proposal logic lives, and Biohub-X has not reproduced it.
      why_it_cannot_support_a_finding: >-
        The checkpoint is quarantined and this window comes from the training
        corpus the reference's sibling weight trained on. integration_only means
        the chain runs, nothing more.

    unresolved:
      - Whether Biohub-X can reproduce the reference's peak finding and
        suppression, which is what turns this heatmap into the node counts
        recorded in R-0001. Until then the proposal interface is loadable but
        not reproduced.
      - The primary weight's training split, carried forward from R-0002.
  - id: R-0005
    status: reference_only
    title: Audit of the CC0 trainer's detection objective, before copying any of it
    source:
      kind: cc0_source_read
      file: repo/scripts/train_unet_transformer.py
      sha256: c4f6317736bb3bb1ec8f3f6e9a6d935a463e3f0f1f685481b2d13218d35dc9ea
      function: compute_detection_loss
      note: Read locally from the copy acquired in G-01. Nothing was downloaded for this audit.

    observed:
      target_construction: >-
        `target = torch.zeros_like(logits)`, then the annotated node voxels are
        set to 1.0. Every other voxel is a negative, weighted by neg_weight. The
        docstring states it plainly: "GT node voxels are positive, all others
        lightly penalised."
      ignore_class: none
      weighting: >-
        Positives normalised by their count to total weight 1.0, negatives by
        theirs to total weight neg_weight, published as 0.01 in the temporal
        seed's training_config.json.
      it_does_warn_about: >-
        Nodes that collapse to the same voxel after downsampling, which it calls
        undetectable. It warns about losing a labelled cell and says nothing
        about supervising an unlabelled one as background.

    measured_consequence:
      method: >-
        Each dataset's annotated node count against its own official
        estimated_number_of_nodes, for four movies spanning both embryos.
      unannotated_cells_supervised_as_background_per_annotated_cell:
        44b6_0c582fdc: 393
        44b6_0db75fae: 97
        6bba_2540cd90: 6
        6bba_5f89039d: 4
      fraction_of_negatives_that_are_really_cells:
        44b6_0c582fdc: 0.0010638
        6bba_2540cd90: 0.0001241
      reading: >-
        Per voxel the contamination is small, which is why the objective trains
        at all. Per cell it is not: on 44b6_0c582fdc the objective asserts that
        71 cells are cells and 27,887 visually identical cells are not. The
        ratio spans two orders of magnitude across the embryos, tracking the
        twelvefold density difference in F-0013, so the two folds would not be
        optimising the same thing.

    verdict: >-
      REJECTED for Biohub-X. AGENTS.md section 5 requires unlabelled and ignore
      regions to be respected rather than treated as background, and this
      objective does the opposite by construction. D-0023 records the
      replacement. The audit is kept because knowing exactly how the reference
      was trained explains its dense output, and because a later comparison
      between the two objectives is a real experiment.

    unresolved:
      - Whether the reference's dense node counts are partly an artefact of this
        objective rather than a deliberate strategy. Its configuration contains
        no node-count target (R-0001), and an objective that penalises every
        unlabelled cell would push toward exactly the behaviour R-0003 found.

# ---------------------------------------------------------------------------
# Approval gate, revised after G-01. The metadata gate is spent; what remains
# is weights and GPU. Both still require an explicit human go-ahead per
# AGENTS.md section 7.
# ---------------------------------------------------------------------------

approval_packet:
  prepared_utc: '2026-09-02T00:00:00Z'
  prepared_against: R-0002
  supersedes: the pre-G-01 packet, whose four-dataset download is no longer what is being asked for
  state: awaiting_human_approval

  gate_1_metadata:
    state: PERFORMED
    outcome: >-
      Every R-0001 uncertainty except two is resolved, at a cost of 523,502
      bytes and no weight download. The headline result is that the reference's
      leaderboard score is contaminated, which changes what a reproduction is
      for.

  gate_2_weight_downloads:
    state: PERFORMED for the two required files; DeepCenter still deferred, figures dropped
    outcome: >-
      Both identities verified against digests declared before the download,
      both registered reference_only and quarantined, and both structurally
      indexed without torch (R-0003). 16,726,318 bytes taken.
    purpose: >-
      Reproduce the reference once to establish what it emits, not to establish
      what it scores. Its public score is contaminated (R-0002), so reproduction
      is an engineering reference for node counts, runtime and behaviour, and is
      no longer evidence that 0.936 generalises.
    licence_position: all CC0-1.0, public, competition rule 2.6 satisfied
    items:
      - slug: pilkwang/biohub-tracking-support-pack-50ep-v1
        required: true
        files_needed:
          - weights/unet_transformer/split_0/edge_predictor_best.pth
          - repo/
        expected_digest:
          edge_predictor_best.pth: 12f6881ee3620a831697ca098ff8f48e687a24225f4e048b538deec3562fe771
        bytes_if_selective: 8512000
        bytes_if_whole_dataset: 355616000
        note: >-
          checkpoint_last.pth (25 MB) is training state and is not needed for
          inference. The wheels directory is 322 MB of offline dependencies that
          a local CPU or GPU run does not need, because this repository already
          pins its own environment. Selective file download avoids 97 percent of
          the bytes.
      - slug: pilkwang/biohub-temporal-unet3d-seed314159-v1
        required: true
        files_needed:
          - weights/unet_transformer/split_0/edge_predictor_best.pth
        expected_digest:
          edge_predictor_best.pth: 9bac2fa0dadc4a6fc1899e0caf187f4b553e0a7cd90ba1261a68b35ffe9e305f
        bytes_if_selective: 8363159
        note: corroborated by the pack's own SNAPSHOT_MANIFEST, whose other declared digests all verified
      - slug: pilkwang/biohub-deepcenter-unet3d-center-prior-v1
        required: false
        files_needed:
          - weights/full_frame_center/best.pt
        expected_digest:
          best.pt: 8040999a92f6b7bbd98fa8cf458141e045c0f9ad7c936bdb3b18e1f7edafe2a0
        bytes_if_selective: 37876911
        note: >-
          Attested only by the run log; unlike the other two, no in-dataset
          manifest declares this digest. It serves only as an add-only veto on
          proposed divisions, and F-0016 shows spurious divisions on unmatched
          nodes are nearly free, so its contribution to the score is small.
          Defer it unless the reproduction misses its division counts.
      - slug: pilkwang/pilkwang-public-dataset-for-notebooks-figures
        required: false
        dropped: true
        reason: unrelated PNG figures; the notebook never reads from it

  gate_3_gpu_runs:
    state: RETIRED by D-0022; the reference will not be reproduced end to end
    runs:
      - id: G-02
        name: faithful reproduction of nusrati/0-936, unchanged
        hardware: Kaggle notebook, 2 x Tesla T4
        expected_runtime_minutes: 30
        configure_from: >-
          The cell-0 environment block, never the runtime integrity receipt,
          which R-0002 shows is stale in at least three fields.
        falsifier: >-
          Fails if emitted node and edge counts differ from R-0001's recorded
          per-movie counts by more than one percent.
        what_it_may_conclude: >-
          Node counts, runtime, memory and stage behaviour. It may NOT conclude
          anything about generalisation, because the models saw the public test
          movies.
        stop_condition: report and stop; no submission, no tuning
      - id: G-03
        name: protected smoke of a real retention policy on the preregistered window
        preconditions:
          - a real proposal source exists whose confidence a filter can act on
          - E02's oracle threshold of 0.94 correct-edge retention is the bar it must clear
        falsifier: the policy is killed if raising the node budget improves the adjusted edge Jaccard
        stop_condition: report both scores and stop

  gate_4_e03_training:
    state: awaiting_approval
    revised_after: E03-MASK-AUDIT
    what_the_audit_changed: >-
      The objective. The packet previously trained against an intensity band;
      F-0020 falsified every band on this corpus and D-0024 removed the negative
      class, so E03 now trains a non-negative positive-unlabelled risk in which
      no voxel is supervised as background. The folds, seeds and falsifier are
      unchanged.
    purpose: >-
      Two clean leave-one-embryo-out detectors, the first models in this project
      whose numbers could be promoted. Nothing here reproduces the reference.

    platform:
      choice: Kaggle, accelerator "GPU T4 x2"
      why: >-
        The competition data already resides on Kaggle, so no restricted data
        crosses a new boundary. Two T4s are requested rather than one because
        the two folds are independent and can be sharded across devices exactly
        as the reference did, halving wall clock for the same quota.
      gpu_shape_in_metadata: '"enable_gpu": true with accelerator "nvidiaTeslaT4"; the
        notebook asserts torch.cuda.device_count() and refuses if it is not what
        was requested'
      colab: >-
        Out of scope for E03. See colab_tracking_assessment below; the blocker is
        verification, not access.

    submission_mechanism:
      how: >-
        `kaggle kernels push -p <dir>` with a kernel-metadata.json naming this
        repository's packaged notebook, the competition as a data source, and no
        dataset sources at all, since E03 uses no external weights.
      kernel_metadata:
        enable_gpu: true
        enable_internet: false
        accelerator: nvidiaTeslaT4
        competition_sources: [biohub-cell-tracking-during-development]
        dataset_sources: []
        kernel_type: notebook
      notebook_content: >-
        Generated from the tested package, never hand-authored (AGENTS.md
        section 3). The notebook installs nothing and contains no model logic; it
        imports biohubx and calls one command.
      status: >-
        NOT BUILT. `package kaggle` remains an unimplemented command in
        SYSTEM.md, and building it is part of executing this gate rather than
        preparing it.

    preflight_evidence_that_this_is_worth_gpu_time:
      loop_integrity: >-
        All ten stages run on CPU under the new objective (F-0019 as amended):
        forward, risk, backward, optimizer step, atomic checkpoint, strict
        reload, identical output, peaks, suppression, legal graph.
      signal_present: >-
        One optimizer step from random initialisation moved node recall from
        0.269 to 0.346 and candidate reach from 0.227 to 0.273 against the same
        window, and the official score from 0.0999 to 0.1818. One step is not
        training and this is integration_only, but the gradient points the right
        way rather than nowhere.
      cost_measured: 32.6 seconds and 1.52 GB resident for 12 frames at 32x32x32
      honest_caveat: >-
        None of this establishes that twenty epochs will beat F-0017 on a
        held-out embryo. That is exactly what the falsifier is for, and it is
        why the smoke runs before the folds.

    run_1_smoke:
      id: E03-SMOKE
      scope: one fold, two movies from the training embryo, two epochs
      seed: 4460
      batch_size: 2
      expected_runtime_minutes: 20
      storage: one checkpoint, under 40 MB
      heartbeat_required: true
      outputs:
        - per-epoch loss with both positive-unlabelled risk terms
        - whether the non-negative clamp fired, per epoch
        - positives seen per batch
        - one checkpoint, written atomically and reloaded strict
      failure_conditions:
        - the risk does not decrease across the two epochs
        - any batch reports zero positive voxels
        - the negative-risk clamp fires in every epoch, which means the model is
          memorising positives rather than learning
        - the checkpoint does not reload with strict=True
        - peak GPU memory exceeds 14 GB on a 16 GB T4
        - wall clock exceeds 40 minutes
        - torch.cuda.device_count() differs from the requested accelerator
      stop_condition: report and stop; the full runs do not start automatically

    run_2_full_folds:
      id: E03-FOLDS
      precondition: E03-SMOKE passed and was reported
      runs:
        - fold_44b6, train 44b6 (71 movies), evaluate 6bba (128 movies), seed 4460
        - fold_6bba, train 6bba (128 movies), evaluate 44b6 (71 movies), seed 6660
      epochs: 20
      batch_size: 2
      learning_rate: 1.0e-4
      expected_runtime_hours: up to 6 per fold
      storage: two checkpoints under 40 MB each, plus per-fold metric reports
      mandatory_outputs:
        - node recall per fold
        - candidate reach per fold
        - official combined score per fold
        - never a pooled number in place of these
      failure_conditions:
        - node recall or candidate reach fails to beat F-0017 on either fold, which kills E03
        - a fold's evaluation touches any movie from its own training embryo
        - the public-test directory is read
        - wall clock exceeds the 6 hour ceiling per fold
      stop_condition: >-
        Report both folds separately and stop. Promotion is a separate decision
        and requires both folds to improve independently.

    inputs:
      competition_data: the 199 annotated train .zarr and .geff pairs, already on Kaggle
      configuration:
        path: configs/e03-clean-folds.yaml
        canonical_text: canonical_text_sha256:sha256/v1:c31428ecad168ed5553965fad500ea75326491220c1b39abd5510b073ffc7117
      code: this repository at the commit recorded in the run manifest
      weights_carried_in: none

    forbidden_throughout:
      - initialising, supervising, selecting or tuning from either quarantined checkpoint
      - reading the public-test directory
      - using the public leaderboard as validation
      - reporting a pooled result in place of per-fold results
      - local CUDA dependencies; the model-cpu group stays CPU-only

    colab_tracking_assessment:
      question: >-
        Whether a Colab L4 run could be tracked as securely as a Kaggle one,
        given that kagglehub.competition_download makes the data reachable there.
      access: not the blocker; the data is reachable from Colab with a login.
      blocker: verification, in three parts.
      detail:
        - >-
          Biohub-X verifies inputs by tree digest through `artifacts verify`
          against registry/artifacts.yaml. A Colab session's copy of the data has
          no registered identity on this machine, so nothing here can assert the
          bytes it trained on were the bytes recorded.
        - >-
          Nothing produced in a Colab session enters this repository's provenance
          chain unless the session writes a manifest and digests back, and a
          manifest the session writes about itself is a claim, not a check. A
          Kaggle kernel has the same weakness, which is why the packet requires
          the notebook to be generated from the tested package rather than
          hand-authored; a Colab notebook edited in a browser has no equivalent.
        - >-
          Competition rule 2.4.b requires reasonable measures to prevent access
          by anyone who has not agreed to the rules. Moving the data into a
          third-party notebook environment has not been assessed against that
          obligation by a person who can make that call.
      what_would_make_it_trackable: >-
        A Colab run that clones this repository at a named commit, verifies the
        downloaded corpus against the recorded tree digests before training,
        emits a run manifest carrying those digests plus the config digest, and
        returns checkpoints whose raw digests are registered on return. That is
        buildable and it is not built. Until it is, Colab can carry synthetic or
        cleared external pretraining and not competition data.

    what_this_gate_does_not_authorise:
      - any submission
      - any kernel push beyond the two runs above
      - reproducing the reference pipeline
      - a CUDA dependency in this repository
      - any Colab run on competition data

  what_G-01_changed_about_the_plan:
    - >-
      Reproducing 0.936 is now a lower priority than it was. It anchors
      engineering behaviour, not a score worth chasing, because the score is
      contaminated.
    - >-
      The 0.950 target must be defined against a clean held-out split of the 199
      train movies under D-0016, never against the public leaderboard.
    - >-
      The reference's own training scripts are in hand as CC0 code. They describe
      a proposal source, which F-0017 identifies as exactly what Biohub-X lacks.

# Artifact registry: every content identity Biohub-X asserts.
#
# Verified by `uv run biohubx artifacts verify`, which re-derives each digest
# from the bytes on disk and exits non-zero on any mismatch.
#
# Required per artifact:
#   id           stable identifier, referenced from other registries
#   kind         what sort of thing this is
#   path         repository-relative; absolute paths and `..` are refused
#   schema       how to read it
#   digests      mapping of slot -> typed digest token
#                  raw            -> raw_artifact_sha256:sha256:<hex>
#                  canonical_text -> canonical_text_sha256:sha256/v1:<hex>
#   produced_by  experiment id from registry/experiments.yaml, or null
#   provenance   status plus whatever the status requires
#
# Digest tokens are the only permitted form. A bare hex string is refused.


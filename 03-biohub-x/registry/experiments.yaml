      which holds every annotated cell on the pilot, a small learned scorer over
      a local patch of intensity and per-scale response, with or without the
      neighbouring frames, ranks true cells above spurious peaks well enough
      that keeping the count-tied top candidates raises the oracle ceiling on
      both held-out embryos over the untruncated A2 union of F-0035, and lifts
      6bba to at least 0.950.
    falsifier: >-
      An arm is killed if it fails strict loading or deterministic

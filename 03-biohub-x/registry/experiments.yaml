    promotion_metric: >-
      official combined score on the held-out embryo, both directions separately;
      promotion requires improvement over A1 on both
    mandatory_outputs:
      - node ratio, raw and adjusted edge Jaccard, division counts, combined score, per embryo
      - the oracle ceiling before any arm
    runtime_ceiling: 7200 seconds per arm
    provenance_status: external_cleared
    first_measurement:
      id: E06-ORACLE
      role: diagnostic ceiling, never a promotable method
      construction: >-
        Proposal nodes are the frozen peaks. Ground-truth nodes are matched
        one-to-one to proposals within the official 7 micrometre radius, per
        frame, by minimum-cost assignment. The only edges emitted are ground-truth
        edges whose two endpoints both matched, rewritten onto their matched
        proposals. Every proposal is a node whether or not it matched, so the
        node-count term is what the frozen detector actually costs.
      decision_rule: >-
        Either embryo below 0.950: association is not yet the sole bottleneck,
        return to H-11c and E05. Both at or above 0.950 with headroom toward
        0.970: proceed to the bake-off.
      outcome:
        finding: F-0033
        score_44b6: 0.9961
        score_6bba: 0.9227
        both_support_0_950: false
        decision_applied: >-
          6bba's ceiling is below 0.950. E06 halts before the bake-off, per the
          rule above, and the campaign returns to proposal complementarity. The
          frozen block is unchanged; the proposal-count question F-0033 raises
          is declared in E05, not here.
    status: halted_at_first_measurement
  - id: E07

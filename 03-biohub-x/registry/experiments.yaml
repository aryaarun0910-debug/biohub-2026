# Experiment registry: one entry per experiment, declared BEFORE it runs.
#
# Required at declaration time:
#   id                 stable identifier
#   component          system or component under test (see SYSTEM.md)
#   hypothesis         what is claimed
#   falsifier          the observation that would kill it
#   inputs             artifact ids from registry/artifacts.yaml
#   split              data split scheme and fold
#   model_config       config path plus its canonical_text digest
#   budget             compute the experiment is allowed
#   expected_outputs   artifact ids it will produce
#   forbidden_changes  what must not move while it runs
#   promotion_metric   the official metric field that decides it
#   runtime_ceiling    wall clock it may not exceed
#   provenance_status  from registry/artifacts.yaml
#
# An experiment is pre-registered only once its inputs, its configuration file
# and that file's canonical_text digest all exist. Declaring one earlier would
# record intentions rather than a runnable experiment, and the declaration is
# only binding if it names the exact thing that will run.
#
# Required at completion, exactly one:
#   status: promoted | challenger | killed | invalid | integration_only
#
# There is no `pending`. A declared but unfinished experiment carries no status
# key at all: a status is a result, and a placeholder result is indistinguishable
# from a real one at a glance. "implemented" and "interesting" are not statuses
# either. Scores are referenced by finding id from registry/findings.yaml, never
# restated here or in prose.

schema_version: 1

experiments:
  - id: E01
    component: vertical_slice
    hypothesis: >-
      The Phase-2 chain runs end to end on real competition bytes and produces a
      score through the pinned official scorer, without the synthetic fixture.
    falsifier: >-
      Any stage refuses real data, or the run produces a number the official
      adapter will not accept. A poor score does not falsify this; an
      unreachable score does.
    inputs:
      - competition.train.6bba_2540cd90.zarr
      - competition.train.6bba_2540cd90.geff
    split:
      scheme: single_window
      note: >-
        One window of one training movie. Not a fold and not an evaluation set.
        Nothing here may be compared with a fold result.
    model_config:
      path: configs/phase3-cpu.yaml
      section: E01
      canonical_text: canonical_text_sha256:sha256/v1:adbafd25957c7873211061fee7f80940ce5507bdf3b236855921e651c7e5be9e
    budget: CPU only, no GPU, no network, no download
    expected_outputs:
      - artifacts/real-preflight.json
      - artifacts/real-preflight-graph.json
    forbidden_changes:
      - the window, once a score exists
      - the pinned official source
    promotion_metric: none
    runtime_ceiling: 600 seconds
    provenance_status: external_cleared
    status: integration_only
    result: F-0017
  - id: E02
    component: graph_policy
    hypothesis: >-
      Emitting roughly the annotated node count rather than roughly every cell
      raises the official adjusted edge Jaccard, and the gain survives the
      correct edges a real filter would destroy reaching that node count.
    falsifier: >-
      Killed if the filtered policy fails to match the dense baseline on either
      embryo fold at a retention a real filter could plausibly achieve.
    inputs:
      - the 199 annotated competition.train .geff artifacts
    split:
      scheme: leave_one_embryo_out
      folds: [44b6, 6bba]
      excluded: the four duplicated public-test fixtures, per D-0015
    model_config:
      path: configs/phase3-cpu.yaml
      section: E02
      canonical_text: canonical_text_sha256:sha256/v1:adbafd25957c7873211061fee7f80940ce5507bdf3b236855921e651c7e5be9e
    budget: CPU only, no GPU, no network, no download
    expected_outputs:
      - artifacts/retention-oracle.json
    forbidden_changes:
      - the pinned official scorer and its aggregation
      - each dataset's own estimated_number_of_nodes as the denominator
    promotion_metric: adjusted_edge_jaccard per embryo fold, never pooled
    runtime_ceiling: 3600 seconds
    provenance_status: external_cleared
    declaration_note: >-
      Declared late. The configuration file was written while the sweep was
      already running, from the invocation that was passed. The run is
      deterministic in its recorded seed and retention list, so the declaration
      names exactly what executed, but the ordering AGENTS.md section 4 requires
      was not followed and is recorded rather than concealed.
    status: challenger
    result: F-0018
    status_reasoning: >-
      The direction wins on both embryo folds, which the promotion rule would
      normally reward. It is recorded as challenger and not promoted because the
      experiment measured the metric's own trade curve using ground truth, not a
      filter. There is no implementation to promote, and main holds promoted
      implementations rather than promoted intentions. It becomes promotable when
      a real filter is shown to retain at least 0.94 of its correct edges at the
      annotated node count on both folds.
  - id: E03
    component: proposal_detector
    hypothesis: >-
      A detector trained on one embryo, with unlabelled cells ignored rather
      than supervised as background, proposes the annotated cells of the other
      embryo well enough to raise node recall and candidate reach above the
      classical detector measured in F-0017.
    falsifier: >-
      Killed if node recall or candidate reach fails to improve over F-0017 on
      either fold. Not promoted unless BOTH folds improve independently; a gain
      on one fold and a loss on the other is a challenger, never a promotion. A
      pooled-only result is not a result at all.
    inputs:
      - the 199 annotated competition.train .geff and .zarr artifacts
      - configs/e03-clean-folds.yaml
    split:
      scheme: leave_one_embryo_out
      folds:
        - id: fold_44b6
          train: 44b6, 71 movies
          evaluate: 6bba, 128 movies
        - id: fold_6bba
          train: 6bba, 128 movies
          evaluate: 44b6, 71 movies
      never_read: >-
        The public-test directory. Not once, for any purpose. Every artifact
        E03 touches is a registered train artifact (D-0015).
    initialisation:
      scheme: deterministic random, seeded per fold
      forbidden: >-
        Neither quarantined checkpoint may initialise, supervise, select or tune
        a clean-fold model. No distillation, no warm start, no threshold copied
        from the reference's tuning, no model selection against anything the
        reference produced (D-0021, D-0022).
      architecture_note: >-
        The vendored CC0 architecture is reused with fresh random weights. The
        code is CC0 and carries no training; reusing a published architecture is
        not reusing a published model.
    model_config:
      path: configs/e03-clean-folds.yaml
      section: E03
      canonical_text: canonical_text_sha256:sha256/v1:c31428ecad168ed5553965fad500ea75326491220c1b39abd5510b073ffc7117
      note: >-
        A separate file from configs/phase3-cpu.yaml, because that file's digest
        is recorded against E01 and E02 as an assertion about what ran and
        editing it would break both.
    budget: Kaggle T4, gated. Nothing runs until the smoke in the packet passes.
    expected_outputs:
      - one checkpoint per fold
      - node recall, candidate reach and the official metric, per fold, separately
    forbidden_changes:
      - the pinned official scorer
      - the ignore quantile, once a fold has started
      - the fold definition
    promotion_metric: >-
      node_recall and candidate reach as the falsifier; the official combined
      score, per held-out embryo, as the promotion criterion. Never pooled.
    mandatory_outputs:
      - node recall
      - candidate reach
      - official combined score
      - each fold reported on its own
    runtime_ceiling: 6 hours per fold
    provenance_status: external_cleared
    not_a_training_target: >-
      The 94 percent retention crossover in F-0018 is a property of the metric
      that a later filter must clear. It is not a label, not a loss term and not
      something E03 optimises. Confusing the two would train a detector to
      predict its own evaluation.
    objective: >-
      Non-negative positive-unlabelled. No voxel is supervised as background,
      because F-0020 falsified every candidate band on this corpus and D-0024
      removed the negative class rather than widening it.
    stated_uncertainty: >-
      The number of dim unannotated cells is unknown. Annotated cells reach
      intensity percentile 0.063, and the class prior counts every cell the
      dataset estimates, so a prior biased against dim cells makes the detector
      under-predict. E03 reports this with its results and does not claim to
      have resolved it.
    assumptions:
      - id: SCAR
        statement: >-
          nnPU is unbiased only if labelled positives are Selected Completely At
          Random from all positives.
        status: MEASURED AND NOT SUPPORTED. F-0022 finds annotation density
          correlates with annotated-cell brightness at r = +0.354 across the 199
          datasets, so labelling is not independent of the feature the detector
          reads.
        consequence: >-
          E03 may not describe its estimator as unbiased (D-0025). The residual
          bias is unmeasured in direction and magnitude and is reported with the
          results.
        falsifier: >-
          The assumption is already violated. It is recorded so that a result
          depending on it cannot be read as if it were not. Independently, if a
          fold's detector recovers annotated cells markedly better than
          unannotated ones at matched intensity, that is the bias showing up in
          the outputs and the fold is reported as compromised rather than
          promoted.
      - id: PRIOR_VALIDITY
        statement: The class prior is a probability at every scale the pipeline uses.
        status: MEASURED AND HOLDS. F-0021 records 1.443e-4 to 3.000e-3 per grid
          voxel across 199 datasets, all inside the open unit interval, with zero
          grid collisions so positive voxels equal annotated nodes exactly.
        falsifier: any dataset whose prior leaves the open unit interval at any scale.
  - id: E03-SMOKE-01
    attempt: 1
    superseded_identity: >-
      Recorded as E03-SMOKE before a retry existed. Renamed once, to give the
      retry a distinct identity that cannot overwrite this outcome. The remote
      run, its status and its log digest are unchanged and must stay so.
    immutable: true
    component: proposal_detector
    parent: E03
    hypothesis: >-
      The packaged fold runs on a Kaggle T4 with every guard intact, so the full
      folds can be requested on evidence rather than hope.
    falsifier: >-
      Any guard failing, or the risk not decreasing across the two epochs.
    inputs:
      - the Kaggle package at canonical_text_sha256:sha256/v1:928065d6f7f5b71b72b4e291152a814fcd89353f174dc77799271a325ef04c73
    split:
      scheme: leave_one_embryo_out
      fold: fold_44b6, two movies from 44b6
    model_config:
      path: configs/e03-clean-folds.yaml
      section: E03
    budget: one Kaggle T4, 2400 second ceiling
    expected_outputs:
      - artifacts/e03-smoke/result-fold_44b6.json
      - one checkpoint under 40 MB
    forbidden_changes:
      - any guard or falsifier in the package
    promotion_metric: none; this experiment cannot promote anything
    runtime_ceiling: 2400 seconds
    provenance_status: external_cleared
    status: invalid
    result: none produced
    outcome: >-
      The kernel errored before executing any packaged code. nbformat validation
      rejected the generated notebook for a missing kernelspec display_name and
      missing cell ids, so conversion failed at import time. The log contains
      zero BIOHUBX_STAGE lines: no guard ran, no falsifier fired, no epoch
      started, and no checkpoint or result manifest exists to retrieve.
    status_reasoning: >-
      invalid rather than killed. Nothing about the hypothesis was tested. A run
      whose code never executed measures neither success nor failure of what it
      was meant to measure, and recording it as killed would misrepresent a
      packaging defect as a scientific result.
    retrieved:
      kernel_log: artifacts/e03-smoke/kernel.log
      kernel_log_digest: raw_artifact_sha256:sha256:cec04e32b04cf2d0db31d0162d7b246b86fd8dc4fad2335a7c342be791a18ecb
      result_manifest: not produced
      checkpoint: not produced
    deviations_from_authorisation:
      - >-
        The kernel was created at aryaarun07/biohub-x-e03-fold-44b6, not the
        authorised aryaarunkaggle/biohubx-e03-fold-44b6. Two causes, both in the
        package. The owner in the metadata came from the username field of the
        local credentials file, which is not the account's URL slug, and Kaggle
        used the authenticated account instead. And the title slugified to
        biohub-x-e03-fold-44b6, which Kaggle preferred over the requested id,
        with a warning. The package content pushed was byte-for-byte the
        authorised package; only its address differed.
    repairs_made:
      note: >-
        No repair run and no second push. The defects are fixed in the builder so
        a future authorised attempt cannot repeat them, and both are bound by
        tests: the notebook now carries a kernelspec display_name and cell ids,
        and kernel_metadata refuses a title that does not slugify to its own id
        or an id without an owner.
  - id: E03-SMOKE-02
    attempt: 2
    component: proposal_detector
    parent: E03
    supersedes_nothing: >-
      E03-SMOKE-01 stands on its own record. This attempt does not replace it,
      correct it, or inherit its identity; a failed attempt that can be
      overwritten by a later one is not a record.
    hypothesis: >-
      The packaged fold runs on a Kaggle T4 with every guard intact, so the full
      folds can be requested on evidence rather than hope.
    falsifier: >-
      Any guard failing, or the risk not decreasing across the two epochs.
    what_changed_since_attempt_1:
      - the notebook carries kernelspec display_name and cell ids, so nbformat validates it
      - the notebook carries its own source and imports from /kaggle/working, not /kaggle/input
      - a mandatory pre-push gate validates, converts, and runs the bootstrap isolated from this repository
      - the kernel id is derived from its own title, and --expect-kernel pins the address
      - the builder refuses a dirty tree, so the pinned commit describes the shipped bytes
    inputs:
      - the Kaggle package at canonical_text_sha256:sha256/v1:265c10fc60b34c0342b9c1225bfebdb0930dc8c8a20b3c2c23b291767fdd793c
      - the embedded source payload at raw_artifact_sha256:sha256:c24db880462b202943669e459e0f2d1fb322e5e7223e7165a64b3a8d01b8acf9
    split:
      scheme: leave_one_embryo_out
      fold: fold_44b6, two movies from 44b6
    model_config:
      path: configs/e03-clean-folds.yaml
      section: E03
    budget: one Kaggle T4, 2400 second ceiling
    expected_outputs:
      - a result manifest carrying a typed checkpoint digest
      - one checkpoint under 40 MB
    forbidden_changes:
      - any guard or falsifier in the package
      - the recorded outcome of E03-SMOKE-01
    promotion_metric: none; this experiment cannot promote anything
    runtime_ceiling: 2400 seconds
    provenance_status: external_cleared
    kernel: aryaarun07/biohub-x-e03-fold-44b6
    kernel_note: >-
      The same kernel slug as attempt 1, because Kaggle addresses a kernel by
      slug and pushing creates a new version rather than a new kernel. Attempt
      identity lives in this registry, not in the remote name, which is why the
      two must not share a record id.
    status: invalid
    immutable: true
    outcome: >-
      Pushed once as kernel version 2 and ran. The bootstrap worked exactly as
      designed: the embedded payload verified against its recorded digest, 44
      files extracted to /kaggle/working/biohubx-package, and biohubx imported
      from that verified tree. Nine of the fifteen stages appeared, through
      bootstrap-verify, bootstrap-extract, bootstrap-import, start, pinned,
      environment and inputs. It then died on `import zarr`.
      ModuleNotFoundError. The Kaggle image does not carry zarr and the kernel
      runs with internet disabled, so nothing could install it. No epoch ran, no
      risk was computed, no checkpoint or result manifest exists.
    status_reasoning: >-
      invalid rather than killed, for the same reason as attempt 1: the
      hypothesis was never tested. What differs is where it stopped. Attempt 1
      died before executing a line; attempt 2 executed, verified its own payload
      and reached the data reader. The packaging problem is solved and an
      environment problem is now visible underneath it.
    retrieved:
      kernel_log: artifacts/e03-smoke-02/kernel.log
      kernel_log_digest: raw_artifact_sha256:sha256:056b2c28279adf10d67e64d7a299e9ca0f159e27a7ac8d5c16e5bdb801ce1ab1
      result_manifest: not produced
      checkpoint: not produced
      extracted_payload_digest_returned_by_the_kernel: raw_artifact_sha256:sha256:c24db880462b202943669e459e0f2d1fb322e5e7223e7165a64b3a8d01b8acf9
      round_trip: >-
        The kernel returned the tree it had extracted, and re-archiving it here
        reproduces the embedded digest exactly. The bootstrap is verified end to
        end by evidence from the remote machine, not by local simulation.
    deviations_from_authorisation:
      - >-
        The authorisation named one Kaggle T4. Kaggle allocated a P100, shown in
        the kernel UI as "Version #2 with GPU P100". kernel-metadata.json
        requested accelerator nvidiaTeslaT4 and that did not take effect. The
        packaged guard checks torch.cuda.device_count(), which was 1 and passed,
        and never checked the device model, so the run proceeded on hardware
        nobody approved. The guard gap is mine; the allocation is Kaggle's.
        Nothing about the failure depends on which GPU it was, since the run died
        before any tensor work, but the scope was still exceeded.
    blocks_further_attempts_until:
      - a dependency strategy is chosen for zarr and the rest of the stack
      - the GPU-model guard exists, so an unapproved accelerator refuses rather than proceeds
  - id: E03-SMOKE-03
    attempt: 3
    component: proposal_detector
    parent: E03
    immutable: true
    supersedes_nothing: >-
      E03-SMOKE-01 and E03-SMOKE-02 stand on their own records. This attempt does
      not replace, correct or inherit either.
    hypothesis: >-
      The packaged fold runs on a Kaggle T4 with every guard intact, so the full
      folds can be requested on evidence rather than hope.
    falsifier: >-
      Any guard failing, or the risk not decreasing across the two epochs.
    what_changed_since_attempt_2:
      - the package carries the wheelhouse it needs, verified before pip and installed offline
      - the mount is located by the identity the package carries rather than a guessed path
      - accelerator and machine_shape both set to the canonical NvidiaTeslaT4
      - the runtime guard requires an actual Tesla T4 rather than a device count
      - the attempt id travels in the package, the log and the result manifest
      - transport validates the staged inventory and verifies the returned slug
    inputs:
      - the Kaggle package at canonical_text_sha256:sha256/v1:0a3edb3213749bbdf1c71c0d1522ace1130d9e3da73fbf4c2c4c3579ce4973f8
      - the embedded source payload at raw_artifact_sha256:sha256:361b4a7b0813c37b85ac8b289e24f9f33b779e82c565c17f1425cd50c90612bb
      - the wheelhouse at tree_sha256:sha256/v1:4c7474376ba70a4772babee4c8fca8d13d829066686f8672cd1b9f23a10ee3ed
    split:
      scheme: leave_one_embryo_out
      fold: fold_44b6, two movies from 44b6
    model_config:
      path: configs/e03-clean-folds.yaml
      section: E03
      canonical_text: canonical_text_sha256:sha256/v1:c31428ecad168ed5553965fad500ea75326491220c1b39abd5510b073ffc7117
    budget: one Kaggle T4 under envelope GPU-CAMPAIGN-E03-01, 2400 second ceiling
    expected_outputs:
      - a result manifest carrying a typed checkpoint digest
      - one checkpoint under 40 MB
    forbidden_changes:
      - any guard or falsifier in the package
      - the recorded outcomes of E03-SMOKE-01 and E03-SMOKE-02
    promotion_metric: none; this experiment cannot promote anything
    runtime_ceiling: 2400 seconds
    provenance_status: external_cleared
    kernel: aryaarun07/biohub-x-e03-fold-44b6
    kernel_version: 3
    status: integration_only
    result: F-0024
    outcome: >-
      Pushed once and completed in 102.4 seconds of wall clock, 84.744 of them
      inside the packaged entry point. Nineteen stages appeared in order. The
      wheelhouse resolved by identity, verified with zero differences, and
      installed offline at returncode 0; the payload verified and imported from
      the extracted tree; 142 registered artifacts were shape-checked and 4
      re-digested in full; fold membership was asserted; the device reported Tesla
      T4; both epochs ran, the risk fell and the clamp never fired; the checkpoint
      wrote atomically and reloaded strict. Every falsifier the envelope named was
      checked and none fired.
    status_reasoning: >-
      integration_only rather than promoted, because a smoke cannot promote and
      because four supervised positives across the whole run is not evidence that
      anything learns. What it establishes is that the clean nnPU training path
      works on real Kaggle hardware, which is exactly what the envelope asked.
    deviations_from_authorisation:
      - >-
        Kaggle allocated two T4s where the package expected one. The device model
        was correct and the envelope named the model rather than a count, so the
        approved hardware was delivered. The packaged count guard did not notice,
        because smoke mode substituted the expected count for the observed one
        before comparing them; recorded in [[R-0011]] and corrected in [[D-0038]].
        No effect on the run: the model trains on one device and peak memory fits
        one card with 11.9 GB to spare.
    budget_consumed:
      pushes: 1 of 2 permitted
      gpu_minutes: about 1.7 of 80 permitted
  - id: E04
    component: proposal_detector
    hypothesis: >-
      A multi-scale Difference-of-Gaussians proposal source, with its budget and
      scale bank selected on one embryo, reaches more annotated cells of the other
      embryo than the classical local-maximum detector does at the same node
      budget.
    falsifier: >-
      Killed if, at a matched node budget, DoG fails to improve reachability over
      the classical baseline on either held-out embryo. One embryo improving and
      the other not is a challenger, never a promotion. A pooled-only result is
      not a result.
    inputs:
      - the 199 annotated competition.train .geff and .zarr artifacts
      - configs/e04-dog-proposals.yaml
    split:
      scheme: leave_one_embryo_out
      folds:
        - id: fold_44b6
          select_on: 44b6
          evaluate_on: 6bba
        - id: fold_6bba
          select_on: 6bba
          evaluate_on: 44b6
      never_read: the public-test directory, for any purpose
    model_config:
      path: configs/e04-dog-proposals.yaml
      section: E04
      canonical_text: canonical_text_sha256:sha256/v1:e85a67c9406ef1dd2de5c1616a7486a857c18a9e23f0cfb908dde4f93d119f94
    budget: CPU only, no GPU, no network, no download
    expected_outputs:
      - artifacts/proposals.json
      - reachability per embryo, per source, per node budget, never pooled
    forbidden_changes:
      - the official 7 micrometre matching radius
      - the node budget's origin, which is each movie's own estimated_number_of_nodes
      - the fold definition
    promotion_metric: >-
      Reachability on the held-out embryo at a matched node budget. This cannot
      promote a component on its own, because reachability is not the official
      metric; it decides whether the proposal source is worth carrying into a
      scored experiment.
    mandatory_outputs:
      - reachability per embryo
      - the node budget each number was measured at
      - each fold reported on its own
    runtime_ceiling: 3600 seconds
    provenance_status: external_cleared
    measure_is_not_node_recall: >-
      Reachability counts an annotated node as reached when some proposal lies
      within the official radius in the same frame. It upper-bounds the official
      one-to-one node recall and is not it: the same classical detector reads
      0.3846 by this measure and 0.269 officially on the F-0017 window ([[F-0025]]).
      It is used because an annotated endpoint with no nearby proposal cannot be
      matched by any association method, so it is the ceiling every later stage
      works under.
    selection_leakage_argument: >-
      The budget comes from each movie's own estimated_number_of_nodes, which is
      official metadata present for every movie including unannotated ones, so
      nothing about the held-out embryo's annotations enters the selection. The
      budget ratio and scale bank are chosen on the training embryo and frozen
      before the evaluation embryo is measured.
    independence: >-
      The mechanism is scale-space blob detection from primary literature and the
      isotropic plane stride is derived from OFFICIAL_VOXEL_SCALE, which
      biohubx.proposals.classical already documented. No constant is inherited
      from any external analysis.
    status: challenger
    result: F-0026
    status_reasoning: >-
      Both folds improve independently, which the falsifier required and which
      would normally justify promotion. It is a challenger rather than promoted
      for the reason E04's own promotion_metric states: reachability is not the
      official metric, and no component is promoted on a diagnostic. What this
      earns the DoG source is a place in a scored experiment, not a place in the
      pipeline. Promotion also requires Arya Arun's approval under [[D-0039]].
    what_would_promote_it: >-
      An end-to-end run on both embryo folds, scored through the pinned official
      metric, where DoG proposals beat classical ones on the combined score rather
      than on reachability. That run needs association to exist, since [[F-0026]]
      raises the ceiling every later stage works under and does not itself close
      any edge.
    open_questions_this_raised:
      - >-
        Both folds selected the largest budget in the sweep. The curve is still
        rising at 2.0 times the estimated cell count, so the useful range has not
        been bracketed and the node-count cost of going further is unmeasured.
      - >-
        Neither source fills its budget above 0.75, so the matched-budget design
        did not fully bind. A fair comparison needs each source truncated to the
        other's actual count, which the aggregate as collected cannot reconstruct.
      - >-
        Reachability near 0.79 still leaves a fifth of annotated cells unproposed.
        Whether the remainder is dim, non-Gaussian or simply outside the scale
        bank decides whether a learned detector is complementary to DoG or
        redundant with it, which is the union question in the queue.
    extensions:
      - id: E04b
        ran: 2026-09-04
        change_from_E04: >-
          Budget sweep extended to 0.5, 1, 2, 3, 4, 6 and 8 times the estimated
          cell count; one-to-one node recall reported beside reachability; every
          annotated node audited at the neutral budget. No change to the fold
          definition, the radius, the budget's origin or the falsifier.
        result: F-0027
        outcome: >-
          Both folds still improve, by wider margins. The curve plateaus at 0.88
          on 44b6 by ratio 6 and is still rising at 0.91 on 6bba at ratio 8. The
          neutral-budget misses are dimmer and lower-response than reached cells
          and are mostly recoverable by budget; annotated crowding and boundary
          distance do not distinguish them.
        what_this_changes_for_E05: >-
          The union question is sharpened. Most neutral-budget misses are cells
          DoG ranks too low, not cells it cannot see, so the first arm to test is
          a second pass over lower-response DoG peaks (H-08) before a learned
          detector is asked to find anything; the learned arm's target is the
          residual that remains at ratio 8, which is roughly a tenth of annotated
          cells and is not yet characterised on its own.
        still_a_challenger: >-
          Nothing here is the official metric. The status of E04 does not change.
        residual_characterised: >-
          F-0028 splits the ratio-8 residual into a localisation regime on 44b6,
          where a proposal already lies 7 to 14 micrometres from almost every
          missed cell, and a half-dim regime on 6bba, where 60 percent of the
          residual sits below intensity percentile 0.80 and never entered the
          candidate pool. The cheap arm is therefore localisation (H-11) and a
          second pass over lower-response peaks (H-08); the learned arm's real
          target is the dim half of the 6bba residual, about five percent of that
          embryo's annotated cells.
        superseded_reading: >-
          F-0030 then showed the detector behind all of the above was counting
          blob shoulders as proposals. F-0032 re-measured with strict peaks and
          two scales: 0.92 and 0.90 reach at a proposal count near the official
          estimate, which is the regime F-0018 asked for. The residual to hand a
          learned detector is now 31 of 365 annotated cells on 44b6, all within
          one nucleus spacing of a peak, and about a fifth of 6bba's at the
          neutral budget, a third of them dim. D-0041 fixes the configuration
          E05 inherits.
  - id: E05
    component: proposals
    hypothesis: >-
      The number of proposals kept, tied to each movie's official estimate, is
      what separates the 6bba oracle ceiling from 0.950 (F-0033), and selecting
      the frozen strict peaks or the per-scale union (F-0034) down to a budget
      ratio chosen on the training embryo raises the oracle ceiling on both
      held-out embryos over the untruncated D-0041 configuration.
    falsifier: >-
      No arm raises the held-out oracle score over A0 in both directions, at the
      ratio selected on the training embryo. Then proposal count is not the
      lever, the proposal stage needs a detector rather than a selector, and the
      residual goes to a learned arm. One direction improving is a challenger; a
      pooled number is not a result.
    inputs:
      - the 199 annotated competition.train .geff and .zarr artifacts
      - configs/e05-proposal-selection.yaml
    split:
      scheme: leave_one_embryo_out
      folds:
        - id: fold_44b6
          select_on: 44b6
          evaluate_on: 6bba
        - id: fold_6bba
          select_on: 6bba
          evaluate_on: 44b6
      never_read: the public-test directory, for any purpose
    model_config:
      path: configs/e05-proposal-selection.yaml
      section: E05
      canonical_text: canonical_text_sha256:sha256/v1:0607cf5a958d7e028b78d06e8ed6d1e64782fef46c67b1e2006c6697e58493ff
    instrument: >-
      biohubx evaluate oracle-ceiling with --budget-ratios, and with
      --per-scale-union for the union source; every ratio is scored from one
      detection pass per window, so the arms share windows, proposals and
      ground truth exactly.
    candidate_sources:
      peaks: the frozen configuration of D-0041, unchanged
      union: H-11d, strict peaks per scale unioned before one shared suppression pass (F-0034)
    selection:
      rule: >-
        rank proposals within each ten-frame window by DoG response and keep
        the top round(k * window_estimate); ties break on instance identity
      budget_ratios: [0.8, 1.0, 1.25, 1.5, 2.0]
      constant_selected_on: the training embryo of each fold, by oracle score
    arms:
      - id: A0
        source: peaks
        truncation: none
        role: baseline; must reproduce F-0033 to the digit
      - id: A1
        source: peaks
        truncation: budget
      - id: A2
        source: union
        truncation: none
      - id: A3
        source: union
        truncation: budget
    window:
      frames_per_movie: 10
      start: first annotated frame, clamped to fit
      spatial_extent: full
      identical_to: E06-ORACLE
    budget: CPU only, no GPU, no network, no download
    expected_outputs:
      - artifacts/e05-peaks.json, arms A0 and A1 at every ratio, per embryo
      - artifacts/e05-union.json, arms A2 and A3 at every ratio, per embryo
    forbidden_changes:
      - the pinned official scorer
      - the two candidate sources' DoG parameters
      - the window, once any arm has run
      - the fold definition
      - D-0041 and E06's frozen block; a promoted arm is a new declaration
    promotion_metric: >-
      oracle ceiling on the held-out embryo at the training-selected ratio,
      both directions separately; promotion requires improvement over A0 on
      both
    mandatory_outputs:
      - >-
        per arm, per ratio, per embryo: proposals, node ratio, node match
        fraction, edge retention, raw and adjusted edge Jaccard, division
        Jaccard, combined score, unscored windows
      - >-
        per fold: the ratio selected on the training embryo and the held-out
        score at that ratio beside A0's
    exit_rule_toward_E06: >-
      A promoted arm whose ceiling is at or above 0.950 on both embryos lets
      E06 resume its bake-off on that arm's proposals under a new frozen
      declaration. Otherwise the ceiling is still the proposal stage's and the
      learned arm comes before any association work.
    runtime_ceiling: 7200 seconds per source
    provenance_status: diagnostic_ceiling
    preregistered_at_commit: after b48c1ee, before any arm ran
    outcome:
      finding: F-0035
      a0_reproduces_f0033: true
      arms_killed: [A1, A3]
      arm_promoted_as_proposal_source: A2
      scores_held_out:
        A0: {44b6: 0.9961, 6bba: 0.9227}
        A2: {44b6: 1.0195, 6bba: 0.9283}
      decision_applied: >-
        Budgeted selection is killed on its falsifier: neither source improves
        the held-out ceiling in both directions at the ratio chosen on the
        training embryo. The per-scale union without truncation improves both
        directions and needs no fitted constant, so it is the better proposal
        source and becomes a new frozen declaration when one is written; it does
        not edit D-0041 or E06's frozen block by itself. The exit rule toward
        E06 is not met: A2's 6bba ceiling is 0.9283, below 0.950, so association
        is still not the bottleneck and the learned proposal arm comes first.
    status: complete

  - id: E06
    component: association
    hypothesis: >-
      With proposals frozen at the strict-peak DoG configuration of D-0041, the
      official combined score on each held-out embryo is limited by association,
      and at least one association arm improves it over the nearest-parent
      baseline on both embryo directions.
    falsifier: >-
      The oracle ceiling decides whether the hypothesis is even in play: if either
      embryo's oracle score cannot support 0.950, association is not yet the sole
      bottleneck and E06 halts in favour of proposal complementarity. In the
      bake-off, an arm is killed if it fails to improve the official combined
      score over the baseline on either held-out embryo; one direction improving
      is a challenger; a pooled-only result is not a result.
    inputs:
      - the 199 annotated competition.train .geff and .zarr artifacts
      - configs/e06-association.yaml
    split:
      scheme: leave_one_embryo_out
      folds:

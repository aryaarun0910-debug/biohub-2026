# Experiment registry: one entry per experiment, declared BEFORE it runs.
#
# Required at declaration time:
#   id                 stable identifier
#   component          system or component under test (see SYSTEM.md)
#   hypothesis         what is claimed
#   falsifier          the observation that would kill it
#   inputs             artifact ids from registry/artifacts.yaml
#   split              data split scheme and fold
#   model_config       config path plus its canonical_text digest
#   budget             compute the experiment is allowed
#   expected_outputs   artifact ids it will produce
#   forbidden_changes  what must not move while it runs
#   promotion_metric   the official metric field that decides it
#   runtime_ceiling    wall clock it may not exceed
#   provenance_status  from registry/artifacts.yaml
#
# An experiment is pre-registered only once its inputs, its configuration file
# and that file's canonical_text digest all exist. Declaring one earlier would
# record intentions rather than a runnable experiment, and the declaration is
# only binding if it names the exact thing that will run.
#
# Required at completion, exactly one:
#   status: promoted | challenger | killed | invalid | integration_only
#
# There is no `pending`. A declared but unfinished experiment carries no status
# key at all: a status is a result, and a placeholder result is indistinguishable
# from a real one at a glance. "implemented" and "interesting" are not statuses
# either. Scores are referenced by finding id from registry/findings.yaml, never
# restated here or in prose.

schema_version: 1

experiments: []

# Findings registry: one measured claim per entry.
#
# Required per finding:
#   id            stable identifier
#   claim         a single measured statement
#   instrument    the code that measured it
#   evidence      how to reproduce, and what was observed
#   validity      scope, and the conditions under which the claim holds
#   superseded_by finding id that replaces this one, or null
#
# A number that is not here is not a result. Numbers are never restated in
# prose; prose references the finding id.

schema_version: 1

findings:
  - id: F-0001
    claim: >-
      Biohub-X is a standalone Git repository with no ancestor repository; no
      tracked file names a quarantined prior-campaign repository; no tracked
      file carries an absolute filesystem path outside the allow-listed
      provenance records; and no import-path entry resolves outside the
      repository, its virtual environment and the standard library.
    instrument: tests/contracts/test_repository_isolation.py
    evidence:
      command: uv run pytest tests/contracts/test_repository_isolation.py
      observed: 14 passed
      note: >-
        The content scans read the Git index, so they pass vacuously on an empty
        index; the instrument asserts the index is non-empty, and both the
        absolute-path detector and the quarantine scan carry negative controls
        that plant the exact shape of a leak and require it to be flagged.
    validity:
      scope: repository_integrity
      holds_while: >-
        the instrument runs in CI on a full clone and the two allow-lists are
        not extended. Extending either allow-list narrows this claim.
    superseded_by: null

  - id: F-0002
    claim: >-
      The two content identities separate platform drift from content change: a
      CRLF rewrite of a configuration file breaks its raw identity and leaves
      its canonical identity intact, while a single-character content edit
      breaks both.
    instrument: tests/mutation/test_line_ending_drift.py
    evidence:
      command: uv run pytest tests/mutation/test_line_ending_drift.py
      observed: 5 passed
    validity:
      scope: content_identity
      holds_while: >-
        CANONICALIZATION_VERSION is v1. Bumping it invalidates every recorded
        canonical digest and supersedes this finding.
    superseded_by: null

  - id: F-0003
    claim: >-
      Under the pinned official scorer, a predicted node that matches no
      ground-truth node adds no edge false positive. Adding one isolated,
      unmatched node to a perfect two-node prediction left edge TP, FP, FN at
      1, 0, 0 and the raw edge Jaccard at 1.0. An edge between two mutually
      unmatched predicted nodes is likewise uncharged. The exemption ends at
      the annotated cells: an edge whose source matches a ground-truth node
      that has a ground-truth successor, but which points elsewhere, was
      charged as one false positive.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        This is edge accounting only. The same unmatched node still enters the
        node-count adjustment: holding the estimated total at 2, it raised
        num_pred_nodes from 2 to 3, total_node_ratio from 0.0 to 0.5, and
        lowered the adjusted edge Jaccard from 1.0 to 0.95 while the raw
        Jaccard did not move. Free of edge penalty is not free of consequence.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        registry/official_source.yaml pins commit
        075fc5f5a52d11077f9dc2b074644618f26939e2 and its digests verify. Moving
        the pin supersedes this finding until the instrument is re-run.
    superseded_by: null

  - id: F-0004
    claim: >-
      The official node-count adjustment multiplies the edge Jaccard by
      1 - 0.1 * (N_pred - N_total) / N_total and is clamped only at zero, so the
      multiplier exceeds one whenever fewer nodes are predicted than the
      estimated total. With 2 predicted nodes, a declared estimated total of 20
      and a raw edge Jaccard of 1.0, total_node_ratio was -0.9 and the adjusted
      edge Jaccard was 1.09.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        Demonstrating an adjusted Jaccard above one requires an estimated total
        larger than the annotated ground-truth count. On a complete synthetic
        ground truth the two coincide, total_node_ratio is 0.0 and the adjusted
        Jaccard equals the raw one, which is why the estimate is a required,
        provenance-tagged argument rather than a default. Whether the real
        datasets are sparse enough for this to be exploitable is not measured
        here and needs competition data.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        the official source pin holds and ADJUSTMENT_ALPHA remains 0.1 in the
        vendored implementation.
    superseded_by: null

  - id: F-0005
    claim: >-
      The two boundaries around a multi-frame edge behave differently and were
      measured separately. The Biohub-X lineage contract refuses an edge that
      does not advance exactly one frame at construction, so such an edge cannot
      reach evaluation. The pinned official scorer, called directly on a graph
      built beneath that contract, drops a frame-skipping edge instead of
      charging it: a prediction whose only edge ran from frame 0 to frame 2
      produced edge TP 0, FP 0 and FN 2 against a ground truth of two
      consecutive edges.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        The official behaviour is silence rather than penalty, which is the
        reason the contract refuses rather than relies on it: an illegal edge
        would neither be rewarded nor charged, while the annotated edge it
        failed to reproduce still counts against the system. Backward and
        same-frame edges are refused by the same contract rule.
    validity:
      scope: official_metric_behaviour_and_lineage_contract
      holds_while: >-
        the official source pin holds and LineageGraph keeps its one-frame edge
        rule.
    superseded_by: null

  - id: F-0006
    claim: >-
      A complete detect-to-score chain can be run on a deterministic synthetic
      fixture with no competition data, no GPU and no external artifact, and the
      graph it emits is legal by construction. On the default fixture the chain
      detects 14 instances, offers 37 candidate edges at a 12 micrometre radius,
      reaches every true edge, decodes 11 edges including the one division, and
      scores 1.1 under the official metric.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The matcher is an untrained deterministic rule with hand-set constants.
        The score is a property of the fixture and those constants, not evidence
        about the competition, and the fixture is far easier than real data.
        What the number demonstrates is causal ownership: every stage is reached
        only through the one in front of it and every intermediate is a
        validated contract.
    validity:
      scope: software_vertical_slice
      holds_while: >-
        the synthetic fixture, the classical detector and the untrained matcher
        are unchanged. Any of them changing supersedes the specific counts.
    superseded_by: null

  - id: F-0007
    claim: >-
      Candidate reach is a real ceiling on the edge Jaccard and its two failure
      modes are separately attributable. Narrowing the candidate radius to 1
      micrometre, below the fixture's one-to-two micrometre true displacements,
      dropped reach to 0.182 with 9 true edges unreachable outside the radius and
      0 unreachable for a missing endpoint, and the edge Jaccard equalled the
      reach at 0.182. Raising the detection threshold to 0.99 instead dropped
      reach to 0.273 with 8 true edges unreachable for a missing endpoint and 0
      outside the radius.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The two knobs produce the same symptom, a low score, through different
        stages. Reporting them apart is what stops the next experiment being
        aimed at the wrong component.
    validity:
      scope: software_vertical_slice
      holds_while: the synthetic fixture and the classical detector are unchanged.
    superseded_by: null

  - id: F-0008
    claim: >-
      The node-count lever measured on hand-built graphs in F-0003 and F-0004
      reproduces through a whole running pipeline. Between fixture noise 0.06 and
      0.15 the detector went from 15 to 189 instances while the raw edge Jaccard
      stayed at 0.9091 and edge false positives stayed at 0; the node-count ratio
      rose from +0.071 to +12.500 and the adjusted edge Jaccard fell from 0.9026
      to 0.0000.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The spurious detections match no annotated node, so they cost nothing in
        edge terms and everything through the adjustment. This makes the lever a
        property of a system rather than of an equation, and is the direct
        justification for the deferral recorded in D-0011.
    validity:
      scope: software_vertical_slice_and_official_metric_behaviour
      holds_while: >-
        the official source pin holds and the fixture and detector are unchanged.
    superseded_by: null

  - id: F-0009
    claim: >-
      A prediction that abstains on every target emits a graph with nodes and no
      edges, and the pinned official scorer cannot score it: `evaluate` returns
      early for an edgeless graph without applying its matching, so the
      `node_recall` helper it documents as requiring a matched graph raises a
      KeyError from inside tracksdata rather than returning a number. Biohub-X
      refuses such a prediction with a named error instead.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        Found by driving the matcher's abstention weight to an extreme while
        testing that no feature channel is inert. A system that abstains
        everywhere is a real possible output, so the failure is reported as a
        refusal that says why, not as a score of zero and not as a dependency's
        key error.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        registry/official_source.yaml pins commit
        075fc5f5a52d11077f9dc2b074644618f26939e2 and tracksdata stays at the
        pinned commit.
    superseded_by: null

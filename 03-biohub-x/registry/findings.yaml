        official estimate, where the node-count multiplier is close to one rather
        than paid for with shoulders. Three readings. First, the peaks detector
        saturates because there are only so many maxima, so its curve is flat
        above twice the estimate and its proposal count is a property of the
        image rather than of a budget; that is the behaviour a detector should
        have and the packed one did not. Second, the bank question resolves
        differently under peaks than under packing: with shoulders removed the
        large scale mostly merges neighbours, so two scales win on both embryos
        wherever the budget is at least twice the estimate, and the one place
        three scales still win is the neutral budget on the dense embryo, by
        0.015. Third, the residual on 44b6 is now almost entirely near misses
        within one nucleus spacing, which is merging at the 3 micrometre scale
        or an annotated cell sitting between two peaks; on 6bba it is a third dim
        and the rest near misses. A first peaks probe put missed cells near the
        volume faces; that was replicated padding defeating a strict inequality
        on the boundary slices, fixed before these numbers were taken, and its
        report is kept under a name that says so.

# Findings registry: one measured claim per entry.
#
# Required per finding:
#   id            stable identifier
#   claim         a single measured statement
#   instrument    the code that measured it
#   evidence      how to reproduce, and what was observed
#   validity      scope, and the conditions under which the claim holds
#   superseded_by finding id that replaces this one, or null
#
# A number that is not here is not a result. Numbers are never restated in
# prose; prose references the finding id.

schema_version: 1

findings:
  - id: F-0001
    claim: >-
      Biohub-X is a standalone Git repository with no ancestor repository; no
      tracked file names a quarantined prior-campaign repository; no tracked
      file carries an absolute filesystem path outside the allow-listed
      provenance records; and no import-path entry resolves outside the
      repository, its virtual environment and the standard library.
    instrument: tests/contracts/test_repository_isolation.py
    evidence:
      command: uv run pytest tests/contracts/test_repository_isolation.py
      observed: 14 passed
      note: >-
        The content scans read the Git index, so they pass vacuously on an empty
        index; the instrument asserts the index is non-empty, and both the
        absolute-path detector and the quarantine scan carry negative controls
        that plant the exact shape of a leak and require it to be flagged.
    validity:
      scope: repository_integrity
      holds_while: >-
        the instrument runs in CI on a full clone and the two allow-lists are
        not extended. Extending either allow-list narrows this claim.
    superseded_by: null

  - id: F-0002
    claim: >-
      The two content identities separate platform drift from content change: a
      CRLF rewrite of a configuration file breaks its raw identity and leaves
      its canonical identity intact, while a single-character content edit
      breaks both.
    instrument: tests/mutation/test_line_ending_drift.py
    evidence:
      command: uv run pytest tests/mutation/test_line_ending_drift.py
      observed: 5 passed
    validity:
      scope: content_identity
      holds_while: >-
        CANONICALIZATION_VERSION is v1. Bumping it invalidates every recorded
        canonical digest and supersedes this finding.
    superseded_by: null

  - id: F-0003
    claim: >-
      Under the pinned official scorer, a predicted node that matches no
      ground-truth node adds no edge false positive. Adding one isolated,
      unmatched node to a perfect two-node prediction left edge TP, FP, FN at
      1, 0, 0 and the raw edge Jaccard at 1.0. An edge between two mutually
      unmatched predicted nodes is likewise uncharged. The exemption ends at
      the annotated cells: an edge whose source matches a ground-truth node
      that has a ground-truth successor, but which points elsewhere, was
      charged as one false positive.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        This is edge accounting only. The same unmatched node still enters the
        node-count adjustment: holding the estimated total at 2, it raised
        num_pred_nodes from 2 to 3, total_node_ratio from 0.0 to 0.5, and
        lowered the adjusted edge Jaccard from 1.0 to 0.95 while the raw
        Jaccard did not move. Free of edge penalty is not free of consequence.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        registry/official_source.yaml pins commit
        075fc5f5a52d11077f9dc2b074644618f26939e2 and its digests verify. Moving
        the pin supersedes this finding until the instrument is re-run.
    superseded_by: null

  - id: F-0004
    claim: >-
      The official node-count adjustment multiplies the edge Jaccard by
      1 - 0.1 * (N_pred - N_total) / N_total and is clamped only at zero, so the
      multiplier exceeds one whenever fewer nodes are predicted than the
      estimated total. With 2 predicted nodes, a declared estimated total of 20
      and a raw edge Jaccard of 1.0, total_node_ratio was -0.9 and the adjusted
      edge Jaccard was 1.09.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        Demonstrating an adjusted Jaccard above one requires an estimated total
        larger than the annotated ground-truth count. On a complete synthetic
        ground truth the two coincide, total_node_ratio is 0.0 and the adjusted
        Jaccard equals the raw one, which is why the estimate is a required,
        provenance-tagged argument rather than a default. Whether the real
        datasets are sparse enough for this to be exploitable is not measured
        here and needs competition data.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        the official source pin holds and ADJUSTMENT_ALPHA remains 0.1 in the
        vendored implementation.
    superseded_by: null

  - id: F-0005
    claim: >-
      The two boundaries around a multi-frame edge behave differently and were
      measured separately. The Biohub-X lineage contract refuses an edge that
      does not advance exactly one frame at construction, so such an edge cannot
      reach evaluation. The pinned official scorer, called directly on a graph
      built beneath that contract, drops a frame-skipping edge instead of
      charging it: a prediction whose only edge ran from frame 0 to frame 2
      produced edge TP 0, FP 0 and FN 2 against a ground truth of two
      consecutive edges.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 11 passed
      note: >-
        The official behaviour is silence rather than penalty, which is the
        reason the contract refuses rather than relies on it: an illegal edge
        would neither be rewarded nor charged, while the annotated edge it
        failed to reproduce still counts against the system. Backward and
        same-frame edges are refused by the same contract rule.
    validity:
      scope: official_metric_behaviour_and_lineage_contract
      holds_while: >-
        the official source pin holds and LineageGraph keeps its one-frame edge
        rule.
    superseded_by: null

  - id: F-0006
    claim: >-
      A complete detect-to-score chain can be run on a deterministic synthetic
      fixture with no competition data, no GPU and no external artifact, and the
      graph it emits is legal by construction. On the default fixture the chain
      detects 14 instances, offers 37 candidate edges at a 12 micrometre radius,
      reaches every true edge, decodes 11 edges including the one division, and
      scores 1.1 under the official metric.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The matcher is an untrained deterministic rule with hand-set constants.
        The score is a property of the fixture and those constants, not evidence
        about the competition, and the fixture is far easier than real data.
        What the number demonstrates is causal ownership: every stage is reached
        only through the one in front of it and every intermediate is a
        validated contract.
    validity:
      scope: software_vertical_slice
      holds_while: >-
        the synthetic fixture, the classical detector and the untrained matcher
        are unchanged. Any of them changing supersedes the specific counts.
    superseded_by: null

  - id: F-0007
    claim: >-
      Candidate reach is a real ceiling on the edge Jaccard and its two failure
      modes are separately attributable. Narrowing the candidate radius to 1
      micrometre, below the fixture's one-to-two micrometre true displacements,
      dropped reach to 0.182 with 9 true edges unreachable outside the radius and
      0 unreachable for a missing endpoint, and the edge Jaccard equalled the
      reach at 0.182. Raising the detection threshold to 0.99 instead dropped
      reach to 0.273 with 8 true edges unreachable for a missing endpoint and 0
      outside the radius.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The two knobs produce the same symptom, a low score, through different
        stages. Reporting them apart is what stops the next experiment being
        aimed at the wrong component.
    validity:
      scope: software_vertical_slice
      holds_while: the synthetic fixture and the classical detector are unchanged.
    superseded_by: null

  - id: F-0008
    claim: >-
      The node-count lever measured on hand-built graphs in F-0003 and F-0004
      reproduces through a whole running pipeline. Between fixture noise 0.06 and
      0.15 the detector went from 15 to 189 instances while the raw edge Jaccard
      stayed at 0.9091 and edge false positives stayed at 0; the node-count ratio
      rose from +0.071 to +12.500 and the adjusted edge Jaccard fell from 0.9026
      to 0.0000.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        The spurious detections match no annotated node, so they cost nothing in
        edge terms and everything through the adjustment. This makes the lever a
        property of a system rather than of an equation, and is the direct
        justification for the deferral recorded in D-0011.
    validity:
      scope: software_vertical_slice_and_official_metric_behaviour
      holds_while: >-
        the official source pin holds and the fixture and detector are unchanged.
    superseded_by: null

  - id: F-0009
    claim: >-
      A prediction that abstains on every target emits a graph with nodes and no
      edges, and the pinned official scorer cannot score it: `evaluate` returns
      early for an edgeless graph without applying its matching, so the
      `node_recall` helper it documents as requiring a matched graph raises a
      KeyError from inside tracksdata rather than returning a number. Biohub-X
      refuses such a prediction with a named error instead.
    instrument: tests/end_to_end/test_vertical_slice.py
    evidence:
      command: uv run pytest tests/end_to_end
      observed: 19 passed
      note: >-
        Found by driving the matcher's abstention weight to an extreme while
        testing that no feature channel is inert. A system that abstains
        everywhere is a real possible output, so the failure is reported as a
        refusal that says why, not as a score of zero and not as a dependency's
        key error.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        registry/official_source.yaml pins commit
        075fc5f5a52d11077f9dc2b074644618f26939e2 and tracksdata stays at the
        pinned commit.
    superseded_by: null

  - id: F-0010
    claim: >-
      The local test split is not a held-out evaluation set. It contains four
      volumes and no ground truth at all, and every one of the four is
      byte-identical to a train volume carrying the same dataset id, confirmed
      by matching tree digests over 456,757,564 to 547,662,847 bytes each. It is
      a format example for the submission pipeline; the genuinely held-out data
      is the hidden set swapped in at rerun.
    instrument: tests/contracts/test_competition_corpus.py
    evidence:
      command: uv run pytest tests/contracts/test_competition_corpus.py
      observed: 6 passed
      note: >-
        Any score computed against the local test split is a score on training
        data. All held-out evaluation must therefore be carved out of the 199
        annotated train datasets. The duplication is recorded structure, not
        permission to score train labels against the test directory.
    validity:
      scope: competition_corpus
      holds_while: >-
        registry/artifacts.yaml records the corpus onboarded on 2026-09-02. A
        genuine held-out test set arriving supersedes this finding, and the
        instrument fails loudly if it does.
    superseded_by: null

  - id: F-0011
    claim: >-
      The supervised corpus spans two embryos, not 199 independent subjects.
      Dataset ids are {embryo}_{field_of_view}, and the 199 annotated train
      datasets divide into embryo 6bba with 128 fields of view and embryo 44b6
      with 71.
    instrument: tests/contracts/test_competition_corpus.py
    evidence:
      command: uv run pytest tests/contracts/test_competition_corpus.py
      observed: 6 passed
      note: >-
        Leave-one-embryo-out yields exactly two folds, each training on a single
        embryo. Any claim that a result holds across embryos rests on n=2, and
        199 is a count of fields of view rather than of independent subjects.
        Fields of view from one embryo are not independent of each other, so a
        random split over the 199 would leak.
    validity:
      scope: competition_corpus
      holds_while: the registered corpus is unchanged.
    superseded_by: null

  - id: F-0012
    claim: >-
      Annotation is sparse by orders of magnitude. Across the 199 annotated
      train datasets the ground truth totals 2,353,863 bytes against
      87,607,537,865 bytes of volume, which is 0.0027 percent. Per dataset the
      median ground truth is 11,713 bytes against a median volume of
      411,186,738 bytes.
    instrument: tests/contracts/test_competition_corpus.py
    evidence:
      command: uv run pytest tests/contracts/test_competition_corpus.py
      observed: 6 passed
      note: >-
        Byte ratios are a proxy for annotation density, not a measurement of it,
        because the two formats differ in what they store. The order of
        magnitude is what matters here: no component may be written assuming
        most cells carry a label. Converting this into a node count needs the
        estimated_number_of_nodes metadata and is not established yet.
    validity:
      scope: competition_corpus
      holds_while: the registered corpus is unchanged.
    superseded_by: F-0013

  - id: F-0013
    claim: >-
      Annotation density varies by two orders of magnitude across the corpus and
      differs systematically between the two embryos. Across 199 annotated
      datasets there are 133,318 annotated nodes and 128,883 annotated edges
      against a summed estimated_number_of_nodes of 4,725,117, so 2.821 percent
      overall. Per dataset the annotated fraction ranges from 0.13 to 20.21
      percent with a median of 3.56. Embryo 44b6 has a median density of 0.77
      percent across 71 movies; embryo 6bba has 9.71 percent across 128.
    instrument: artifacts/corpus-annotation-survey.json
    evidence:
      command: >-
        read every train .geff, count nodes and edges, and read
        estimated_number_of_nodes from the geff metadata extra
      observed: 199 datasets surveyed, all carrying an estimate
      note: >-
        The two leave-one-embryo-out folds are therefore not merely different
        embryos, they are different annotation regimes differing about
        twelvefold in density. A result that holds on one says little about the
        other, and reporting the folds pooled would hide that.
    validity:
      scope: competition_corpus
      holds_while: the registered corpus is unchanged.
    superseded_by: null

  - id: F-0014
    claim: >-
      Division supervision is extremely scarce. The corpus contains 151
      annotated divisions in total, and 112 of the 199 datasets contain none at
      all. The median dataset has zero and the maximum has five. Embryo 44b6
      holds 26 divisions and embryo 6bba holds 125, so a leave-one-embryo-out
      fold trains a division model on either 26 or 125 examples.
    instrument: artifacts/corpus-annotation-survey.json
    evidence:
      command: count nodes with out-degree of two or more in every train .geff
      observed: 151 divisions across 199 datasets
      note: >-
        This bounds the joint division scorer proposed as experiment E04 far
        more tightly than the 0.1 metric weight suggests. Twenty-six positive
        examples in the smaller fold is not enough to fit a learned triple
        scorer with any confidence, so synthetic fork pretraining or a
        geometric prior is likely necessary rather than optional.
    validity:
      scope: competition_corpus
      holds_while: the registered corpus is unchanged.
    superseded_by: null

  - id: F-0015
    claim: >-
      The official node-count adjustment offers roughly a ten percent uplift on
      the raw edge Jaccard to a system that predicts the annotated node count
      rather than the true cell count. Using each dataset's own
      estimated_number_of_nodes, the multiplier 1 - 0.1 * (N_pred - N_total) /
      N_total has a median of 1.0000 when predicting the estimated total and
      1.0964 when predicting the annotated count, ranging 1.0798 to 1.0999. It
      is 1.0992 for embryo 44b6 and 1.0903 for embryo 6bba.
    instrument: artifacts/corpus-annotation-survey.json
    evidence:
      command: >-
        evaluate the pinned metric's adjustment formula against each dataset's
        recorded estimated_number_of_nodes under four node-count policies
      observed: 199 datasets, medians 1.0000 / 1.0929 / 1.0964 / 1.0982
      note: >-
        This quantifies the lever established abstractly in F-0004 against the
        real corpus. It is a ceiling, not a strategy: the uplift is only
        realised if the nodes predicted are the annotated ones, since an edge
        scores nothing unless both endpoints match ground truth within 7
        micrometres. The multiplier is nearly flat between predicting half the
        annotated count and twice it, so precision in node count matters far
        less than which nodes are chosen.
    validity:
      scope: official_metric_behaviour_and_competition_corpus
      holds_while: >-
        the official source pin holds, ADJUSTMENT_ALPHA remains 0.1, and the
        registered corpus is unchanged.
    superseded_by: null

  - id: F-0016
    claim: >-
      The official division counter shares the unmatched-prediction exemption
      that F-0003 measured for edges. A predicted fork built entirely from
      unmatched nodes is not charged: added to a perfect single-division
      prediction it left division TP, FP, FN at 1, 0, 0 and the division
      Jaccard at 1.0, while raising num_pred_nodes from 3 to 6 and lowering the
      adjusted edge Jaccard from 1.0 to 0.9. The exemption ends at the annotated
      cells: against a ground truth holding no divisions, a fork whose own node
      matched an annotated cell with a successor was charged as one division
      false positive, taking the division Jaccard from undefined to 0.0, and was
      charged again as one edge false positive.
    instrument: tests/contracts/test_official_scorer_behaviour.py
    evidence:
      command: uv run pytest tests/contracts/test_official_scorer_behaviour.py
      observed: 13 passed
      note: >-
        A predicted fork enters the false-positive set only through
        `considered`, `evaluable_forks` or `invalid_forks`. A fork on an
        unmatched node is local to no ground-truth division window, is excluded
        from `evaluable_forks` because that set requires the fork node to carry
        a match, and supplies no cross-component branch evidence. Spurious
        division repair on unannotated cells is therefore nearly free, and the
        cost of an aggressive division policy is paid in the node count rather
        than in the division term.
    validity:
      scope: official_metric_behaviour
      holds_while: >-
        registry/official_source.yaml pins commit
        075fc5f5a52d11077f9dc2b074644618f26939e2 and its digests verify. Moving
        the pin supersedes this finding until the instrument is re-run.
    superseded_by: null

  - id: F-0017
    claim: >-
      The Phase-2 chain runs end to end on real competition bytes and scores
      0.082121 through the pinned official scorer, and detection rather than
      association is what limits it. On a 12-frame, 32x128x128 window of
      6bba_2540cd90 holding 26 annotated nodes and 22 annotated edges, the
      classical local-maximum detector proposed 65 instances at node recall
      0.269. Candidate reach was 0.182: of 18 unreachable annotated edges, all
      18 were unreachable because an endpoint was never detected and 0 because
      the 12 micrometre candidate radius was too small. Edge TP, FP, FN were
      2, 2, 20 for a raw edge Jaccard of 0.083333; 65 predicted nodes against a
      declared window estimate of 56.745 gave a node ratio of +0.145 and an
      adjusted edge Jaccard of 0.082121. The window holds no annotated
      divisions, and all 4 predicted divisions were uncharged.
    instrument: biohubx infer real
    evidence:
      command: >-
        biohubx infer real --dataset 6bba_2540cd90 --first-frame 0 --frames 12
        --crop-z 0:32 --crop-y 128:256 --crop-x 128:256 --detection-threshold 0.70
      observed: artifacts/real-preflight.json, 0.39 seconds of chain runtime
      note: >-
        integration_only. This measures that the chain runs on real data and
        where its first bottleneck is, not that the approach works. The split
        of unreachable edges is the load-bearing part: association had nothing
        to fix, because the endpoints it needed did not exist. The window's
        node-count estimate is prorated from the movie's official estimate by
        frame and voxel fraction, which assumes uniform cell density, so it is
        DECLARED rather than official metadata and the adjusted figure is not
        comparable with a whole-movie one.
    validity:
      scope: vertical_slice_on_real_data
      holds_while: >-
        the window in configs/phase3-cpu.yaml section E01 is unchanged, the
        official source pin holds, and the classical detector is unchanged.
    superseded_by: null
  - id: F-0018
    claim: >-
      Emitting the annotated node count instead of the estimated cell count is
      worth about nine percent of the adjusted edge Jaccard, and it stops paying
      once a filter destroys more than about eight percent of the correct edges
      to get there. Across all 199 annotated training datasets, a dense
      prediction padded to each dataset's own estimated_number_of_nodes scored an
      adjusted edge Jaccard of exactly 1.0000 on both embryo folds, because its
      node ratio is zero by construction. The same edges emitted at the annotated
      node count scored 1.0986 on 44b6 and 1.0905 on 6bba. Sweeping the fraction
      of correct edges the filtered policy retains, both folds break even at 0.92
      and both fall behind the dense baseline at 0.90, by 0.0114 on 44b6 and
      0.0184 on 6bba. Reaching 0.014 above the dense baseline, which is the step
      from a 0.936 system to 0.950 with the division term held fixed, requires a
      retention of 0.94 on both folds: 0.0327 on 44b6 and 0.0251 on 6bba.
    instrument: biohubx evaluate retention
    evidence:
      command: >-
        biohubx evaluate retention --seed 0
        --retentions 1.0,0.98,0.96,0.94,0.92,0.90,0.88,0.85
      observed: artifacts/retention-oracle.json, 199 datasets, 1180 seconds
      note: >-
        An oracle upper bound, not a strategy. Every retained edge is correct by
        construction, so a real filter at the same node count scores no higher
        than this and almost certainly lower. The command re-measured F-0003 and
        F-0016 on real data before relying on them: padding 44b6_0113de3b from 52
        nodes to its estimated 25,755 left every edge and division count
        identical and moved the adjusted edge Jaccard from 1.0998 to 1.0000.
        The crossover is independent of association quality while no false
        positive is charged, since both policies scale linearly in the fraction
        of correct edges, and that independence ends as soon as a system emits
        wrong edges on annotated cells, which F-0003 shows are charged.
    validity:
      scope: official_metric_behaviour_and_competition_corpus
      holds_while: >-
        the official source pin holds, ADJUSTMENT_ALPHA remains 0.1, and the
        registered corpus is unchanged. The four duplicated public-test fixtures
        were not read.
    superseded_by: null
  - id: F-0019
    claim: >-
      A three-valued detection target with an intensity-quantile ignore band
      keeps every annotated cell supervised while refusing to call unannotated
      cells background, and the whole E03 training loop runs on CPU. On the E01
      window at the ninetieth percentile the target was 26 positive, 353,632
      negative and 39,558 ignored voxels, 10.06 percent ignored, at an intensity
      threshold of 0.0976, with 0 annotated nodes unplaceable and all 26 inside
      the ignore band. From deterministic random initialisation one Adam step at
      1e-4 moved the masked loss from 1.110484 to 0.859316 at a gradient norm of
      14.08. The checkpoint wrote atomically, reloaded with strict=True and
      reproduced its output bit-identically. Peak extraction and suppression
      yielded 133 proposals, which decoded to a legal graph of 133 nodes and 114
      edges at candidate reach 0.227 and node recall 0.269, scoring 0.099879
      through the pinned official metric. The run took 24.8 seconds and 1.52 GB
      peak resident.
    instrument: biohubx train preflight, tests/unit/test_training_targets.py
    evidence:
      command: biohubx train preflight --seed 0
      observed: artifacts/train-preflight.json, 11 passed
      note: >-
        integration_only. One tiny window, one optimizer step, no fold and no
        promotion; the score is what an untrained detector produces and means
        nothing beyond the loop being wired correctly. Two things are worth
        keeping. The ignore band containing all 26 annotated cells is the
        evidence for D-0023, since a band that hid unannotated cells without
        containing annotated ones would be guesswork. And peak extraction had to
        threshold by quantile: one step from noise leaves the detector
        uncalibrated, its maximum probability reached only 0.4929, so no
        absolute threshold would have fired. E03 uses an absolute threshold once
        a trained detector's scale means something.
    validity:
      scope: training_boundaries_on_real_data
      holds_while: >-
        the E01 window in configs/phase3-cpu.yaml is unchanged and the official
        source pin holds. Its loop-integrity half still stands; its band half
        does not.
    superseded_by: F-0020
  - id: F-0020
    claim: >-
      No intensity band can call any voxel background without contradicting
      annotated cells, and the failure is not a grid artefact. Measuring the
      intensity percentile of 5,291 annotated nodes across all 199 training
      movies, the dimmest annotated cell sits at percentile 0.5263 on 44b6 and
      0.0917 on 6bba. The q90 band this repository had adopted would call 179 of
      856 44b6 nodes (20.9 percent) and 671 of 4,435 6bba nodes (15.1 percent)
      background. Selecting per fold from the training embryo alone, 44b6 admits
      only q50, which withholds half the volume from supervision and still
      misclassifies 46 of 4,435 held-out 6bba nodes (1.04 percent); 6bba admits
      no band at all, since even q50 contradicts 46 of its own. Replacing the
      reference's striding with max-pooling over the same 4x4 block makes it
      slightly worse, not better: the dimmest node moves to 0.4961 on 44b6 and
      0.0894 on 6bba, and q90 coverage falls from 0.791 to 0.758 and from 0.849
      to 0.840. Annotated cells are also rarely local intensity maxima on this
      grid: 14.8 percent on 44b6 and 5.8 percent on 6bba.
    instrument: biohubx evaluate mask-audit
    evidence:
      command: biohubx evaluate mask-audit --max-frames 4
      observed: artifacts/mask-audit.json, 199 datasets, 5,291 nodes, 124 seconds
      note: >-
        Percentile rank within a frame is invariant to any monotonic intensity
        normalisation, so none of these numbers move if the scaling changes;
        what a normalisation moves is the absolute value a band maps to, never
        which nodes fall inside it. Band selection used only each fold's
        training embryo, and the evaluation embryo was measured afterwards as a
        false-negative proxy that could not influence the choice. This finding
        supersedes the single-window result in F-0019 that appeared to bless
        q90: one window of one bright movie is not the corpus.
    validity:
      scope: competition_corpus_and_supervision
      holds_while: >-
        the registered corpus is unchanged and the model grid stays (1, 4, 4).
        A finer grid would need re-measuring, and might change the answer.
    superseded_by: null

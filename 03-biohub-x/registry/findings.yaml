  - id: F-0029
    claim: >-
      The near-miss residual is not sub-voxel error and not a z artefact. Among
      the annotated cells DoG still misses at eight times the estimated cell
      count whose nearest proposal lies within 14 micrometres, 41 on 44b6 and 125

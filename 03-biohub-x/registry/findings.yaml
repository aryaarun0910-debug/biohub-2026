    evidence:
      command: biohubx evaluate proposals --ratios 8.0 --audit-misses --audit-ratio 8.0
      observed: artifacts/proposals-residual-r8-displacement.json, 2,033 nodes audited, 613.5 seconds
      note: >-
        integration_only, and it settles H-11's first probe against refinement.
        Sub-voxel centroid refinement can move a peak by at most a fraction of a
        1.625 micrometre grid step per axis; the offsets here are four to six
        steps. And a proposal that sits a nucleus-spacing away is not this cell's
        peak displaced but a neighbour's peak, so moving it toward its own blob
        centre cannot bring it to the missed cell. The mechanism this points at
        is response merging: at the largest scale in the bank, 4.5 micrometres,
        the outer Gaussian has a sigma of about 4.2 micrometres, wide enough to
        fuse two nuclei eight micrometres apart into one response maximum, so
        the dimmer of the pair produces no maximum of its own. That is the
        merging-of-neighbours failure the C. elegans study named (R-0013,
        RL-0009), and it is a property of the scale bank rather than of the
        localisation. The suppression radius of 4 micrometres is not the cause:
        it is smaller than the offsets observed, so it did not remove these
        peaks; they were never formed.

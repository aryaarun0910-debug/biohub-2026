# EXPERIMENTS REGISTRY - binds every identifier for one experiment in ONE place.
#
# WHY THIS EXISTS
# An experiment currently has up to six different names: the spec file stem, the spec
# `name`, the Kaggle slug, the notebook out_dir, the submission ref, and whatever prose
# called it in the ledger. Nothing tied them together, so answering "what did p15 score?"
# meant guessing a slug. On 2026-08-25 that cost a wrong-slug API call, and separately a
# spec copied without changing `out_dir` silently overwrote a sibling kernel's metadata.
#
# THE RULE
# One EXP-#### per experiment. Every other identifier hangs off it. Prose cites the EXP id.
#
# status:
#   built     notebook built locally, never pushed
#   running   pushed, kernel executing
#   complete  kernel finished, output fetched
#   scored    submission has a leaderboard score
#   pending   submitted, awaiting score
#   void      ran but produced nothing usable - the run is evidence of a DEFECT, not a result
#   cancelled stopped before it finished; whatever it emitted is partial
#   deployed  the current live submission
#
# TWO LINK DIRECTIONS, AND THEY ARE NOT THE SAME. `experiments[].facts` is a loose "facts
# involved in this run" list and includes the facts that MOTIVATED it - EXP-0019 cites
# FACT-0111, which closed LEVER-0003 on unrelated evidence and is untouched by the leak. The
# RETRACTION edge runs the other way: `facts[].experiment` names the run a fact's numbers came
# from. validate_registry R8 walks ONLY that direction, so setting a status to `void` or
# `cancelled` forces every fact DERIVED from it to declare a validity, and never retracts the
# run's own inputs. If you void an experiment, check that its derived facts carry the link.


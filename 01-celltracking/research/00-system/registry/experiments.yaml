  - id: EXP-0018
    title: P18 relink division - a priced second row per source in the motion relink
    spec: scripts/kaggle_specs/p18_relink_division.json
    kernel: aryaarun07/biohub-p18-relink-division
    submission: null
    lb: null
    status: built
    date: '2026-08-25'
    facts: [FACT-0090, FACT-0093]
    note: >-
      BUILT AND VERIFIED, NOT LAUNCHED (rule 8; both GPU slots also busy with EXP-0004A/B).
      Single-variable arm off the champion EXP-0009. Duplicates each source row in the
      relink cost matrix and prices the copy, so linear_sum_assignment SELECTS which sources
      earn a second child jointly over motion + raw distance + learned probability - the
      joint-scorer structure the multi-cause evidence (FACT-0084) calls for, rather than a
      fifth AND-gate. Targets the 14 fork-collapsed divisions (FACT-0090).
      .
      38 contract tests pass: the disabled default (-1) reproduces the champion EXACTLY on
      random matrices, in-degree <= 1 and out-degree <= 2 always hold, the penalty is
      monotone in second children (so it is a real selector), and the gap-close bijection at
      cell 6:697 is left untouched.
      .
      CAVEAT: the penalty 2.0 is an UNMEASURED GUESS. Cost units are roughly um
      (motion + 0.05*raw - 0.75*prob), so 2.0 demands a clearly better second child, but
      nothing has measured it. Today's lesson says buy the CURVE not the point - the relink
      is post-processing and cheap relative to inference, so one kernel could emit the whole
      penalty sweep as several LOEO exports and be scored offline for zero submission slots.
      That is the better design and it is NOT yet built.

  - id: EXP-0019
    title: P19 relink division penalty SWEEP - the whole curve from one GPU session
    spec: scripts/kaggle_specs/p19_relink_sweep_f1.json
    kernel: aryaarun07/biohub-p19-relink-division-sweep-loeo-f1
    submission: null
    lb: null
    status: complete
    date: '2026-08-25'
    facts: [FACT-0090, FACT-0093, FACT-0102, FACT-0111]
    note: >-
      BUILT AND VERIFIED, NOT LAUNCHED (rule 8). Supersedes the single-value EXP-0018 as the
      thing to run. Emits one LOEO fold-1 export per penalty in {-1, 0, 1, 2, 4, 8}, each
      scoreable offline against data/train with scripts/core/score_oof.py - ZERO submission
      slots.
      .
      WHY A SWEEP: two slots were spent on two points of the DETECTION curve (EXP-0016/0017)
      which one offline CPU pass then reproduced entirely (FACT-0111). The relink penalty has
      the same shape - one scalar, unknown optimum - so a per-value submission would repeat
      that mistake. Cheap because the geffs are cached: only filter_output_graph is re-run
      per penalty, not the UNet, edge model or ILP.
      .
      ON THE CHAMPION SUBSTRATE. Built from notebooks/kaggle_p3_harmonic (the deployed base)
      plus the P9 coupled-division transplant, NOT the older p0b base the existing LOEO chain
      uses. So it measures what we actually deploy. Discovered while building this: our LOEO
      diagnostics have been running on a DIFFERENT substrate from the deployment.
      .
      ORDERING IS LOAD-BEARING: the sweep must run BEFORE the LOEO cleanup, which deletes
      every /kaggle/working entry not in _LOEO_KEEP - and the geffs live under
      /kaggle/working/tracking_repo. A sweep ordered after it would find nothing and waste
      the session silently. Verified at build (offset 3,532 vs 12,300) and guarded by a test.
      .
      IN-RUN CONTROL: penalty -1 is the disabled sentinel and must reproduce the champion
      exactly. If its node/edge counts do not match the primary LOEO export, the sweep is
      invalid and must not be interpreted.
      .
      43 contract tests pass across EXP-0018/0019.
      .
      RESULT 2026-08-26: RAN CLEAN, CONTROL PASSED, MECHANISM KILLED. Penalty -1 reproduced
      the champion EXACTLY (2,156,725 nodes / 2,077,140 edges / 6,314 forks), so the sweep is
      valid. Every other penalty scored WORSE: -0.0040 (p=0) to -0.0023 (p=2), with divJ
      falling 0.0743 -> 0.061-0.067 and div_tp dropping 26 -> 21. See FACT-0131, LEVER-0012.
      Evidence: _evidence/p19_relink_sweep_f1/. Cost: one GPU session, ZERO submission slots,
      six points instead of one - the sweep design paid for itself.

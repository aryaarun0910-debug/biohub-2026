id: PKT-0046
title: "The reversed ceiling ladder: the CPU disqualifier for the detector lane, run before any GPU"
lever: null
owner: agent-9-reversed-ladder
lock: claimed
opened: '2026-08-31'

why_no_lever: >-
  This is a DISQUALIFIER measurement that prices a lane; it tests no hypothesis of its own and claims none of
  LEVER-0032, LEVER-0033 or LEVER-0030. Its output decides whether those levers may receive a GPU slot. R6
  permits a null lever.

claim: >-
  Perfect node correction under the FROZEN consumer is worth enough full-chain score to justify detector
  integration as the campaign's high-headroom lane.

falsifier: >-
  PREREGISTERED. If the best node-only rung misses the bar on the honest fold, detector integration CANNOT
  serve as the >= +0.02 node-improvement lane and the primary bet is disqualified BEFORE any GPU is spent.
  ASYMMETRY STATED IN ADVANCE, because it decides how the result may be read: this is a DISQUALIFIER, not a
  qualifier. A MISS is decisive for the node-only detector thesis. A PASS licenses exactly ONE capped
  protected smoke and proves nothing about capability - oracle-to-real conversion here is poor (FACT-0384
  priced a perfect verifier at +0.01416 against ~+0.001 achievable).
  SCOPE LIMIT, NOT NEGOTIABLE: this bounds NODE CORRECTION UNDER THE FROZEN CONSUMER only. A real detector
  also changes localisation, node features, candidate availability and association decisions, so a miss does
  NOT kill detector-derived representations or candidate-generation effects.

method: >-
  CPU ONLY. FOUR ARMS, BOTH FOLDS SEPARATELY, every arm through the OFFICIAL patched scorer and the COMPLETE
  chain:
  (1) deployed control, reproduced EXACTLY - a control that does not reproduce halts the packet;
  (2) perfect LOCALISATION of already-matched nodes, topology frozen;
  (3) perfect node MEMBERSHIP - correct missing and extra nodes - with current edges transported wherever
      identities remain valid;
  (4) the existing perfect-nodes-plus-perfect-edges self-check, which FACT-0368's harness scores at exactly
      1.0000 and which is therefore the instrument's own calibration.
  REPORT SEPARATELY for every arm: raw edge Jaccard, adjusted edge Jaccard, division Jaccard AND division
  TP/FP/FN, node recall, count-adjustment contribution, and the official combined score. By fold and pooled;
  never pooled alone (AGENTS.md section 4).
  THE LADDER IS ORDER-DEPENDENT AND THAT IS THE POINT: FACT-0368 perfects association FIRST and then nodes,
  so its 7.1% detection rung is what remains AFTER association is already perfect. This packet measures the
  REVERSE order - nodes corrected at TODAY's association - which is the quantity a detector swap actually
  buys and which has never been measured.

worker_policy: >-
  MEASURED, NOT ASSUMED (FACT-0440): this 16 GB / 4-physical-core box PAGES above THREE concurrent workers and
  eight cut throughput to a FIFTH. Native libraries default to eight threads per process, so six workers would
  request 48 BLAS threads on four cores.
  START WITH THREE WORKERS and force every native library to one thread BEFORE python starts:
  OPENBLAS_NUM_THREADS, OMP_NUM_THREADS, MKL_NUM_THREADS, NUMEXPR_NUM_THREADS, POLARS_MAX_THREADS,
  RAYON_NUM_THREADS all = 1.
  Use the existing atomic dynamic claiming (finaledge_batch --claim), which is the right scheduler for highly
  unequal crop runtimes. Raise stale-claim protection to FOUR HOURS so a thermally throttled large crop is not
  duplicated. Hot artifacts under C:/temp. Do NOT run the full pytest, a second scorer or another heavy
  analysis concurrently.
  Only after several representative crops, test a FOURTH worker; keep it only if aggregate crops/hour improves
  materially while free RAM stays safely above ~2 GB and paging stays negligible. Hyperthreads are not
  automatically useful for branch-heavy graph work.
  PROFILE BEFORE REFACTORING: Gate A/B already loads once and sweeps in memory and caches the ILP solution per
  candidate surface. The remaining suspected overhead is run_crop() reloading the notebook module, detector,
  atlas, scorer and parquet slice per crop. Measure that split first; only if setup is material, introduce a
  per-worker context initialised once.

budget: {gpu_sessions: 0, submissions: 0, wall_clock: 1-2 days}


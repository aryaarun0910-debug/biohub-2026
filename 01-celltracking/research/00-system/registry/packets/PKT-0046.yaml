  why_the_one_passing_arm_does_not_count: >-
    perfect_membership_full clears +0.02 count-fair on both folds (+0.061803 / +0.093522) and it must
    NOT be read as detector headroom, for three measured reasons rather than an argument.
    (1) IT RECOVERS ZERO TRUE EDGES. d_edge_tp = +0 and d_edge_fn = +0 on BOTH folds, exactly. Its
        entire movement is false-positive suppression: -1,353 and -13,860 FP edges. Nothing about
        finding or choosing the right cells is doing any work.
    (2) THE OPERATION IS NOT AVAILABLE TO A DETECTOR. The gain comes from DELETING every unmatched
        predicted node. Measured on this substrate at the END of the deployed chain, N_pred/N_est is
        0.7275 on fold 0 and 0.9171 on fold 1 - the pipeline already emits FEWER nodes than the crop
        is estimated to contain. So the 1,885,290 and 1,833,471 unmatched nodes are overwhelmingly
        real cells the sparse annotation does not label, not spurious detections. A better detector
        emits MORE of them, not fewer. (Stage matters and is stated: FACT-0354's 0.8906 is the
        DETECTION-surface ratio; this is the post-chain emitted graph, after the ILP drops nodes per
        FACT-0353. The two are different stages and do not contradict.)
    (3) IT VIOLATES THE STANDING SAFETY CONDITION. Division true positives DECLINE on both folds,
        5 -> 2 and 14 -> 9, which is exactly the FACT-0371 caution the promotion gate encodes.

  verdict: >-
    DISQUALIFIED, and the disqualification is clean. Perfect node correction under the frozen consumer
    does NOT clear +0.02 full-chain score on the honest fold. On fold 0 the two arms a detector could
    actually deliver are worth -0.000364 (perfect localisation of already-matched nodes) and exactly
    +0.000000 (perfect node membership, additive), against a +0.02 bar. Fold 1 agrees: -0.000043 and
    +0.000000. The single most striking number in the packet is that inserting every missing annotated
    cell - 223 on fold 0 and 14,970 on fold 1, taking node recall to 1.00000 on both folds - changes
    NOT ONE EDGE: d_edge_tp, d_edge_fp and d_edge_fn are all exactly zero. Under a frozen consumer a
    newly detected cell arrives as an orphan, so detection recall converts to score at a rate of zero.
    THE ORDER WAS THE WHOLE POINT. FACT-0368's forward ladder reports a 7.1% fold-0 detection rung
    because it perfects ASSOCIATION FIRST, which hands every newly correct node a ready-made perfect
    edge. Measured in the order a real detector swap would occur - nodes corrected at TODAY's
    association - that rung is worth nothing. FACT-0368's rungs must not be quoted as the value of a
    detector swap, and this packet is the measurement that shows why.
  scope_limit_restated_because_it_is_binding: >-
    This bounds NODE CORRECTION UNDER THE FROZEN CONSUMER only. A real detector also changes
    LOCALISATION, NODE FEATURES, CANDIDATE AVAILABILITY and ASSOCIATION DECISIONS. This result does
    NOT kill detector-derived representations and does NOT kill candidate-generation effects; both are
    untouched by it. What it kills is the specific proposition that better NODES, consumed by today's
    association, can be the >= +0.02 lane. Note also that arm 2 freezes topology by construction, so
    it prices only the matching consequence of localisation error and cannot price relinking - the
    FACT-0270 claim survives this packet.


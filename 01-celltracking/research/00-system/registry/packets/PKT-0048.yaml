  .
  CF-F  general_v1 HAS NO LEARNED ABSTENTION. Output 3 is torch.new_zeros; _predict.py:359
  exponentiates it to a constant 1.0 per node; so the abstain mass at _predict.py:426-428 is
  orphan_prob = 1/(sum of edge sim_exp + 1), a deterministic function of the edge logits against a

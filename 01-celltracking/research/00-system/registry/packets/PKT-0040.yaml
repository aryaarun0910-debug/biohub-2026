id: PKT-0040
title: >-
  Final-edge survival audit - where a learned parent score can still be overwritten in the
  deployed program, and the precise stage boundaries for ledger categories 2 and 5
lever: null
why_no_lever: >-
  This is an ARCHITECTURE AUDIT of the deployed program, not a hypothesis about the score. It
  claims no LEVER-####, spends no GPU and no submission slot, and changes nothing in the
  deployed path. R6 permits a null lever, and taking one here would have been the anti-pattern
  AGENTS.md section 2 warns about - locking a live hypothesis behind work that cannot move it.
  Its output is a MAP and a MEASUREMENT that any association lever must be read against, plus
  the falsifier for the successor lever it recommends.
owner: agent-3-final-edge-survival
lock: claimed
opened: '2026-08-30'

claim: >-
  A learned association score consumed ONLY at pre-ILP candidate ranking is discarded before the
  emitted graph exists, because exactly one operation - motion_relink_edges - chooses every
  surviving parent edge, and it reads the learned score only as a bounded bonus on pairs the ILP
  already kept. The correct place to spend the next GPU session is therefore a scorer that
  reaches that operation, not a better pre-ILP ranker.

falsifier: >-
  A forced change to the pre-ILP parent choice SURVIVES into the emitted graph at a high rate -
  say above 0.60 of the perturbed targets whose node survives to emission - on both folds. That
  would mean the relink largely honours the upstream choice, the pre-ILP stage is the effective
  decision point, FACT-0364's structural warning does not bind a re-ranker, and the campaign's
  existing pre-ILP numbers (FACT-0413, FACT-0414) could be read as capability rather than as
  measurements at a stage that is thrown away.
  SECOND FALSIFIER, on the map rather than the measurement: any operation after
  motion_relink_edges is found at deployed file:line to reassign a parent that a target already
  had. That would make categories 2 and 5 non-disjoint and this packet's ledger definitions
  wrong.

prediction: >-
  Stated before the replay was run. The survival rate of a pre-ILP-only parent change, over
  targets whose node survives to emission, lands BELOW 0.35 on both folds, and the dominant
  failure mode is REVERSION - the relink re-selects the original parent on geometry - rather
  than reassignment to a third node. Mechanism: MOTION_RELINK_LEARNED_BONUS is 1.0 while the
  relink cost is a distance in micrometres, so a bonus of at most 1.0 cannot move a pair whose
  geometric disadvantage is larger than that.

inputs:
  facts:
    - FACT-0364      # motion relink replaces the whole edge list - category 5's mechanism
    - FACT-0369      # at most one candidate parent per target at the deployed floor
    - FACT-0370      # bounds ledger categories 1 and 3
    - FACT-0368      # association is the dominant share of the gap; bounds category 4
    - FACT-0371      # divisions are downstream of association; bounds category 6
    - FACT-0376      # SUSPECT. Used only for its structural reading - widening under an
                     # unchanged scorer loses - never for a magnitude.
    - FACT-0382      # all fold-0 contested errors sit below the deployed floor
    - FACT-0387      # the predictor runs as a subprocess; patches rewrite its source text
    - FACT-0408      # the vendored predictor is a DIFFERENT program from the deployed one
    - FACT-0413      # the fold-1 ranker gain, at stage pre_ILP_candidate_ranking
    - FACT-0414      # the fold-0 gate; falsifier (e) fires
  artifacts:
    - C:/temp/p7/tracking_repo/scripts/predict_unet_transformer.py   # the DEPLOYED predictor
    - notebooks/kaggle_p28_champion_control_f1/biohub-p28-champion-control-f1.ipynb
    - notebooks/kaggle_p28_champion_control_f0/biohub-p28-champion-control-f0.ipynb
    - notebooks/kaggle_p35_dcveto_on_931/biohub-p35-dcveto-on-931.ipynb
    - notebooks/kaggle_p3_harmonic/biohub-p3-harmonic.ipynb
    - C:/temp/p30_f0/preilp_split0.parquet
    - C:/temp/p30_f0/ecb/
    - C:/temp/p30_f0/graphs_ctl/
    - C:/temp/p34_f1/preilp_split1.parquet
    - C:/temp/p34_f1/ecb/
    - C:/temp/p28_f0/run_stats.csv
    - C:/temp/p28_f1/run_stats.csv
    - C:/temp/biohub_deepcenter_p10_audit/best.pt
  code:
    - scripts/win_bet/p28_full_chain_replay.py          # the deployed chain, extracted by ast
    - scripts/win_bet/ilp_replay.py                     # build_graph_from_frame + solve
    - scripts/win_bet/assoc_preilp_survival.py          # NEW - the perturbation instrument
    - scripts/win_bet/assoc_preilp_survival_panel.py    # NEW - the per-fold aggregation

method: >-
  Three parts, none of which spends GPU.
  (1) STAGE MAP at deployed file:line. Read the deployed support-pack predictor - verified by
  sha256 to be the 1047-line program, not the 677-line vendored one (FACT-0408) - and the built
  notebook's own filter_output_graph. For every stage record what it reads, what it writes,
  whether it can overwrite a parent choice made upstream, and whether any learned score reaches
  it. Cross-check the chain across four built notebooks by hashing each function body, so a
  claim about "the deployed chain" is not a claim about one build.
  (2) DEMONSTRATION. Perturb ONLY the pre-ILP parent choice - promote the P30/P34 candidate
  sidecar's runner-up source to be the parent, carrying the deployed edge's own probability, so
  the ILP objective and the relink bonus both see an equally confident commitment - then replay
  the COMPLETE deployed chain on CPU and inspect the emitted graph. The control arm must
  reproduce the kernel's own run_stats exactly on the fifteen columns p28_full_chain_replay
  compares, or the run is refused. Attribute every forced choice to exactly one bucket, node
  loss first so category 2 and category 5 cannot both claim it.
  (3) SUCCESSOR FALSIFIER, written before any successor work begins.

budget:
  gpu_sessions: 0
  submissions: 0
  wall_clock: one CPU session


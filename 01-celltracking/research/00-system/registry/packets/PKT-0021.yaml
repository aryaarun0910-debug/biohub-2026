id: PKT-0021
title: "LEVER-0025: metric-legal division reach + targeted daughter steal (FACT-0295) - census, oracle ceiling, GT-free rule on the champion controls"
lever: LEVER-0025
owner: primary
lock: claimed
opened: '2026-08-27'

claim: >-
  Using the scorer's real acceptance window (fork at the divider or its predecessor; daughter evidence
  from child or grandchild) and stealing the second daughter from a parent edge that cannot be a GT
  edge converts unscored-but-reachable GT divisions into true positives on both folds, and a GT-free
  version of the rule keeps enough of that to clear +0.003 on fold 1 at zero edge cost.

falsifier: >-
  Stage A: the committed census must reproduce FACT-0295 (metric-legal reach 80/125 f1, 23/26 f0; steal
  frees 24 -> 51 f1, 6 -> 19 f0) within +-2 per count, else the premise is wrong and the lever closes.
  Stage B: the GT-guided oracle round-trip on the champion controls must be >= +0.003 score on fold 1
  AND >= 0 on fold 0; below that even perfect targeting cannot pay through the scorer and the lever is
  killed as a post-processing lever. Stage C: a GT-free rule replayed on the same exports must be
  >= +0.003 (f1) and >= 0 (f0) paired, with adj_edge not worse than -0.0005 on either fold; else killed.
  Both embryo directions reported at every stage. No submission until stage C passes.

prediction: >-
  Stage A reproduces (the counts came from the scorer's own function). Stage B oracle: +0.003..+0.008
  on fold 1, +0.003..+0.010 on fold 0 (the fold-0 division term is coarse: 26 GT divisions). Stage C:
  30-60% of the oracle; the risk is precision - the proposer emits ~6k forks against 15-51 positives
  (FACT-0294), so any relaxation of the orphan condition must be gated hard or it breaks scored
  edges at scale. The lower halves of the bands are the more likely outcome.

inputs:
  facts: [FACT-0295, FACT-0290, FACT-0291, FACT-0294, FACT-0322, FACT-0323, FACT-0325]
  artifacts:
    - C:/temp/p20_relink_sweep_f0/sweep_pen_off.csv.gz     # clean fold-0 champion export (EXP-0022 control)
    - C:/temp/p19_relink_sweep_f1/sweep_pen_off.csv.gz     # clean fold-1 champion export (EXP-0021 control)
    - C:/temp/p20_relink_sweep_f0/atlas/, C:/temp/p19_relink_sweep_f1/atlas/   # scorer-exact tables
    - data/train/*.geff
  code:
    - scripts/win_bet/div_reach_steal.py     # census / oracle / rule (this packet's instrument)
    - scripts/win_bet/ea_atlas.py            # scorer-exact round-trip
    - vendor/kaggle-cell-tracking/src/tracking_cellmot/division_metrics.py   # the acceptance rule itself

method: >-
  Stage A: per GT division, classify parent-side and daughter-side matches with the scorer's own
  match_divisions/_matched_division_nodes, tabulate naive vs metric-legal reach and the second
  daughter's current parent (orphan / wrong parent / the mother). Stage B: apply GT-guided edits to the
  export (remove the wrong parent edge, add mother -> daughter; t-1 / t+2 routes where the divider or
  daughter is unmatched), write a CSV, score with ea_atlas + summarise on all crops, paired against the
  control. Stage C: replay the deployed proposer's gates (coupled_division_transplant.py) with the
  orphan condition relaxed under explicit, GT-free conditions; score the same way. CPU only.

budget:
  gpu_sessions: 0
  submissions: 0
  wall_clock: 2-5 CPU-hours (ea_atlas is ~3-5 min per arm per fold)

forbidden:
  - any Kaggle launch or submission
  - fitting the GT-free rule on one fold and reporting it on the same fold without the other direction
  - reading the four visible test movies
  - the deployed spec

outputs:
  evidence: C:/temp/div_reach/ (outside git) and _evidence/div_reach/summary.json
  facts_added: []          # stage A census, stage B oracle, stage C rule - one FACT each
  record: >-
    One section in research/06-knowledge-system/experimental-records.md under 2026-08-27 (day)

result: >-
  STAGE A DONE 2026-08-27 (FACT-0333): committed census reproduces FACT-0295 in structure - legal reach 23/26 (f0) and
  84/125 (f1); 17 / 61 unscored-but-legal divisions are recoverable by a fork plus at most one steal, 12 / 38 need a
  steal, and in no case is the stolen edge a scored TP. Prediction record: the +-2 tolerance fired by +2/+3 on fold-1
  reach (window vs global matching in the uncommitted original); the premise is confirmed, not refuted.
  STAGE B DONE (FACT-0334): the GT-guided oracle is +0.0192 (f0, CI +0.0116..+0.0272) and +0.0133 (f1, CI
  +0.0098..+0.0170), division FP unchanged, edge term improved on both folds - the stage-B bar (>= +0.003 f1, >= 0 f0)
  is cleared by a wide margin. The oracle band pre-registered above (+0.003..+0.008 f1) was EXCEEDED. Adversarial
  audit of the instrument requested the same day. STAGE C DONE 2026-08-27 (FACT-0337): the steal does NOT survive GT-free (precision ~0; the deployable rule
  scores -0.0141/-0.0076), and the orphan sub-lane is +0.0013 (f1) / -0.0003 (f0), below the +0.003 bar. LEVER-0025
  PARKED, not killed - the oracle ceiling stands and needs a LEARNED triple scorer (LEVER-0002) to be reached. The
  FP-endpoint anatomy done alongside opened LEVER-0026 (a +0.065/+0.096 GT-guided ceiling in the adj_edge term).
  Instrument tests/test_div_reach_steal_adversarial.py (23) confirm the oracle is scorer-exact and conservative.

id: PKT-0038
title: "AGENT 3 - the association model tournament, trained from a contract we own. The primary 0.950 lane"
lever: LEVER-0041
owner: agent-3-tournament
lock: claimed
opened: '2026-08-30'

why_this_is_not_a_second_lock: >-
  PKT-0034 held LEVER-0041 and closed `done` on 2026-08-30, having delivered the harness rather than run the
  experiment. R6 counts only `claimed` and `running`, so this is the lever's only live lock. The split is
  deliberate: one packet built the instrument, this one runs the tournament through it, and the instrument's
  untested falsifier (a) - the cache gate - is inherited here because this is the packet that first uses a
  real cache.

claim: >-
  A parent scorer trained from a feature contract we own, selected on fold 1 and applied FROZEN to fold 0,
  beats the deployed argmax on contested targets and converts that into net true edges through the complete
  unchanged chain.

falsifier: >-
  Inherited from LEVER-0041 and not relaxed. (a) It does not beat the deployed contested top-1 with a
  favourable paired interval on the DISCOVERY fold. (b) It beats contested top-1 while regressing
  single-candidate targets, which abstention makes possible for the first time. (c) Ranking improves but net
  true edges through the COMPLETE chain do not - the genuine FACT-0376 quantity, not the pre-ILP proxy.
  (d) The gain is a count-adjustment artifact. (e) The frozen model does not transfer to fold 0.
  (f) The FACT-0382 condition: the full-chain comparison is (widened surface + scorer) against the DEPLOYED
  control, never against a widened control.
  ADDED HERE, AND IT IS THE ONE MOST LIKELY TO BITE: (g) the tournament produces a winner by SELECTION
  RATHER THAN SKILL. Five model classes with hard-negative mining over one discovery fold is a large search,
  and the whole point of freezing on fold 1 and applying to fold 0 is that fold 0 then measures what
  survived selection. If the fold-0 result is materially worse than the fold-1 result, the honest reading is
  that the tournament fitted the discovery fold - not that fold 0 is unlucky.

prediction: >-
  Stated before any training. FACT-0386 measured representation-free rerankers capturing about 2% of the
  contested-parent ceiling, and its positive content is that the representation, not the head, was the
  constraint - so contextual features should do better than that or the diagnosis was wrong. I expect the
  contextual head to beat the linear and tree controls on fold 1, and I expect the honest fold-0 transfer to
  be SMALLER than the fold-1 figure, because that is what selection on one surface usually costs. The
  quantity I most expect to disappoint is (c): FACT-0364 says motion relink replaces the solver's edge list
  wholesale, so a better pre-ILP ranking has a documented history of not surviving to the final graph.

inputs:
  facts: [FACT-0388, FACT-0386, FACT-0382, FACT-0376, FACT-0364, FACT-0371, FACT-0392, FACT-0378]
  artifacts:
    - C:/temp/p34_f1/                       # the audited fold-1 substrate - the discovery surface
    - C:/temp/p30_f0/                       # the fold-0 promotion gate
    - _evidence/audit/receipts/f1_p34.json
  code:
    - scripts/win_bet/assoc_train_harness.py    # the harness; use it, do not fork it
    - scripts/win_bet/assoc_parent_dataset.py   # the frozen surface and label contract
    - scripts/win_bet/assoc_report.py           # the only promotable summary

method: >-
  FOLD 1 IS THE DISCOVERY SURFACE, FOLD 0 IS THE GATE, and they are never swapped. FACT-0388 is the reason:
  fold 1 carries 7,757 contested errors against fold 0's 691, so an effect that is invisible on fold 0 can
  be measured on fold 1 - and fold 0's 691 was already small enough that FACT-0386's best arm moved 12 with
  churn 40 and no favourable interval.
  TOURNAMENT, all five on the SAME data contract so the comparison is real: calibrated linear/listwise
  control, tree ranker, contextual transformer/HOCT-style head, bidirectional head, and an alternate-seed
  secondary head. The last two exist so CONSENSUS becomes cleanly measurable later under FACT-0378 - the
  public configuration's secondary saw all 199 movies and is therefore un-validatable offline, so a
  consensus claim needs fold-specific secondary heads of our own.
  Explicit null/abstain class throughout. Hard negatives mined ITERATIVELY - wrong nearby parents,
  high-confidence substitutions, motion-consistent errors, and division-producing mistakes - with each
  round's mining set recorded so the curriculum is reproducible rather than emergent.
  SELECTION DISCIPLINE: freeze architecture AND calibration on fold 1, then apply unchanged to fold 0. No
  refitting, no threshold nudging, no per-fold calibration. Models are compared by CONVERTED TRUE EDGES and
  full-chain raw association, never by training loss.

host_direction_2026_08_30: >-
  THIS IS THE PRIMARY SCORING LANE AND IT MUST DELIVER CHECKPOINTS AND FULL-FOLD RESULTS, NOT ANOTHER
  ARCHITECTURE REPORT. Four constraints added by the host:
  (1) DO NOT WAIT ON PUBLIC HOCT WEIGHT COMPATIBILITY. PKT-0029 is a parallel compatibility test, not a
      dependency. Train from a contract we own.
  (2) CACHE BOTH PLAUSIBLE TRUNKS IN EACH FOLD ACQUISITION, so trunk provenance can never invalidate a null
      (FACT-0392's third risk).
  (3) PIPELINE, DO NOT BATCH. Training begins as soon as the FIRST usable fold cache lands - do not wait for
      every downstream document, and do not spend both GPU slots on acquisition simultaneously if that
      leaves nothing training behind them.
  (4) ITERATE ON REPRESENTATION, NOT THRESHOLD GRIDS. FACT-0386 already established that the head is not the
      constraint; a threshold sweep would re-answer a question that is closed.
  The first genuinely new model passing the honest fold-0 gate receives the standing seam-calibration
  submission BEFORE further polishing - PKT-0036 releases it.

budget:
  gpu_sessions: 2   # Slot A fold-1 cache then training; Slot B fold-0 cache then the complementary head
  submissions: 0    # the seam-calibration slot is PKT-0036's to release, not this packet's to spend
  wall_clock: 3-5 days

forbidden:
  - launching any GPU job before PKT-0037 certifies the foundations AND Gate 1 passes with a PKT-0036 receipt
  - training on any cache whose manifest does not bind trunk, fold, embryo, normalisation, node ordering,
    candidate parameters and commit
  - refitting or recalibrating on fold 0 after freezing on fold 1 - that destroys the only honest transfer
    measurement this packet has
  - reporting any summary not produced by scripts/win_bet/assoc_report.py
  - reading an association gain as division recovery (FACT-0371)
  - claiming LEVER-0034 or LEVER-0040, or editing PKT-0029, PKT-0035, PKT-0036 or PKT-0037
  - making or requesting a submission
  - .claude/settings.json or .gitignore
  - staging or committing to git - the primary agent commits explicit paths per packet

outputs:
  evidence: C:/temp/assoc_tournament/ and _evidence/assoc/tournament/
  facts_added: []
  record: >-
    One compact row in research/06-knowledge-system/experimental-records.md

result: >-
  INTERIM - the lock stays `claimed` because arm 3 and the whole full chain are outstanding. What is
  DELIVERED is a checkpoint and full-fold results on BOTH folds, CPU only, zero GPU, zero submissions.

  THE DISCOVERY FOLD ANSWERED YES, AND IT IS NOT BINNING. On the complete widened P34 fold-1 surface
  (all 128 crops, all 91,410 decidable targets, crop-grouped 5-fold, out-of-fold only) SIX of seven
  arms beat the deployed contested top-1 of FACT-0388 with a crop-paired ci95 that excludes zero on
  the favourable side. Best: A4.bidir.tree, contested top-1 0.762227, delta +0.053833, gained 2316 /
  lost 884 / net +1432 / churn 3200, ci95 [+0.04687, +0.06150]. Ladder: linear +0.027330 <
  tree +0.041841 < bidirectional +0.053833, so the CONTEXT the bidirectional columns add is worth
  more than the head class - which is the direction FACT-0386 predicted when it found the head was
  not the constraint. The iterative hard-negative curriculum did NOT help on either base
  (A2m -0.001128 against A2, A4m -0.000827 against A4): it moves far more targets (churn 3944 against
  3200) and nets slightly fewer, so mining is REJECTED on this surface as a representation change.
  THE NOISE FLOOR WAS MEASURED ON THIS SURFACE RATHER THAN INHERITED, and this is what makes the
  number readable. FACT-0386's fold-0 caution was that a tree given ONLY the deployed probability
  still posted +0.0014 by quantile binning, about half its best arm's net. Re-run on fold 1 the same
  control posts delta -0.001391, net -37, churn 315 - the floor here is NEGATIVE, so no part of
  +0.053833 is binning and the honest gain is if anything slightly larger than the raw delta. Its
  paired instrument check passed exactly: a LINEAR model on the probability alone returned the
  deployed contested top-1 to all 16 digits with churn 0, which is the only arithmetically possible
  outcome for a correct protocol and is asserted, not merely reported (`noisefloor` REFUSES if it
  fails).

  THE GATE SAID NO, AND IT SAID IT TWICE - FALSIFIER (e) FIRES. The winner was frozen on fold 1 by
  the declared rule before fold 0 was touched, pickled and pinned by sha256, and applied.
    GATE_A, architecture transfer (identical recipe REFITTED out of fold on fold 0's own crop-grouped
      splits - the FACT-0386 protocol, so no cross-checkpoint issue exists): contested top-1
      0.8337743565070964, delta EXACTLY 0.000000, gained 36 / lost 36 / churn 72, ci95
      [-0.00355, +0.00347]. It genuinely reshuffled 72 targets and netted nothing.
    GATE_B, weight transfer (the fold-1 fit applied with NO fold-0 fitting of any kind; FrozenTransferHead.fit
      is a counted no-op): contested top-1 0.817176, delta -0.016599, gained 133 / lost 202 / net -69,
      ci95 [-0.02699, -0.00586] - EXCLUDES ZERO ON THE WRONG SIDE. This is NEGATIVE transfer, which is
      strictly stronger than no transfer.
  So the packet's falsifier (e) fires as written, and (g) cannot be excluded. Two candidate readings
  and this experiment CANNOT separate them, which is itself the finding: (i) the tournament fitted the
  discovery fold; (ii) the transfer crosses more boundaries than the packet named. On (ii) - VERIFIED
  by source read of the two acquisition logs, not inferred - the P30 fold-0 run used
  `split_0/edge_predictor_best.pth` (C:/temp/p30_f0/biohub-p30-acquisition-f0.log) while the P34
  fold-1 run used `loeo_weights/edge_predictor.pth` built from `split_1.pth (sha256 2e4ebf616b3d4fb5)`
  (C:/temp/p34_f1/kernel.log). The `prob` feature - the dominant one - is emitted by a DIFFERENT
  CHECKPOINT on each fold, so GATE_B is cross-embryo AND cross-edge-predictor by construction of the
  LOEO protocol. That does not rescue the arm: GATE_A removes the checkpoint difference entirely by
  refitting, and still returns exactly zero.

  SIDE (b) DOES NOT FIRE, AND IT WAS MADE LIVE RATHER THAN ASSUMED. With preservation OFF - the only
  mode in which the null is available to single-candidate targets, so the bar is two-sided for the
  first time - the abstaining arm abstained on 4,741 contested targets and on ZERO of the 64,809
  single-candidate targets, with 0 regressions listed. The whole cost of abstention lands where it
  should. The abstaining arm's contested top-1 falls to 0.653434 because an abstention is scored as an
  error there; that is the price of the null, not a ranking failure.

  CONSENSUS IS MEASURABLE NOW AND THE HEADROOM IS THIN. FACT-0378 makes the public secondary
  un-validatable offline, so fold-specific secondaries of our own were the precondition. The
  alternate-seed secondary (different seed, 0.7 row bootstrap) lands at 0.762189 against the primary's
  0.762227 and they agree on 97.95% of contested targets: both correct 20,003, both wrong 6,053,
  primary-only 273, secondary-only 272. Oracle-of-the-two 0.772452, i.e. a PERFECT consensus rule
  could buy at most +0.010 over the primary, and top-1 where they agree is 0.767693 against 0.762227
  pooled - so agreement is a usable abstention trigger but a weak one. Diversity, not the rule, is the
  binding constraint on the consensus route.

  WHAT IS NOT ESTABLISHED, EXPLICITLY. Falsifiers (c), (d) and (f) are UNMEASURED and no CPU work can
  measure them: parent_conversions is PRE-ILP, FACT-0364 says motion relink replaces the solver's whole
  edge list at a median 99.9% coverage, and the genuine FACT-0376 quantity is final-graph edge TP/FP/FN
  from a replay. Every verdict this packet emits therefore carries `promotable: false` from
  assoc_report, and the seam-calibration slot is NOT earned - it requires passing the honest fold-0
  gate, and fold 0 fails at the ranking stage before the chain is ever reached. Nothing here is read as
  division recovery (FACT-0371). Arm 3, the contextual/HOCT-style head, has never run: it is blocked on
  a licensed cache and is now wired for BOTH plausible trunks per fold.

  TWO DEFECTS IN OUR OWN INSTRUMENT WERE FOUND AND FIXED, AND THEY WERE THE SAME DEFECT.
  `assoc_train_harness.resolve_callable` imports this driver BY NAME, so a scripted run has two module
  objects - `__main__` and `assoc_tournament` - with two sets of module state. (1) SILENT: the mining
  curriculum was appended to one copy and serialised from the other, so the first discovery payload
  carried `"mining_curriculum": []` while claiming to record it. (2) LOUD: `bind_frozen_model` bound
  the `__main__` class while the harness constructed the imported one, and `apply` refused with "no
  frozen model bound" - the fail-closed constructor is the only reason this surfaced as a refusal
  instead of a transfer arm that quietly refit itself, which would have destroyed the one honest
  measurement this packet exists to make. Both now route through one `_module_copies()` helper,
  `run_fold` REFUSES to write an empty curriculum when a mining arm ran, and both defects are planted
  and caught by tests. This is AGENTS.md's "does the state cross a process, thread or replica
  boundary?" one boundary in from FACT-0060.
  The re-run after the fix reproduced the pre-fix payload EXACTLY: every arm's contested top-1,
  gained/lost/net/churn, interval and calibration are bit-identical across two independent end-to-end
  runs; the only differences anywhere are two 1-ulp float-summation drifts in a descriptive margin mean.

  TWO INHERITED CORRECTIONS, BOTH CLOSED AND VERIFIED.
  (1) The fold-1 evaluation surface was being read from C:/temp/audit_receipts/ - PKT-0036's audit
      scratch. It is now materialised at C:/temp/p34_f1/assoc_targets_split1.parquet, verified
      byte-identical (sha256 798e17cd7e2d7df7...), recorded into every payload by
      `surface_provenance`, and `load_surface` REFUSES any path containing `audit_receipts`.
  (2) `scripts/win_bet/assoc_specs/harness_f1.json` named the DEPLOYED surface. Re-measured before
      repointing: C:/temp/assoc/f1.parquet has 2,162,040 rows, max 1 candidate per target, ZERO
      contested targets and prob_min exactly 0.5000, so contested top-1 is 1.0 by arithmetic and it
      cannot falsify a ranker. It now names the widened P34 table (3,704,355 rows, max 4 candidates,
      26,601 contested, prob_min 0.1000). The harness's own refusal fires BEFORE any fit
      (assoc_train_harness.py:1037), so the guard is exercised rather than trusted.

  CANDIDATE FACTS FOR THE PRIMARY AGENT - this packet may not write facts.yaml. Every number above is
  MEASURED, complete-fold, out-of-fold, crop-grouped, by committed code, with payloads at
  _evidence/assoc/tournament/ and C:/temp/assoc_tournament/. The three worth recording are the fold-1
  discovery ladder with its measured negative binning floor, the two-sided fold-0 gate result, and the
  consensus diagnostic.

  ARTIFACTS. Checkpoint _evidence/assoc/tournament/frozen_fold1_model.pkl (sha256 pinned in
  frozen_selection.json). Payloads: discovery_fold1.json, noisefloor_fold1.json, sideb_fold1.json,
  consensus_fold1.json, gate_fold0.json, blocked_arms.json. Instruments:
  scripts/win_bet/assoc_tournament.py (driver, uses the PKT-0034 harness and does not fork it),
  tests/test_assoc_tournament.py (30 contracts, each planting the violation it guards).

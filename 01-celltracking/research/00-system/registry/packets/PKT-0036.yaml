  fold-0 evidence, so that the moment P33 or P34 lands the audit is a command rather than a design exercise.
  Verify every premise at file:line or by rerunning committed code. Where a check needs a script it goes in
  scripts/win_bet/ and fails closed, with a positive heartbeat whose ABSENCE is the alarm.

budget:
  gpu_sessions: 0
  submissions: 0
  wall_clock: continuous through the cycle

forbidden:

id: PKT-0036
title: "AGENT 4 - landing audits and launch control, with veto over every downstream launch"
lever: null              # an auditor holds no hypothesis - see `why_no_lever`
owner: agent-4-release-auditor
lock: claimed
opened: '2026-08-29'

why_no_lever: >-
  Same reason PKT-0033 held none: an auditor that owns a hypothesis has a stake in the answer. R6 permits a
  null lever, which is also the mechanical reason this packet cannot collide with PKT-0029 (LEVER-0034),
  PKT-0034 (LEVER-0041) or PKT-0035 (LEVER-0040).

scope_extension_2026_08_30: >-
  EXTENDED to RELEASE AUDITING, keeping the pending P33 audit. Added: bind every submission artifact into a
  receipt joining notebook, weights, manifest, graph and predicted score; detect row-order dependence, empty-
  band success, graph-id drift, cross-fold leakage and code-version mixing; and ENFORCE THE SEAM-CALIBRATION
  EXCEPTION - exactly one standalone submission for the first genuinely new model class that passes the
  honest fold-0 gate. That slot is this packet's to release and no other packet's to spend.
  FIRST DUTY: the champion transition. FACT-0393 records submission 55871868 at 0.931, above the 0.928 P24
  champion, but the champion of record stays P24 until this packet issues a release receipt binding the
  artifact together. Baseline relocation is not capability, and the receipt is what makes the relocation
  auditable rather than assumed.

authority: >-
  VETO OVER DOWNSTREAM LAUNCHES (host, 2026-08-29). No feature cache, no fold-1 surface materialisation and
  no training run proceeds on an artifact this packet has not passed. A veto is exercised by recording a
  FAIL receipt naming the condition and the evidence; it is not a matter of opinion and it is not overridden
  by a passing heartbeat elsewhere. The authority runs one way - this packet can stop a launch, and cannot
  authorise one that a gate did not license.

claim: >-
  Every artifact this cycle consumes carries a pass/fail receipt naming the condition it met, the evidence
  that shows it, and the commit it was produced at - so no scientific claim downstream rests on an artifact
  whose provenance was assumed.

falsifier: >-
  Inverted, as PKT-0033's was: this packet fails if it issues a PASS without having exercised the named
  condition, or if it reports a clean audit without saying what it ran that would have caught a failure.
  "The heartbeat was present" is not an audit of the thing the heartbeat describes. An empty grep is not
  evidence - ripgrep -E means --encoding, and _evidence/ and artifacts/ are gitignored and skipped silently
  by default.

audit_targets:
  p33_gate1: >-
    EXP-0041, on landing. All six preregistered conditions, and the crop-count requirement is EXTERNAL by
    construction: the kernel's all_passed does NOT assert two crops, so a report with a crop count other
    than 2 is a FAIL regardless of what all_passed says. Also confirm the verify phase ran as a separate
    process, that band B compared a non-zero number of sub-threshold pairs, and that node-count mismatches
    are empty. Record the known blind spot - a uniform per-frame source shift is invisible to this gate - as
    a limit on what the PASS licenses, not as a failure.
  p34_acquisition: >-
    EXP-0039, on landing. Champion graph parity against the P28 fold-1 control; ECB patch heartbeat with one
    export line per crop and no zero-export crop; deployed candidate reconstruction; stable node IDs;
    cross-run node ordering against the 2026-08-19 preilp_f1_v2 export via
    scripts/win_bet/preilp_crossrun_stability.py; then the fold-1 contested census, INCLUDING the outcome
    where fold 1 remains too thin to falsify a ranker, which PKT-0030 falsifier (e) named in advance.
  leakage: >-
    Independently verify every training split and cache manifest produced by PKT-0034 and PKT-0035 for
    embryo leakage. Trace the subtle routes, not only the declared ones: fold-wide statistics reaching a
    feature, hyperparameters selected on the judged fold, and checkpoints whose provenance is not
    split-specific. FACT-0378 is the precedent.
  version_coherence: >-
    Confirm no running or landed artifact mixes commits or code versions - that the built notebook, the spec,
    the patch sources and the committed tree agree, and that a fetched result names the kernel version it
    came from.
  report_completeness: >-
    REJECT any model result missing raw association, the count-adjustment contribution, node recall, or
    division TP/FP/FN. A summary not produced by scripts/win_bet/assoc_report.py is not a result.


  one GPU session, no submission, deployed output unchanged.

  STANDING: the known blind spot of any FUTURE pass is unchanged and must be recorded with it - the
  gate compares post-softmax probabilities over the SOURCE axis, so a uniform per-frame source shift
  is mathematically invisible to it.

id: PKT-0003
title: Division stage 2 - a learned selector, not a relaxation
lever: LEVER-0002
owner: primary
lock: running
opened: '2026-08-25'

claim: >-
  Keeping the bijection and adding divisions as a learned STAGE 2 recovers part of the
  structurally unreachable division score (FACT-0034).

falsifier: >-
  Must beat the P9 division mechanism end-to-end on a scored submission. Note that blanket
  out-degree<=2 already scored -0.0081, so a relaxation is NOT the mechanism - anything that
  merely loosens gates is refuted before it starts.

inputs:
  facts: [FACT-0034, FACT-0080, FACT-0082, FACT-0083, FACT-0084]
                            # WARNING: FACT-0034 is UNVERIFIED. Re-derive the divJ ceiling
                            # before building on it. FACT-0083 bounds a selector over the
                            # CURRENT candidate set at ~19% division recall.
  artifacts: []
  code: []

method: >-
  Not started. STEP 0 is now cheaper and comes first: find where the 23 divisions present
  pre-ILP (FACT-0083) but absent from the scored output are destroyed. That is a CPU-only
  diff over the atlas already on disk, needs no model, and its result bounds everything
  downstream. Only then re-verify FACT-0034 and design the joint scorer. hengck23 (discussion/726924) names the
  architecture; a CC0 corpus of 165,267 labelled divisions exists for PRETRAINING ONLY -
  its division rate is inflated 4.07% vs 0.26% and embryo heterogeneity is not modelled.

budget:
  gpu_sessions: 0
  submissions: 0
  wall_clock: unscoped

forbidden:
  - loosening out-degree gates and calling it a selector
  - adding another AND-gate to the P9 chain; the conjunction is the thing being replaced

outputs:
  evidence: null
  facts_added: []
  record: one row in experimental-records.md

result: >-
  STEP 0 DONE 2026-08-25. Localised where the divisions die between the pre-ILP graph and the
  scored output (scripts/win_bet/division_loss_diff.py). Of the 24 held upstream:
  14 fork_collapsed (FACT-0090), 9 node_lost (FACT-0091), 1 still held, 0 both-edges-lost.
  .
  The 14 are the prize: every endpoint still detected, exactly one daughter edge kept, lost
  purely because linear_sum_assignment cannot express out-degree 2. Recoverable by changing
  association STRUCTURE alone. The 9 node_lost are a DIFFERENT lever (detection/filtering)
  and are not fixed by the same change - do not conflate them.
  .
  Headline (FACT-0092): the pipeline collapses 14 real forks and then emits 6,303 fabricated
  ones to hit 1. Fix the destruction before tuning the fabrication.
  .
  STEP 1 DONE 2026-08-25. The collapse is motion_relink_edges at built-notebook cell 6:487
  (FACT-0093, VERIFIED) - a POST-PROCESS gated on OUTPUT_MOTION_RELINK, not the ILP and not
  the model. Its cost at cell 6:486 already carries the learned edge probability, so the
  joint scorer's input was already plumbed in.
  .
  STEP 2 BUILT, NOT LAUNCHED: EXP-0018 gives each source a second, PRICED row so the solver
  selects divisions instead of collapsing them. 38 contract tests pass including exact
  reproduction of the champion when disabled. Launch needs a free GPU slot and host
  authorisation.
  .
  NEXT: the penalty value is an unmeasured guess. Prefer buying the whole penalty CURVE in
  one run (the relink is cheap post-processing) and scoring it offline via LOEO, rather than
  spending a submission per point - the exact mistake the detection arms just made.
  .
  LIMITATION: the atlas carries a pre-ILP frame for fold 1 only, so this diff could not be
  run for fold 0. The contract requires both embryo directions; fold 0 is unmeasured here.

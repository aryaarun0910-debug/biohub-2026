id: PKT-0037
title: "AGENT 1 - upstream foundations: no cache launches until a null could be interpretable"
lever: null              # infrastructure, not a hypothesis
owner: agent-1-foundations
lock: claimed
opened: '2026-08-30'

why_no_lever: >-
  This packet moves no score and tests no hypothesis. It removes the ambiguities that would make a NULL
  RESULT uninterpretable downstream - which is the expensive failure, because a null from an ambiguous cache
  cannot distinguish "the head does not work" from "we fed it the wrong features". R6 permits a null lever.

scope_rescope_2026_08_30: >-
  RESCOPED BY THE HOST AFTER A SECOND GPU SESSION WAS LOST TO ENVIRONMENT DISCOVERY (FACT-0397). This packet
  is no longer "upstream foundations" in general; it owns LAUNCH INFRASTRUCTURE, and its deliverable is ONE
  REUSABLE PREFLIGHT SYSTEM that runs before every Kaggle GPU job:
    - a CENTRAL bounded dataset resolver, so no experiment ever carries its own mount path again;
    - a Kaggle CPU PREFLIGHT using the exact datasets, notebook, patches and subprocess command;
    - verification of imports, file discovery, EXPECTED CROP COUNT, schemas, writable output, model paths
      and patch heartbeats;
    - the worker run in --preflight-only mode THROUGH THE REAL SUBPROCESS BOUNDARY, because both Gate 1
      failures lived at boundaries a same-process check cannot see;
    - a signed receipt carrying resolved paths, input hashes, crop names, code commit and expected GPU
      outputs;
    - EXACT POSITIVE COUNTS - "non-empty" is insufficient, and FACT-0394 is why: a band that compared
      nothing passed every non-empty test it had;
    - unified queue-fetch and factory-output artifact discovery, with P24 and P32 regression fixtures for
      BOTH conventions - the two-convention split is what produced the false FAIL corrected in FACT-0396.
  P33 attempt 3 receives GPU ONLY after this preflight passes against the exact built notebook. One
  environment failure after that stops the mechanism until it is reproduced locally. No fourth speculative
  kernel.

authority: >-
  TERMINAL GATE ON GPU. No feature cache launches until this packet certifies that every ambiguity capable
  of making a null uninterpretable has been removed. That is a hard precondition on Slot A and Slot B, and
  it sits upstream of PKT-0036's release veto rather than replacing it.

claim: >-
  Every cache this campaign trains on can be bound, after the fact and by an independent command, to the
  trunk that produced it, the fold and embryo it belongs to, the normalisation and candidate rule it used,
  and the exact notebook and commit that ran - so that a null result is attributable to the model rather
  than to the substrate.

falsifier: >-
  (a) The band-A non-vacuity fix does not actually fire - if a crop with zero shared band-A pairs still
      passes the in-kernel gate, the fix is decorative and the gate can still certify nothing;
  (b) the fold-hygiene fix does not close the inherited-setting route - if a fold-1 spec that inherits its
      fold from a base notebook is still skipped rather than checked, the hole Agent 4 measured (12 checked,
      54 skipped) remains and the fold-1 cache run is built through it;
  (c) the dual-trunk acquisition cannot be made to produce both trunks in ONE session - if it cannot, then
      FACT-0392's third risk stands and any HOCT null remains confounded with trunk identity;
  (d) the independent audit command does not FAIL on a deliberately swapped trunk, reordered nodes, an empty
      probability band, or wrong-fold weights. A checker that has not been shown to reject is not a checker.

prediction: >-
  Stated before the work. (a) and (b) are small and I expect them to hold. (d) is where the real work is and
  where I expect the surprises, because each of the four mutations has to be MANUFACTURED to prove the
  checker rejects it - and manufacturing a convincing swapped-trunk cache is harder than checking one.
  (c) is the one that could genuinely fail on cost rather than correctness: two trunks in one session
  doubles the feature pass, and if that does not fit the session budget the honest answer is to say so and
  propose the sequential alternative with its confound stated, not to quietly cache one.

inputs:
  facts: [FACT-0387, FACT-0390, FACT-0391, FACT-0392, FACT-0382, FACT-0378, FACT-0369]
  artifacts:
    - C:/temp/p33_v2/                       # Gate 1 attempt 2 output, when it lands
    - C:/temp/p30_f0/                       # the fold-0 reproduction target
    - C:/temp/p34_f1/                       # the fold-1 substrate, audited
    - C:/temp/hoct/code/                    # publisher source, for the candidate rule
  code:
    - scripts/kaggle_edits/assoc_feature_parity.py
    - tests/test_loeo_weights_hygiene.py
    - scripts/win_bet/audit_p33_gate1.py
    - scripts/win_bet/assoc_train_harness.py

method: >-
  CPU only, and in this order because each step gates the next.
  (1) BAND-A NON-VACUITY IN-KERNEL. The gate currently floors band B only, so a crop whose band A compared
  nothing passes conditions (3) and (4) having verified nothing. The floor is per-crop, so an uncapped run
  is not immune. Add it, and prove it fires.
  (2) FOLD HYGIENE. tests/test_loeo_weights_hygiene.py reads the fold from the spec env, so a spec inheriting
  its fold from a base notebook is skipped. Resolve the EFFECTIVE fold - spec env first, then the base
  notebook - and check every spec rather than the ones that happen to declare it.
  (3) DUAL-TRUNK ACQUISITION in one session, so trunk identity is never confounded with contract error.
  (4) CACHE BINDING. Every cache carries, in a manifest beside it: trunk checkpoint sha256 and provenance,
  fold and embryo, feature normalisation, node ordering and ids, candidate-graph parameters, and the notebook
  and source commit that produced it.
  (5) THE INDEPENDENT AUDIT COMMAND, which must be shown to REJECT a swapped trunk, reordered nodes, an
  empty band and wrong-fold weights - each demonstrated by mutation, not asserted.

budget:
  gpu_sessions: 0   # this packet does not launch; it decides whether launching is interpretable
  submissions: 0
  wall_clock: 1 day

forbidden:
  - launching a GPU job, pushing a kernel, or making a submission
  - modifying scripts/kaggle_edits/assoc_feature_parity.py WHILE P33 v2 IS RUNNING - that would break the
    version-coherence chain PKT-0036 verified, and the running kernel's code would no longer be the
    committed code. Prepare the fix; apply it only once P33 has landed and been audited.
  - claiming any lever, or editing PKT-0029, PKT-0035, PKT-0036 or PKT-0038
  - running pytest concurrently with another agent - see the 2026-08-30 registry race; the planting lock
    now serialises the registry suite, but confirm before assuming
  - .claude/settings.json or .gitignore
  - staging or committing to git - the primary agent commits explicit paths per packet

outputs:
  evidence: C:/temp/foundations/ and _evidence/foundations/
  facts_added: []
  record: >-
    One compact row in research/06-knowledge-system/experimental-records.md

result: >-
  FOUNDATIONS ARE **NOT YET** CERTIFIED, AND EXACTLY ONE ITEM REMAINS - APPLYING A PATCH THAT IS
  ALREADY WRITTEN, TESTED AND PROVEN BY MUTATION. Tasks 2, 3, 4 and 5 are complete and green;
  task 1 is complete as a change set but is deliberately UNAPPLIED because P33 v2 was still
  RUNNING at every check this session (kaggle_factory status, 2026-08-30). Applying it would have
  broken the version-coherence chain this packet forbids breaking.

  (1) BAND-A NON-VACUITY - PREPARED, PROVEN, NOT APPLIED. The gate floors band B at
  b_checked > 0 but nothing floors band A, so a crop whose band A compared nothing satisfies
  every band-A condition trivially and is reported passed
  (scripts/kaggle_edits/assoc_feature_parity.py:232-262). The defect is not hypothetical and did
  not need manufacturing: the repo own green test
  tests/test_assoc_feature_parity.py::test_gate_passes_when_the_cache_is_faithful ALREADY runs a
  crop whose band A compares ZERO pairs - every stub probability is 1/3, nothing clears the
  deployed 0.5, and the pre-ILP fixture therefore records no band-A edge - and asserts
  all_passed is True. Measured by running both workers against the identical fixture: committed
  all_passed=True with band A recorded 0 and reproduced 0; prepared patch all_passed=False with
  a_checked=0 while band B still checked 27 pairs, so the refusal is the band-A floor and not a
  collateral band-B failure (_evidence/foundations/band_a_floor_mutation.json). The prepared test
  additions FAIL against the committed worker and PASS 9/9 against the patched one. The change
  set is a four-hunk diff plus a fixture correction, at _evidence/foundations/pending/ and
  C:/temp/foundations/pending/.
  NOTE FOR WHOEVER APPLIES IT: the fixture correction is NOT optional and NOT cosmetic. The
  patched worker fails the existing happy-path test until the stub features vary between nodes
  of a frame, and the spread must be 0.1 rather than 1.0 - at 1.0 the source-axis softmax
  saturates and swallows the 0.05 perturbation that test_a_corrupted_cache_fails_the_gate
  depends on, turning the corruption test green for the wrong reason. That was found by running
  it, not by reading it.

  (2) FOLD HYGIENE - APPLIED AND GREEN. kaggle_factory.apply_edit APPENDS a spec env block after
  the base notebook existing text (scripts/core/kaggle_factory.py:499-508), so every
  os.environ assignment the base already carries stays in force unless the spec names the same
  key. tests/test_loeo_weights_hygiene.py read the fold from the spec env alone and therefore
  SKIPPED every spec built by inheritance. It now resolves the EFFECTIVE fold - base notebook
  first, spec env overriding - and fails closed on a base notebook that is not on disk. Coverage
  measured before and after: the fold-1 guard goes from 12 checked / 54 skipped to 14 / 52,
  reproducing the PKT-0036 audit numbers exactly, and the fold-0 guard from 19 to 22; 36 of 66
  specs now have a resolvable fold against 31. Five specs were invisible and TWO OF THEM ARE
  REALLY FOLD 1: p29_p28_detpeak_export_f1 and p34_acquisition_f1, both built on
  notebooks/kaggle_p28_champion_control_f1/biohub-p28-champion-control-f1.ipynb, which bakes in
  BIOHUB_LOEO_FOLD = 1. Both happen to be clean, so this closes a hole rather than retracting a
  result - but the fold-1 feature-cache run is built exactly that way. Seven mutation tests
  manufacture the defect through the inheritance route and require the guard to fire, including
  a positive heartbeat that names the two inherited specs so a future refactor cannot silently
  skip everything again (_evidence/foundations/fold_hygiene_resolver.json).

  (3) DUAL-TRUNK IN ONE SESSION - IT FITS, AND THE PARTITION SHOULD BE BY FOLD, NOT BY TRUNK.
  Computed from artifacts on disk rather than estimated: fold 0 is 71 crops / 2,332,346 nodes /
  1,973,714 candidate edges with a measured prediction pass of 86.65 min on T4x2
  (C:/temp/p30_f0/biohub-p30-acquisition-f0.log); fold 1 is 128 crops / 2,523,479 nodes /
  2,162,040 edges at 139.27 min (C:/temp/p34_f1/kernel.log). A feature pass is a strict SUBSET of
  that work - no ILP solve, no post-ILP chain - so doubling it for two trunks is a genuine upper
  bound and over-counts twice, since the detector pass and the candidate graph are shared. Dual
  trunk is then at most 2.89 h (f0) and 4.64 h (f1) of prediction, plus 1.36 h of measured
  non-prediction kernel overhead: 4.25 h and 6.00 h per fold. At 32 float32 per node the dual
  trunk cache is 0.61 GB (f0) and 0.66 GB (f1) uncompressed. Everything in ONE session is 8.89 h
  upper bound, which also fits, but one session PER FOLD with BOTH TRUNKS inside is the right
  shape: the FACT-0392 confound is between TRUNKS, and splitting by trunk is precisely what puts
  the resolving comparison across a session boundary, whereas splitting by fold introduces no new
  confound because the contract already forbids pooling the embryo directions. Two fold sessions
  also sit exactly at the FACT-0061 cap.
  ONE HARD PRECONDITION INSIDE THE SESSION: both trunk passes must index ONE detector pass, so
  the two caches differ ONLY in the 32-dim features. That is available rather than aspirational -
  the PKT-0029 upstream audit item U1 establishes that the HOCT configuration takes node
  coordinates from a node-graph provider and that peak extraction does not determine the node set
  at all. audit_feature_cache.py audit-pair REFUSES a pair whose coordinate digests disagree and
  equally refuses one whose feature digests AGREE.
  THE SEQUENTIAL ALTERNATIVE, WITH ITS CONFOUND STATED because the packet requires it be stated
  rather than quietly taken: four (fold, trunk) sessions, two at a time. Two sessions do not share
  a detector pass unless the node set is carried between them as a fixed input, and FACT-0363
  already measured that run-to-run identity is not free on this pipeline. Without that carry a
  trunk-to-trunk difference is confounded with a node-set difference and no HOCT null may be read
  as evidence about the head. Not recommended; recorded so the choice is visible.
  UNREGISTERED NUMBER, FLAGGED RATHER THAN USED: the 12 h Kaggle single-session limit is a
  platform figure that is NOT in facts.yaml. The longest run we have our own evidence for is
  2.81 h. Every margin above is stated against that unverified 12, so if the primary wants the
  headroom claim to be load-bearing it should be measured and registered first.

  (4) CACHE BINDING - BUILT. scripts/win_bet/audit_feature_cache.py bind writes a manifest beside
  the cache carrying trunk checkpoint sha256 plus bytes, role and provenance; fold and held-out
  embryo and crop list; the feature normalisation and its statistics; the node-id convention with
  the frame partition and SEPARATE coordinate and feature digests; the candidate rule with floor,
  cap, gate, det threshold, pool kernel, softmax axis and abstain mass together with the per-band
  pair counts; and the notebook sha256, spec, kernel and git commit.

  (5) THE INDEPENDENT AUDIT COMMAND - BUILT AND SHOWN TO REJECT, 12/12 BY MUTATION. audit
  re-derives the binding from disk alone; audit-pair checks a dual-trunk pair; self-test
  manufactures the defects and requires rejection. Each of the four the packet names is rejected
  BY THE CHECK DESIGNED FOR IT, which is a stronger claim than that it rejected: a swapped trunk
  on an unchanged node set fires features_unchanged; a swapped checkpoint fires
  trunk_checkpoint_sha256; a within-frame coordinate permutation that changes no shape, count or
  feature value fires node_order_unchanged; a cache with nothing at or below the deployed 0.5
  floor fires learnable_band_is_not_empty; split_0 weights on fold 1 fire
  fold1_does_not_use_the_leaky_pack_weights; and a fold declared over the other embryo fires
  embryo_matches_fold. Two accept controls and three dual-trunk cases are included, because an
  auditor that rejects everything checks nothing. Getting there required splitting one digest
  into two - the first version rejected the swapped trunk with a REORDER message, which would
  have sent an operator to the wrong repair. 17 tests in tests/test_audit_feature_cache.py.
  Two fail-closed refusals worth knowing BEFORE the cache run is built: a cache without its frame
  partition is unauditable because node ids are not provable, and a cache without its candidate
  surface cannot be checked for an empty band - and
  scripts/win_bet/assoc_feature_cache.py --cache-out currently writes exactly that first shape.
  The cache-writing run must emit coords, frames, starts, ends, feat_frames, feat_t, source_id,
  target_id and edge_prob, or the auditor will refuse it.

  VERDICT (first pass): NOT CERTIFIED. One item remained and it was mechanical: apply
  _evidence/foundations/pending/*.diff once P33 v2 had landed. THAT IS NOW DONE - the band-A
  floor is committed at scripts/kaggle_edits/assoc_feature_parity.py:271 (`and a_checked > 0`,
  commit 43d770a) and tests/test_assoc_feature_parity.py is green.

result_preflight_2026_08_30: >-
  THE PREFLIGHT SYSTEM IS BUILT AND PROVEN, AND ITS FIRST VERDICT ON P33 ATTEMPT 3 IS **FAIL** -
  ON THE SAME PROCESS-BOUNDARY DEFECT THAT KILLED ATTEMPT 1 (FACT-0387). Caught on CPU in
  seconds. This is the one case the standing GPU rule names where infrastructure counts as the
  cycle's output: the harness demonstrably prevented an already-scheduled GPU launch.

  INSTRUMENTS (all new; nothing existing was modified, so the built notebook under audit is
  untouched):
    scripts/kaggle_edits/kaggle_mount_ladder.py  the ONE central bounded dataset resolver,
      written as an INJECTABLE snippet so a kernel patch embeds this text instead of writing a
      fourth private ladder. Bounded depth ladder, never `**`. Fails closed with a listing of
      what IS mounted. Positive heartbeat MOUNT_RESOLVED on every hit.
    scripts/win_bet/kaggle_mounts.py  the CPU face. It does NOT re-implement the ladder - it
      execs that file, so the resolver the preflight proves and the resolver the kernel runs are
      the same characters (test: resolve.__code__.co_filename == the ladder path). Also carries
      simulate_mount_tree (flat / datasets / competitions) and rebase_and_exec, which lifts a
      resolver OUT OF THE BUILT NOTEBOOK, re-points it at a sandbox and CALLS it. Execution, not
      a regex over the text.
    scripts/win_bet/kaggle_artifacts.py  unified queue-fetch / factory-output discovery with role
      aliases, recording WHICH convention produced the hit and, on a miss, every root searched.
    scripts/win_bet/gpu_preflight.py  the driver: 10 checks, a signed receipt, and --selftest.
    tests/test_gpu_preflight.py  20 tests, 20 pass.

  P33 ATTEMPT 3 VERDICT: FAIL, one check, and it is not cosmetic. PF07 launches the built
  notebook's own worker across the REAL subprocess boundary, in preflight-only mode (argparse and
  phase dispatch execute; only the GPU-bound phase bodies are stubbed), reproducing the
  notebook's own launch kwargs. The notebook calls
  `_afp_sub.run(_afp_cmd, cwd=str(REPO_DIR), text=True, capture_output=True)` with NO `env=`
  (built notebook cell 5; source scripts/kaggle_edits/assoc_feature_parity.py:399). The worker
  file lives at /kaggle/working/afp_gate1.py, so sys.path[0] is /kaggle/working, NOT
  REPO_DIR/scripts - and cwd is not on sys.path for a script invocation. Measured in the probe:
  sys_path0=<working>, PYTHONPATH=<unset>, and
  `ModuleNotFoundError: No module named 'predict_unet_transformer'` - FACT-0387 verbatim, one
  process over. A second, independent break rides with it: biohub_tracking is unresolvable too,
  because the DEPLOYED shards are launched with env={**os.environ, "PYTHONPATH": "src"} (cell 5,
  two call sites) and the gate's launcher omits it. The worker's own comment,
  "resolves because cwd is the repo root", is false.
  THE FIX IS ONE LINE, and it is proven rather than proposed: the same worker, same sandbox, same
  probe, with env={**os.environ, "PYTHONPATH": "scripts" + os.pathsep + "src"} imports cleanly
  and runs on to load_model (selftest M6). "src" alone is NOT enough - the worker is not inside
  scripts/, which is why copying the deployed shards' env would still fail.

  WHAT THE OTHER NINE CHECKS ESTABLISHED (all PASS):
    PF01 built notebook sha256 e826a682 == build_manifest.built_sha256; slug, datasets and
      competition sources agree with the spec; every patch file is committed clean.
    PF02 both resolvers this spec injects (_afp_find, _loeo_find) were EXECUTED against simulated
      mounts and resolve under BOTH conventions; no resolver in the notebook can `**`-walk.
      Recorded finding: SIX independent ladders coexist in this one notebook, each with its own
      depth ceiling. That is the FACT-0397 generator, and it is why the ladder is now central.
    PF03 EXACT crops, not a count: ['44b6_0113de3b', '44b6_0b24845f'] - the notebook's own
      selection rule evaluated against the real uploaded parquet; both are in the fold-0 stem
      list and both have a train .zarr.
    PF05 parquet columns and dtypes and every ECB sidecar key the worker reads.
    PF06 EXACT POSITIVE COUNTS at the 8-frame cap, which is the FACT-0394 lesson applied BEFORE
      the spend rather than after: 44b6_0113de3b band A 1488 / band B 835; 44b6_0b24845f band A
      2174 / band B 7585. Every pair is frame-consecutive, node ids are contiguous and
      time-ordered, and the sidecar's in-scope >0.5 count equals the pre-ILP band-A count exactly
      (1488 and 2174) - an independent cross-artifact tie on node identity. So the in-kernel
      a_checked>0 / b_checked>0 floors CAN be satisfied; the gate will not refuse for emptiness.
    PF08 the gate report is written outside the try block and is in _LOEO_KEEP, so it survives
      the export sweep.
    PF09 WEIGHTS_RELATIVE is repo-relative and joined to REPO_DIR; the DeepCenter checkpoint,
      which the spec env hardcodes as /kaggle/input/<slug>/..., has a datasets/ fallback in cell 6
      and resolves under both conventions. STATED LIMIT: the pack's edge_predictor_best.pth is not
      mirrored locally, so only the path SHAPE is checked - recorded, not silently passed.
    PF10 heartbeat tokens the fetched log MUST carry, named in the receipt so their absence is the
      alarm. Reported but NOT blocking: scripts/kaggle_edits/coupled_division_transplant.py
      contains ZERO print calls and cannot prove it fired.
    PF11 P24 resolves by the queue convention (C:/temp/queue/p24_deepcenter_best_veto) and P32 by
      the factory convention (notebooks/kaggle_p32_public931_exact/_out) - the two artifacts whose
      split produced the false FAIL corrected in FACT-0396, now regression fixtures in both the
      selftest and the test suite.

  PROVED BY MUTATION, 15/15, EVERY CHECK REJECTED BY ITS OWN CONDITION: M1 hardcoded flat mount
  (finds under flat, misses under datasets); M2 a `**` walk; M3 a 1-frame cap that makes both
  bands compare nothing; M4 a sidecar torn off the pre-ILP band-A tie; M5 a factory-only search
  that misses the queue champion; M6 the as-built launcher vs the same worker with
  PYTHONPATH=scripts+src; M7 one byte added to the built notebook; M8 a receipt edited after
  signing; M9 a gate patch that cannot say it ran; M10 a selected crop absent from the fold stem
  list; M11 a sidecar missing edge_prob; M12 the gate report dropped from the keep set; M13
  weights pinned to an absolute mount path. TWO ACCEPT CONTROLS (A1 the central ladder under all
  three conventions, A2 P32 by the factory convention), because an auditor that rejects
  everything checks nothing.
  ONE CHECKER BUG THE MUTATIONS FOUND, worth recording: the first is_bounded read `**` anywhere in
  the text and therefore condemned _loeo_find for the sentence in its own docstring explaining why
  it does NOT use `**`. It now parses glob call arguments with ast.

  RECEIPT: _evidence/foundations/preflight_receipt_p33.json (also C:/temp/foundations/), carrying
  resolved paths, input sha256s, the exact crop names, the code commit, the expected GPU outputs
  and the per-crop minimum pair counts. Tamper-evident, NOT authenticated - no secret exists in
  this repository, and claiming otherwise would be the decorative check this packet exists to
  remove. `verify-receipt` rejects an edited body and a changed instrument.

  VERDICT: PREFLIGHT SYSTEM CERTIFIED; P33 ATTEMPT 3 IS **NOT CLEARED FOR GPU**. See the
  correction block below for the final state, which is stronger than this first pass.

result_preflight_corrected_2026_08_30: >-
  CORRECTED AFTER A FALSE NEGATIVE WAS REPORTED FROM THE FIELD, AND THE CORRECTION FOUND A THIRD
  KERNEL DEFECT. Agent 2 ran gpu_preflight against a SUBMISSION notebook and PF09 failed on
  arithmetic of its own: it split /kaggle/input/datasets/<owner>/<slug>/... positionally, took
  "datasets" for the slug and left the slug inside the "relative" remainder, then mounted that
  under <owner>/<slug>/ again - `datasets/pilkwang/datasets/pilkwang/...`. The notebook was fine.
  A checker that cries wolf is worse than none: it teaches a reader to ignore the one time it is
  right. FIVE bugs of that ONE class were then found in this instrument, all of them "read the
  code" where the fix is "resolve the code", and every one is now fixed and pinned by a mutation:
    (i)   PF09 path split -> parse_mount_path(), which handles flat, datasets/<owner>/<slug> and
          competitions/<slug>, and every probe asserts no duplicated slug segment. Proved in BOTH
          directions, which the packet's own standard requires: A3 the correct nested root must
          PASS; M14 a checkpoint under a slug that is not mounted must FAIL.
    (ii)  PF01 called git status with an EMPTY pathspec when a spec had no code_file edits, which
          reports the WHOLE worktree - so any such spec failed on another agent's open files.
          A4 proves the empty question now has an empty answer; M16 proves an uncommitted patch of
          the spec's OWN is still rejected.
    (iii) PF07 read the launcher's PYTHONPATH with a regex over the CALL text. When the launcher
          was rewritten to build a NAMED env dict, the regex saw an env= it could not read and
          passed none - reproducing a failure the notebook no longer had. It now parses and
          evaluates the assignment (ast, supporting os.pathsep concatenation).
    (iv)  PF07's model probe HARDCODED TemporalUNet3D - the UNet, which is a CONSTRUCTOR ARGUMENT
          - and reported all four of the worker's model calls missing. load_model in fact returns
          UNetNodeTransformer. The probe now resolves the class from load_model's own source and
          checks __init__ assignments as well as class attributes.
    (v)   is_bounded read `**` anywhere in the text and condemned _loeo_find for the sentence in
          its own docstring explaining why it does not use `**`. It now parses glob arguments.

  ARTIFACT CLASS, added on Agent 2's second point. A submission notebook has no Gate-1 report and
  never will, so failing it for lacking one is noise - and noise is how a real FAIL gets ignored.
  Each spec is now classified (submission / gate_smoke / feature_cache / generic) and each check
  declares the classes it applies to. Out-of-class checks are SKIPPED, named in the receipt, and
  EXCLUDED from the verdict - never counted as a PASS. The dangerous half is guarded too: a class
  that SHOULD carry a check but has no implementing profile FAILS CLOSED (M15b), because the
  original defect here was PF05 and PF06 reporting PASS on P32 while reading P33's dataset. With
  this, P32 and P24 both preflight to PASS on their five applicable checks.

  THE THIRD KERNEL DEFECT, found only because bug (iv) was fixed rather than worked around. The
  Gate-1 worker's CACHE phase calls `model.detection_head(unet_out)` (built notebook cell 5, line
  647; source scripts/kaggle_edits/assoc_feature_parity.py). The class load_model returns,
  UNetNodeTransformer, has NO such attribute - it is `detect_head`
  (scripts/train_unet_transformer.py:437, and used as self.detect_head at :487 and :503). The
  string "detection_head" appears in the support pack ZERO times and in the whole built notebook
  exactly ONCE, inside the AFP worker. Confirmed against FIVE independently materialised copies of
  the pack (C:/temp/p7, p7b, lonnie_gap2_output, h1r_edge_s5_smoke_v2 and vendor/) - all say
  detect_head. So the cache phase would raise AttributeError on the FIRST crop, and a third GPU
  session would end with zero crops compared. This is exactly the failure the preflight exists to
  price on CPU.

  WHAT ELSE MOVED WHILE THIS RAN. scripts/kaggle_edits/assoc_feature_parity.py now carries the
  PYTHONPATH fix diagnosed above (uncommitted at the time of writing, applied by another agent).
  That is the right fix and the as-if-rebuilt probe confirms it: with it, import
  predict_unet_transformer succeeds, every AFP attribute the worker uses resolves, and the

result_passive_redesign_2026_08_30: >-
  GATE 1 REBUILT AS PASSIVE INSTRUMENTATION ON HOST ORDER, AND A SIXTH DEFECT WAS FOUND AND
  MEASURED WHILE DESIGNING IT. CPU only. No GPU job, kernel push or submission.

  THE SIXTH DEFECT, AND IT IS THE SAME CLASS AS THE OTHER FIVE. The deployed node feature is NOT
  a per-frame quantity. TemporalUNet3D contains _TemporalAttention, which mixes across the time
  axis of the window (src/biohub_tracking/models/temporal_unet.py:30-48 and :125-131), so
  unet_out[:, i] depends on every frame in the window. With the deployed window_size 2 and stride
  W-1 = 1 an interior frame t is the TARGET of pair (t-1, t) from window [t-1, t] AND the SOURCE
  of pair (t, t+1) from window [t, t+1] - two different forward passes, two different feature
  vectors. The old worker cached feats[t] once at first sight and reused it for BOTH roles
  (scripts/kaggle_edits/assoc_feature_parity.py:138-147), so for every pair (t, t+1) with t >= 1
  it fed the head SOURCE features taken from the wrong window. MEASURED on the real deployed path,
  not read: 66 of 173 role-nodes appear in both roles and their feature vectors differ by up to
  0.0123 absolute (3.5% relative, median 1.0%) - 2.1 orders of magnitude above the gate's own 1e-4
  tolerance (_evidence/foundations/defect6_measurement.json). The error is not uniform across the
  source axis, so the softmax blind spot would NOT have hidden it: a fourth GPU session would have
  ended in a FAIL caused entirely by the gate's own reimplementation.

  THE REDESIGN. scripts/kaggle_edits/assoc_feature_tap.py injects a PASSIVE tap into the deployed
  predict_video by rewriting its source text - the pattern pre_ilp_export.py and
  edge_candidate_budget.py already use - and records the exact tensors handed to
  model.predict_edges together with the deployed probabilities computed one line later. Nothing
  about the image pipeline, normalisation, downsample, voxel scale, detection peaks, window
  partition, masks or node ordering is recomputed, so the entire FACT-0400 defect class is gone
  rather than fixed. scripts/win_bet/assoc_tap_replay.py reloads the persisted cache IN A FRESH
  PROCESS and re-runs ONLY the head. The cache is keyed by (pair, role), not by frame.

  PASSIVITY IS PROVED TWICE, NOT ASSERTED. Statically: every insertion is marker-wrapped and the
  patch requires that stripping the spans restores the pre-patch bytes exactly; the kernel
  re-proves that from disk after the run and prints AFT_PASSIVITY_VERIFIED. Dynamically: the CPU
  suite runs the REAL predict_video over a real zarr, pristine versus tapped, and requires
  bit-identical coords and edges.

  THE TWO-BAND CONTRACT IS KEPT AND ITS THRESHOLDS ARE UNCHANGED - band A is > cfg.threshold
  (0.5), band B is the ECB rule (floor 0.02, top-8 per target) minus band A, and both per-crop
  floors a_checked>0 / b_checked>0 remain (FACT-0394, FACT-0382). What changed is the SOURCE: both
  bands are recorded at the deployed site in THIS run, so no previous run's parquet or sidecar is
  an input and none can be stale. That also removes a cross-run assumption FACT-0363 warns against.

  ONE CORRECTION TO THE STATED BLIND SPOT. The invariance is a property of the LOGITS, not of the
  features: softmax over the source axis is invariant to a PER-TARGET constant offset. The older
  wording ("a uniform per-frame source shift") is not equivalent, because the head is not affine
  in the source features. The precise version is asserted in both directions in the suite.

  TESTS: tests/test_assoc_feature_tap.py, 22 passed, in PRODUCTION LAYOUT (module at
  <repo>/scripts, worker at <working>, cwd=<repo>, real subprocess boundary) against the REAL
  class surface - no stub anywhere, which is what let model.detection_head survive a green suite.
  Rejections proved by mutation: the per-frame cache (defect 6), a single perturbed node, a
  within-frame permutation, a torn window-shape record, an empty band A, an empty band B, an empty
  cache directory. Accept controls: a lossless round trip, and the as-built launcher. FACT-0399 is
  re-executed three ways (no PYTHONPATH -> ModuleNotFoundError, src only -> still fails,
  scripts+src -> passes).

  PREFLIGHT. The instrument now carries a second Gate-1 PROFILE (assoc_feature_tap) so the new
  spec is classified rather than silently skipped; PF03/PF05/PF06 have profile implementations
  and PF07 extracts and launches the tap's own worker. Verdict on the rebuilt notebook
  (scripts/kaggle_specs/p36_assoc_feature_tap_smoke.json, built by kaggle_factory, sha256 in
  _evidence/foundations/feature_tap_redesign.json): 9 of 10 applicable checks PASS, nothing
  skipped, and the single FAIL is PF01 because the two new patch files are UNCOMMITTED - this
  packet is forbidden from staging. Receipt: _evidence/foundations/preflight_receipt_p36.json.

  A PRE-EXISTING SELFTEST FAILURE WAS FOUND AND FIXED. M6 was already failing on the committed
  instrument (verified by running HEAD's copy: 20/21), because it used the LIVE P33 notebook as
  its defective fixture and that notebook had since been rebuilt with the env= fix. A mutation

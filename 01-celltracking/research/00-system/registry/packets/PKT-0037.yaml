  vectors. The old worker cached feats[t] once at first sight and reused it for BOTH roles
  (scripts/kaggle_edits/assoc_feature_parity.py:138-147), so for every pair (t, t+1) with t >= 1
  it fed the head SOURCE features taken from the wrong window. MEASURED on the real deployed path,
  not read: 66 of 173 role-nodes appear in both roles and their feature vectors differ by up to
  0.0123 absolute (3.5% relative, median 1.0%) - 2.1 orders of magnitude above the gate's own 1e-4
  tolerance (_evidence/foundations/defect6_measurement.json). The error is not uniform across the

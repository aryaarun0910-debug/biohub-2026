        4x8x8 = 256-token grid), a 6-layer MSDeformAttn 3D pixel decoder at CONVS_DIM 288, and a
        9-layer Mask2Former decoder with exactly 300 object queries at HIDDEN_DIM 288 and
        NUM_CLASSES 1. The backbone adapter is 387,287,968 params, 94.1% of the model.
      value: 411638146
      unit: parameters
      provenance: UNVERIFIED

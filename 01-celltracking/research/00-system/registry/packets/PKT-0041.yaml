        FIRST PASS LABELLED THIS `MEASURED` AND THAT WAS WRONG. The count comes from instantiating
        the architecture with RANDOM initialisation; no checkpoint was read, because the download is
        blocked by the permission system. A count obtained that way is NUMERICALLY INDISTINGUISHABLE
        from one taken off the released tensors, so the label was doing work the evidence could not
        support - the FACT-0043 failure shape. It is UNVERIFIED until `focus3d_probe.py ckpt` reads

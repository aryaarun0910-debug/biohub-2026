outputs:
  evidence: _evidence/focus3d/ and C:/temp/focus3d/
  facts_added: []          # routed to the coordinator as CANDIDATE FACTS in `result`
  record: >-
    One compact row in research/06-knowledge-system/experimental-records.md

result:
  session: '2026-08-30, agent-5, CPU only. Steps 1-3 complete; step 4 prepared, NOT run.'

  headline: >-
    ALL THREE GATES PASS AND THE ONE NAMED TECHNICAL BLOCKER IS DEAD. Falsifier (a) does not fire:
    the rules are permissive by default and the asset is free and public. Falsifier (b) does not
    fire on any evidence available: no source in FOCUS-3D's published dataset inventory is the
    competition's provenance, and no listed volume matches our geometry - but the publisher ships NO
    training manifest, so a residual EXTERNAL risk is recorded rather than cleared. Falsifier (c)
    does NOT fire and this is the largest single finding of the session: the packaged inference path
    needs neither Detectron2 nor any compiled CUDA extension, and the complete graph was RUN END TO
    END on CPU in this repository's own venv. RECOMMENDATION: proceed to step 4.

  # -------------------------------------------------------------------------------------------
  step_1_admissibility:
    verdict: >-
      ADMISSIBLE FOR OFFLINE USE (host authority, above) AND ADMISSIBLE ON THE RULE TEXT FOR A
      SUBMISSION, subject to one residual judgement that belongs to the host: whether an
      auto-approved Hugging Face gate counts as "publicly available and equally accessible ... at no
      cost". Every objective condition the rules impose is met; the only thing a participant must do
      that they need not do for an ungated asset is create a free HF account and click accept.
    rule_text_at_source:
      retrieved_how: >-
        The Kaggle rules page is a JS SPA; a plain GET returns a 5.7 KB shell and WebFetch, crawler
        UAs and every competitions.CompetitionService RPC name tried return no rule text. The full
        36,552-byte rules markdown was obtained through the r.jina.ai text-extraction proxy at
        https://r.jina.ai/https://www.kaggle.com/competitions/biohub-cell-tracking-during-development/rules
        and is archived at the session scratchpad as rules_raw.txt. AUTHENTICITY CHECKED, not
        assumed: the page's competition-specific values (7 prizes / USD 60,000, winner licence MIT,
        data CC0, max team size 5, 5 submissions/day) match the authenticated
        competitions.CompetitionService/GetCompetition RPC payload exactly, so it is this
        competition's rules and not a generic template.
      section_2_6_a_external_data: >-
        "You may use data other than the Competition Data ("External Data") to develop and test your
        Submissions. However, you will ensure the External Data is either publicly available and
        equally accessible to use by all Participants of the Competition for purposes of the
        competition at no cost to the other Participants, or satisfies the Reasonableness criteria
        as outlined in Section 2.6.b below."
      section_2_6_b_models: >-
        "The use of external data and models is acceptable unless specifically prohibited by the
        Host. ... their use must be "reasonably accessible to all" and of "minimal cost"."
      section_2_5_a_3_winner_licence: >-
        "In the event that input data or pretrained models with an incompatible license are used to
        generate your winning solution, you do not need to grant an open source license in the
        preceding Section for that data and/or model(s)."
      section_3_6_c_open_source: >-
        "Unless otherwise stated in the Specific Competition Rules above, if open source code is
        used in the model to generate the Submission, then you must only use open source code
        licensed under an Open Source Initiative-approved license (see www.opensource.org) that in
        no event limits commercial use of such code or model containing or depending on such code."
      completeness: >-
        The whole 36 KB document was searched for `external data`, `pre-?trained`, `AMLT`,
        `reasonableness`, `automated machine learning`, `open source` and `publicly available`.
        There is NO blanket prohibition on external data or pretrained weights anywhere in it.
    why_it_lands_admissible:
      - >-
        2.6.b is permissive by default - "acceptable unless specifically prohibited by the Host" -
        and no Host prohibition exists. The Host has in fact approved external data in this
        competition once already, on the record (forum topic 734330, 2026-08-13, the only
        HOST-flagged message in the thread: "Hi! Yes you are free to use the data and all resources
        in Zebrahub for this competition! There is no overlap with the test set.").
      - >-
        The cost test is satisfied absolutely. Both the code and the weights are free. The
        "Reasonableness Standard" the rules describe is entirely about EXCESSIVE COST excluding
        participants; its worked example is a proprietary dataset licence costing more than the
        prize. A free, auto-approved account gate is not that.
      - >-
        2.5.a.3 explicitly contemplates a WINNING solution built on pretrained models whose licence
        is incompatible with the MIT winner grant. That clause would be incoherent if pretrained
        weights were disallowed, and it also means the weights' own licence cannot by itself make a
        winning submission invalid - it only carves that component out of the open-source grant.
      - >-
        3.6.c is satisfied on the code axis: BSD-3-Clause is OSI-approved and does not limit
        commercial use.
    the_one_residual_question_for_the_host: >-
      2.6.a's alternative limb asks for data "publicly available and equally accessible to use by
      all Participants ... at no cost". The repo is public and `gated: "auto"`, which means approval
      is automatic and instant for any free Hugging Face account - there is no queue, no manual
      approval, no fee and no geo restriction that we can observe. The honest statement is that this
      is equally accessible to all participants at no cost in every practical sense, and that the
      only formal gap is a per-participant click. We do not treat that as a bar; we record it so the
      host is not surprised by it at prize verification.
    licences_recorded_separately_as_instructed:
      code_licence:
        what: BSD-3-Clause, "Copyright (c) 2026, Qinghua Zhang"
        where_read: https://github.com/yu-lab-vt/FOCUS-3D LICENSE (via the GitHub licence API)
        osi_approved: true
        limits_commercial_use: false
        obligations: >-
          Retain the copyright notice, the list of conditions and the disclaimer in source AND in
          binary redistributions; do not use the copyright holder's or contributors' names to
          endorse or promote derived products without prior written permission.
      inherited_third_party_code_licence:
        what: MIT, "Copyright (c) 2022 Meta, Inc."
        where_read: src/focus3d/segmentation/FOCUS3D/LICENSE in the same GitHub repo
        why_it_matters: >-
          The Mask2Former lineage carries its own MIT notice INSIDE the BSD-3 repository. Any
          redistribution of the model code owes BOTH notices, not just the outer one. This is the
          exact shape of the LEVER-0034 precedent (MIT code, separately-licensed weights, a required
          attribution string) and it was found only by reading the tree rather than the top-level
          licence badge.
      weights_licence:
        what: Apache License 2.0, asserted in the model card body
        where_read: >-
          README.md of the gated repo Qinghua-thu/FOCUS-3D, retrieved with the host's token:
          "The model weights in this repository are released under the Apache License 2.0."
        provenance_caveat: >-
          There is NO LICENSE file in the weights repo and NO licence field in its card metadata -
          the API returns tags ["region:us"] and cardData null. The grant exists ONLY as that one
          README sentence. It is a statement by the rights holder, so it is a real grant, but it is
          weaker evidence than a licence file and it can be edited without a trace we would notice.
          A snapshot of README.md at repo sha 528455a03493d12f170c03384974318248b1774c is archived.
        obligations: >-
          Apache-2.0 requires the licence text and NOTICE (if any) to accompany redistribution and
          requires marking modified files. If the weights are re-hosted as a Kaggle dataset, that
          dataset must carry the Apache-2.0 text and the attribution.
    submission_precondition_filed: >-
      Before any submission that depends on this asset: (i) the weights must be re-hosted as a
      Kaggle dataset that is PUBLIC, so the "equally accessible at no cost" limb is satisfied
      directly and does not rest on the HF gate at all; (ii) that dataset carries the Apache-2.0
      text for the weights and BOTH the BSD-3-Clause and the Meta MIT notices for the code; (iii)
      the write-up names FOCUS-3D, yu-lab-vt/FOCUS-3D and Qinghua-thu/FOCUS-3D. Note (i) makes the
      residual 2.6.a question moot, which is why it is cheap to just do.

  # -------------------------------------------------------------------------------------------
  step_2_contamination:
    recorded_before_any_number: true
    verdict: >-
      NO OVERLAP FOUND, AND THE LEVER IS NOT RESTRICTED TO SUBMISSION-ONLY JUDGEMENT. Falsifier (b)
      does not fire. But the clearance is NEGATIVE EVIDENCE, not a manifest: FOCUS-3D publishes no
      training-data manifest at all, so this cannot be upgraded past EXTERNAL.
    published_inventory_read_at_source:
      where: >-
        https://www.quiclab.org.cn/focus-3d/datasets and its 14 per-dataset pages (slugs: allen,
        dro1, dro2, eye, fish-c0, fish-c1, fish1, fish2, fish-f0, mezzo, mouse1, notochord, sox-c0,
        ce). The GitHub README and the model card carry NO inventory; this portal is the only one.
      headline_counts: 14 dataset families, 82 annotated volumes, 400,000+ 3D instances (nuclei 9, membrane 3, others 2)
      sources_named_by_the_publisher:
        - Hufnagel group (Drosophila embryo, 30 slices, voxel 1x1x1)
        - Keller lab (Drosophila whole embryo 125 sl 5x1x1; zebrafish whole embryo 253 sl 8x1x1; mouse embryo 70 sl 5x1x1)
        - Schier lab (zebrafish whole embryo, 180 slices, voxel 5.86x1x1)
        - Cell Tracking Challenge (C. elegans embryo, 35 slices, voxel 1 x 0.09 x 0.09 um)
        - Allen Institute for Cell Science (human iPSC, 66 slices, voxel 0.290 x 0.108 x 0.108 um)
        - >-
          "FOCUS-3D collection" - their own, 7 volumes, all zebrafish, all voxel 5x1x1: eye nuclei 84
          sl, nuclei 41 sl, notochord nuclei 101 sl, membrane 41 sl (x2), membrane 40 sl, cytoplasm
          24 sl
    why_no_overlap_is_the_reading:
      - >-
        THE COMPETITION'S PROVENANCE IS NOT IN THE LIST. Neither CZI Biohub, nor Zebrahub, nor the
        Royer lab, nor DAXI appears anywhere in the inventory or on any dataset page. The zebrafish
        volumes are attributed to Schier lab, Keller lab and the authors' own collection.
      - >-
        NO GEOMETRY MATCHES. Our data is z_ratio 4.0 exactly (1.625 / 0.40625 um, AGENTS.md s4).
        Every listed zebrafish volume is 5x1x1, 5.86x1x1 or 8x1x1; none is 4. The one geometric
        near-neighbour is a different lab's.
      - >-
        The Zebrahub non-overlap check this repo already ran (voxel 1.24 / 0.439 / 0.439 vs ours)
        remains independent evidence that our movies are not re-crops of the public zebrafish sets.
    the_residual_risk_stated_honestly: >-
      This is an inventory of "gold-standard annotated datasets", NOT a stated training split. The
      project is pre-alpha, has no paper (the GitHub README says "Please contact ... before the
      paper is published"), no benchmark table and no per-checkpoint training manifest, so WHICH of
      the 82 volumes trained model_final_nuclei.pth is unpublished. The inference is therefore: no
      DISCLOSED source overlaps ours and no disclosed geometry matches ours. That is enough to keep
      offline evaluation interpretable and to avoid the FACT-0378 trap, and it is not enough to be
      called VERIFIED. If the publication later discloses a CZI/Zebrahub-derived volume, every
      offline number from this lever must be re-read under FACT-0378's rule.
    consequence_for_the_lever: >-
      Steps 4 and 5 may be judged OFFLINE on our own LOEO folds in the normal way. The lever is NOT
      pushed into submission-only judgement, which is the outcome that would have changed its cost
      entirely.

  # -------------------------------------------------------------------------------------------
  step_3_packaging:
    verdict: >-
      PACKAGEABLE OFFLINE FOR T4x2 WITH NO COMPILED EXTENSION. Falsifier (c) does not fire. The
      named risk was real upstream and is already solved by the publisher for the inference path.
    the_named_risk_and_why_it_is_dead:
      upstream_risk_is_genuine: >-
        The GitHub tree DOES ship a compiled multi-scale deformable-attention op -
        src/focus3d/.../vitadapter/ops/ with ms_deform_attn_cuda.cu, ms_deform_im2col_cuda.cuh,
        setup.py and make.sh. If that were the inference path, a network-less Kaggle kernel could
        not build it and (c) would fire.
      but_the_inference_path_does_not_use_it: >-
        The publisher ships a second, Detectron2-free, pure-PyTorch runtime and it is the one the
        official demo uses. VERIFIED at file:line in the public Space (Qinghua-thu/FOCUS-3D, gated
        false, licence bsd-3-clause), whose files are mirrored at C:/temp/focus3d/src/:
        adapter_modules.py:134 defines class MSDeformAttn3D_PyTorch; :147 "Sampling is done with
        trilinear grid_sample"; :285 the F.grid_sample call; :447 and :513 the two sites that
        instantiate it inside the ViT-Adapter. The Space ships NO ops/ directory at all. A grep of
        the whole runtime for MSDeformAttnFunction | ms_deform_attn | MultiScaleDeformableAttention
        | load_ext | cpp_extension | CUDA_HOME returns ZERO hits.
        config_win.py:1-14 states it replaces detectron2.config.get_cfg and mask2former's
        add_maskformer2_config; the only occurrences of the word detectron2 in the runtime are in
        that docstring and in inference_win.py:225-237's "Equivalent to Linux:" comment.
        The Space README says it plainly: "The Space uses the pure-PyTorch `inference_win` runtime
        ... It follows `notebooks/01_inference.ipynb` and therefore does not require Detectron2."
        The GitHub README agrees: "Install detectron2 (optional, only for Linux model fine-tuning)".
      proved_by_execution_not_by_reading: >-
        The complete graph was BUILT AND RUN END TO END on CPU in this repository's own
        .venv (torch 2.13.0+cpu, 4 threads), from the public Space runtime and 3d_test.yaml, with no
        detectron2 and nothing compiled. One patch of the model's native [32,96,96] shape forwards
        in 21.5 s (batch 1) and 40.5 s (batch 2, 20.2 s/patch), returning pred_masks [300,32,96,96],
        pred_scores [300], pred_classes [300]. An import-only check would not have been evidence;
        this is.
      what_a_cpu_torch_CANNOT_answer: >-
        Stated plainly rather than inferred. A CPU-only torch cannot demonstrate that the CUDA path
        runs on CC 7.5, cannot measure GPU throughput and cannot measure peak device memory. What it
        DOES establish is the thing the wheel question was about: there is no custom CUDA kernel to
        compile, so no bespoke wheel matching T4 / CC 7.5 is needed at all - the requirement reduces
        to the stock torch CUDA build that Kaggle's image already ships. That reduction is the
        finding; the throughput number is not, and it is left to step 4's own timing probe.
    architecture_and_size_from_the_config_NOT_from_the_weights:
      provenance_ceiling: UNVERIFIED
      why: >-
        These numbers come from instantiating the publisher's config with RANDOM weights. They are
        numerically indistinguishable from numbers taken off the released tensors, and the tensors
        were never read because the download is blocked. See the auditor_veto_v3_response below.
      parameters_total: 411638146
      parameters_trainable: 411181714
      state_dict_entries: 886
      state_dict_numel: 411647755
      fp32_weight_bytes: 1646552584
      largest_component: backbone.adapter 387,287,968 params (94.1% of the model)
      instrument: >-
        scripts/win_bet/focus3d_probe.py arch - builds MaskFormer via
        inference_win.build_maskformer_model_from_cfg on the public config, no checkpoint loaded.
        The payload self-labels ARCHITECTURE_INSTANTIATION / UNVERIFIED so this cannot be misread.
      config_read_at_source: >-
        configs/3d_test.yaml: D2MAE3DBackbone, IMG_SIZE [32,96,96], PATCH_SIZE [8,12,12], IN_CHANS 1,
        EMBED_DIM 1008, DEPTH 24; ViT-Adapter INTERACTION_INDEXES [[0,5],[6,11],[12,17],[18,23]];
        MSDeformAttnPixelDecoder3D CONVS_DIM/MASK_DIM 288, TRANSFORMER_ENC_LAYERS 6, IN_FEATURES
        res2-res5; MultiScaleMaskedTransformerDecoder HIDDEN_DIM 288, NUM_OBJECT_QUERIES 300,
        NHEADS 8, DEC_LAYERS 9; NUM_CLASSES 1; PIXEL_MEAN [0.0], PIXEL_STD [1.0];
        TEST.DETECTIONS_PER_IMAGE 300. The "hundreds of object queries" claim is now VERIFIED as
        exactly 300, and the token grid is 4x8x8 = 256.
    checkpoint_structure:
      status: NOT MEASURED THIS SESSION - the download was refused by the permission system
      what_is_known_from_the_repo_api:
        model_final_nuclei.pth: {bytes: 4468804784, lfs_sha256: b14a7bd272f824adb1a1073bc3f2af17a95919d5a0c3f1d9011a8d82378d8f3a}
        model_final.pth: {bytes: 4468804784, lfs_sha256: e5f107ee0ab9996b93f70f430f4a6efa4b6d977630e08644e9e0c7d8d9cd9938}
        model_final_membrane.pth: {bytes: 4468130940, lfs_sha256: db9eb9e8fa3cf2d5293e7a5cd90d292fd6de59f020a65a0859c7da2ecbca87b9}
        repo_total_storage_bytes: 13405740508
      the_arithmetic_finding_worth_acting_on: >-
        4,468,804,784 / 4 = 1,117,201,196 float32 elements, against a model of 411,647,755. The
        checkpoint is 2.71x the model. That is the signature of a TRAINING checkpoint carrying
        optimizer state (Adam's two moments plus the weights is ~3x), not a bare state_dict. The
        runtime already anticipates it: inference_win.py:_extract_model_state_dict unwraps 'model',
        'state_dict' or 'model_state_dict', and _clean_state_dict_keys strips 'module.' and 'model.'
        prefixes. CONSEQUENCE: the Kaggle dataset should carry an EXTRACTED ~1.65 GB state_dict, not
        the 4.47 GB blob - a 2.7x saving on upload, mount and load time. This is a hypothesis from
        file size and must be confirmed against the tensors the moment the download is possible.
      contrast_with_PKT_0036_precedent: >-
        PKT-0036 could identify its three trunks by hash because they were bare 136-tensor state
        dicts with zero non-tensor keys. This one is almost certainly not that, so the equivalent
        check here is: unwrap, then record entry count, key prefixes, non-tensor keys, and the
        missing/unexpected sets against the 886 keys measured above.
    dependencies_by_exact_version:
      space_runtime_requirements_txt: >-
        gradio==6.26.0, spaces, numpy, scipy, scikit-image, tifffile, imagecodecs>=2023.9.18, zarr,
        PyYAML, tqdm, torch. NO detectron2. gradio and spaces are demo-only and are not needed.
      pypi_package: >-
        focus-3d 0.1.19 (releases 0.1.17/0.1.18/0.1.19), requires_python >=3.10, requires_dist:
        numpy, qtpy, scikit-image, scipy, pandas, tifffile, zarr, pyyaml, requests, dask,
        matplotlib, scikit-learn, tqdm, imagecodecs>=2023.9.18, napari[all] (gui extra only). torch
        is deliberately NOT declared - the README installs it separately per CUDA version.
      what_we_actually_need_in_a_kernel: >-
        torch (Kaggle's stock CUDA build), numpy, scipy, scikit-image, tifffile, PyYAML, tqdm - all
        already present in the Kaggle image. NOTHING NEEDS INSTALLING AND NOTHING NEEDS COMPILING.
        The runtime itself is ~30 pure-Python files and ships as a Kaggle dataset alongside the
        weights. Verified importable and runnable offline against a local mirror at
        C:/temp/focus3d/src/, which is the same thing the kernel would do.
    preprocessing_read_at_source:
      pipeline: >-
        inference_win.py:311-323 documents the ten stages and the code implements them:
        (1) read volume (Z,Y,X); (2) resample_volume_for_inference (:1225) so the cell radius equals
        reference_cell_radius = 15 px in XY, factor = cell_radius / 15, and CRUCIALLY when z_ratio >
        1 the Z axis is left UNCHANGED and only Y/X are resampled (scipy ndi.zoom, order 1);
        (3) normalise to [0,1] with GLOBAL percentiles computed once over the whole volume
        (lower 1.0, upper 99.0 - :549-567); (4) pad and tile; (5) skip pure-background patches
        (background_threshold, defaulting to the global 5th percentile - :580); (6) batched forward
        under torch.inference_mode + torch.autocast(cuda, float16) (:790-801); (7) per-patch
        postprocess and stitch; (8) instance/confidence maps; (9) restore to the original raw shape
        (nearest for labels, :1190-1223).
      published_defaults: >-
        stride [24,64,64] on patch [32,96,96], batch_size 12, score_thresh 0.7, mask_thresh 0.5,
        min_edge_area 64, topk_postprocess 300 - identical in the Space adapter (backend/inference.py
        :249-255) and in notebooks/01_inference.ipynb, so they are the publisher's defaults and not
        a demo tweak.
      the_two_parameters_that_are_ours_to_set:
        z_ratio: 4.0
        z_ratio_derivation: 1.625 / 0.40625, exact, from the atlas scale in AGENTS.md s4
        cell_radius_xy_px: 12.0
        cell_radius_derivation: >-
          MEASURED on the DENSE deployed pre-ILP node surface (C:/temp/p34_f1/preilp_split1.parquet,
          40 crop-frame groups grouped by (dataset,t), median 66 nodes per group): median
          nearest-neighbour spacing 9.75 um (IQR 9.33-10.07) = 24.0 XY px, so radius ~= 12.0 px.
        a_wrong_turn_recorded_so_it_is_not_repeated: >-
          The same measurement run on the GT first returned 22-37 um and an implied radius of 27-46
          px. That is WRONG and is discarded: the GT is sparse (FACT-0354's validity note - 861
          annotated cells against ~6,362 present), so GT nearest-neighbour distance measures
          ANNOTATION SPACING, not nucleus spacing. Only the dense predicted surface answers this.
        calibration_guard_passed: >-
          The same distance code reproduced the independently known GT displacement median on crop
          6bba_062c8d37 at 1.8168 um against FACT-0040's 1.817 um, so the (z,y,x) convention and the
          anisotropic scale are right before any derived quantity was trusted.
        why_it_is_lucky: >-
          12 against a reference of 15 means a resample factor of 0.8 - a mild 1.25x XY upsample and
          no Z change at all. Our crops (64,256,256) become (64,320,320). We are near the model's
          native scale, which is the regime where a foreign segmenter has any chance of joining.
    boundary_questions_asked_at_build_time:
      - >-
        AUTOCAST ACROSS REPLICA THREADS. inference_win.py:796 wraps the forward in torch.autocast,
        which is THREAD-LOCAL. Wrapping this model in nn.DataParallel for T4x2 would silently drop
        autocast in the replica threads - AGENTS.md s5 and the FACT-0060 class, guaranteed on every
        run on this hardware. RESOLUTION: do NOT use DataParallel. Run one process per GPU, crop A
        on cuda:0 and crop B on cuda:1. The two-crop design and the boundary-safe design are the
        same design, which is why step 4 is shaped that way.
      - >-
        THE EMBEDDING HOOK ACROSS A PROCESS BOUNDARY. The per-query embeddings are captured by a
        forward hook on a module object. A hook registered in the parent does not exist in a
        DataLoader worker or a prediction subprocess - the FACT-0060 failure exactly. RESOLUTION:
        data_loader_num_workers=0 (which is also what the publisher's own Space forces, backend/
        inference.py:246) and the same process that owns the hook writes the table to disk. Nothing
        is handed across a subprocess.
      - >-
        THE MOUNT ROOT. All dataset access goes through the ONE central bounded resolver,
        scripts/kaggle_edits/kaggle_mount_ladder.py biohub_mount_find(), proved on CPU by
        scripts/win_bet/kaggle_mounts.py (which execs that same file rather than re-implementing it)
        and driven by scripts/win_bet/gpu_preflight.py. No path is written by hand. FACT-0397 cost a
        full session to exactly this, with the fix already in a file the failing notebook loaded.
    a_silent_no_op_found_in_the_publisher_s_loader:
      where: inference_win.py build_predictor, at the load_state_dict call and the ~8 lines after it
      what: >-
        The load is strict=False and the two prints that would report the missing and unexpected key
        counts are COMMENTED OUT. A checkpoint whose keys do not match the built model therefore
        loads SILENTLY and the model runs on random weights - which on a 300-query segmenter looks
        like "the foreign model does not join to our nodes", i.e. exactly falsifier (d).
      mitigation_binding_on_step_4: >-
        Our wrapper asserts len(missing) == 0 and len(unexpected) == 0 after unwrapping, prints both
        counts, and refuses to proceed otherwise. A positive heartbeat carries the two counts and
        the checkpoint sha256, so its ABSENCE is the alarm. This is the AGENTS.md "silent no-op is
        worse than a crash" rule applied to somebody else's code, and it is the single most likely
        way this lever would produce a false negative.

  # -------------------------------------------------------------------------------------------
  step_4_prepared_not_run:
    status: >-
      DESIGNED AND COSTED. Not launched. No kernel pushed, no GPU job, no submission. It is one
      command once the host allocates a slot, with the two build inputs below staged first.
    what_it_is_and_is_not: >-
      It answers falsifier (d) - do FOCUS-3D instances JOIN to our node surface - and gives the
      first read on (g), localisation. It CANNOT answer (e) or (f): two crops carry roughly 100-120
      contested targets against the 4,157 and 26,601 populations FACT-0414 and FACT-0413 were
      measured on. Saying so now is the point. (f) needs a full-fold embedding cache, which is a
      separate and much larger GPU ask that must NOT be committed until (d) passes.
    the_reusable_asset_under_the_standing_gpu_rule: >-
      A per-node embedding table for matched official nodes - a reusable feature dataset, which is
      the first item on the standing rule's list. One row per matched node: crop, t, node_id, the
      288-d query embedding, the query's score, the mask volume, the centroid residual to the node,
      and the match flags. 288 float16 per node is 576 bytes; 10,000 nodes is under 6 MB. Even if
      every scientific verdict comes back null, the table is the asset and step 5 consumes it on CPU.
    where_the_embedding_comes_from: >-
      mask2former_transformer_decoder_3d_win.py:1263-1264, decoder_output = self.decoder_norm(output)
      then transpose to (N, Q, 288) - the per-query embedding immediately before class_embed and
      mask_embed consume it. A forward hook on decoder_norm captures it additively. The model's
      public return carries only pred_masks / pred_scores / pred_classes, so without the hook there
      is no representation to test and the lever cannot be run at all.
    passivity: >-
      Stronger than the P36 tap's situation, because this is not a tap into the deployed model at
      all - it is a separate model reading the same voxels. STATIC PROOF: the FOCUS stage touches no
      prediction cell; the deployed export is written and sha256-ed BEFORE the stage runs. IN-KERNEL
      PROOF: the same sha256 is recomputed after the stage and asserted equal, and the geff node and
      edge counts are re-read and asserted unchanged. INERT UNLESS ARMED: with BIOHUB_FOCUS3D_DIR
      unset the stage records nothing and writes nothing, following
      scripts/kaggle_edits/assoc_feature_tap.py's contract exactly. Anchors fail closed.
    matching_protocol:
      against: BOTH the official predicted nodes and GT, reported separately and never pooled
      radii: >-
        the competition radius 7.0 um AND the division-sensitive 3.0 um radius of FACT-0380, both
        reported, because the second is the one the localisation half of this lever lives or dies on
      matcher: >-
        the same one-to-one bipartite matcher at scale (1.625, 0.40625, 0.40625) that FACT-0354 and
        FACT-0368 share, so the recall numbers are comparable to the registry rather than adjacent
      reported: >-
        matched-node recall at both radii; duplicates, merges and splits; centroid residual
        distribution; instance count against N_pred and n_est; per-fold and per-embryo-direction,
        never pooled (AGENTS.md s4)
      gate_on_d: >-
        preregistered here: if matched-node recall against the OFFICIAL predicted nodes at 7 um is
        below 0.60 on either crop, falsifier (d) fires and the lever dies on its own evidence
        without a second GPU session
    sizing_measured_on_cpu:
      volume_after_preprocessing: (64, 320, 320) from (64, 256, 256) at cell_radius 12 / z_ratio 4.0
      patches_per_frame: 75 (Z 3 x Y 5 x X 5 at patch [32,96,96], stride [24,64,64]), before background skipping
      patches_per_full_crop: 7500 (100 frames)
      proposed_scope: 2 crops x 8 frames = 16 volumes = 1200 patches, one crop per GPU
      expected_node_yield: ~1,000-2,300 matched-node rows, which is ample for (d) and (g) and deliberately not for (e)/(f)
    runtime_and_memory_honestly:
      cpu_measured: 20.2-21.5 s per patch at batch 1-2, torch 2.13.0+cpu, 4 threads
      gpu_UNMEASURED: >-
        No GPU throughput number is offered, because none was measured and this session had no GPU.
        1,200 patches is between 4 minutes and 40 minutes on a T4 for any plausible per-patch time
        between 0.2 s and 2 s. That range is too wide to plan against, which is why the job opens
        with a timing probe rather than an estimate.
      device_memory: >-
        Weights are 1.647 GB fp32 MEASURED. Activation peak is UNMEASURED; the dominant term is the
        300 x 32 x 96 x 96 mask tensor per patch, ~340 MB in fp16 at batch 1 and ~4.1 GB at the
        published batch 12, so 16 GB per T4 is comfortable but batch 12 is not free. The probe
        reports torch.cuda.max_memory_allocated and the run steps batch down if it exceeds 10 GB.
      the_budget_guard: >-
        FIRST ACTION is a 20-patch timing probe that prints seconds/patch and peak memory and then
        extrapolates. If the extrapolated full job exceeds 45 minutes the run reduces frames per
        crop until it fits, and if 20 patches alone exceed 5 minutes it ABORTS and writes the probe
        result as the session's asset. Under the standing GPU rule the session cannot end with
        nothing: the probe itself is a recorded environment measurement, and the embedding table is
        the real asset.
    two_build_inputs_still_to_stage_on_cpu:
      - >-
        the weights, as a Kaggle dataset - BLOCKED THIS SESSION, see below. Preferably the extracted
        ~1.65 GB state_dict rather than the 4.47 GB training checkpoint.
      - >-
        the runtime, as a Kaggle dataset - the ~30 pure-Python files already mirrored at
        C:/temp/focus3d/src/focus3d_runtime plus configs/3d_test.yaml, carrying the BSD-3-Clause and
        Meta MIT notices
    blocker_for_the_host:
      what: >-
        The 4.47 GB checkpoint download was REFUSED by the permission system, three times, on three
        reasonable invocations (background, foreground, and via a written script). The coordinator's
        authorisation is not the permission system and does not override it.
      consequence: >-
        Everything that needs the tensors is unmeasured: the real sha256, the true parameter count in
        the file, the wrapper structure, the key prefixes, the non-tensor keys, and the
        missing/unexpected sets against our 886 keys. Nothing else in steps 1-3 depends on it.
      what_unblocks_it: >-
        A Bash permission rule allowing the venv python to run the download, or the host fetching
        model_final_nuclei.pth to C:/temp/focus3d/ by hand. The HF gate is already accepted on the
        host's account, so no further licence action is needed. Roughly 15 minutes of CPU work
        follows: hash, unwrap, structure report, strict-load against the built model, and the slim
        state_dict extraction.

  auditor_veto_v3_response:
    veto_accepted_in_full: true
    what_was_wrong: >-
      The parameter count and the state-dict entry count were labelled MEASURED. They came from
      instantiating the architecture with random initialisation via an uncommitted scratchpad
      script, with no checkpoint and no sha256. AGENTS.md requires MEASURED to be computed from a
      named artifact by COMMITTED code and VERIFIED to be re-derived at a named file:line or by
      rerunning committed code, and neither held. The auditor's central point is the one that
      matters: an architecture-instantiation count is NUMERICALLY IDENTICAL to a count off the
      released tensors, so nothing in the artifact let a reader tell them apart. That is the
      FACT-0043 shape.
    fixes_applied:
      - >-
        A COMMITTED INSTRUMENT NOW EXISTS: scripts/win_bet/focus3d_probe.py, with three subcommands
        (arch / ckpt / radius) and the heartbeat FOCUS3D_PROBE_COMPLETE.
      - >-
        THE DISTINCTION IS NOW MECHANICAL RATHER THAN EDITORIAL. Every payload carries
        `evidence_source`, and the `arch` mode hard-codes `provenance_ceiling: UNVERIFIED` with the
        reason in its own output. The only VERIFIED-capable mode is `ckpt`, which requires a real
        checkpoint file and records its sha256. A mode that cannot see tensors says so itself.
      - >-
        The parameter-count candidate fact is relabelled UNVERIFIED with the correction written
        into it, and both surviving CPU numbers were RE-RUN through the committed path.
      - >-
        The cell-radius fact is now genuinely MEASURED - committed code over the named artifact
        C:/temp/p34_f1/preilp_split1.parquet - and its FACT-0040 calibration guard runs inside the
        same instrument, returning 1.8168 um on 6bba_062c8d37 against the anchor's 1.817.
      - >-
        R7 fixed: `host_authorisation_2026_08_30` is recorded above with the host's exact words, and
        the one `forbidden` entry about accepting access conditions is amended. Every other
        prohibition is unchanged - no GPU launch, no kernel push, no submission, no touching the
        deployed node surface or detector.
    what_the_auditor_correctly_observed_about_the_download: >-
      There is no model_final*.pth anywhere and the HF blobs/ cache is empty holding only README.md.
      That is accurate. The download was ATTEMPTED three times - backgrounded, foregrounded, and via
      a written script - and REFUSED each time by the permission system. The coordinator's
      authorisation is not the permission system and does not override it, so the refusal stands
      until the host grants a Bash permission rule or fetches the file by hand.
    what_the_veto_does_NOT_touch: >-
      The three verdicts are unaffected, because none of them rests on the parameter count.
      Admissibility rests on quoted rule text; contamination rests on the publisher's own dataset
      portal; and packaging rests on a file:line source read of the released CODE, which contains no
      compiled op whether or not the released WEIGHTS ever load.


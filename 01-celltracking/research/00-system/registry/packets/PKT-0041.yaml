id: PKT-0041
title: "AGENT 5 - FOCUS-3D as a bounded THIRD REPRESENTATION TRUNK, admissibility first and compute last"
lever: LEVER-0043
owner: agent-5-focus3d-integration
lock: done
opened: '2026-08-30'

host_authorisation_2026_08_30:
  quoted_verbatim: "I give the go for FOCUS-3D - we have authority to use."
  relayed_by: coordinator (primary agent), 2026-08-30
  what_it_releases: >-
    Falsifier (a) is released ON THE AUTHORITY AXIS ONLY. The access conditions may be treated as
    already-granted host authority, the weights may be downloaded, and the asset may be used for
    OFFLINE experimentation. Recorded here rather than in the lever because the coordinator owns
    levers.yaml and this packet owns its own file.
  what_it_does_NOT_release:
    - >-
      THE COMPETITION-RULES FINDING. Host authority settles our right to use the asset. It cannot
      change what the competition's external-data and pretrained-weights rules say, and those govern
      whether a SUBMISSION built on it is valid. The rules verdict below is therefore filed as a
      PRECONDITION ON ANY FUTURE SUBMISSION, not as a gate on this lever's science. Every offline
      result in steps 4-5 stays valid and interpretable regardless of how it lands.
    - >-
      CONTAMINATION. Authority to USE is not the same as offline evaluation being INTERPRETABLE.
      Step 2 ran as written and its verdict is recorded BELOW, before any number was produced.
    - >-
      GPU. No kernel push, no GPU job and no submission without a separate explicit authorisation.
  observed_state_of_the_gate: >-
    No acceptance action was needed or taken by this packet. The Hugging Face gate on
    Qinghua-thu/FOCUS-3D is `gated: "auto"` and was ALREADY accepted on the host's account (HF user
    AryaArun): the gated README fetches successfully with the cached token, whereas an unauthenticated
    fetch returns HTTP 401 "Access to model Qinghua-thu/FOCUS-3D is restricted".

why_this_is_not_a_detector_lever: >-
  Stated first because it is the obvious misreading and because LEVER-0031's decomposition rule forbids the
  umbrella form. This packet does NOT replace the node surface and does NOT touch detection. FACT-0354 shows
  almost no recall headroom below the deployed threshold on fold 0 and FACT-0368 puts the large majority of
  the fold-0 gap in association, so a node-surface replacement would buy little against real merge/split/count
  risk. If FOCUS-3D is later proposed as the node source, that is a different lever carrying the LEVER-0031
  family's split_0 detection-parity gate, and it is not this one.

claim: >-
  A frozen foreign instance-query representation can be licensed, packaged, joined to our existing node
  surface, and shown either to add contested-parent ranking skill that TRANSFERS between folds, or to improve
  division-sensitive localisation without damaging node recall - or to do neither, decisively and cheaply.

falsifier: >-
  Inherited verbatim from LEVER-0043 (a) through (g) and NOT relaxed here. The two that decide the packet's
  shape are (a), the licence and prize-rules check, which can end the lane before any compute is spent, and
  (f), the diagnostic falsifier: if FOCUS embeddings improve the DISCOVERY fold and fail to transfer to the
  honest fold, reproducing the FACT-0414 pattern on a representation architecturally unrelated to ours, then
  our trunk is NOT the cause of the inversion. That is a finding this packet reports as a success of the
  experiment and a refutation of the hypothesis, never as a null to be retried with a different head.

prediction: >-
  Stated before any download. I expect (a) and (b) to be the real risks and I expect them to be resolvable
  only by reading the artifact and the competition rules, not the model card - the project is pre-alpha with
  no published paper, so every architectural and training-data claim about it is EXTERNAL in the AGENTS.md
  sense until measured. On the science I expect the join in step 3 to be the first hard technical gate: a
  query-based segmenter tuned on other microscopy will produce instances that do not trivially correspond to
  our peak-derived nodes, and matched-node recall is what decides whether any embedding claim is reachable at
  all. On (e) I hold no strong prior; on (f) I note explicitly that a FAILURE to transfer would be the most
  INFORMATIVE outcome available this cycle, which is a reason to run it and not a reason to expect success.

inputs:
  facts: [FACT-0354, FACT-0368, FACT-0380, FACT-0386, FACT-0413, FACT-0414, FACT-0415, FACT-0378,
          FACT-0392, FACT-0061]
  artifacts:
    - C:/temp/p34_f1/          # fold-1 widened surface, audited
    - C:/temp/p30_f0/          # fold-0 promotion gate
    - _evidence/assoc/tournament/
  code:
    - scripts/win_bet/assoc_train_harness.py     # consumes a trunk; do not fork it
    - scripts/win_bet/assoc_parent_dataset.py    # the frozen surface and label contract
    - scripts/win_bet/assoc_report.py            # the only promotable summary

method: >-
  FIVE STEPS, STRICTLY ORDERED, EACH GATING THE NEXT. The order is the design: the cheapest thing that can
  end the lane runs first.
  (1) ADMISSIBILITY, CPU, NO DOWNLOAD OF GATED WEIGHTS. Read the competition's external-data and pretrained-
  weights rules at source and record whether a checkpoint behind accept-to-access conditions qualifies.
  Record the code licence and the weights licence SEPARATELY - they differ here - and record the attribution
  obligations each imposes. NOTE: accepting the access conditions is an agreement made in the HOST'S name and
  this packet MUST NOT accept them; it prepares the question and the host answers it.
  (2) CONTAMINATION, CPU. Record the published training-data inventory and check it against the competition
  movie sources. If it overlaps, the weights may still be legitimate to USE while their offline evaluation
  becomes un-interpretable in exactly the FACT-0378 way, and that restriction is recorded BEFORE any number
  is produced, not after.
  (3) PACKAGING, CPU. Reproduce the exact inference environment offline. Detectron2 and the 3D deformable-
  attention components are the named risks. Record parameter count, checkpoint structure, preprocessing and
  every dependency by version. This is where FACT-0392's trunk-identity risk is answered for a THIRD trunk.
  (4) ONE TWO-CROP PASSIVE GPU DIAGNOSTIC, and only after PKT-0037 preflight and PKT-0036 clearance. It must
  produce a REUSABLE ASSET or it must not run: the asset is the per-node embedding table for matched official
  nodes. It reports instance masks and centroids matched against BOTH the official predicted nodes and GT;
  recall at the competition radius AND the division-sensitive radius (FACT-0380); duplicates, merges, splits,
  centroid residuals; runtime and peak memory; and the query or pooled mask embeddings for matched nodes.
  PASSIVE means it changes no deployed output - proven statically and in-kernel, as the P36 tap was.
  (5) CPU ASSOCIATION TEST ON BOTH FOLDS through the existing harness, as an ADDITIONAL trunk beside the
  existing ones - never as a replacement, so trunk identity is never confounded (FACT-0392). Report the
  fold-transfer behaviour explicitly against FACT-0414's pattern, and emit the unified lost-edge ledger.

budget:
  gpu_sessions: 1   # ONE two-crop passive diagnostic, and only when a slot is genuinely free
  submissions: 0    # no submission at any stage of this lever without a new preregistration
  wall_clock: 2-4 days, CPU steps first

sequencing: >-
  THE PRIMARY LANE OUTRANKS THIS PACKET FOR COMPUTE. FACT-0061 caps concurrent GPU batch sessions at two, and
  Phase 2's contract-2 smoke plus Phase 3's fold caches are the primary 0.950 lane. Steps 1-3 are CPU and run
  in parallel with everything. Step 4 waits for a genuinely free slot and does not pre-empt the association
  cache. This is a sequencing decision about scarce compute and it weakens none of this lever's gates.


  A HIGH RESULT LICENSES EXACTLY ONE FURTHER LOOK - EITHER an independent kernel rerun producing a
  SEPARATELY AUDITED artifact, OR one different safe setting. NEVER BOTH.
  AN IDENTICAL ARTIFACT HASH IS NEVER RESUBMITTED: Kaggle scoring is deterministic for the same file, so a
  resubmission of identical bytes measures nothing and spends a look. Replication counts only if an

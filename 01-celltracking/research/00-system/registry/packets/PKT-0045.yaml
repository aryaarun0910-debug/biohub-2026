policy_basis: >-
  The submission policy adopted 2026-08-31 after the macro review. Offline retains veto over validity,
  provenance, leakage, integer export, graph invariants, catastrophic node/edge loss and division-TP
  regression, and retains its diagnostic and prioritisation role - but it LOSES veto over MAGNITUDE, because
  FACT-0344 records an arm reading +0.002 offline and scoring -0.014, and FACT-0345 records a three-to-four
  fold under-read in the other direction. The leaderboard is the instrument for external direction and
  magnitude. Eligibility is one clean fold with positive full-chain evidence, the other flat but not
  materially unsafe. Belief promotion still requires both folds or independent corroboration; THIS
  SUBMISSION DOES NOT PROMOTE ANYTHING TO ESTABLISHED CAPABILITY.

claim: >-
  The fold-0 combined-score gain measured under the deployed relink at bonus 2.0 transfers to the hidden
  test substrate.

falsifier: >-
  PREREGISTERED BEFORE THE BUILD, three-way on purpose because FACT-0412 records public-LB variance as being
  of the order of the effect under test, and forcing a binary is how PKT-0039's +0.001 pass ended up weak.
  AT OR BELOW 0.930 - kills the tested GLOBAL b2 AMPLIFICATION ON THE HIDDEN SUBSTRATE. It does NOT establish
  that the hidden set behaves like fold 1, and it must not be reported that way; it is a fact about this
  setting on that substrate.
  AT OR ABOVE 0.935 - strong leaderboard evidence of POSITIVE TRANSFER FOR THIS SETTING. It is NOT general
  confirmation of the consumption thesis, which is Gate B's question and is unresolved.
  0.931 TO 0.934 INCLUSIVE - UNINFORMATIVE, DECLARED IN ADVANCE. Licenses no follow-up and closes nothing.
  Naming this band before the score exists is what stops it being rationalised into a win afterwards.

prediction: >-

id: PKT-0024
title: "LEVER-0028: crop-adaptive node budgeting - candidate-score exporter first, then a frozen budget function screened on P28"
lever: LEVER-0028
owner: primary
lock: done
opened: '2026-08-28'

claim: >-
  Re-thresholding the detection candidate set PER CROP toward that crop's estimated_number_of_nodes (instead of the
  single global 0.96875) recovers the under-detected embryo class and beats the best global threshold on BOTH folds
  of the P28 champion substrate, clearing the +0.003 both-fold promotion bar before one P24-based submission.

falsifier: >-
  Any of: (a) the frozen crop-budget function does not beat the best GLOBAL threshold on both folds offline on P28;
  (b) the clean fold-1 (6bba) paired-delta CI does not exclude zero; (c) a positive score is an artifact of the
  node-count adjustment masking an edge-term loss (checked by reporting adj WITHOUT the count term); (d) it does not
  reach the +0.003 both-fold bar. Near-zero offline is NON-DECISIVE (FACT-0345), not a kill; a LARGE negative kills.

prediction: >-
  Node budgeting is DeepCenter-independent, so it is screenable offline on P28 (FACT-0345). 44b6 is under-detected
  (0.888 of estimate vs 6bba 0.988), so budgeting should help fold 0 more; fold 1 is the deciding clean CI. Expected
  small-to-moderate; the band is written only after the frozen function is fit and its candidate sidecar exists.

inputs:
  facts: [FACT-0102, FACT-0335, FACT-0345, FACT-0346, FACT-0261]
  artifacts:
    - C:/temp/p28_f0/, C:/temp/p28_f1/            # the 0.928-base screening substrate (FACT-0345)
    - C:/temp/p20_relink_sweep_f0/, C:/temp/p19_relink_sweep_f1/   # for the substrate-equivalence sentinel
    - data/train/*.geff                            # estimated_number_of_nodes per crop
  code:
    - vendor/kaggle-cell-tracking/scripts/predict_unet_transformer.py  # extract_peaks:255-291 (the score site)
    - scripts/win_bet/ea_atlas.py + tracking_cellmot.summarise         # the scorer round-trip

method: >-
  STEP 0 (substrate sentinel, per the host caution): replay ONE orthogonal DeepCenter-independent transform on BOTH
  p20/p19 and P28 and confirm the paired deltas agree within noise before treating P28 as equivalent for independent
  levers. STEP 1 (prerequisite, FACT-0346): build a candidate-score exporter - patch extract_peaks to emit every
  local-max peak with sigmoid(logits) at a near-zero floor into a per-crop sidecar; one Kaggle run on the champion
  config, both folds. STEP 2: FREEZE ONE crop-budget function (a monotone map from the crop's candidate-score
  distribution / estimated_number_of_nodes to a per-crop threshold; NO embryo-name routing). Fit it in ONE direction
  (one fold), apply UNCHANGED to the other. STEP 3: rebuild each crop's node set at the per-crop threshold, re-link
  via the champion pipeline (or a fixed offline linker if a full re-run is too costly), and score on P28 with
  ea_atlas + summarise. Report separately: edge TP/FP/FN, the node term, adj WITH and WITHOUT the count adjustment,
  node_recall, per fold, paired crop bootstrap. STEP 4: only a both-fold win over the best global threshold, clean
  fold-1 CI excluding 0, and >= +0.003 both folds licenses ONE P24-based submission with a pre-registered band.

budget:
  gpu_sessions: 4 diagnostic sessions (initial smoke exposed duplicate writes; one repaired smoke + one full export per fold), plus at most 1 budgeted relink only after thresholds freeze
  submissions: 1 (only if the offline bar is cleared)
  wall_clock: 2-4 days

forbidden:
  - embryo-name or dataset routing in the budget function (FACT: no-family-routing contract)
  - fitting and reporting on the same fold without the reverse direction
  - a submission on a near-null offline gain (FACT-0345: tiny offline deltas are ambiguous)
  - float-coordinate export (FACT-0344, LB-unsafe)
  - lowering the promotion bar below +0.003 both folds
  - .claude/settings.json

outputs:
  evidence: C:/temp/node_budget/ and _evidence/node_budget/
  facts_added: [FACT-0350, FACT-0351, FACT-0352, FACT-0353, FACT-0354, FACT-0355]
  record: >-
    One section per step in research/06-knowledge-system/experimental-records.md

closed: '2026-08-28'

result: >-
  CLOSED. The lever is KILLED at its premise and the packet spent zero submissions and no extra GPU beyond the
  two exports it had already licensed.

  STEP 0 FIRED (FACT-0350): the fixed-tolerance sentinel passed fold 0 but failed the clean fold 1, and the probe
  rule itself deleted scored TP edges on every substrate. Old-control deltas were therefore not inherited and
  everything below was measured directly on both P28 folds, as required.

  STEP 1 DONE. The smoke passed (FACT-0351) and both full exports (EXP-0033/0034) are fetched and audited. The
  DETECTION stage is bit-identical to the P28 champion controls on all 199 crops of both folds; fold 0 reproduces
  the champion graph exactly, fold 1 reproduces 127 of 128 with the single divergence confined to stages strictly
  after detection (FACT-0352). The sidecars are a faithful record of the P28 detection surface.

  STEP 2 REFUTED THE PREMISE INSTEAD OF FREEZING A FUNCTION. The 0.888 under-count is not a detection deficit:
  the detector already emits at or above estimated_number_of_nodes on both folds and the ILP solver then discards
  15.2% / 19.9% of those peaks, with 0.888 reproducing exactly at the post-ILP stage (FACT-0353). The whole
  available threshold band recovers 20 annotated cells on fold 0 (FACT-0354). No budget function was frozen
  because there is no detection deficit for one to close.

  STEPS 3 AND 4 NOT RUN, and they could not have been as written. FACT-0353 establishes that newly admitted peaks
  must pass edge prediction and the ILP before becoming nodes, so the offline scorer round-trip STEP 3 assumed is
  not available from a sidecar. No submission was made; the promotion bar was never approached and was not lowered.

  WHAT THE PACKET BOUGHT ANYWAY: the successor. Retention, not detection, holds the headroom - the pipeline nets
  away 133 (fold 0) and 5,000 (fold 1) annotated cells the detector had already found, one-directionally, which on
  the clean fold is 2.1x everything the entire sub-threshold band could recover (FACT-0355). That is LEVER-0035,
  and it is instrumentable the same cheap way: a passive pre-ILP export makes the solver-weight sweep a CPU replay.

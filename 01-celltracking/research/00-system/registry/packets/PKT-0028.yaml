id: PKT-0028
title: "One preregistered submission of the exact public-0.931 configuration, as the transfer control"
lever: LEVER-0038
owner: primary
lock: claimed
opened: '2026-08-29'

claim: >-
  The public configuration reported at 0.931, run byte-identical on our account, scores above our deployed
  champion (FACT-0341) and therefore establishes that the lineage transfers to our deployment - giving a
  stronger baseline from which the association work proceeds.

falsifier: >-
  The submission scores at or below the champion. That would mean the reported 0.931 does not reproduce on our
  account, and the correct response is to STOP treating the public configuration as a baseline rather than to
  hunt for which knob was mis-copied - the notebook is run unmodified, so a miss is a fact about the
  configuration or the leaderboard, not about our transcription.

prediction: >-
  Stated before the run, low band promoted per the packet convention. Central estimate 0.929, band 0.925-0.932.
  Reasoning: the reported 0.931 is a public-LB number on a lineage we share, and our champion is 0.928 on the
  same board, so the differences are real but small; public-LB variance and the possibility that the report is
  a best-of-several observation both argue against expecting the full +0.003. A score at or below 0.928 fires
  the falsifier.

inputs:
  facts: [FACT-0377, FACT-0378, FACT-0341, FACT-0368, FACT-0376, FACT-0371]
  artifacts:
    - notebooks/kaggle_p32_public931_exact/biohub-p32-public931-exact.ipynb   # verbatim public source
    - C:/temp/intel/sn931/                                                    # pull and dissection
  code:
    - scripts/kaggle_specs/p32_public931_exact.json

method: >-
  Run the pulled public notebook UNMODIFIED. It is not reconstructed because the single genuine
  association-side difference from our champion is the bidirectional fusion rule - harmonic-probability at
  0.15 against our plain linear blend at 0.20 - and no notebook in our tree implements harmonic_probability,
  so a reconstruction would re-derive the mechanism under test. Offline validation is IMPOSSIBLE for this
  configuration: its secondary is trained on all 199 movies, legitimate against a hidden test set but
  un-measurable by any LOEO control we can build (FACT-0378). One submission is therefore the only available
  instrument, and exactly one is spent.

budget:
  gpu_sessions: 1
  submissions: 1   # exactly one, preregistered above; no second attempt on this configuration
  wall_clock: 1 day

forbidden:
  - modifying the public notebook in any way before this submission - it is the control
  - STACKING anything of ours onto this configuration before its own score is known
  - attributing any observed gain to an individual knob; every difference is confounded
  - treating a positive result as validating the secondary consensus specifically, which our champion
    already deploys identically (FACT-0377 as corrected)
  - a second submission of this configuration to chase variance
  - .claude/settings.json

outputs:
  evidence: C:/temp/p32/ and _evidence/p32/
  facts_added: []
  record: >-
    One compact row in research/06-knowledge-system/experimental-records.md

interpretation_rules_preregistered: >-
  Written before the run.
  (1) ATTRIBUTION IS TO THE WHOLE BUNDLE ONLY. Bidirectional fusion rule and weight, ILP disappearance and
  division weights, detector threshold, gap-2 recovery, adaptive short-track rescue, safe-division radii, and
  the DeepCenter checkpoint/veto pair are all confounded. No knob may be credited.
  (2) A POSITIVE RESULT IS A BASELINE, NOT A SOLUTION. It relocates the starting point; it does not advance
  the association capability the ceiling analysis says is needed (FACT-0368).
  (3) DIVISION IS REPORTED SEPARATELY at every subsequent gate, and a gain here is never read as division
  recovery (FACT-0371 host caution).
  (4) IF IT LOSES, the public lineage is not our baseline and the campaign continues from P24 unchanged. That
  is an informative outcome and costs one slot.

result: null

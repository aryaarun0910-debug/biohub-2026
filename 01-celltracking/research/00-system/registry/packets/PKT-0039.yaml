  (5) WHAT THE PREFLIGHT ESTABLISHED THAT WAS NOT KNOWN. Read from the fetched kernel logs of both scoring
  runs, now at _evidence/exploit931/p32_kernel.log and p24_kernel.log: the released 0.931 base LOADS A

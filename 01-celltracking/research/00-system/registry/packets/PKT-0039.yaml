central_preflight_adjudication: >-
  BOTH PREFLIGHTS WERE RUN AND BOTH ARE REPORTED. Agent 1's central scripts/win_bet/gpu_preflight.py
  landed while this treatment was being built, so it was run as well:
  `gpu_preflight.py run --spec scripts/kaggle_specs/p35_dcveto_on_931.json`, receipt at

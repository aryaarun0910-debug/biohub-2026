  adjudicated here rather than waved away. It is written for the Gate-1 / association-feature kernels, and
  four of the seven failures ask this submission notebook for things that exist only in those:
  PF03 wants an expected CROP COUNT and crop names, PF07 wants an _AFP_WORKER literal, PF08 wants
  assoc_feature_parity.json in the export keep-set, PF10 wants the ASSOC_FEATURE_PARITY_COMPLETE heartbeat.
  None applies to a full inference-and-submission notebook. Of the remaining three:
  PF01 is a GOVERNANCE condition and it is REAL - it fails only because the spec and the built notebook are
  UNCOMMITTED, which this packet is forbidden to change. Everything PF01 actually compares agrees: notebook
  sha equals manifest built sha, metadata slug equals spec slug, dataset list, competition source, GPU and

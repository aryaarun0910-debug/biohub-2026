  requires it to reproduce BOTH scored runs, and only then reports the treatment - which resolves to
  best.pt epoch 2 under BOTH mount conventions.
  (7) WHAT IT DOES NOT LICENSE. Nothing about the score. This configuration cannot be validated offline at
  all (FACT-0378, FACT-0393 rule 4). The band above is a prior. The notebook prints a PROXY_SCORE over the

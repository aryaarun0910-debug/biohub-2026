  executing the notebook's own ladder.
  RESIDUAL RISK CARRIED KNOWINGLY: the base's _dc_checkpoint_candidates contains an unbounded `**` glob
  under /kaggle/input, which PF02 did not assess because the function's name does not match its resolver

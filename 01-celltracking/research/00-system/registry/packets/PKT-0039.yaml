claim: >-
  Exchanging ONLY the collapsed DeepCenter/veto configuration in the public 0.931 base for the P24
  best-checkpoint plus safe-division-veto bundle scores above 0.931, establishing an intermediate baseline
  without touching the association capability the 0.950 route depends on.

falsifier: >-
  The one preregistered submission scores at or below 0.931. Because exactly one component is exchanged on
  an otherwise byte-identical base, a miss is a fact about that component ON THIS BASE - not an invitation to
  sweep its neighbours. THE LANE ENDS EITHER WAY. There is no second exploitation experiment, no follow-up
  tuning, and no stacking, whatever the score.

prediction: >-
  PREREGISTERED 2026-08-30 BEFORE THE TREATMENT WAS BUILT, and written verbatim into
  submission_description below so Kaggle timestamps it earlier than the score (FACT-0396).
  NAIVE MODAL ESTIMATE, REJECTED: base + the full FACT-0341 delta = 0.934. It is rejected because
  the modal estimate has run optimistic on this campaign and because the component is not additive
  by construction - see the reasoning below.
  PREREGISTERED CENTRAL: 0.931 - the LOW band promoted to the central per packet convention. The
  modal outcome I actually expect is NO CHANGE, which means my own central estimate SITS ON the
  falsifier. That is deliberate and is stated now so it cannot be reinterpreted later: this lane is
  a cheap capped test of a component we like, not a result we expect.
  PREREGISTERED BAND: 0.927 to 0.935.
  FALSIFIER (unchanged, fixed by the lever): a score AT OR BELOW 0.931.
  REASONING, both directions.
  FOR a gain: (a) FACT-0341 measured this exact three-variable exchange on our own substrate,
  moving the P9 lineage by its recorded delta, and FACT-0345 records our offline instrument
  under-reading its leaderboard contribution three to four times, so a small offline signal is not
  evidence of a small leaderboard one. (b) The exchange is not a threshold nudge: on the released
  base the DeepCenter detector is LOADED BUT INERT on the division path - the fetched kernel log of
  the scoring run shows deepcenter_rejected=0 on every movie because the safe-division veto is off,
  and the gap veto runs on the collapsed epoch-500 prior that FACT-0312 measured at zero acceptance.
  The base pays for a detector that decides nothing. (c) The base safe-division radii sit close to
  the radii the P24 A/B was measured at, so the candidate population the veto filters is not alien.
  (d) The base own validator reports a very low division jaccard, so there is real division headroom.
  AGAINST a gain: (e) the two mechanisms act on stages the public bundle has already changed -
  gap-2 recovery and adaptive short-track rescue are both ON here and were both OFF in P24, so
  making the gap veto live ADDS repairs on top of an already more permissive regime, where extra
  adds are likelier to be spurious. (f) The safe-division veto is a PRUNER: it can only subtract
  from the division edges the base already adds, and FACT-0345 records it lowering node recall
  slightly, so its sign on this base is genuinely uncertain. (g) The base is already above the P9
  substrate the delta was measured on, and nothing guarantees the same headroom survives.
  (h) Public-LB variance alone is of the order of the effect under test.
  NOT A MEASUREMENT: this configuration cannot be validated offline at all (FACT-0378, FACT-0393
  rule 4). The band is a PRIOR. No offline check performed for this packet licenses any part of it.

submission_description: >-
  PREREGISTERED before build (PKT-0039 / LEVER-0042). Treatment = the released public-0.931 base
  with exactly one component exchanged: DeepCenter checkpoint best.pt epoch 2 plus safe-division
  veto ON (the P24 bundle, FACT-0341). Nothing else touched - no threshold, candidate, rescue or
  stacking change. CENTRAL 0.931 (low band promoted; naive modal 0.934 rejected as optimistic).
  BAND 0.927-0.935. FALSIFIER: score at or below 0.931. One submission only; this lane ends either
  way, win or lose, with no follow-up tuning of the public lineage.

inputs:
  facts: [FACT-0393, FACT-0341, FACT-0345, FACT-0377, FACT-0378, FACT-0396]
  artifacts:
    - notebooks/kaggle_p32_public931_exact/       # the 0.931 base, released champion
    - C:/temp/queue/p24_deepcenter_best_veto/     # the P24 artifact, receipt-passing
  code:
    - scripts/kaggle_specs/p32_public931_exact.json
    - scripts/core/kaggle_factory.py
    - scripts/win_bet/audit_release_receipt.py

method: >-
  ONE controlled treatment, in this order and no other. (1) Preregister the band and falsifier HERE and in
  the submission description. (2) Build the treatment on the P32 base with exactly one component exchanged -
  the DeepCenter checkpoint and safe-division-veto pair - and nothing else touched. (3) CPU PREFLIGHT, which
  is now mandatory before any GPU push (standing rule, head of levers.yaml): the exact built notebook, the
  exact datasets, the real subprocess boundary. (4) ONE GPU build. (5) Audit through
  scripts/win_bet/audit_release_receipt.py, which must bind notebook, weights, manifest, graph and score.
  (6) Submit STANDALONE, never stacked. Then stop.
  NOTE THE BUILD TRAP THIS BASE CARRIES, recorded as exception E1 of FACT-0396: the P32 spec sets
  base_notebook == built_notebook, so a rebuild consumed its own base and kaggle_factory build on that spec
  now ABORTS. The treatment spec must name a base that still exists, or restore one, before anything is
  built. Do not work around this by pointing the spec at its own output.

budget:
  gpu_sessions: 1   # Slot A
  submissions: 1    # exactly one, and PKT-0036 releases it
  wall_clock: 1 day

forbidden:
  - any second submission on this lane, whatever the first one scores
  - threshold changes, candidate widening, rescue changes, or stacking of any kind
  - crediting any individual knob of the public bundle - PKT-0028 rule (1) still binds (FACT-0377)
  - pushing to GPU before the CPU preflight passes on the exact built notebook (standing rule)
  - claiming LEVER-0041 or LEVER-0034, or editing PKT-0036, PKT-0037 or PKT-0040
  - treating an offline check as a score prediction - this base cannot be validated offline at all (FACT-0378)
  - .claude/settings.json or .gitignore
  - staging or committing to git - the primary agent commits explicit paths per packet

outputs:
  evidence: C:/temp/exploit931/ and _evidence/exploit931/
  facts_added: []
  record: >-
    One compact row in research/06-knowledge-system/experimental-records.md


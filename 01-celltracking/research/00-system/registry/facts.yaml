      GT parent/divider/daughter/granddaughter window with the official 7 um DistanceMatching, then requires a local
      directed fork whose two predicted child branches map to two distinct GT daughter lineages. Therefore 7 um is
      only the admissibility radius; spatial errors well inside it can still change one-to-one assignments, branch
      identity and whether the whole division topology is recovered
    value: 7.0

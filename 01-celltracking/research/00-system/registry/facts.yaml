      Demonstrated by running BOTH workers against one identical fixture rather than by reading either. Band B
      still compares 27 pairs under the patched worker, which is what proves the refusal is the band-A floor
      and not a collateral band-B failure. The committed worker's behaviour is not inferred from the source -
      it was executed.
    instrument: >-
      PKT-0037 mutation harness; evidence _evidence/foundations/band_a_floor_mutation.json and the pending
      change set at _evidence/foundations/pending/
    note: >-
      THIS IS A DEFECT IN OUR OWN GATE AND IT WAS FOUND BY THE PACKET WHOSE JOB IS TO DOUBT IT. Two readings
      matter more than the fix. (1) The gate exists to license two full feature-cache GPU sessions. A crop
      passing on a vacuous band A would certify nothing about the DEPLOYED band while appearing to certify
      everything, and the floor is PER-CROP, so a full uncapped run is not immune - one bad crop passes
      silently inside an otherwise real result. (2) The test suite is the sharper lesson: a green test that
      asserts a pass while the thing under test compared nothing is worse than no test, because it converts an
      untested path into a documented one. This project has now recorded that failure twice - once as a test
      that grepped source instead of running it, and now as a test that ran the code but not the branch.
      THE PATCH IS NOT APPLIED, ON PURPOSE. P33 v2 (EXP-0041) was RUNNING at every check, and editing the
      patch source mid-flight would break the version-coherence chain that makes the running kernel auditable
      against its commit. The EXTERNAL audit (scripts/win_bet/audit_p33_gate1.py) enforces band-A non-vacuity
      for this run, so the gate is sound AS AUDITED; the in-kernel floor ships in the next build, before any
      cache session.
      A FIXTURE CORRECTION TRAVELS WITH THE PATCH AND IS LOAD-BEARING: the stub features must vary between
      nodes of a frame, with a spread of 0.1 and NOT 1.0 - at 1.0 the source-axis softmax saturates and
      swallows the 0.05 perturbation the corruption test depends on, turning that test green for the wrong
      reason. Found by running it, not by reasoning about it.

  - id: FACT-0364
    statement: >-
      The deployed champion DISCARDS the ILP's edge selection: motion_relink_edges replaces the whole edge list
      and re-assigns one-to-one per frame pair, and on all 128 fold-1 crops it did so, covering a median 99.9%
      of the solver's raw edges with zero fallbacks. What survives the solver into the final graph is its NODE
      SET, not its edges. Any lever that improves the ILP's edge choice is therefore overwritten downstream and
      cannot be claimed for the champion without re-measuring through the relink
    value: 0.999
    unit: median_share_of_raw_edges_replaced_by_motion_relink_f1
    scope:
      crops_where_relink_replaced_the_edge_list: {n: 128, of: 128}
      replaced_over_raw_edges: {median: 0.9990, min: 0.9874, max: 1.0000}
      motion_relink_fallback_raw: 0
      final_edges_over_relink_edges_median: 0.9782
      surviving_ilp_contribution: node set (nodes_by_id), plus raw edge probabilities passed in as a scoring prior
    provenance: VERIFIED
    validity: VALID
    instrument: >-
      source read of the built P28 notebook - motion_relink_edges definition, the call site
      `edges = motion_edges`, and the module's own comment "motion_relink_edges replaces the whole edge list
      and assigns one-to-one per frame pair" - plus the run_stats
      motion_relink_replaced_raw_edges/raw_edges ratio over all 128 fold-1 crops of C:/temp/p28_f1
    experiment: EXP-0033
    note: >-
      STANDING DECISION (host, 2026-08-29): DO NOT RERUN THE IDENTITY ATLAS to manufacture a five-way
      classification this pipeline's structure cannot reliably distinguish. Because motion relink replaces
      the whole edge list at a median 99.9% coverage with zero fallbacks, "ILP-rejected" against
      "relink-overwritten" is near-degenerate for edges - relink overwrites essentially everything - so a
      five-way atlas would report a distinction the mechanism does not support. The atlas is THREE-WAY:
      gained, displaced, wrong parent. That is computable from what the replay already persists, and the
      control arm is complete at 71 of 71 crops; re-running both arms to chase the other two categories
      would spend that work for a split the structure cannot carry.
      This is a structural constraint on a whole class of ideas, not a detail. It says the ILP is, in the
      deployed configuration, a NODE SELECTOR whose linking is provisional. Read with FACT-0353 (the ILP is
      where 15-20% of detected peaks are discarded) the picture is consistent: the solver's job in this pipeline
      is choosing which detections are real, and motion relink then decides how they connect. The practical
      rule: score an ILP-stage change on its node set, and treat any edge-term gain measured before the relink
      as not yet transferable. The raw edge probabilities ARE passed into the relink as a scoring prior, so the
      influence is not strictly zero - it is indirect and must be measured, not assumed.
    date: '2026-08-28'
    tags: [ilp, motion-relink, pipeline-structure, lever-0035, verified]


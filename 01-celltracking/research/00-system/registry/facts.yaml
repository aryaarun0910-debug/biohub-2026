      entry's two readings did not contain. Reading (i) is retired: a head fitted on fold 0 and selected on
      nothing beats the deployed argmax on FOLD 1 with a favourable interval, which selection on the
      discovery fold cannot produce. Reading (ii) is not the answer either. GATE_A is the OUT-OF-FOLD
      COLLAPSE of a wholly optimistic in-sample signal: the refit changes the argmax on only 81 of 4,157
      contested targets, all in the lowest primary-margin quartile, and zero per cent of an apparent
      +0.024 survives honest holding-out, against 81.6% surviving on fold 1. The gating question this note
      posed is therefore ANSWERED, and the answer is about the fold-0 SURFACE rather than about the model:
      fold 0 cannot measure a parent scorer at all.
      WHAT IS NOT ESTABLISHED. Falsifiers (c), (d) and (f) are UNMEASURED and no CPU work can measure them -
      parent_conversions is PRE-ILP and FACT-0364 governs. Every verdict in the payload carries
      promotable false and the seam-calibration slot is NOT earned: it requires passing the honest fold-0
      gate, and fold 0 fails at the ranking stage before the chain is ever reached. Nothing here is read as
      division recovery (FACT-0371).
    date: '2026-08-30'
    tags: [association, parent-ranking, fold-0, gate, negative-transfer, exact-cancellation, lever-0041,

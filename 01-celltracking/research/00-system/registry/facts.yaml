  - id: FACT-0376
    statement: >-
      LEVER-0037 is a RANKING FAILURE, not a candidate-generation win. Widening the fold-0 candidate set to
      floor 0.1 with at most two parents per target raised GT-edge reach from 18,466 to 19,390 of 19,665
      detectable edges - 924 newly reachable pairs at 1.45x the candidates - and the complete chain converted
      only 28 of them into net true edges, a 3.0% conversion, while adding 113 false-positive edges. The score
      FALLS 0.00906 with a bootstrap interval of [-0.0154, -0.0034] that excludes zero, raw edge Jaccard falls
      0.00339, and division true positives drop from 5 to 4. Node retention DID improve as the mechanism
      predicted (recall 0.9868 to 0.9900, +156,408 nodes) - the extra edges do retain nodes, but the linker
      cannot pick the right parents from the wider set

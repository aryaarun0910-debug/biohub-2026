  - id: FACT-0425
    statement: >-
      THE NAMED PACKAGING BLOCKER FOR FOCUS-3D IS DEAD, AND IT WAS KILLED BY RUNNING THE GRAPH RATHER THAN BY
      READING IT. The upstream repository does ship a compiled CUDA op, so the risk was genuine, but the
      publisher already solved it for inference: adapter_modules.py:134 defines MSDeformAttn3D_PyTorch on
      F.grid_sample at :285, instantiated at :447 and :513, and the packaged runtime ships no ops/ directory
      at all, grepping zero for every compiled-op marker. The complete 411.6M-parameter graph BUILDS AND
      FORWARDS END TO END ON CPU in this repository's own venv, returning pred_masks of shape
      [300, 32, 96, 96]. No bespoke T4 / CC 7.5 wheel is required and the requirement reduces to Kaggle's
      stock torch
    value: 411638146
    unit: focus3d_parameters_in_the_instantiated_architecture_NOT_from_released_tensors
    scope:
      compiled_op_risk: RESOLVED
      pytorch_fallback: {class: MSDeformAttn3D_PyTorch, defined_at: 'adapter_modules.py:134',
                         mechanism: 'F.grid_sample at :285', instantiated_at: [':447', ':513']}
      packaged_runtime_ships_ops_dir: false
      forward_pass: {device: cpu, completed: true, output: pred_masks, shape: [300, 32, 96, 96]}
      wheel_required: false
      cpu_throughput_s_per_patch: 20.2
      gpu_throughput: UNMEASURED
      weights_fp32_gib: 1.647
      checkpoint_blob_gb: 4.469
      blob_to_model_ratio: 2.71
      blob_interpretation: the signature of a training checkpoint carrying optimizer state; ship the extracted state_dict
      geometry_fit: {our_z_ratio: 4.0, our_cell_radius_xy_px: 12.0, model_reference_radius: 15}
      parameter_count_provenance_ceiling: UNVERIFIED
    provenance: VERIFIED
    validity: VALID
    validity_reason: >-
      The blocker was retired by BUILDING AND FORWARDING the real graph on CPU, not by reading the source and
      inferring that the fallback would work - which matters because a source read cannot show that every
      instantiation path actually avoids the compiled op. The parameter count is separately and explicitly
      NOT verified: it was taken from an architecture instantiated with RANDOM weights and is numerically
      indistinguishable from a count off the released tensors, so its provenance ceiling is UNVERIFIED and
      the probe hard-codes that ceiling into its own output.
    instrument: >-
      scripts/win_bet/focus3d_probe.py, whose payloads carry an `evidence_source` field and whose `arch` mode
      hard-codes provenance_ceiling UNVERIFIED; only its `ckpt` mode, which requires a real file and records
      its sha256, can support VERIFIED
    note: >-
      TWO HAZARDS BIND ANY STEP-4 DESIGN AND BOTH ARE THE PROJECT'S OWN RECURRING SHAPES.
      (1) THE PUBLISHER'S LOADER IS A SILENT NO-OP: load_state_dict(strict=False) with its missing- and
      unexpected-key prints COMMENTED OUT. A key mismatch runs on random weights and would look exactly like
      LEVER-0043's falsifier (d) - a foreign model that will not join. Our wrapper must assert both counts and
      FAIL CLOSED. This is AGENTS.md's "a silent no-op is worse than a crash" against a loader that was built
      to be silent.
      (2) THE GEOMETRY FIT WAS NEARLY MEASURED ON THE WRONG SURFACE. Cell radius was taken on the DENSE
      deployed surface at 12.0 XY px; the GT version returned 22-37 um because the GT is sparse (FACT-0354's
      validity note) and was discarded. The FACT-0040 calibration guard was passed at 1.8168 um before
      anything derived from the geometry was trusted, per the AGENTS.md rule that a derived quantity is
      calibrated against an independently known value first.
      GPU THROUGHPUT IS UNMEASURED AND WAS NOT INVENTED. CPU is 20.2 s/patch; the proposed two-crop scope is
      about 1,200 patches, which spans 4 to 40 minutes on a T4 for any plausible per-patch time - too wide to
      plan against, so the job must open with a short timing probe that aborts and banks its own result if it
      overruns.
    date: '2026-08-30'
    tags: [focus3d, packaging, compiled-op-resolved, silent-no-op-loader, unverified-param-count,
           lever-0043, verified]


        n_crops_with_contested: 68
      linear_best: {tag: alldec.score_context.linear, contested_top1: 0.8337743565070964, delta: 0.0}
      loco_strictest: {tag: alldec.all_nine.tree.LOCO, contested_top1: 0.8369, net: 13, favourable: false}
      noise_floor:

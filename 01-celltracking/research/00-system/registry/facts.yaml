        contested_top1: 0.8366610536444551
        delta: 0.0028867
        gained: 26
        lost: 14
        net: 12
        churn: 40
        mcnemar_exact_p: 0.0806904677519924
        crop_paired_ci95: [-0.0005127538232518083, 0.006439651696616524]

  - id: FACT-0392
    statement: >-
      The binding HOCT integration mismatch is the CANDIDATE SURFACE, not the detector, and it is larger than
      the pool-kernel blocker it replaces. HOCT's candidate rule is a purely geometric 15 um ball over every
      source, uncapped and unfiltered; our deployed rule admits at most ONE parent per target by arithmetic
      (FACT-0369) and the widened P30 surface at most four. The head was trained to discriminate among
      competitors our pipeline never offers, so it CANNOT be run as a reranker of our candidate list - it
      must be given its own 15 um graph rebuilt from node coordinates. Its probabilities also carry an
      abstain mass ours lacks, so only WITHIN-TARGET RANKING is comparable and absolute levels never are
    value: 15.0
    unit: hoct_candidate_gate_um_uncapped_vs_our_one_parent_rule
    scope:
      hoct: {rule: geometric ball, gate_um: 15.0, capped: false, filtered: false, source: "cache_official_hoct_features.py:62-74"}
      ours_deployed: {max_parents_per_target: 1, mechanism: "softmax over source axis then threshold 0.5", fact: FACT-0369}
      ours_widened_p30: {max_parents_per_target: 4, floor: 0.1}
      abstain_mass: {hoct: present, ours: absent, source: "infer_stabledet_hoct.py:320-324"}
      comparability: {within_target_ranking: true, absolute_levels: false}
      rebuild_cost: {cpu_cheap: true, implemented: true, still_gpu_bound: "32-channel UNet node features"}
    provenance: VERIFIED
    validity: VALID
    validity_reason: >-
      Both rules were read at named file:line in the publisher's own code and in ours, rather than inferred
      from behaviour. The consequence - that within-target ranking is the only comparable quantity - follows
      from the abstain mass being present on one side and absent on the other, which is also read at source.
    instrument: >-
      PKT-0029 upstream audit, C:/temp/hoct/upstream_audit.json (12 items); publisher sources under
      C:/temp/hoct/code/
    experiment: EXP-0035
    note: >-
      THIS REPLACES THE BLOCKER FACT-0361 NAMED AND FACT-0379 CLEARED. The pool_kernel_um 5.0 question is
      settled and stays settled, but FACT-0379's recorded MECHANISM is amended by this audit: HOCT does not
      inherit our load_model quirk - their cache script re-injects pool_kernel_um explicitly. It is inert for
      them because the model-card configuration supplies node COORDINATES from a node graph, which overrides
      peak extraction entirely, and peak extraction is the only consumer of pool_kernel_um and det_threshold.
      The conclusion survives on stronger evidence than the one recorded.
      A THIRD RISK IS NEWLY IDENTIFIED AND UNRESOLVED, and it must be closed inside a single session rather
      than across two: WHICH TRUNK produced the 32-dim features is a --weights command-line argument, absent
      from the checkpoint. Feeding official-trunk features to a head trained on StableDet-trunk features
      would look exactly like a wrong contract. Any feature-cache run for this lever must therefore cache
      BOTH trunks and compare them in the same session, or a null result is uninterpretable.
    date: '2026-08-30'
    tags: [hoct, lever-0034, candidate-surface, integration, upstream, verified]


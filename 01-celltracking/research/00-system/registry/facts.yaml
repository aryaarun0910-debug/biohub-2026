  - id: FACT-0417
    statement: >-
      FIVE MORE DEFECTS, ALL IN THE LAUNCH-PREFLIGHT INSTRUMENT ITSELF AND ALL CAUGHT ON CPU, taking the
      running ledger of this lineage from eight to THIRTEEN: a hardcoded contract-1 band-field list; a floor
      detector matching a literal expression form rather than the behaviour; stale mutation-test names; the
      signed RECEIPT's expected_gpu_outputs hardcoded to the contract-1 parity worker; and input_hashes keyed
      on the string "None". Each produced a FALSE FAIL or a FALSE PASS against a CORRECT contract-2 notebook.
      The receipt defect is the most dangerous of the five because the POST-RUN AUDIT READS THAT FILE and
      nobody re-derives it - a correct tap run would have been failed, and a tap that recorded nothing would
      have passed unnoticed
    value: 13
    unit: cumulative_distinct_defects_in_the_gate_1_cache_and_launch_lineage
    scope:
      new_instances: 5
      prior_total: 8
      prior_total_fact: FACT-0408
      numbering_caution: >-
        PKT-0037 numbered these locally as its own instances 6 through 10. That is a PACKET-LOCAL count and
        must not be read against FACT-0402/FACT-0405/FACT-0408, whose ledger reached 8. The cumulative figure
        recorded here is 13.
      defects:
        - {id: PF05, defect: hardcoded contract-1 band fields, effect: false FAIL on a correct notebook}
        - {id: PF06, defect: floor detector matched a literal expression form, effect: false FAIL}
        - {id: PF06, defect: stale mutation-test names, effect: mutations not actually exercised}
        - {id: receipt, defect: expected_gpu_outputs hardcoded to the contract-1 parity worker,
           effect: "false FAIL on a correct run AND false PASS on a run that recorded nothing",
           read_by: the post-run audit, re_derived_by: nobody}
        - {id: input_hashes, defect: keyed on the string "None", effect: hashes silently unbound}
      also_caught: spec title would have slugified away from the declared slug, diverging the push
      selftest: 35/35
      suite: {command: "pytest tests/test_gpu_preflight.py tests/test_audit_feature_cache.py tests/test_assoc_feature_tap.py",
              passed: 146}
      caught_before_any_gpu_spend: true
    provenance: VERIFIED
    validity: VALID
    validity_reason: >-
      Each defect is pinned by a MUTATION that fails without the fix rather than by an assertion that it is
      gone, and all five were found against the real contract-2 artifact rather than a fixture. The receipt
      defect was demonstrated in BOTH directions - a correct run failing and an empty run passing - which is
      what establishes it as a false-pass hazard and not only a false-fail nuisance.
    instrument: scripts/win_bet/gpu_preflight.py selftest; tests/test_gpu_preflight.py
    experiment: EXP-0044
    note: >-
      THE SIGNATURE IS UNCHANGED ACROSS ALL THIRTEEN AND IT HAS NOW MOVED UP A LEVEL. Defects 1-8 were in the
      thing being tested or in its fixtures; these five are in THE INSTRUMENT THAT DECIDES WHETHER TO SPEND A
      GPU SESSION. The rule still holds and still explains every instance - a fixture may differ from
      production in COST, never in KIND - but the corollary is new and worth stating: an instrument that
      gates a launch is itself production, and it needs the same mutation discipline as the code it guards.
      Two in-kernel additions were made on the same reasoning, each proved by mutation: a crop-count floor,
      because the kernel's own all_passed cannot see a crop that never ran, and a coordinate-rescale
      integrity check whose fixture asserts the deployed downsample BEFORE mutating it (FACT-0405's lesson
      applied prospectively rather than retrospectively).

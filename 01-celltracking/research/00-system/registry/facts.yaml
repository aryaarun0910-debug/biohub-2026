# FACTS REGISTRY - the single source of truth for every measured value.
#
# WHY THIS EXISTS
# Measured on 2026-08-25: the superseded score 0.915 was asserted 244 times across 36
# files; the live score 0.925 only 31 times across 7. An agent opening a research doc at
# random was 8x more likely to read a dead number than a live one. The cause is that
# numbers were COPIED into prose instead of REFERENCED by id, so every restatement was an
# independent chance to go stale and nothing detected divergence.
#
# THE RULE
# A measured value lives here ONCE. Prose cites `FACT-####`. A `state` document may not
# assert a superseded value as current; `scripts/core/validate_registry.py` enforces it.
#
# PROVENANCE - exactly one per fact, and it is a claim about EVIDENCE, not confidence:
#   VERIFIED    re-derived this cycle at a named file:line, or by rerunning committed code
#   MEASURED    computed from a named artifact by code that is committed
#   EXTERNAL    asserted by a third party (forum, public notebook) - NOT independently checked
#   UNVERIFIED  recorded in our own history but never re-derived, and not currently reproducible
#   SUPERSEDED  replaced by a newer fact; `superseded_by` names it
#
# Adding a fact with provenance VERIFIED or MEASURED REQUIRES `instrument` to name committed
# code or a `file:line`. "An oracle that is not committed as code is not a result, it is an
# anecdote" - learned the hard way when the 3.44% anchor proved unreproducible.
#
# VALIDITY - a SECOND, ORTHOGONAL axis. Provenance grades how strongly a number was DERIVED.
# It cannot say whether the RUN it came from was a legitimate measurement of what it claims.
# The EXP-0019 leak facts were MEASURED and deserved it - they were correctly computed, from
# an invalid run. Seven facts and eight packets inherited the leak before anyone noticed.
#
#   provenance   how strong is the derivation?             VERIFIED .. UNVERIFIED
#   validity     was the run it derives from legitimate?   VALID .. INVALID
#
#   VALID    (default when absent) no defect on record. NOT a claim of "audited clean".
#   SUSPECT  a known defect affects PART of the claim. The structure may survive; every
#            magnitude is untrusted until re-derived. Say in `validity_reason` WHAT survives.
#   INVALID  the producing run was not a legitimate measurement. No number in it may be used.
#   UNKNOWN  deliberately not assessed; an audit is owed.
#
# Anything not VALID REQUIRES `validity_reason`. A retraction that does not say what broke
# cannot be acted on by whoever reads it next.
#
# TWO MORE FIELDS make retraction and hygiene mechanical:
#   experiment: EXP-####   the run this fact's numbers come from, directly or through its
#                          inputs. This is the RETRACTION EDGE - void the experiment and
#                          validate_registry R8 forces every fact hanging off it to declare
#                          itself. Without it a void cannot propagate; 89 of 92 facts had no
#                          such link when the leak happened.
#   protocol: {weights, eval}
#                          PROTOCOL PROVENANCE, for any fact measured on a held-out fold.
#                          The leaky and honest fold-1 manifests were byte-identical in fold,
#                          arm, n_crops, det_threshold, secondary_enabled, deepcenter_enabled
#                          and experiment_tag - ONLY `weights` differed, and nothing in a fact
#                          recorded it. FACT-0130 and FACT-0161 measure the SAME quantity and
#                          are now distinguishable here, and only here.

schema_version: 2          # 2 adds the validity axis: validity / validity_reason / protocol

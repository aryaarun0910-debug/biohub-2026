  - id: FACT-0385
    statement: >-
      A cross-fitted false-fork verifier is DATA-LIMITED, not architecture-limited, and it INVERTS between
      embryos. Trained on fold 1's emitted forks - 14 positives - and judged on the fold it never saw, it
      rejects 14 of 67 fold-0 false positives before losing a single true positive, a deployment-view AUC of
      0.6299 worth roughly +0.001 of score against FACT-0384's +0.01416 ceiling. The same protocol judged on
      fold 1 rejects only 5 of 349 before the first true-positive loss, BELOW the random expectation of 23.3.
      Two design traps were found and disarmed: pooling GT-derived tuples with emitted forks inflates the
      unseen-fold AUC to 0.8006 while the deployment view is 0.5254, because out_degree and competing_parents
      read the CONSTRUCTION ROUTE rather than the physics; and the Zebrahub external positives are
      ANTI-ALIGNED with our surface at pooled AUC 0.179, collapsing an in-domain fit from 0.80 to 0.21
    value: 14
    unit: f0_false_forks_rejected_before_the_first_true_positive_loss
    scope:
      protocol: {judge_fold_0_trains_on: [fold 1, external], judge_fold_1_trains_on: [fold 0, external], external_fold_id: -1}
      judge_f0:
        in_domain_emitted_forks_only: {train_rows: 363, train_positives: 14, auc_unseen_fold: 0.8901, deployment_auc: 0.6299, fp_rejected_before_tp_loss: 14, of_fp: 67}
        in_domain_only_pooled: {train_rows: 1213, train_positives: 80, auc_unseen_fold: 0.8006, deployment_auc: 0.5254, fp_rejected_before_tp_loss: 6}
        emitted_plus_counterfactual: {train_positives: 14, auc_unseen_fold: 0.1696, deployment_auc: 0.5701, fp_rejected_before_tp_loss: 11}
        in_domain_plus_external: {train_rows: 1426706, train_positives: 2667, auc_unseen_fold: 0.2149, deployment_auc: 0.6239, fp_rejected_before_tp_loss: 9}
        external_only: {train_rows: 1425493, train_positives: 2587, auc_unseen_fold: 0.1785}
      judge_f1: {deployment_auc: 0.640, fp_rejected_before_tp_loss: 5, of_fp: 349, random_expectation: 23.3, below_chance: true}
      random_expectation_f0: 11.2
      counterfactuals: {f0: 270, f1: 850, kinds: [cf_wrong_parent, cf_wrong_sister, cf_temporal_skip, cf_temporal_same]}
      separability_against_cf_wrong_parent: {parent_midpoint_um_auc: [0.068, 0.071], daughter_angle_auc: [0.129, 0.109], reading: "0.068 is 0.932 inverted - strongly separable"}
      in_fold_signal: {sister_um_auc_deployment_view: [0.854, 0.793]}
    provenance: MEASURED
    validity: SUSPECT
    validity_reason: >-
      The NEGATIVE is solid and the protocol is sound - the cross-fit is enforced mechanically by a single
      selector with an assertion that raises on a judged-fold row, on the held-out embryo when the fold column
      lies, and on any identifier reaching the feature list. What makes it SUSPECT rather than VALID is sample
      size in the only place it matters: the fold-0 result rests on 5 true positives and 67 false ones, so
      14-of-67 carries very wide sampling error, and the fold-1 arm rests on 14 positives. A result built on
      nineteen positives across both folds is not a stable estimate of anything.
    instrument: >-
      scripts/win_bet/divverify_dataset.py viability probe, with training_rows_for and assert_no_leak;
      output _evidence/divverify/viability.json
    experiment: EXP-0035
    note: >-
      PKT-0032's falsifier (a) FIRES: the usable positive population is 19 emitted true forks across both
      folds against HOCT's 110 (FACT-0362), so the division lane is data-limited on our own substrate and by
      roughly six times more than the external evidence suggested. But read what did NOT fire, because it
      decides whether the lane stays open. THE MECHANISM WORKS: 14 false positives were cut at ZERO
      true-positive cost, so LEVER-0040's own falsifier (a) - that false positives cannot be cut without
      losing true positives roughly one for one - is REFUTED rather than confirmed. In-fold signal is strong,
      sister_um alone reaching 0.854 on the deployment view, and the counterfactual negatives are strongly
      separable. It is the cross-fold CALIBRATION that fails, on nineteen positives.
      THE INVERSION IS THE STANDING-RULE FINDING. Fold 0 rejects 14 of 67 above chance while fold 1 rejects 5
      of 349 BELOW chance. Pooling these would have reported a modest positive and hidden a complete
      directional disagreement - exactly the failure AGENTS.md requires both embryo directions be reported
      separately to prevent.
      THE ZEBRAHUB PLANK IS NOT USABLE AS DRAWN, and this contradicts the assumption carried in LEVER-0040 and
      FACT-0362 that external triples are the asset that changes the count. At 1,425,493 rows and 2,587
      positives it is anti-aligned with our surface, and the gap is not one scalar: per-feature median ratios

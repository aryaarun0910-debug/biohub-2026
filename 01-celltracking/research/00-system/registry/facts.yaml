        prob_only_linear: {contested_top1: 0.8337743565070964, delta: 0.0, churn: 0}
        mechanism: "HistGradientBoosting bins each feature into <=255 quantile bins; 41 contested targets (1.0%) have candidates colliding in a bin"
      feature_attribution_on_the_tree:
        rank_margin_ncand_over_prob: -0.0017
        geometry_over_that: 0.0024
        src_out_degree_further: 0.0007
        geometry_alone: -0.0310

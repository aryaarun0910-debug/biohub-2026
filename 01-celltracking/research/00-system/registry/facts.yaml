  - id: FACT-0423
    statement: >-
      FOCUS-3D IS ADMISSIBLE UNDER THE COMPETITION'S OWN RULE TEXT, AND THREE LICENCES BIND AN INTEGRATION
      RATHER THAN THE TWO ADVERTISED. Rule 2.6.b states that external data and models are acceptable unless
      specifically prohibited by the Host, subject to being reasonably accessible to all and of minimal cost;
      no Host prohibition exists, and the Reasonableness Standard is about EXCESSIVE COST excluding
      participants, its worked example being a licence costing more than the prize - which a free
      auto-approved gate is not. Rule 2.5.a.3 is stronger still and is incoherent unless pretrained models are
      permitted. The licences are BSD-3-Clause code, a SEPARATE MIT Copyright (c) 2022 Meta, Inc. inside
      src/focus3d/segmentation/FOCUS3D/ from the Mask2Former lineage which the top-level badge hides, and
      Apache-2.0 weights asserted in ONE README SENTENCE with no LICENSE file and no card metadata
    value: 3
    unit: distinct_licences_binding_a_focus3d_integration
    scope:
      admissibility: ADMISSIBLE
      deciding_clauses: ['2.6.b', '2.5.a.3']
      reasonableness_standard: about excessive cost excluding participants, not about gating
      host_prohibition: none
      licences:
        code: {spdx: BSD-3-Clause, holder: Qinghua Zhang, artifact: top-level LICENSE}
        vendored: {spdx: MIT, holder: "Meta, Inc.", year: 2022, lineage: Mask2Former,
                   path: src/focus3d/segmentation/FOCUS3D/LICENSE,
                   note: hidden by the top-level badge, found only by reading the tree}
        weights: {spdx_asserted: Apache-2.0, artifact: one README sentence,
                  license_file: absent, card_metadata: null, tags: ['region:us']}
      rules_source_authenticated: >-
        The rules page is a JS SPA; the 36 KB markdown was obtained via text extraction and AUTHENTICATED
        before quoting - its competition-specific values (7 prizes / $60,000, MIT winner licence, CC0 data,
        5 submissions per day) match the GetCompetition RPC payload exactly, so it is this competition's
        rules and not boilerplate
      gate_state: {gated: auto, already_accepted_on_host_account: true}
    provenance: VERIFIED
    validity: VALID
    validity_reason: >-
      The admissibility verdict rests on QUOTED rule text whose provenance was authenticated against an
      independent RPC payload before it was relied on, rather than on a summary of the rules. The third
      licence was found by reading the source tree rather than the advertised badge, which is the only way it
      could have been found. What remains weak is stated rather than smoothed over: the weights grant is one
      README sentence with no LICENSE artifact - a real grant from the rights holder, but a thin one.
    instrument: >-
      scripts/win_bet/focus3d_probe.py; evidence under _evidence/focus3d/ including the archived rules
      markdown and the model-card snapshot
    note: >-
      THE HOST'S AUTHORISATION AND THIS FINDING ANSWER DIFFERENT QUESTIONS AND BOTH WERE NEEDED. The host
      settled our right to use the asset; this settles whether the competition's own rules permit a submission
      built on it. LEVER-0043's falsifier (a) is now discharged on both axes rather than only the authority
      one. The attribution obligations of all THREE licences must be carried into any released artifact - the
      Meta MIT notice in particular, because nothing in the repository's advertised licensing surfaces it.
    date: '2026-08-30'
    tags: [focus3d, admissibility, licensing, lever-0043, rules-authenticated, verified]


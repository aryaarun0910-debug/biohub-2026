    validity_reason: >-
      Both files were read and counted. The distinction is not stylistic: a 677-line predictor with no
      secondary code cannot exhibit a fusion defect at all, so every test in that suite was passing on a
      program that could not fail the way the real one did.
    instrument: tests/test_assoc_feature_tap.py _deployed_pack; source counts over both trees
    experiment: EXP-0043
    note: >-
      THE LEDGER IS NOW EIGHT AND THE PATTERN HAS NOT CHANGED ONCE. Defect 4 stubbed a method the real class
      never had. Defect 5 approximated the image pipeline. Defect 6 keyed a cache the architecture makes
      undefined. Defect 7 chose the one downsample at which the deployed transform is the identity. Defect 8
      pointed the whole suite at a different program. Every one is a fixture differing from production in
      exactly the dimension under test, and every one was GREEN while wrong.
      THE RULE, RESTATED BECAUSE IT KEEPS EARNING ITS KEEP: a fixture may differ from production in COST,
      never in KIND. A smaller pack is a cheaper test; a DIFFERENT pack is a different experiment. The

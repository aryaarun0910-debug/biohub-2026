    provenance: MEASURED
    validity: SUSPECT
    validity_reason: >-
      The NEGATIVE result is solid - complete fold 0, 71 crops, interval excluding zero, and the treatment was
      selected to be favourable to the lever, so a loss under its own best setting is strong evidence. Two
      limits on the MECHANISM claim. (1) delta_edge_tp is a NET count: the replay retains per-crop metrics and
      not final graphs, so 28 net could be 28 gained and 0 lost, or hundreds gained and nearly as many
      displaced. PKT-0027 rule (5) triggers an identity-level re-run that persists graphs before the ranking
      diagnosis is treated as established. (2) The floor and rank were chosen on this same fold's GT reach
      (FACT-0374), so this is treatment characterisation; that selection bias worked IN THE LEVER'S FAVOUR,
      which makes the negative result more, not less, credible.
    instrument: >-
      scripts/win_bet/lever37_conversion.py and scripts/win_bet/p28_full_chain_panel.py over the 71 fold-0
      l37 replays; outputs _evidence/ecb/{conversion_l37.json,panel_l37_f0.json}
    experiment: EXP-0035
    note: >-
      This is the most informative negative of the cycle, because it separates two explanations that FACT-0368
      could not. Association is 87% of the fold-0 gap, and the question was whether that gap is bounded by
      WHICH PAIRS ARE OFFERED or by WHICH PAIR IS CHOSEN. The answer is the latter: offering the true parent
      raised reach by 924 edges and the pipeline took 28 of them while taking 113 wrong ones - roughly four
      false positives per true one recovered. Candidate generation is therefore NOT the binding constraint on
      the honest fold, and further widening is contraindicated. The lane is the SCORER's discrimination, which
      is exactly what LEVER-0034's HOCT head is - a differently-trained edge head on an architecturally
      identical trunk (FACT-0361). Two secondary readings. The node-retention mechanism is real and separable:
      extra candidates do retain nodes (+0.0032 recall), but that pushes N_pred up and spends the
      under-production bonus, which is why the adjusted loss (-0.0079) exceeds the raw loss (-0.0034) - the
      exact mirror of LEVER-0036 (FACT-0375). And division recovery got WORSE, so rule (4) applies
      independently: non-promotional whatever the pooled score did.
    date: '2026-08-29'
    tags: [lever-0037, ranking-failure, association, conversion, negative, headline]

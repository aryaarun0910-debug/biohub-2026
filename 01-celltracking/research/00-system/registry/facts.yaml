  - id: FACT-0349
    statement: >-
      The patched division scorer has no special 3 um cutoff: it independently matches the predicted graph to each
      GT parent/divider/daughter/granddaughter window with the official 7 um DistanceMatching, then requires a local
      directed fork whose two predicted child branches map to two distinct GT daughter lineages. Therefore 7 um is
      only the admissibility radius; spatial errors well inside it can still change one-to-one assignments, branch
      identity and whether the whole division topology is recovered
    value: 7.0
    unit: micron_official_matching_radius
    scope:
      matched_window: [predecessor, divider, daughters, granddaughters]
      topology: "matched parent side plus two distinct matched daughter branches"
      empirical_three_um_status: "not a scorer constant; external operating observation in FACT-0348"
    provenance: VERIFIED
    instrument: >-
      vendor/kaggle-cell-tracking/src/tracking_cellmot/division_metrics.py::extract_divisions,
      match_divisions, _matched_division_nodes, _is_strongly_connected_division and score_divisions;
      src/biotrack/metric.py:28-29; source read 2026-08-28
    note: >-
      This reconciles the comment with the metric. A detector can have high aggregate recall yet miss one member of
      the parent-plus-two-daughter tuple, localise it onto the neighbouring cell under one-to-one assignment, or feed
      the right nodes into the wrong branches. Detection is a prerequisite, not a sufficient objective for divJ.
    date: '2026-08-28'
    tags: [metric, division, localisation, topology, verified]


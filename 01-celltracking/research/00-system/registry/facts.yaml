  - id: FACT-0201
    statement: >-
      Forward and reverse association are the SAME problem, not two differently-failing ones -
      linear_sum_assignment is invariant under transposing the cost matrix
    value: null
    unit: structural
    provenance: VERIFIED
    instrument: >-
      control experiment - zeroing the velocity term makes forward and reverse disagree on 1
      node out of 530,792 (0.0002%) versus 357 with the deployed velocity weight
    note: >-
      A bijection imposes out-degree <= 1 AND in-degree <= 1 simultaneously, and that constraint
      set is time-symmetric. So 100% of observed forward/reverse disagreement comes from the one
      asymmetric cost term - the source-anchored extrapolation - and NONE from the bijection. It
      is a velocity-consistency signal, not a division signal. At a division the parent's own
      velocity prior is perfectly ordinary; what is unusual is two daughters COMPETING, and the
      bijection resolves that competition identically in both directions.
      .
      This kills my "a division forward is a merge backward" idea at the mechanism, not just
      empirically. The idea is only expressible if the backward map is MANY-TO-ONE.
    date: '2026-08-26'
    tags: [division, refuted, mechanism]


  - id: FACT-0093
    statement: >-
      The fork-destroying bijection is motion_relink_edges, a POST-PROCESS we fully control -
      not the ILP and not the model
    value: null
    unit: structural
    provenance: VERIFIED
    instrument: >-
      notebooks/kaggle_p3_harmonic/biohub-p3-harmonic.ipynb cell 6:487, inside
      motion_relink_edges defined at cell 6:420
    note: >-
      Only two linear_sum_assignment calls exist in the built notebook: cell 6:487 in
      motion_relink_edges and cell 6:697 in close_single_frame_gaps. NEITHER is the primary
      association stage - that is the ILP, which runs in the prediction subprocess. Calling
      these "both association stages" understated how reachable they are: the relink builds a
      cost matrix per frame pair and its `matches` REPLACE the edge set, so every fork the
      ILP produced is discarded here, by a post-process gated on OUTPUT_MOTION_RELINK.
      .
      Line 6:486 reads `cost = motion + 0.05*raw - MOTION_RELINK_LEARNED_BONUS * prob`, so the
      LEARNED EDGE PROBABILITY IS ALREADY AVAILABLE at the exact point where divisions die.
      A joint scorer has its input plumbed in already; what is missing is the ability to
      assign a source two targets, plus a selector deciding which sources earn it.
    date: '2026-08-25'
    tags: [division, structural, actionable, headline]


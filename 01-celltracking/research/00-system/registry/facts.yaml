      which is FACT-0380 reappearing inside the external data. Any future use of Zebrahub for divisions must
      solve that alignment first rather than pooling rows.
    date: '2026-08-29'
    tags: [division, verifier, cross-fit, data-limited, fold-inversion, zebrahub, negative, headline]

  - id: FACT-0386
    statement: >-
      Simple models on the existing representation-free features CANNOT beat the deployed edge probability at
      choosing parents, and the small apparent gain is mostly a discretisation artifact. Across 22
      preregistered crop-grouped arms on the complete fold-0 frozen surface, the LINEAR model never beats the
      deployed 0.8338 on contested targets at any feature set, and the best TREE arm reaches 0.8367 - a point
      gain of +0.0029, net +12 targets of the 691 available with churn 40 - with a crop-paired interval of
      [-0.00051, +0.00644] that includes zero and McNemar p = 0.081. NO ARM OF THE 22 HAS A FAVOURABLE
      INTERVAL. The noise floor was measured rather than assumed: a tree given ONLY the deployed probability,
      which cannot in principle beat an argmax over that same scalar, still posts +0.0014 and net +6 because
      the learner bins each feature into at most 255 quantile bins and 41 contested targets have candidates
      colliding in a bin - so the best arm's +12 is roughly twice a pure-binning floor of +6
    value: 0.8366610536444551
    unit: best_tree_contested_parent_top1_f0_oof
    scope:
      fold: 0
      crops: 71
      surface: {source: C:/temp/assoc/f0.parquet, floor: 0.1, rank_cap: 4, decidable: 19444, contested: 4157}
      deployed_bar: {contested_top1: 0.8337743565070964, errors: 691}
      arms_run: 22
      arms_with_favourable_interval: 0
      best_arm:

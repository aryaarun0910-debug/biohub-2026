      vendor/kaggle-cell-tracking - the organizer's public repository - while the kernel materialises the
      support pack into /kaggle/working/tracking_repo and runs that. The vendored predictor is 677 lines with
      ZERO occurrences of "secondary"; the deployed one is 1047 lines and contains BOTH fusion stages. A
      green suite was therefore structurally incapable of catching any fusion defect, including the one that
      invalidated P36's verdict
    value: 0

      the node-id check that guarantees these candidates address the same nodes the pre-ILP graph consumes.
      Reach is an UPPER BOUND: it counts GT edges whose true pair is OFFERED, not chosen. A scorer still has to
      pick the right parent out of the widened set, and widening necessarily hands the linker more ways to be
      wrong, so the realised gain will be smaller and could be negative.
      SELECTION DEPENDENCY (host red-team, 2026-08-29): the treatment floor and rank were CHOSEN from this
      fold-0 GT reach surface, and LEVER-0037 is then scored on that same fold. The resulting replay is

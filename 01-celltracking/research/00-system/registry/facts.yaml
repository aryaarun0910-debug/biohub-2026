      is `unresolved` rather than one of the four. It is not calibration shift, not candidate-mixture shift
      (Kitagawa puts only 11.2% on mixture), not representation inversion and not an implementation defect.
      It is a POWER failure specific to the fold-0 surface: at roughly ten contested errors per crop, an
      in-sample gain of +0.024 leaves nothing at all once the model is honestly held out.

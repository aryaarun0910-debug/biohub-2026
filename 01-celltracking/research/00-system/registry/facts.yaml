# FACTS REGISTRY - the single source of truth for every measured value.
#
# WHY THIS EXISTS
# Measured on 2026-08-25: the superseded score 0.915 was asserted 244 times across 36
# files; the live score 0.925 only 31 times across 7. An agent opening a research doc at
# random was 8x more likely to read a dead number than a live one. The cause is that
# numbers were COPIED into prose instead of REFERENCED by id, so every restatement was an
# independent chance to go stale and nothing detected divergence.
#
# THE RULE
# A measured value lives here ONCE. Prose cites `FACT-####`. A `state` document may not
# assert a superseded value as current; `scripts/core/validate_registry.py` enforces it.
#
# PROVENANCE - exactly one per fact, and it is a claim about EVIDENCE, not confidence:
#   VERIFIED    re-derived this cycle at a named file:line, or by rerunning committed code
#   MEASURED    computed from a named artifact by code that is committed
#   EXTERNAL    asserted by a third party (forum, public notebook) - NOT independently checked
#   UNVERIFIED  recorded in our own history but never re-derived, and not currently reproducible
#   SUPERSEDED  replaced by a newer fact; `superseded_by` names it
#
# Adding a fact with provenance VERIFIED or MEASURED REQUIRES `instrument` to name committed
# code or a `file:line`. "An oracle that is not committed as code is not a result, it is an
# anecdote" - learned the hard way when the 3.44% anchor proved unreproducible.


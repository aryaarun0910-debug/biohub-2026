  - id: FACT-0369
    statement: >-
      The deployed candidate-edge rule admits AT MOST ONE parent per target by construction, and this is
      verified both at source and in the data. `predict_unet_transformer.py` takes softmax over the SOURCE axis
      of the source-by-target logit matrix and keeps pairs above cfg.threshold = 0.5; since a softmax over
      sources sums to one, at most one source can exceed 0.5 for any target. Measured across all 2,162,040
      fold-1 candidate edges the in-degree maximum is exactly 1 with zero exceptions, the minimum edge
      probability is exactly 0.5000, and only 85.7% of nodes have any candidate parent at all
    value: 1
    unit: max_candidate_parents_per_target
    scope:
      fold: 1
      candidate_edges: 2162040
      candidate_nodes: 2523479
      in_degree: {max: 1, mean: 1.000, count_above_1: 0}
      out_degree: {max: 6, mean: 1.096, count_at_least_2: 176835}
      nodes_with_any_candidate_parent: 0.8568
      edge_prob: {min: 0.5000, p1: 0.5103, median: 0.8924, count_at_or_below_threshold: 0}
      deployed_rule: {activation: "softmax over source axis", threshold: 0.5, max_parents_per_node: 1, max_children_per_node: 2}
      source: "vendor/kaggle-cell-tracking/scripts/predict_unet_transformer.py:455-480"
    provenance: VERIFIED
    validity: VALID
    validity_reason: >-
      The mechanism is read at source and the consequence is independently confirmed in the exported candidate
      graph, which is the strongest available pairing. The degree census is fold 1 because that is the fold with
      a pre-ILP export, but the RULE is code shared by both folds, so the structural claim is not fold-specific;
      only the rates are.
    instrument: >-
      source read of extract/predict edge construction in predict_unet_transformer.py, plus a degree and
      probability census of C:/temp/preilp_f1_v2/preilp_split1.parquet; 2026-08-29
    note: >-
      This reframes what the ILP and every downstream stage are actually doing. The candidate graph is not a
      set of competing hypotheses to be resolved - it is a PARTIAL FUNCTIONAL ASSIGNMENT in which the edge model
      has already committed to one parent per target, or abstained. Three consequences follow. (1) The solver
      cannot choose between competing parents because none are offered, which independently explains why motion
      relink can discard the ILP's edge list wholesale at little cost (FACT-0364). (2) Swapping in a stronger
      association head such as HOCT (FACT-0361) WITHOUT changing this rule would still leave it emitting one
      commitment per target; HOCT's own gate is geometric and much wider (15 um, 64 neighbours), which is a
      different regime, not a tuning difference. (3) It gives the missing edges of FACT-0370 a mechanism: in a
      dense neighbourhood the softmax mass splits across plausible sources and the true parent clears no
      threshold, which is why those misses are SHORT-range rather than long.
    date: '2026-08-29'
    tags: [association, candidate-generation, structure, verified, headline]


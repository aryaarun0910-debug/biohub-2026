      promotion fold is about a third of what FACT-0370 implied. Across all 71 fold-0 crops and 19,665
      detectable GT edges, the DEPLOYED rule already offers 93.9% of them, against 82.7% on fold 1. The true
      parent sits at rank 1 for 95.7% of edges and within rank 2 for 99.3%, so rank beyond 2 buys almost
      nothing. The smallest expansion that materially improves reach is floor 0.1 with at most 2 parents per
      target: 98.6% reach for 1.4x the candidate count

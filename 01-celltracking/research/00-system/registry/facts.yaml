    provenance: VERIFIED
    instrument: >-
      vendor/kaggle-cell-tracking/src/tracking_cellmot/division_metrics.py::extract_divisions,
      match_divisions, _matched_division_nodes, _is_strongly_connected_division and score_divisions;
      src/biotrack/metric.py:28-29; source read 2026-08-28
    note: >-

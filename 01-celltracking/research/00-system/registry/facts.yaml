      output _evidence/ecb/reach_f0.json
    experiment: EXP-0035
    note: >-
      This is the fold inversion FACT-0031 warned about, appearing again: a lever sized on fold 1 shrinks by a
      factor of three on the fold that gates promotion. The unreachable share falls from 17.3% of detectable
      edges (fold 1) to 6.1% (fold 0), which is consistent with fold 1 being the association-degraded
      configuration (FACT-0261) rather than with the candidate rule behaving differently - the rule is shared
      code (FACT-0369). Two design conclusions for the treatment. (1) RANK 2 IS ENOUGH: 99.3% of true parents
      are within rank 2, so the deployed one-parent-per-target limit costs most of its recall at the SECOND
      parent, not deeper - a large top-k is pure precision cost. (2) THE FLOOR DOES THE WORK: at rank 2, reach
      climbs 0.939 to 0.986 as the floor drops 0.5 to 0.1, then flattens, so 0.1 is the knee and floors below
      0.05 buy 0.004 reach for 40% more candidates. The chosen treatment is therefore floor 0.1, rank 2 -
      +0.047 reach for 1.4x candidates - and it is tested through the complete chain before any claim.

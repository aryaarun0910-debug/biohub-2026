  - id: FACT-0415
    statement: >-
      TWO INDEPENDENTLY-SEEDED HEADS OF OUR OWN MAKE ALMOST THE SAME ERRORS, SO THE CONSENSUS ROUTE IS
      DIVERSITY-LIMITED RATHER THAN RULE-LIMITED. An alternate-seed secondary - different seed, 0.7 row
      bootstrap - lands at contested top-1 0.762189 against the primary's 0.762227 and the two agree on
      97.95% of the 26,601 contested fold-1 targets: both correct 20,003, both wrong 6,053, primary-only 273,
      secondary-only 272. The oracle of the two reaches 0.772452, so a PERFECT consensus rule could buy at
      most +0.010 over the primary, and top-1 where they agree is 0.767693 against 0.762227 pooled - making
      agreement a usable abstention trigger but a weak one
    value: 0.9795120484192323
    unit: contested_target_agreement_rate_between_two_independently_seeded_heads_f1
    scope:
      fold: 1
      contested: 26601
      primary: {tag: A4.bidir.tree, contested_top1: 0.7622269839479718}
      secondary: {tag: A5.secondary.seed, contested_top1: 0.7621893913762641,
                  difference: different seed and 0.7 row bootstrap}
      breakdown: {both_correct: 20003, both_wrong: 6053, primary_only: 273, secondary_only: 272}
      oracle_of_the_two: 0.7724521634525018
      headroom_over_primary_if_perfect_rule: 0.010225179504530012
      top1_where_they_agree: 0.7676926619588579
      promotable: false
    provenance: MEASURED
    validity: VALID
    validity_reason: >-
      Computed over the complete contested fold-1 population through the same committed harness, with both
      heads fitted out of fold on the same crop-grouped splits, so the agreement rate is not inflated by one
      head having seen targets the other had not.
    instrument: >-
      scripts/win_bet/assoc_tournament.py consensus arm; payload
      _evidence/assoc/tournament/consensus_fold1.json
    note: >-
      WHY THIS WAS WORTH MEASURING AT ALL. FACT-0378 makes the public configuration's secondary
      un-validatable offline - it saw all 199 movies - so a consensus claim needs fold-specific secondary
      heads of our own before it can be assessed. It now can be, and the answer is discouraging for the cheap
      version of the route.
      THE ORACLE IS A CEILING AND NOT A RESULT - it is chosen with the label, and it is reported here only to
      bound what any rule could reach. About +0.010 is the whole prize for a PERFECT rule over two heads that
      agree 98% of the time; a real rule gets a fraction of it.
      THE DESIGN CONSEQUENCE, and it is why the successor lane does not open with an ensemble: ALTERNATE
      SEEDS ARE NOT DIVERSITY. Genuine diversity has to come from different association VIEWS - a different
      representation, a different stage, a different physical prior - not from re-seeding one head on one
      contract. Note also that this is measured on the surface FACT-0414 shows did not transfer, so the
      agreement structure itself is a discovery-fold quantity.
    date: '2026-08-30'
    tags: [association, consensus, diversity, fold-1, diagnostic, lever-0041, seeds-are-not-diversity]


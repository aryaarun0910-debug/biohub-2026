    provenance: MEASURED
    validity: VALID
    validity_reason: >-
      Complete fold 0, all 71 crops, out-of-fold only, splits GROUPED BY CROP so no target contributes to its
      own training fold, with leave-one-crop-out reported as the strictest available proxy and agreeing with
      the 5-fold result. All 22 arms were preregistered and ALL 22 are reported, so there is no
      best-of-many selection. The harness carries its own internal control: a LINEAR model on the probability
      alone returns exactly the deployed number with churn 0, which is what a monotone transform of a single
      feature must do to an argmax - so the tree's +0.0014 on the same input is demonstrably binning and not
      skill. The run was repeated end to end after the tie-break correction landed and both runs agree on all
      22 arms with zero disagreements.
    instrument: >-
      scripts/win_bet/assoc_baseline_rankers.py, heartbeat ASSOC_BASELINE_RANKERS_COMPLETE, with six
      fail-closed guards including a crop-leak assertion and a sha256 pin of the modules the numbers came
      from; scored through scripts/win_bet/assoc_parent_dataset.py evaluate() and
      scripts/win_bet/assoc_report.py parent_conversions(); outputs
      _evidence/assoc/baselines/baselines_f0.json and C:/temp/assoc_baselines/
    experiment: EXP-0035
    note: >-
      THIS IS THE INFORMATIVE NEGATIVE THE BASELINE WAS COMMISSIONED FOR, and it answers PKT-0029's question
      directly: the HEAD is not the constraint, the REPRESENTATION is. If a gradient-boosted tree on the
      deployed probability plus rank, margin and geometry cannot separate true parents on the surface the
      deployed model itself produced, then richer node context - which is exactly what LEVER-0034's HOCT
      trunk supplies - is justified rather than speculative.
      THREE READINGS THAT WOULD BE WRONG. (1) Do not read the single-candidate retention of 1.0000 as a

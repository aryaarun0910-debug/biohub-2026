    validity_reason: >-
      Read at the cited deployed lines in the built notebook and the deployed predictor, with the bonus value
      confirmed in three separate live env blocks rather than inferred from the default. The claim that
      edge_prob is the only learned quantity crossing the boundary is a source read of the whole build_graph
      surface, not an absence argument from grep.
    instrument: >-
      source read at the cited lines; recorded in _evidence/assoc/survival/stage_map.json
    note: >-
      THE ARITHMETIC IS THE FINDING. A bonus capped at 1.0 is subtracted from a cost denominated in
      MICROMETRES, so the learned channel can only overturn a geometric preference when the competing parents
      are within roughly a micrometre of each other. FACT-0428 measures what that costs in practice, and
      FACT-0429 measures how rarely the band is even reached. This is also why a better pre-ILP scorer is not
      automatically a better graph: the solver's own output is re-decided by an operation that reads the
      learned signal at a weight chosen for a different purpose.
      A SECOND CONSEQUENCE THAT BOUNDS ANY FUTURE DESIGN: pairs the ILP dropped score 0.0, so the relink
      cannot rescue an edge the solver never kept, no matter how confident a scorer is about it.
    date: '2026-08-30'
    tags: [association, motion-relink, learned-channel, bonus, verified, headline]

  - id: FACT-0428
    statement: >-
      A CHANGE MADE ONLY AT PRE-ILP CANDIDATE RANKING IS MOSTLY DISCARDED BEFORE THE EMITTED GRAPH EXISTS,
      AND THE TWO FOLDS DIFFER BY ROUGHLY TWO-FOLD. Forcing the sidecar runner-up as the parent and replaying
      the COMPLETE deployed chain: on fold 0, 3,056 of 3,613 forced choices whose target survived to emission
      are absent from the emitted graph - an overwrite rate of 0.8458 and a survival of 0.1542; on fold 1,
      1,477 of 2,119, overwrite 0.6970 and survival 0.3030. The counterfactual on the SAME targets
      unperturbed is decisive about what this means: the pre-ILP parent IS the emitted parent for 4,092 of
      4,198 fold-0 survivors (0.9747) and 2,401 of 2,529 fold-1 (0.9494). THE PIPELINE AGREES WITH ITS
      PRE-ILP RANKING; IT DOES NOT FOLLOW IT
    value: 0.1542
    unit: survival_rate_of_a_pre_ilp_only_parent_change_into_the_emitted_graph_fold0
    scope:
      fold_0: {movie: 44b6, crops: 12, forced: 4800, evaluable: 3613, overwritten: 3056,
               category_5_rate: 0.8458, survival: 0.1542}
      fold_1: {movie: 6bba, crops: 8, forced: 3200, evaluable: 2119, overwritten: 1477,
               category_5_rate: 0.6970, survival: 0.3030}
      counterfactual_unperturbed:
        fold_0: {agree: 4092, of: 4198, rate: 0.9747}
        fold_1: {agree: 2401, of: 2529, rate: 0.9494}
      control_arm: asserted exact against the kernel's own run_stats on all fifteen compared columns
      sample: {fold_0: '12 of 71 crops', fold_1: '8 of 128 crops', selection: committed-list order, not random}
      lower_bound_reason: >-
        the promoted alternative is the sidecar RUNNER-UP, which FACT-0370 implies sits further away than the
        parents a well-aimed scorer would promote, so these rates UNDERSTATE what a good re-ranker would achieve
      do_not_conflate_with: >-
        FACT-0422's ledger category 5 (73 fold-0 and 537 fold-1 GT edges correctly selected then overwritten).
        That counts GT edges lost to overwrite in the UNPERTURBED pipeline; this measures the survival of a
        FORCED change. Different objects, different denominators, and neither substitutes for the other
    provenance: MEASURED
    validity: VALID
    validity_reason: >-
      The control arm was asserted EXACT against the kernel's own run_stats across all fifteen compared
      columns before any perturbed arm was read, with a mismatch configured as a hard refusal - so the replay
      is demonstrated to reproduce the deployed chain rather than assumed to. The sample and its
      non-randomness are stated rather than smoothed over, and the direction of the resulting bias is named:
      these are a LOWER bound on what a well-aimed re-ranker would see.
    instrument: >-
      scripts/win_bet/assoc_preilp_survival.py over scripts/win_bet/p28_full_chain_replay.py, aggregated by
      scripts/win_bet/assoc_preilp_survival_panel.py; payloads
      _evidence/assoc/survival/survival_panel.json and _evidence/assoc/survival/crops/
    note: >-
      "AGREES WITH BUT DOES NOT FOLLOW" IS THE WHOLE RESULT AND IT RESOLVES AN APPARENT CONTRADICTION.
      Unperturbed agreement of 95-97% looks like a pipeline that honours its ranking; a survival of 15-30%
      under perturbation shows it does not. Both are true because the relink usually re-derives the same
      answer from GEOMETRY - so when the ranking agrees with geometry it appears to be followed, and when it
      disagrees it is overruled. A scorer's gains live precisely in the disagreements, which is exactly the
      population that does not survive.
      THE CONSEQUENCE FOR PLANNING IS BLUNT. Combined with FACT-0422's ceiling of 240 wrong-parent GT edges on
      fold 0, a pre-ILP-only parent scorer's realisable prize on fold 0 is of order 240 x 0.1542, i.e. a few
      dozen edges. That is not a lane worth a GPU feature cache on its own.
      FOLD 1 IS ABOUT TWICE AS PERMEABLE TO A RANKING CHANGE AS FOLD 0 (0.3030 against 0.1542). Offered as a
      CANDIDATE structural mechanism for the FACT-0413 / FACT-0414 transfer failure, not as a demonstration
      of it - it is consistent with FACT-0420's power collapse rather than a replacement for it.
    date: '2026-08-30'
    tags: [association, motion-relink, pre-ilp, survival, category-5, fold-transfer, measured, headline]

  - id: FACT-0429
    statement: >-
      SURVIVAL OF A FORCED PRE-ILP PARENT CHANGE FALLS MONOTONICALLY WITH THE PROMOTED PARENT'S GEOMETRIC
      HANDICAP, AND THE BREAK IS EXACTLY WHERE THE BONUS ARITHMETIC PREDICTS. Within 1.0 um of the deployed
      parent, survival is 104/185 = 0.5622 on fold 0 and 129/189 = 0.6825 on fold 1; outside it, 453/3,428 =
      0.1321 and 513/1,930 = 0.2658 - ratios of 4.3x and 2.6x across precisely the boundary that a bonus of
      1.0 against a micrometre-denominated cost implies. Only 5.1% of tested alternatives on fold 0 and 8.9%
      on fold 1 fall inside that band at all
    value: 0.051
    unit: share_of_tested_alternative_parents_inside_the_band_where_the_learned_bonus_can_act_fold0
    scope:
      band_um: 1.0
      inside_band: {fold_0: {survived: 104, of: 185, rate: 0.5622},
                    fold_1: {survived: 129, of: 189, rate: 0.6825}}
      outside_band: {fold_0: {survived: 453, of: 3428, rate: 0.1321},
                     fold_1: {survived: 513, of: 1930, rate: 0.2658}}
      ratio_inside_over_outside: {fold_0: 4.3, fold_1: 2.6}
      share_inside_band: {fold_0: 0.051, fold_1: 0.089}
      predicted_by: 'FACT-0427 - a bonus capped at 1.0 against a cost in micrometres'
      full_curve: survival_by_geometric_handicap_um in the panel payload
    provenance: MEASURED
    validity: VALID
    validity_reason: >-
      The boundary was PREDICTED from the deployed cost expression before it was measured, and the measured
      break lands there on both folds independently. That is a prediction meeting data rather than a cut
      chosen after inspecting the curve, which is what distinguishes this from a post-hoc threshold.
    instrument: >-
      scripts/win_bet/assoc_preilp_survival.py and assoc_preilp_survival_panel.py; payload
      _evidence/assoc/survival/survival_panel.json
    note: >-
      THIS IS THE MECHANISM BEHIND FACT-0428 AND IT NAMES A FREE EXPERIMENT. The learned channel can only act
      inside a roughly one-micrometre band, and only about one alternative in twenty on fold 0 is inside it.
      Raising MOTION_RELINK_LEARNED_BONUS widens the band, and the replay reads that constant FROM ITS OWN
      ENVIRONMENT - so the entire sweep is CPU-only and costs no GPU session. That is the cheapest available
      test of whether the final-edge consumption point, rather than the scorer, is what has been binding.
      A CAUTION THAT COMES WITH IT: the bonus is GLOBAL, so raising it trades geometric coherence everywhere
      for learned influence everywhere - the FACT-0376 shape, where a change that helps the targeted
      population is charged against the rest. The sweep must be scored through the complete chain and the
      official scorer, never on the relink's own objective.
    date: '2026-08-30'
    tags: [motion-relink, geometric-gate, learned-bonus, association, free-experiment, measured]


  - id: FACT-0093
    statement: >-
      The fork-destroying bijection is motion_relink_edges, a POST-PROCESS we fully control -
      not the ILP and not the model
    value: null
    unit: structural
    provenance: VERIFIED
    instrument: >-
      notebooks/kaggle_p3_harmonic/biohub-p3-harmonic.ipynb cell 6:487, inside

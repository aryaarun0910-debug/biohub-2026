      statistical. (1) THE DECOMPOSITION IS SEQUENTIAL: the shares are attributed along one path (edges, then
      node selection, then detection) and a different order would apportion the overlap differently; the
      robust, order-independent reading is the association rung alone, which is measured against the deployed
      node set. (2) Rungs 2 and 3 restrict the prediction to ANNOTATED cells, which is far fewer nodes than the
      crop contains, so their ADJUSTED scores collect an under-production bonus (FACT-0191) that no real method
      can earn - they are read on raw edge Jaccard only, and the instrument flags them.
    instrument: >-
      scripts/win_bet/ceiling_ladder.py over the P28 champion exports and the P29 DetPeak sidecars; official
      tracking_cellmot evaluate/per_sample_metrics/summarise; one-to-one 7 um matching shared with
      FACT-0354/0355/0357; outputs _evidence/ceiling/ladder_f{0,1}.json
    experiment: EXP-0033
    note: >-
      This is the quantitative answer to the 2026-08-29 reframe from "beat the top-3 boundary" to "reach this
      machine's ceiling", and it settles the effort allocation that FACT-0335 argued for qualitatively. On the
      fold that gates promotion, 87% of everything still available is in deciding WHICH detected cells connect
      to which - not in finding more cells, and not in choosing better ones. Three consequences. (1) The
      association lanes are the campaign's main line: LEVER-0034 (HOCT, a head swap on an identical trunk per
      FACT-0361) and LEVER-0027 (RoPE-4D). (2) Detector work is worth at most 7.1% of the fold-0 gap, which
      independently supports leaving the retrain blocked behind recipe parity (FACT-0339) rather than treating

      NOT a dual-trunk acquisition (FACT-0418, FACT-0431).
    falsifier_original_2026_08_30: >-
      PRESERVED VERBATIM. The text this lever opened with, before the host's amendment and before any data:
      "(a) THE FREE TEST. Sweeping MOTION_RELINK_LEARNED_BONUS alone on the existing replay over COMPLETE
      fold 0, with the deployed edge_prob unchanged, produces no bonus that beats the deployed control with a
      crop-paired interval excluding zero on the favourable side. If that is the outcome the lever dies for
      ZERO GPU, because widening the band the learned channel acts in is a strictly easier intervention than
      replacing what fills it. (b) Fewer than 1% of assignments change across the whole sweep. (c) Raw edge
      Jaccard is flat through the COMPLETE chain on fold 0 under the official scorer. (d) Net true edges
      through the complete chain are at or below zero. (e) Node recall or division true positives decline on
      either fold. (f) The fold-0 arm reproduces FACT-0414's exact zero at the FULL-CHAIN stage."
    falsifier_restoration_2026_08_30: >-
      TWO CONDITIONS WERE DROPPED BY THE AMENDMENT WITHOUT BEING MENTIONED, AND THE AUDITOR CAUGHT IT. They
      are restored above, still before any data was taken.
      (1) The original clause (f) - the fold-0 arm reproducing FACT-0414's exact zero at the FULL-CHAIN stage
      - disappeared when the letter (f) was reused for the adjusted-versus-raw condition. It is NOT subsumed
      by the Gate A narrowing, because it binds precisely the stage Gate B tests, and it is now (g).
      (2) The crop-paired interval requirement vanished from the prose while assoc_report's verdict() went on
      enforcing it, so the text and the instrument disagreed.
      NET EFFECT: the lever is HARDER than either the original or the first amendment, and every change to
      this falsifier - the host's and this one - has moved in that direction. The record is kept in three
      pieces on purpose: falsifier (live), falsifier_original_2026_08_30 (verbatim), and the two reason
      fields, so any reader can reconstruct what changed and when without trusting a summary.
      Two additional protocol conditions were added at the same time, from auditor vetoes V4 and V5, and both
      are about making a NULL interpretable rather than about the bar: control provenance must be asserted,
      and score coverage must be reported.
    falsifier_amendment_reason: >-
      THE ORIGINAL (a) CONTAINED A LOGICAL FLAW AND THE HOST CAUGHT IT BEFORE IT COST ANYTHING. It proposed
      to kill the entire final-edge thesis on a sweep of the DEPLOYED probability - but FACT-0421 measured
      that the deployed probability is precisely the NON-TRANSFERRING feature, the one component whose
      deletion makes the scorer transfer in both directions. Amplifying a poor score at the correct stage can
      still lose, while a better score at that same stage might win. So a negative Gate A is evidence about
      the deployed probability, not about the consumption point, and the original falsifier would have
      retired a live mechanism on evidence that cannot address it - the exact "closed by association" error
      AGENTS.md section 2 names as this project's second most expensive mistake.
      THE AMENDMENT IS RECORDED BEFORE ANY DATA WAS TAKEN, which is what makes it legitimate rather than
      rationalisation. It does not relax the lever's bar: it NARROWS what Gate A is permitted to conclude and
      ADDS Gate B, a strictly harder coupled test, as the only thing that can kill the lever. The original
      text is preserved above so the change is auditable rather than silent.
    supporting: [FACT-0426, FACT-0427, FACT-0428, FACT-0429, FACT-0422, FACT-0420, FACT-0364, FACT-0376]
    note: >-
      OPENED 2026-08-30. THIS IS NOT A RESTATEMENT OF LEVER-0041 AND THE BOUNDARY IS MECHANICAL. LEVER-0041
      asks whether a better SCORER can be built and consumed at pre-ILP candidate ranking; it stays OPEN and
      is NOT closed by this lever, because FACT-0419 retired the selection-artifact reading and FACT-0420
      classified the fold-0 null as a power collapse rather than a representation failure. This lever asks a
      different question with a different intervention: whether the score is CONSUMED where it can act.
      WHY IT IS OPENED NOW, ON EVIDENCE ABOUT ITSELF. FACT-0426 establishes that exactly one deployed
      operation can change an already-assigned parent, and every later edge-mutating stage is add-only or
      node-removing. FACT-0427 reads the deployed cost expression: the learned channel enters as a bonus
      capped at 1.0 subtracted from a cost in MICROMETRES, and pairs the ILP dropped score exactly zero.
      FACT-0429 measures the consequence - the band where the bonus can act reaches only 5.1% of alternatives
      on fold 0 - and FACT-0428 measures the cost of that: a pre-ILP-only change survives 15.4% of the time on
      fold 0. Combined with FACT-0422's ceiling of 240 wrong-parent GT edges on fold 0, the realisable prize
      for a pre-ILP-only scorer is of order a few dozen edges, which is not a lane worth a GPU cache on its
      own.
      THE SEQUENCING CONSEQUENCE IS THE POINT OF THE LEVER. Falsifier (a) is a CPU sweep on an existing
      replay that reads the constant from its own environment, so it costs no GPU session and it can kill or
      validate the whole final-edge thesis before the ~7 GiB dual-trunk caches of FACT-0416 are built. Under
      the standing GPU rule this is the correct order: the cheapest thing that can end the lane runs first.
      TWO CAUTIONS CARRIED IN AT BIRTH. The bonus is GLOBAL, so raising it trades geometric coherence
      everywhere for learned influence everywhere - the FACT-0376 shape, where a change that helps the
      targeted population is charged against the rest, and it must therefore be scored through the complete
      chain and the official scorer and never on the relink's own objective. And learned_prob at notebook
      lines 1833-1842 SILENTLY SIGMOIDS out-of-range scores, so any future scorer writing into that slot must
      assert its range rather than trust it - a silent no-op is worse than a crash.
      DIVISIONS GET NOTHING FROM THIS LEVER. add_safe_divisions_postlink is add-only and its candidate set
      excludes incoming edges, so no division claim may be read from any result here (FACT-0371).
    priority: 1

  - id: LEVER-0045
    claim: >-
      A TRACKLET-CONDITIONED CANDIDATE GENERATOR trained with high-confidence PSEUDO-LINEAGES increases
      category-3 reach - the true edges never offered to any scorer - and a MULTI-FRAME edge scorer converts
      that reach into complete-chain RAW association without node or division loss.
    status: killed
    closed_by: [FACT-0442, FACT-0441, FACT-0443]
    closed_date: '2026-08-31'
    outcome_2026_08_31: >-
      FALSIFIER 0 FIRED ON ITS OWN EVIDENCE AND THE ROUTE CLOSED BEFORE ANY GPU WAS SPENT - which is exactly
      what the falsifier was written to do. All SIX cells kill: the oracle contribution is 0.84x the
      remaining deficit on fold 0 and 1.13x on fold 1 against a preregistered threshold of 2x, and the best
      cell reaches 57% of it. The honest promotion fold does not clear even the bare-pass line that was
      itself preregistered as a kill (FACT-0442).
      THE KILL IS STRONGER THAN A NULL BECAUSE IT IS AN ORACLE. The figures assume PERFECT selection over
      every newly reached edge - no scorer, no errors, no cost - so no better model can rescue the route.
      Applying FACT-0428's measured survival leaves +0.0023 and +0.0061.
      AN INDEPENDENT SECOND REASON, WHICH WOULD HAVE BOUND EVEN IF THE HEADROOM HAD CLEARED: fold-1 division
      Jaccard FALLS at every context under perfect selection (FACT-0443), because re-parenting a target
      strips a child edge from its previous source. FACT-0371's safety condition fails at the oracle, and the
      loss is a property of the edit rather than of the chooser.
      IT WAS NOT LEVER-0037 IN DISGUISE, AND THAT WAS CHECKED RATHER THAN ASSERTED. The frozen rule never
      reads edge_prob, reaches short misses a wider radius cannot (FACT-0370), and does so at a SMALLER
      candidate multiplier than the 1.45x FACT-0376 charged. A genuinely different mechanism, tested on its
      own terms, that still does not pay.
      THE LARGEST RESULT IS NOT THE VERDICT. The packet sent to exploit the never-offered mass MEASURED THAT
      THE MASS IS TWO THIRDS SMALLER THAN THE REGISTRY BELIEVED (FACT-0441): motion_relink_edges assigns over
      all node pairs in a 6.0 um gate, so 713 of 1,110 fold-0 and 9,522 of 14,007 fold-1 never-offered edges
      are ALREADY EMITTED. Category 3 partitions the candidate surface, not the output. That correction
      outlives this lever and re-prices every candidate-side argument in the campaign.
    what_this_does_not_kill: >-
      SCOPED DELIBERATELY, because closing by association is this project's second most expensive recorded
      mistake and a coupled lever is the easiest place to do it.
      (1) It says NOTHING about LEVER-0044's consumption question, which is measured separately and remains
          open on Gate B.
      (2) It does NOT kill MANUFACTURED SUPERVISION as such. What was tested is a temporal PROPOSAL rule
          against the never-offered mass; no pseudo-label was ever generated, so falsifiers (1) and (2) never
          ran. Manufactured supervision aimed at a DIFFERENT target - notably the division data limit
          FACT-0362 records, where the binding constraint is positives and not proposals - is untested here
          and would need its own lever and its own falsifier.
      (3) It does not condemn multi-frame context in a SCORER. What failed is multi-frame context as a
          CANDIDATE GENERATOR; a scorer consuming temporal context over the existing surface is a different
          claim.
      A USEFUL NEGATIVE WORTH CARRYING FORWARD: the rule's rank-1 nominee is the target's DEPLOYED candidate
      parent in 289 of 640 fold-0 and 3,091 of 6,995 fold-1 cases, so temporal extrapolation on this data
      mostly re-proposes what the softmax already chose. That is a fact about the data, not about the lever.
    mechanism: >-
      temporal tracklet proposal + manufactured labels + learned discrimination + final consumption. All four,
      coupled. This is the only version of the lane with the mass to matter.
    falsifier: >-
      WRITTEN BEFORE ANY WORK. FALSIFIER 0 IS A CPU ORACLE AND IT RUNS FIRST, BESIDE LEVER-0044's GATE B.
      THE VACUOUS VERSION IS EXPLICITLY FORBIDDEN. Do NOT measure whether a true edge "exists inside an
      eight-frame window" - both endpoints already exist in ADJACENT frames, so that measurement is nearly
      vacuous and would pass regardless of merit.
      THE PROPOSAL RULE IS FROZEN BEFORE GT IS CONSULTED, and it is GT-FREE by construction:
        - context lengths 2, 5 and 8 frames;
        - tracklets built from DEPLOYED predicted edges only;
        - tracklet motion EXTRAPOLATED to the target frame;
        - previous-frame parents nominated by PHYSICAL DISTANCE to the extrapolated position;
        - a FIXED candidate cap and physical gate, identical across both embryos;
        - ADJACENT-FRAME candidates only. Longer gaps supply CONTEXT, never illegal scored edges.
      THEN, ON LEDGER CATEGORY 3 ONLY, report: newly reachable GT edges; true-parent RANK; candidate
      MULTIPLIER per target; coverage by crop AND embryo; the ORACLE official-score delta if those newly
      reachable edges were selected perfectly; and OVERLAP with the endpoint-removal (category 2) and
      downstream-overwrite (category 5) populations.
      KILL THRESHOLD, PREREGISTERED WITH A SAFETY MARGIN RATHER THAN AN EXACT FIT: the oracle score
      contribution must exceed TWICE the remaining gap to 0.950 recorded in FACT-0412. A bare pass at one
      times the deficit is a KILL, not a marginal pass. The margin is not arbitrary - this campaign has
      measured its oracle-to-real conversion and it is poor: FACT-0384 priced a PERFECT false-fork verifier at
      +0.01416 while the achievable effect came in near +0.001, roughly a fourteen-fold haircut. A route that
      only just clears the deficit under a perfect-selection oracle will not clear it in deployment.
      SUBSEQUENT FALSIFIERS, in order of when they can fire.
      (1) PSEUDO-LABEL FIDELITY. Consensus pseudo-edge precision, measured on our ANNOTATED movies by EDGE
          IDENTITY through the OFFICIAL matcher - never by nearest-track distance - is too low to train on.
      (2) ASSOCIATION-RECIPE PARITY ON REAL LABELS fails before any pseudo-label is introduced. If we cannot
          reproduce the deployed association head's quality on real supervision, a pseudo-label result is
          uninterpretable. FACT-0339 is the precedent and it is why this gate exists.
      (3) The multi-frame scorer does not convert the reach into COMPLETE-CHAIN raw association, both folds,
          official scorer.
      (4) NODE RECALL or DIVISION TP declines on either fold (FACT-0371).
      (5) The gain is a count-adjustment artifact, or adjusted improves while RAW is flat or negative.
      (6) The comparison is not (new candidate surface + scorer + final consumer) against the DEPLOYED
          control (FACT-0382).
    supporting: [FACT-0422, FACT-0370, FACT-0369, FACT-0362, FACT-0412, FACT-0426, FACT-0427, FACT-0428,
                 FACT-0430, FACT-0368, FACT-0339]
    boundary_with_other_levers: >-
      STATED FIRST BECAUSE THREE COLLISIONS ARE PLAUSIBLE AND ALL THREE ARE REAL LEVERS.
      (1) vs LEVER-0044. That lever asks whether our DEPLOYED FINAL CONSUMER uses learned evidence
      effectively. This lever asks whether multi-frame context and manufactured supervision can NOMINATE the
      large population of true edges currently never offered. Different question, different intervention,
      different failure mode. They meet at the consumption point and the branch logic below states exactly how.
      (2) vs the KILLED LEVER-0037, and this is the one that must not be fudged. LEVER-0037 died widening the
      candidate rule - threshold and radius - on a TWO-FRAME surface under the UNCHANGED scorer, at a measured
      cost. This lever changes the PROPOSAL MECHANISM, not its width: tracklet motion extrapolated over a
      temporal context, which is a different object. FACT-0370 is the independent reason the distinction is
      real rather than semantic - the never-offered misses are SHORT, median 2.26 um, so a wider radius is
      demonstrably not the fix and only a temporal mechanism can reach them. This is a new mechanism with a
      stated falsification test, which is what AGENTS.md requires; it is NOT a reopening of LEVER-0037.
      (3) vs LEVER-0043 (FOCUS-3D, parked) and LEVER-0029 (SSL pretraining, open). FOCUS-3D was parked as a
      REPRESENTATION trunk; it re-enters here only if dense segmentation QUALITY becomes the bottleneck in
      manufacturing labels, at which point it is a DATA-PRODUCTION component and not a detector replacement.
      ASCENT is a representation/pretraining reference belonging to LEVER-0029's lane: its released models
      target C. elegans NEURON tracking with embedding similarity plus Hungarian matching, which is a
      DOMAIN-TRANSFER hypothesis and not a ready solution here.
    label_manufacture_policy: >-
      BEGINS ONLY IF THE ORACLE PASSES, and it needs no GPU to begin.
      (1) Pseudo-tracks from AT LEAST TWO INDEPENDENT trackers.
      (2) Only CONSENSUS edges are accepted as positives.
      (3) Disagreements are UNCERTAIN, never automatic negatives - a disagreement is missing information, and
          treating it as a negative teaches the model the trackers' shared blind spots.
      (4) Synthetic two-frame pairs by affine and elastic deformation, CALIBRATED against registry facts on
          displacement, density, localisation residual and division frequency. An uncalibrated deformation
          generates a distribution the deployed data does not contain.
      (5) EXACT lineage identities preserved through every deformation.
      (6) SPLIT BY SOURCE MOVIE BEFORE GENERATION, so transformed siblings cannot cross folds. Doing this
          after generation is the leak.
      (7) Pseudo-label precision measured on our ANNOTATED movies by EDGE IDENTITY through the OFFICIAL
          matcher - never nearest-track distance, which measures spatial proximity and not association
          correctness.
    training_policy: >-
      THE DETECTOR IS NOT RETRAINED. Association-only, detector frozen.
      Prove ASSOCIATION-RECIPE PARITY ON REAL LABELS first; introduce pseudo-labels only after. Use
      edge/tracklet representations at the context length the CPU oracle selects. Produce CALIBRATED
      ADJACENT-EDGE probabilities. Consume them at the final selector LEVER-0044 establishes. Score COMPLETE
      MOVIES through the official scorer.
      HOCT architecture and code may be used where useful - it is MIT and its design is the relevant
      reference, combining edge-centric attention with a multi-frame parental softmax and a tracklet-level
      ILP rather than merely enlarging a two-frame transformer, and it reports rapid adaptation from limited
      corrections, which is direct support for manufactured supervision. BUT VALIDATION MUST NOT REST ON
      ORGANIZER CHECKPOINTS WITHOUT A TRAINING MANIFEST: HOCT is the organizer lab's model, so the FACT-0378
      hidden-overlap ambiguity applies to any claim validated on its weights. Training our own head from an
      explicit contract avoids that entirely, and that is the reason to do it.
    branch_logic_on_lever_0044: >-
      FIVE BRANCHES, FIXED BEFORE EITHER RESULT EXISTS.
      - GATE B PASSES: use its PROVEN final consumer for the pseudo-trained temporal scorer.
      - GATE B FAILS because the deployed consumer cannot convert good evidence: THIS LEVER STAYS ALIVE but
        must bring its OWN final selector, and HOCT's multi-frame parental-softmax / tracklet-ILP design is
        the relevant successor.
      - ORACLE REACH FAILS: CLOSE this route BEFORE any GPU.
      - ORACLE REACH PASSES BUT PSEUDO-LABEL FIDELITY FAILS: keep the TEMPORAL CANDIDATE GENERATOR and abandon
        MANUFACTURED SUPERVISION. Those are separable and must not die together.
      - BOTH PASS: this becomes the PRIMARY HIGH-CEILING LANE, ahead of contract-2 image-feature caching.
    note: >-
      OPENED 2026-08-31 (host). WHY NOW AND WHY THIS SHAPE. Our own ledger measured the parent-rescoring prize
      at 240 fold-0 GT edges against 1,110 fold-0 and 14,007 fold-1 true edges NEVER OFFERED to any scorer
      (FACT-0422), and FACT-0369 shows the deployed rule admits at most one parent per target by arithmetic,
      so no rescoring can reach them. FACT-0362 independently established that the division lane is DATA
      limited rather than architecture limited. This lever attacks both of those and nothing else does.
      A COMPETITOR ARRIVED AT THE SAME DIAGNOSIS INDEPENDENTLY, which is corroboration rather than evidence -
      the public demonstration shows NEAREST-TRACK DISTANCE, which measures spatial proximity and not the
      edge-level quantity the metric charges, and no score accompanies it. Treated accordingly: the direction
      is corroborated, the magnitude is not.
      THIS IS THE 0.970-SCALE PROGRAM. Attack the never-offered mass, manufacture the supervision needed to
      learn it, and ensure the learned evidence controls the final graph.

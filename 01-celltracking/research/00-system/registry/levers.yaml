      defaults an uncovered pair to 0.0, the WORST score rather than a neutral one (notebook :1652), so
      partial coverage over a widened surface penalises every uncovered candidate and an arm can fail on
      coverage while the mechanism is sound. Report raw AND adjusted edge
      Jaccard separately, edge TP/FP/FN, node recall, division TP/FP/FN, assignment churn, the
      count-adjustment contribution, and results BY FOLD and pooled. Select the SMALLEST value on a winning
      PLATEAU, never the numerically best isolated point - an isolated optimum on a coarse grid is a
      selection artifact.
    launch_decision_tree_2026_08_30: >-
      HOST DECISION, RECORDED BEFORE EITHER GATE REPORTS so the mapping from outcome to action cannot be
      chosen after seeing a number. PHASE 2 IS TECHNICALLY CLEARED AND SCIENTIFICALLY ON HOLD: the contract-2
      smoke passes its preflight and signs all four protection-contract sections, and it still does not

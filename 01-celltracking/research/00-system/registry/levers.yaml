      The multiplier is 1 - 0.1 * total_node_ratio with no upper cap (FACT-0191), and on the clean folds the
      pipeline's node deficit is currently collecting a real bonus (FACT-0192). Recovering nodes SPENDS that
      bonus, so this lever must win on RAW edge Jaccard by more than the bonus it gives back - which is exactly
      why raw and adjusted are reported separately, and it is also an independent explanation of FACT-0102's
      leaderboard loss when the detection threshold was lowered. (2) THE RECOVERABLE POPULATION IS SMALL AND
      MOSTLY NOT THE SOLVER'S FAULT (FACT-0357): 58% of fold-1 losses had no candidate edge or one below 0.8,
      the drop rate falls monotonically with candidate quality, and on fold 0 - the promotion gate - every lost
      cell together is 0.88% of node recall. Expect the falsifier to fire on fold 0; run it to find out where the
      solver IS wrong (the strong-candidate and one-sided-candidate populations), not because a win is likely.

      KILLED 2026-08-28 by PKT-0025, on three independent grounds, none of which is "it did not help enough".
      (1) THE PREMISE IS MOSTLY WRONG: 58% of the fold-1 losses had no candidate edge or one below 0.8 and the
      drop rate falls monotonically with candidate quality, so the solver is largely reacting correctly to weak
      association (FACT-0357). (2) THE DIRECTION IS INVERTED: relaxing the disappearance weight loses
      monotonically; the optimum is at 3.0, TIGHTER than deployed, keeping 12.5% fewer nodes at unchanged
      recall (FACT-0365). The short-track filter is already optimal at 6 (FACT-0366). (3) THE CHANNEL IS
      OVERWRITTEN: the champion replaces the ILP's entire edge list with motion relink on all 128 crops
      (FACT-0364), so the edge-Jaccard gain that the sweep found has no established path to the deployed score.
      The surviving direction is a different claim with a different mechanism and is LEVER-0036.
    priority: 1

  - id: LEVER-0036
    claim: >-
      The deployed pipeline is under-tuned in the direction the metric actually pays: raising the ILP
      disappearance weight to about 3.0 yields a SMALLER, more selective node set at unchanged node recall, and

# LEVERS REGISTRY - every hypothesis that could move the score, with its status.
#
# WHY THIS EXISTS
# The most expensive recurring mistake in this project has been reopening a lever that was
# already answered. The second most expensive has been CLOSING one by association - the
# Trackastra pruning lane was filed as "a detour" on evidence about HOCT, a different model,
# and stayed closed for weeks on evidence that was never about it.
#
# So a lever may only be closed by evidence ABOUT ITSELF, and `closed_by` must name the
# FACT ids that did it. `scripts/core/validate_registry.py` enforces that a closed lever
# names its evidence, and that its evidence is not UNVERIFIED.
#
# status:
#   open      live hypothesis, may be claimed by a packet
#   running   a packet is executing against it
#   killed    tested and refuted BY EVIDENCE ABOUT ITSELF
#   closed    ruled out for a stated structural reason (cost, contamination, infeasibility)
#   parked    plausible but deliberately deferred; `reopen_when` states the trigger

schema_version: 1
updated: '2026-08-25'

levers:

  - id: LEVER-0001
    claim: >-
      Smoothing node positions along a tracklet before the linker recovers association
      accuracy, because ~37% of localisation error is independent per frame
    status: killed
    falsifier: >-
      The nearest-parent statistic must move UP off the run's own deployed baseline.
    closed_by: [FACT-0050, FACT-0051]
    closed_date: '2026-08-25'
    outcome: >-
      Six of six measurements moved it DOWN, across two substrates and both estimators.
      Mean -5.64 pp, linefit -1.41 pp on the pre-ILP frame. The kill is robust to the
      disputed FACT-0043 anchor because it depends only on the SIGN of the change against
      each run's own baseline. Mechanism - smoothing follows PREDICTED tracks, and predicted
      tracks are the broken thing, so denoising along a wrong link propagates its error.
      Consequence: do NOT move linefit_smooth_output_graph earlier (FACT-0052).

  - id: LEVER-0002
    claim: >-
      A division STAGE 2 - keep the bijection, add divisions via a learned selector on
      appearance change and longer-track cues - unlocks the structurally unreachable divJ
    status: open
    falsifier: >-
      Must beat the P9 division mechanism end-to-end on a scored submission.
    supporting: [FACT-0034, FACT-0080, FACT-0082, FACT-0083, FACT-0084]
    note: >-
      SHARPENED 2026-08-25 by direct measurement. We recover 1 of 125 GT divisions on f1
      (FACT-0080) while EMITTING 6,303 (FACT-0082) - a selection failure, not a threshold
      failure, which is why blanket out-degree<=2 scored -0.0081. Independently corroborated
      by a 48th-place competitor who measures that missed divisions fail 2-3 checks at once,
      so no single threshold recovers anything (FACT-0084).
      .
      THE DESIGN CONSEQUENCE: our P9 mechanism is an AND-chain of independent gates (radii
      8/11/10 AND mid-track parent AND mutual-nearest-orphan AND t+2 divergence). A
      conjunction of gates cannot be tuned into a joint scorer - the correct structure is ONE
      model that sees all cues together and emits a probability, then a top-k selection
      against a budget.
      .
      AND THE CHEAPER MOVE FIRST: the pre-ILP graph already contains 24 of the 125
      (FACT-0083); the ILP and relink destroy 23 of them. Recovering what we already have
      precedes training anything. Note this also BOUNDS a selector over the current candidate
      set at ~19% division recall.
      .
      hengck23 (discussion/726924) names the stage-2 architecture; a CC0 corpus of 165,267
      labelled divisions exists for pretraining only (division rate inflated 4.07% vs 0.26%).
    priority: 1

  - id: LEVER-0003
    claim: >-
      The deployed detection threshold 0.96875 is too high; lowering it raises edge recall
      by more than the under-production bonus it erodes
    status: running
    falsifier: >-
      EXP-0016 / EXP-0017 read as a PAIR must show a monotone or interior-optimum gain.
    closed_by: [FACT-0102, FACT-0111]
    closed_date: '2026-08-25'
    outcome: >-
      FULLY CLOSED - both directions, by LB arms AND by the offline curve. The curve bought
      from the repaired p4 export shows detection recall is SATURATED: dropping 0.96875 to
      0.5 buys +0.0010 recall for 23.7% more nodes, raising to 0.999 costs -0.043
      (FACT-0111). That PREDICTS the measured arms exactly. The inherited threshold is
      effectively optimal; there is no headroom either way. The real detection lever moved
      DOWNSTREAM (FACT-0112, now LEVER-0011).
      .
      Originally: REFUTED IN THE DIRECTION TESTED. Both arms scored inside their pre-registered bands and
      both moved DOWN: 0.90 -> 0.922, 0.94 -> 0.924 against the deployed 0.96875 -> 0.925.
      Four independent lines of evidence supported lowering the threshold and all were wrong
      about the sign. With the p6 control (0.999 -> 0.883) the four points bracket an interior
      optimum at or slightly ABOVE 0.96875. LOWERING is closed; the remaining live question is
      whether a SLIGHTLY HIGHER threshold pays, which the detpeak curve answers offline for
      zero slots since T=0.5 makes every higher threshold a subset.
    experiments: [EXP-0016, EXP-0017, EXP-0004A, EXP-0004B]
    note: >-
      The p4 detpeak export buys the whole [0.5,1.0] curve offline for zero submission
      slots, which subsumes the pointwise arms. Smoke (EXP-0004S) shows the per-crop spread
      is large - 4% vs 49% extra nodes on two crops of the same fold - so a single global
      threshold is probably the wrong instrument.
    priority: 9

  - id: LEVER-0004
    claim: Trackastra used as a PRUNER of candidate edges
    status: killed
    falsifier: Must beat the cached-graph baseline when scored.
    closed_by: [FACT-0070, FACT-0071]
    closed_date: '2026-08-25'
    outcome: >-
      Scored from cached graphs f0 -0.187, f1 -0.084. Its 14.7/55.2/39.2% rejection rates
      cannot clear the measured 58.88% break-even deletion precision. Closed on evidence
      about ITSELF, replacing an earlier closure-by-association with HOCT.

  - id: LEVER-0005
    claim: >-
      Trackastra OWNING re-association with its background class live, replacing the
      geometric LAP rather than filtering its output
    status: parked
    reopen_when: >-
      A cheaper lever is exhausted, or the p15 reading shows the deficit is edges not
      divisions.
    note: >-
      A DIFFERENT mechanism from LEVER-0004 and explicitly NOT closed by it. The prior on it
      should drop given the pruning result, but the two are not the same experiment and the
      distinction must not be collapsed.

  - id: LEVER-0006
    claim: The remaining gap is divisions rather than edges
    status: running
    falsifier: >-
      EXP-0015 returns our pure adj_edge. ~0.923-0.924 means the edge term is already at
      top-3 level and the whole deficit is divisions; ~0.915-0.920 means the gap is edges.
    experiments: [EXP-0015]
    supporting: [FACT-0100, FACT-0101, FACT-0080]
    note: >-
      PARTIALLY ANSWERED, NOT PINNED. The probe scored 0.906, BELOW both pre-registered bands.
      The naive subtraction gives divJ 0.19, contradicting the direct 1/125 measurement
      (FACT-0080) by 24x - the probe destroyed ~984 true-positive edges it was not meant to
      touch, which alone explains the drop. Preferred reading: adj_edge ~0.924 with divJ ~0.01,
      i.e. our EDGE term is near top-3 level and the deficit IS divisions. That is inferred,
      not measured. A clean read needs a fork-free probe that does not trip the short-track
      filter. Either way the direction of travel is divisions, which LEVER-0002 owns.
    priority: 1

  - id: LEVER-0007
    claim: ILP_APPEARANCE_WEIGHT is mistuned
    status: closed
    closed_date: '2026-08-23'
    outcome: 0.0 is the tuned public consensus; the code default 0.1 was the anomaly. No headroom.

  - id: LEVER-0008
    claim: HOCT replaces the ILP profitably
    status: closed
    closed_date: '2026-08-23'
    outcome: Measured under-performing a tuned ILP at ~45 min/movie. Cost-infeasible.

  - id: LEVER-0009
    claim: Abstention / edge deletion improves precision enough to pay for lost recall
    status: closed
    closed_date: '2026-08-25'
    outcome: >-
      Break-even deletion precision is 58.88%; our best measured is 58.3%. Nothing has ever
      cleared it. Generalises LEVER-0004.

  - id: LEVER-0010
    claim: >-
      The defect ledger can be made to gate real specs by widening spec_name_globs
    status: killed
    closed_by: [FACT-0063]
    closed_date: '2026-08-25'
    outcome: >-
      The proposed fix does not exist - kaggle_factory.py:295 ALREADY defaults to ["*"].
      Widening the 8 rules would fail nearly every deploy spec. The real gap is that no rule
      has ever been written for the deploy substrate, which is a coverage problem needing
      new rules, not a globbing problem.

  - id: LEVER-0011
    claim: >-
      Node recall is lost DOWNSTREAM of detection - in filtering and post-processing, not at
      the threshold - and recovering it is worth more than any threshold change
    status: open
    falsifier: >-
      If the peak-stage and scored-frame node recall agree on fold 1, there is nothing
      downstream to recover and this closes.
    supporting: [FACT-0110, FACT-0112, FACT-0083]
    note: >-
      Fold 0 loses ~1 point of recall between peak detection (0.9955) and the scored graph
      (0.9861). The prior record puts scored fold-1 node recall at 0.8691, implying a far
      larger downstream loss on the fold that carries essentially all the headroom
      (FACT-0031). This is the same shape as the division finding - the pipeline discards
      what it already has (FACT-0083) - and matches Soheil Ayati's public remark that "many
      linking issues actually originated earlier during node selection".
      .
      FIRST STEP is free: rerun the curve on the p4 fold-1 export when it lands and compare
      peak-stage recall against the scored frame. No GPU, no slot.
    priority: 2

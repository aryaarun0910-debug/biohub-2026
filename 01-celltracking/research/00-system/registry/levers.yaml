  - id: LEVER-0014
    claim: >-
      REMOVING false divisions is worth as much as finding true ones, because
      divJ = TP/(125+FP) and our FP (225) exceeds all real divisions (125)
    status: running
    falsifier: >-
      If no feature separates our 26 TP from our 225 FP better than chance, a filter cannot
      be built and this closes.
    supporting: [FACT-0130]
    note: >-
      THE REFRAME. TP+FN is FIXED at 125, so FP alone dilutes the denominator. Deleting every
      FP with ZERO new discovery gives 26/125 = 0.208, i.e. +0.0134 of score by subtraction.
      We have spent the cycle trying to FIND divisions while precision sits at 10%. A filter
      is a ranking problem over 350 existing candidates, not a discovery problem.
      .
      Includes the model-misspecification conjecture: if true sibling separation is unimodal
      with an interior mode (~10.6 um - OUR OWN measurement, see FACT-0174, NOT public) while our cost is MONOTONE in
      distance, then any monotone ranker preferentially selects the CLOSEST pairs - which are
      the false ones. Prediction: FP separation < TP separation. THAT SUB-CONJECTURE IS
      UNAFFECTED by the leak - the GT separation distribution is ground truth.
      .
      DEPRIORITISED 2026-08-26 (FACT-0160): the headline arithmetic came from the LEAKY
      TP=26/FP=225 split. On honest weights (TP 1-3, FP ~500) deleting every FP is worth about
      +0.0019, not +0.0134 - below any promotion bar. The lever is not dead, but it is no longer
      priority 1 and must be re-costed on honest counts before any effort is committed.
      .
      KILLED 2026-08-26 (FACT-0171). Re-costed: the veto ceiling is +0.00064 (f1) and +0.00611
      (f0) for deleting EVERY false division perfectly at zero collateral. Break-even is 616
      false removed per true one lost on fold 1. The ceiling scales with TP, and honest TP is
      1 and 2 - my "removal is worth as much as discovery" reframe was a pure leak artifact.
      The NUMERATOR is broken; you cannot subtract your way to a score. Perfect SELECTION is
      worth +0.053 (f1) / +0.083 (f0) at current reach - discovery is the lane.
    closed_by: [FACT-0171, FACT-0161]
    closed_date: '2026-08-26'
    priority: 9

  - id: LEVER-0015
    claim: >-
      Cell-count conservation gives a per-frame division BUDGET that no local geometric gate
      can express
    status: killed
    falsifier: >-
      If GT cell count does not track division count (cells leave the volume, filtering
      removes them), the conservation assumption fails and this closes.
    closed_by: [FACT-0153, FACT-0151]
    closed_date: '2026-08-26'
    outcome: >-
      REFUTED - the falsifier fired verbatim. Cell count does not track divisions: AUC 0.5592
      for GT divisions and 0.4674 (BELOW chance) for separating our TP from FP forks. 48.8%
      of GT divisions occur where the count change is <= 0. Fork count carries 2.0% of the
      variance in count change. 57.6% of GT track ends sit within 5 um of the crop boundary
      (27.0% base rate), so the sub-volume population is not closed and conservation holds
      only in aggregate - per-interval error is 37.8x the division signal.
      .
      EVERY budget variant loses even under an ORACLE within-interval ranking: best case
      -0.00105, realistic -0.0017. The algebra explains it (FACT-0152): proportional pruning
      is strictly harmful, and a global budget prunes mostly INVISIBLE forks (96% are unscored,
      FACT-0151) while paying for the scarce TPs it hits. Independently corroborated by the
      p19 sweep, where every suppression setting scored worse.

  - id: LEVER-0016
    claim: >-
      Forward/reverse assignment DISAGREEMENT is a division signal obtainable with no new
      model and no new features
    status: running
    falsifier: >-
      If GT division parents are not enriched among forward/reverse disagreements versus base
      rate, there is no signal and this closes.
    note: >-
      A division forward in time is a MERGE backward. Both directions use a bijection, so both
      must abandon something at a real division - but they fail DIFFERENTLY. This extracts
      division information from structure we already compute, which matters because the relink
      cost provably contains none (LEVER-0012).
    priority: 3

  - id: LEVER-0017
    claim: >-
      Ensembling used as a division VETO raises divJ without finding anything new
    status: closed
    falsifier: >-
      If independent linkers agree on our false divisions as often as on our true ones,
      agreement carries no signal and this closes.
    closed_by: [FACT-0176, FACT-0171]
    closed_date: '2026-08-26'
    outcome: >-
      CLOSED as low-ceiling AND untestable. Agreement AUC 0.543 within the sweep and 0.482
      (BELOW chance) across genuinely different pipelines; only 1.6-2.2% of forks are confirmed
      by any other pipeline while nodes replicate at 79-82%, so forks are ~40x less
      reproducible than nodes. Independently, the veto ceiling is +0.0006/+0.0061 (FACT-0171),
      so even a perfect signal could not pay. And on honest weights the test is UNPOWERED by
      construction - TP is 1 (f1) and 2 (f0); no agreement statistic is estimable from n=1.
      Recorded as untestable rather than as a clean null.
    note: >-
      Detection ensembling is a known trap - unioning detections without a merge pass costs
      ~9% for nothing (Duvanov, EXTERNAL). But a veto only ever REMOVES, and removal is
      exactly what divJ = TP/(125+FP) rewards.
    priority: 3

  - id: LEVER-0018
    claim: >-
      The node-ratio multiplier is uncapped above 1, so node COUNT is a direct lever
      independent of node quality
    status: killed
    falsifier: >-
      If the multiplier is in fact capped at 1 in the official scorer, there is no bonus to
      exploit and this closes.
    closed_by: [FACT-0173]
    closed_date: '2026-08-26'
    outcome: >-
      PREMISE FALSE. Pooled total_node_ratio is +0.0240 - we OVER-produce. FACT-0021's -0.0937
      had no instrument and is wrong by ~37x in the wrong DIRECTION. There is no
      under-production bonus to exploit; each 1% of node inflation costs 0.00090 and needs 54
      new true edges to break even.
    supporting: [FACT-0102, FACT-0111]
    note: >-
      adj_edge = edge_jaccard * (1 - 0.1 * total_node_ratio), clamped below at 0 and
      reportedly UNCAPPED above 1. We under-produce (ratio -0.0937, UNVERIFIED) and reportedly
      collect a bonus. This would explain why LOWERING the detection threshold scored worse
      despite recall being saturated - the lever would be node COUNT, not node QUALITY, and we
      have never optimised it directly.
    priority: 2

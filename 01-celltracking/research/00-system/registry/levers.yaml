      PROTOCOL BINDING BOTH GATES. The deployed bonus value must reproduce the control EXACTLY before any
      treatment is read - a control that does not reproduce is a hard refusal. The CROP-PAIRED INTERVAL
      requirement is retained and is not optional: assoc_report's verdict() enforces it at :304-305 whatever

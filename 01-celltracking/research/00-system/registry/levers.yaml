# ---------------------------------------------------------------------------------------------
# STANDING SUBMISSION POLICY - SEAM-CALIBRATION EXCEPTION (host, 2026-08-29)
#
# WHY IT EXISTS. Our offline instruments have repeatedly failed to predict leaderboard DIRECTION
# and MAGNITUDE for this pipeline: DeepCenter read +0.0009 offline against +0.003 on the LB
# (FACT-0345, a 3-4x under-read) and icom read +0.002 offline and scored -0.014 (FACT-0344). More
# offline rigor cannot fix a seam; only a submission measures it. For a genuinely NEW model class
# the risk is that a fortnight of both-fold work is spent before learning whether the offline proxy
# tracks the LB for that kind of change at all.
#
# THE EXCEPTION. A genuinely new LEARNED ASSOCIATION MODEL may receive ONE calibration submission
# after passing the honest FOLD-0 full-chain gate, BEFORE fold 1 is complete. Every condition binds:
#   - it is a new learned SCORER, not another threshold, candidate rule or post-processing change;
#   - RAW association improves through the complete chain, not merely the adjusted score;
#   - opportunity CONVERTS into net true edges (the FACT-0376 quantity);
#   - node recall stays acceptable AND division TP does not decline (FACT-0371 caution);
#   - the artifact is audited, submitted STANDALONE, and preregistered with a band;
#   - ONE slot, no stacking and no rapid follow-up;
#   - FOLD 1 IS STILL REQUIRED before the model becomes established campaign evidence.
#
# THIS IS SEAM CALIBRATION, NOT PROMOTION. It does not weaken any gate for ordinary levers, and it
# is not available to node-count manipulation, candidate widening, threshold nudges or
# public-bundle micro-ablation - those remain excluded from submissions entirely.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# STANDING GPU RULE (host, 2026-08-30) - EVERY SESSION MUST PRODUCE AN ASSET
#
# WHY IT EXISTS. Two consecutive GPU sessions were spent on Gate 1 and it never compared a single
# crop. Attempt 1 died on a process boundary (FACT-0387); attempt 2 died on a dataset mount root
# (FACT-0397) that this repository had already hit, diagnosed and written up on 2026-08-01 in a
# file the failing notebook LOADS. Neither was a scientific result. Both were environment
# discovery paid for at GPU rates.
#
# THE RULE. Every GPU session must produce ONE of:
#   - a reusable feature dataset;
#   - a trained model checkpoint;
#   - a full-fold scientific result;
#   - a leaderboard artifact.
# GPU is NEVER used to discover mounts, imports, filenames, subprocess boundaries or empty inputs.
# Those are CPU preflight questions and they are answered on CPU, against the exact built notebook,
# the exact datasets and the real subprocess boundary, before a kernel is pushed.
#
# ONE ENVIRONMENT FAILURE AFTER THE PREFLIGHT EXISTS STOPS THE MECHANISM until it is reproduced
# locally. There is no fourth speculative kernel.
#
# DAILY ATTRITION CONTRACT. Every 24-hour cycle ends with at least one of: an audited leaderboard
# score; a reusable full-fold feature cache; a trained model checkpoint; a complete full-chain
# model comparison; or a model family killed on committed evidence. A cycle that ends with only a
# new harness, packet or audit rule is INCOMPLETE - unless that harness demonstrably prevented an
# already-scheduled GPU launch, which is the one case where infrastructure counts as output.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# THE WINNING FUNCTION AND THE REVISED PROMOTION GATE (host, 2026-08-30)
#
# THE FUNCTION. Offer the correct parent  x  discriminate it correctly  x  ensure the final relink
# CONSUMES that score. We have separately failed each partial version - LEVER-0037 offered without
# discriminating and was killed; LEVER-0039 discriminated without offering and was killed; LEVER-0041
# discriminated on a widened surface and its output is discarded 85% of the time on fold 0
# (FACT-0428). It is the COUPLED system that is the route past the public frontier, and it must be
# tested coupled.
#
# WHY THE OLD FOLD-0 RANKING GATE IS RETIRED. Every prior gate required a favourable fold-0 paired
# interval on contested parent ranking. FACT-0420 MEASURED that fold 0 cannot supply one: an apparent
# +0.024 leaves exactly 0.000 out of fold, the refit moves 81 of 4,157 targets and all 81 sit in the
# lowest margin quartile, at roughly ten contested errors per crop. Keeping that gate would prohibit
# EVERY parent scorer regardless of merit - it demands a resolution the substrate does not have. This
# is not a relaxation; it is the removal of an impossible condition and its replacement by five that
# are each answerable.
#
# THE REPLACEMENT GATE. All five bind.
#   RANKING     probability-free CONTEXTUAL scoring transfers positively in BOTH embryo directions.
#               FACT-0421 currently supplies that premise and it must be re-established, not assumed,
#               for any new scorer.
#   CONSUMPTION the FROZEN scorer and bonus improve COMPLETE-CHAIN raw association on BOTH folds.
#   STATISTICAL fold 1 shows a favourable crop-paired interval; fold 0 must be NON-INFERIOR with a
#               POSITIVE POINT ESTIMATE. Do not demand an interval the surface cannot resolve.
#   SAFETY      neither node recall nor division TP declines on either fold (FACT-0371).
#   METRIC      an ADJUSTED improvement with flat or negative RAW association is REJECTED. This is the
#               shape that killed LEVER-0036 (FACT-0375) and, mirrored, LEVER-0037 (FACT-0376).
#   COMPARISON  widened surface + scorer + FINAL CONSUMER, against the DEPLOYED control - never against
#               a widened-only control (FACT-0382).
#
# RECORDED BEFORE GATE B RUNS, as the host required, so it cannot be tuned to a result.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# THE WINNING FUNCTION, SHARPENED (host, 2026-08-31) - after the reversed ladder and the reach oracle
#
#   RICH OBJECT REPRESENTATION -> DISCRIMINATIVE CANDIDATE SCORING WITH ABSTENTION -> A CONSUMER THAT
#   PRESERVES THE GAIN
#
# WHY IT IS STATED AS A PRODUCT. Improving ANY ONE factor while freezing the other two has now produced
# a zero or a bound five times, measured rather than argued:
#   LEVER-0037  offered without discriminating        -> killed
#   LEVER-0039  discriminated without offering        -> killed (FACT-0386)
#   LEVER-0045  temporal proposal, frozen scorer      -> killed at 0.84x/1.13x the bar (FACT-0442)
#   reversed ladder: nodes at a frozen consumer       -> EXACTLY ZERO edges moved (FACT-0447)
#   pre-ILP ranking at a frozen consumer              -> only 15%/30% survives (FACT-0428)
#   Gate A: consumer moved, score frozen              -> paid on ONE fold only (FACT-0437)
# That is SIX instances and they cover all three factors from both sides: LEVER-0037/0045 and the
# reversed ladder move the OFFER with the scorer frozen; LEVER-0039 and FACT-0428 move the SCORER with
# the offer and consumer frozen; Gate A moves the CONSUMER with the score frozen. Every one returned a
# zero, a bound, or a single-fold result. The factors are not additive and not separately testable.
# Co-design, or expect a zero.
#
# WHERE THE FACTORS STAND. P38 (Kaggle 55915569) tests the THIRD factor on the leaderboard now.
# FOCUS-3D -> HOCT targets the FIRST TWO together and is the most coherent currently identified
# co-designed route - but NOT the only one. Still open: other mask generators feeding official HOCT;
# a POINT-NATIVE HOCT trained from a contract we own; synthetic-correspondence T=2 pretraining
# followed by cross-fitted association training; and a detector and consumer integrated TOGETHER.
#
# THREE SCOPE LIMITS THAT MUST TRAVEL WITH THE KILLS, so the board is not over-closed:
#   FACT-0448's sixteen caps CORRECTING WRONG LINKS BETWEEN TWO ANNOTATED CELLS. It does not cap a
#     scorer that ABSTAINS on unmatched-node edges, REMOVES bad edges, or RECOVERS missing true ones.
#   FACT-0449 makes BROAD node deletion expensive. SELECTIVE deletion stays admissible and must pay
#     through the COMPLETE objective.
#   FACT-0447 holds TOPOLOGY FIXED by design. It cannot bound a detector producing new features,
#     masks, candidates and associations JOINTLY. What is dead is the NODE-ONLY thesis.
#
# COMPUTE POLICY THAT FOLLOWS.
#   Node-only detector GPU spend: HELD PERMANENTLY.
#   Unprotected FOCUS/HOCT GPU execution: HELD until its adapter passes.
#   CPU preparation and Gate B: NOT held for P38 - P38 decides whether the EXISTING consumer
#     amplification transfers, not whether mask-aware association is valuable.
#   GPU goes to the FIRST mask/HOCT smoke whose contract proves SCALE, FEATURE COVERAGE, OUTPUT
#     INTERPRETATION, PROVENANCE and INDEPENDENT AUDITABILITY - all five, or it does not launch.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# GPU PROTECTION CONTRACT (host, 2026-08-30) - FOUR SIGNED SECTIONS BEFORE EVERY LAUNCH
#
# This sits UNDER the standing GPU rule, not beside it: that rule says every session must produce an
# asset, this one says what must be signed before a session may start. Four sections, each signed,
# each failing CLOSED.
#
#   CODE      clean scoped tree; explicit staged paths; reproducible notebook SHA; unique slug and
#             out_dir; deployed support-pack SHA pinned. A built notebook embedding uncommitted code
#             is refused - and note the trap that produced this clause: the injected patch may be
#             GENERATED, so committing the file the check names can still leave HEAD failing its own
#             drift lock.
#   DATA      a FOLD-LEGITIMATE trunk - explicitly NOT the invalid pairing FACT-0418 exposed, where
#             every declared dual_trunk_pair had no legitimate arm on either fold and the audit
#             constant would have refused the honest pair - plus contamination status and checkpoint
#             hashes.
#   PROCESS   exact environment propagation INTO the predictor subprocess; a positive heartbeat whose
#             ABSENCE is the alarm; a crop-count assertion, because the kernel's own all_passed cannot
#             see a crop that never ran; a timing probe with early abort that banks its own result.
#   ARTIFACT  atomic output; capacity guard against the RE-DERIVED storage figure (FACT-0416, after a
#             12.3x-low estimate); independent post-run reconstruction; and expected outputs
#             RE-DERIVED FROM THE BUILT NOTEBOOK rather than trusted from the receipt - FACT-0417
#             records the receipt's own expected-outputs field hardcoded to the wrong worker, which
#             would have failed a correct run and passed a run that recorded nothing.
#
# NO GPU IS SPENT until the free coupled CPU experiment (LEVER-0044 Gate B) shows the learned signal
# can reach the final graph at all.
# ---------------------------------------------------------------------------------------------


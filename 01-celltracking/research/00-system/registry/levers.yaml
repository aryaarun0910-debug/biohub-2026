  - id: LEVER-0012
    claim: >-
      Relaxing the relink bijection with a priced second row per source recovers the
      fork-collapsed divisions
    status: killed
    falsifier: >-
      Any penalty must beat the disabled control on the offline LOEO score.
    closed_by: [FACT-0131]
    closed_date: '2026-08-26'
    outcome: >-
      HARMFUL AT EVERY PENALTY: -0.0040 (p=0) to -0.0023 (p=2) against a control that
      reproduced the champion exactly. divJ FALLS at every setting (0.0743 -> 0.061-0.067)
      and div_tp drops 26 -> 21, so it DESTROYS correct divisions rather than finding them.
      .
      MECHANISM: linear_sum_assignment returns at most min(2*n_src, n_tgt) pairs, so
      duplicating source rows cannot CREATE edges, only reallocate them - a source winning
      two targets orphans another, which OUTPUT_PRUNE_ISOLATED then deletes. At penalty 0
      that cost 3,412 nodes and 6,105 edges to buy 95 forks.
      .
      ROOT CAUSE, and this is the transferable part: the relink cost is
      motion + 0.05*raw - 0.75*prob, a GEOMETRIC prior containing no division-specific
      signal. Structural permission to fork is NECESSARY BUT NOT SUFFICIENT; the information
      simply is not in the cost function. Cost: one GPU session, ZERO submission slots.
    note: >-
      This does NOT close LEVER-0002. That lever proposes a LEARNED selector on appearance
      change and longer-track cues - a different mechanism, and precisely the signal shown
      here to be missing. Closing it by association would repeat the Trackastra/HOCT error.

  - id: LEVER-0013

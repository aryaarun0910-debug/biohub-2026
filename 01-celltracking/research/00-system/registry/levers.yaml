      [0, 0.5, 1, 2, 4, 8] with the DEPLOYED edge_prob unchanged, all crops of BOTH folds, through the
      complete chain and the official scorer. A LOSS HERE KILLS ONLY "AMPLIFY THE DEPLOYED SCORE". It does
      NOT kill this lever, and reading it as if it did would be a logical error - see the amendment reason.
      GATE B - THE DECISIVE MECHANISM TEST, and the only one that can kill LEVER-0044. Place the existing
      PROBABILITY-FREE CONTEXTUAL score (FACT-0421) into the edge_prob slot, combine it with the WIDENED
      candidate surface, and consume it inside motion_relink_edges at the winning or preregistered bonus. If
      that COMPLETE COUPLED INTERVENTION cannot improve RAW association through the full chain, the
      final-edge scorer mechanism is dead and no feature cache may be built.
      SUPPORTING CONDITIONS, applying to both gates. (b) Fewer than 1% of assignments change across the whole
      sweep - the knob is inert rather than harmful. (c) Raw edge Jaccard flat through the COMPLETE chain
      under the official scorer. (d) Net true edges at or below zero - the genuine FACT-0376 quantity, never
      the pre-ILP proxy. (e) Node recall or division true positives decline on either fold (FACT-0371).
      (f) An adjusted improvement with flat or negative RAW association is REJECTED, not reported as a win.
      (g) RESTORED 2026-08-30 - see falsifier_restoration below. The fold-0 arm reproduces FACT-0414's exact
          zero AT THE FULL-CHAIN STAGE. That is a distinct outcome from (c): it would mean the fold-0
          substrate cannot resolve THIS intervention either, in which case the honest gate has to move rather

# LEVERS REGISTRY - every hypothesis that could move the score, with its status.
#
# WHY THIS EXISTS
# The most expensive recurring mistake in this project has been reopening a lever that was
# already answered. The second most expensive has been CLOSING one by association - the
# Trackastra pruning lane was filed as "a detour" on evidence about HOCT, a different model,
# and stayed closed for weeks on evidence that was never about it.
#
# So a lever may only be closed by evidence ABOUT ITSELF, and `closed_by` must name the
# FACT ids that did it. `scripts/core/validate_registry.py` enforces that a closed lever
# names its evidence, and that its evidence is not UNVERIFIED.
#
# status:
#   open      live hypothesis, may be claimed by a packet
#   running   a packet is executing against it
#   killed    tested and refuted BY EVIDENCE ABOUT ITSELF
#   closed    ruled out for a stated structural reason (cost, contamination, infeasibility)
#   parked    plausible but deliberately deferred; `reopen_when` states the trigger


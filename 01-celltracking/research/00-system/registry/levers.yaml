  - id: LEVER-0044
    claim: >-
      THE CONSUMPTION POINT, NOT THE SCORER, IS WHAT BINDS. A learned association score consumed at the FINAL
      parent-selecting operation - motion_relink_edges - rather than only at pre-ILP candidate ranking
      converts ranking skill into emitted edges, where a pre-ILP-only change is discarded 85% of the time on
      fold 0 and 70% on fold 1

      This is the one direction PKT-0025 found that survives its own forensics, and it is the OPPOSITE of the
      node-budget theme that produced LEVER-0028 and LEVER-0035. Three independent measurements now agree that
      this pipeline should predict FEWER nodes, not more: adding nodes by lowering the detection threshold lost
      on the leaderboard (FACT-0102), the detector is already at or above the node estimate (FACT-0354), and the
      solver optimum sits at 12.5% fewer nodes than deployed with recall unchanged (FACT-0365). FACT-0191/0192
      give the reason - the metric multiplier is 1 - 0.1 * total_node_ratio with no upper cap, so
      under-production is paid.
      WHAT MAKES THIS HARD, AND WHY IT IS NOT JUST A RERUN: the sweep's gain was in the ILP's EDGE structure,
      which motion relink discards (FACT-0364). Only the node-set change reaches the champion. So the test is
      not another ILP sweep - it needs the post-relink chain replayed on CPU (the notebook's
      filter_output_graph, which needs the DeepCenter bundle and image frames for gap refinement) or one
      host-authorised GPU run per fold. Fold 0 has no pre-ILP export at all and fold 0 is the promotion gate
      (FACT-0261), so a fold-0 export is required either way before promotion.
      COMPLETE FOLD-1 RESULT, 2026-08-29 (FACT-0372) - THE EXPECTATION IS NOW SMALL, AND THE PANEL BELOW IS
      SUPERSEDED IN MAGNITUDE. All 128 crops through the full chain give +0.0058 with a bootstrap interval
      INCLUDING zero, against the 20-crop panel's +0.0195 with an interval excluding it. Three things the panel
      hid, each visible only because the terms are reported separately: RAW edge Jaccard moves only +0.0013, so
      78% of the adjusted gain is the node-count adjustment (FACT-0191/0192); node recall FALLS 0.8636 to
      0.8359; and division true positives DROP 14 to 12, the divJ gain being a false-positive reduction rather
      than better recovery. FACT-0372 is the load-bearing reason for pessimism, precisely because it SEPARATES
      the count adjustment from genuine tracking quality. FACT-0368's 5.9% is a weaker and narrower bound and
      must not be over-read: its shares are computed on RAW edge Jaccard, so it caps what better node SELECTION
      can contribute to the raw association gap and says nothing about gains manufactured by the metric's
      count multiplier, which moves on an entirely different channel and leaves raw Jaccard untouched. The
      lever stays open only because fold 0 is the gate and is unmeasured, but it should now be EXPECTED TO FAIL
      its +0.003 fold-0 bar, and it must never be promoted on an adjusted gain whose raw counterpart is near
      zero.

      KILLED 2026-08-29 ON ITS OWN FOLD-0 GATE (FACT-0375). All 71 fold-0 crops through the complete chain:

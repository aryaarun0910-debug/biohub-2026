      DeepCenter vetoes, safe division, short-track filter, line fit), not the ILP stage alone, and must beat
      the deployed weight on the pooled objective on BOTH folds with a clean FOLD-0 crop-bootstrap CI excluding
      zero and >= +0.003 on fold 0, reporting raw edge Jaccard beside the adjusted score. Killed if the gain

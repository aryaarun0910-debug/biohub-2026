  - id: bet-subvoxel-refine
    title: Sub-voxel centroid refinement
    theme: E
    hypothesis: >
      If the detector emits integer-voxel / coarse-argmax centroids, parabolic/Gaussian sub-voxel
      peak refinement recovers localization the 7um-match metric rewards.
    mechanism: "Metric matches within 7um maximizing 1/(1+d); community EDA: 3um->-41%, 4um->-74%."
    expected_benefit: "several points IF currently integer-argmax (unverified); else nil"
    cost: low
    status: closed
    falsification: "KILLED 2026-08-18. Full paired deployment-substrate LOEO: 44b6 0.9037->0.9033 (-0.0004), 6bba 0.7051->0.7042 (-0.0009). Bilaterally NEGATIVE, an order below the +0.005 bar. Mechanism predicted in advance from predict_unet_transformer.py:495: z has zero quantisation error, y/x a 0.609 um systematic bias, RMS radial 1.075 um -- already inside the metric's free zone (cliff ~1.5-2 um), and OUTPUT_LINEFIT_SMOOTH dilutes the remainder. Residual untested: a constant +0.5-voxel grid-centre shift would cut RMS 1.075 -> 0.642 um at zero cost (different intervention)."
    links: ["06-knowledge-system/internal-reports/competitive_refresh_2026-08-17.md"]
    evidence:
      - "AUDIT 2026-08-17: predict_unet_transformer.py:285-293 returns integer int16 coords via max-pool local-max, no sub-voxel refine, at the 4x-downsampled grid -> lever LIVE. Applying it needs the detection logit maps (a detector re-run), not pure post-processing on existing geffs."
      - "SCAFFOLD 2026-08-17: scripts/win_bet/h1r_subvoxel_refine.py (parabolic per-axis offset) self-tested -> integer-argmax err 0.497 vox -> refined 0.138 vox (>3.5x). Integration = one-block kaggle_edit on extract_coords_from_logits (return float32) + detector re-run."

  - id: bet-ot-linker
    title: Unbalanced optimal-transport linker
    theme: B
    hypothesis: >
      An entropic unbalanced-Sinkhorn transport plan over the candidate graph beats greedy/threshold
      linking by handling appearance/disappearance/division and node calibration jointly.
    mechanism: "KL-relaxed marginals = appear/disappear; one->two mass split = division; mass knob = N_pred vs N_est."
    expected_benefit: "edge + node-multiplier + division jointly; cross-family calibratable"
    cost: medium
    status: proposed
    falsification: "Unbalanced-OT <= current linker on LOEO with tau fit on A, evaluated on B (both directions)."
    links: ["06-knowledge-system/internal-reports/novel_crossdomain_2026-08-17.md"]
    evidence: []

  - id: bet-meta-ranker
    title: Post-hoc meta-classifier ranker (MetaDetect + nnPU + conformal)
    theme: B
    hypothesis: >
      A GBM/shallow-MLP on existing candidate+edge features, trained with a PU-corrected loss and
      conformal-bounded acceptance, filters FP edges and ranks toward N_est cheaply.
    mechanism: "MetaDetect/LMD quality head; nnPU corrects 2.8%-annotation PU bias; conformal bounds spurious-edge FDR."
    expected_benefit: "precision on the junk candidate pool at seconds CPU; cross-family-honest"
    cost: low
    status: proposed
    falsification: "GBM/nnPU cross-family AUC (fit A / eval B) no better than the scalar threshold it replaces."
    links: ["06-knowledge-system/internal-reports/novel_crossdomain_2026-08-17.md"]
    evidence: []

  - id: bet-node-budget
    title: Node-budget pruning (reopened -- prior kill used a forbidden substrate)
    theme: E
    hypothesis: >
      Weakest-component-first pruning toward N_est improves the adjusted-J multiplier on the weaker
      fold; the prior kill used the forbidden placeholder-movie substrate and is not honestly closed.
    mechanism: "adjusted_J penalizes (N_pred-N_est)/N_est linearly; per-family keep_frac trims over-emission."
    expected_benefit: "+0.001 bilateral (settled sub-bar); 44b6 +0.00110 / 6bba +0.00087 / pooled +0.00099"
    cost: low
    status: closed
    falsification: "SETTLED 2026-08-17: full 199-crop P0-strict sweep optimum at keep_frac 0.975 on all three folds (kill rule NOT triggered, so the old 'no-pruning optimum' claim was false), but effect is +0.001 -- an order below the +0.005 bar, ~count-multiplier artifact. Honestly reopened then re-closed as sub-bar."
    links: ["06-knowledge-system/internal-reports/redteam_blindspots_2026-08-17.md"]
    evidence: ["199-crop P0-strict sweep keep_frac 0.975: 44b6 +0.00110, 6bba +0.00087, pooled +0.00099"]


name: Knowledge integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-knowledge.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/sync_source_rows.py import
      - run: python tools/ingest_kaggle.py
      - run: python tools/sync_source_rows.py check
      - run: bash -n tools/harvest_kaggle.sh tools/colab_guard.sh
